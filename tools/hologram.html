<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hologram turntable renderer</title>
<style>body { background: #02050c; color: #8fe9ff; font: 12px ui-monospace, monospace; margin: 12px; } canvas { display: block; margin-top: 8px; background: #02050c; max-width: 100%; }
iframe { position: absolute; left: -9999px; top: 0; width: 1100px; height: 800px; border: 0; }</style>
</head>
<body>
<!--
  Renders a generator's real 3D model as a cyan hologram turntable and uploads a sprite atlas.
  Open: tools/hologram.html?gen=ghost-builder&frames=24&hue=185&save=1   (the page loads programs/<gen>.html in a hidden frame)
  Params: gen, frames (24), cell (288), cols (6), hue (degrees, default 185 cyan), yaw0 (start angle), save=1 (upload to
  scripts/receive-render.mjs on :5190 as holo-<gen>.png)
-->
<div id="log">loading…</div>
<canvas id="atlas"></canvas>
<iframe id="gen"></iframe>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var GEN = q.get('gen') || 'ghost-builder';
  var N = +(q.get('frames') || 24), CELL = +(q.get('cell') || 288), COLS = +(q.get('cols') || 6);
  var HUE = +(q.get('hue') || 185), SS = +(q.get('ss') || 3), YAW0 = +(q.get('yaw0') || 0);
  var FILL = +(q.get('fill') || 0.78);
  var K_WIRE = +(q.get('wire') || 0.07), K_EDGE = +(q.get('edge') || 0.9), K_BODY = +(q.get('body') || 0.4), K_GLOW = +(q.get('glow') || 0.55), K_ANGLE = +(q.get('angle') || 28);          // fraction of the cell the model's bounding sphere fills
  var log = function (t) { document.getElementById('log').textContent = t; };
  var frame = document.getElementById('gen');
  frame.src = '../programs/' + GEN + '.html';

  function hsl(h, s, l) { return 'hsl(' + h + ',' + s + '%,' + l + '%)'; }

  function waitForStage(done) {
    var tries = 0;
    (function poll() {
      var w = frame.contentWindow;
      if (w && w.MM_STAGE && w.MM_STAGE.getModelData && (w.MM_STAGE.getModelData() || []).length) return done(w.MM_STAGE);
      if (++tries > 200) return log('timed out waiting for the generator');
      setTimeout(poll, 100);
    })();
  }

  function build(stage) {
    var T = stage.THREE;
    var data = stage.getModelData();
    var total = 0;
    data.forEach(function (e) { total += e.positions.length; });
    var pos = new Float32Array(total), o = 0;
    data.forEach(function (e) { pos.set(e.positions, o); o += e.positions.length; });

    // Fit: pivot on the vertical axis through the bounding-box centre; scale so the bounding sphere is constant.
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, minZ = 1e9, maxZ = -1e9;
    for (var i = 0; i < pos.length; i += 3) {
      minX = Math.min(minX, pos[i]); maxX = Math.max(maxX, pos[i]);
      minY = Math.min(minY, pos[i + 1]); maxY = Math.max(maxY, pos[i + 1]);
      minZ = Math.min(minZ, pos[i + 2]); maxZ = Math.max(maxZ, pos[i + 2]);
    }
    var cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, cz = (minZ + maxZ) / 2;
    var R = 0;
    for (i = 0; i < pos.length; i += 3) {
      pos[i] -= cx; pos[i + 1] -= cy; pos[i + 2] -= cz;
      R = Math.max(R, Math.hypot(pos[i], pos[i + 1], pos[i + 2]));
    }
    var geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.BufferAttribute(pos, 3));
    geo.computeVertexNormals();

    var col = new T.Color(hsl(HUE, 100, 62));
    var body = new T.ShaderMaterial({
      uniforms: { uColor: { value: col } },
      transparent: true, depthWrite: false, side: T.DoubleSide, blending: T.AdditiveBlending,
      vertexShader: 'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
      fragmentShader: 'const float K_BODY = ' + K_BODY.toFixed(3) + '; uniform vec3 uColor; varying vec3 vN; varying vec3 vV; void main(){ float f = 1.0 - abs(dot(normalize(vN), normalize(vV))); gl_FragColor = vec4(uColor * (0.03 + K_BODY * pow(f, 2.4)), 1.0); }'
    });
    var edges = new T.LineSegments(new T.EdgesGeometry(geo, K_ANGLE), new T.LineBasicMaterial({ color: col, transparent: true, opacity: K_EDGE, blending: T.AdditiveBlending, depthWrite: false }));
    var mesh = new T.LineSegments(new T.WireframeGeometry(geo), new T.LineBasicMaterial({ color: col, transparent: true, opacity: K_WIRE, blending: T.AdditiveBlending, depthWrite: false }));
    var root = new T.Group();
    root.add(new T.Mesh(geo, body), mesh, edges);

    var scene = new T.Scene();
    scene.add(root);
    var cam = new T.PerspectiveCamera(26, 1, 1, 5000);
    var dist = R / Math.sin((26 / 2) * Math.PI / 180) / FILL * 0.5 * 2 * 0.5 + R * 0;
    dist = (R / FILL) / Math.tan((26 / 2) * Math.PI / 180);
    cam.position.set(0, dist * 0.22, dist);
    cam.lookAt(0, 0, 0);

    var size = CELL * SS;
    var renderer = new T.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setSize(size, size, false);
    renderer.setClearColor(0x000000, 1);

    var rows = Math.ceil(N / COLS);
    var atlas = document.getElementById('atlas');
    atlas.width = CELL * COLS; atlas.height = CELL * rows;
    var actx = atlas.getContext('2d', { willReadFrequently: true });
    var tmp = document.createElement('canvas'); tmp.width = tmp.height = CELL;
    var tctx = tmp.getContext('2d', { willReadFrequently: true });
    var glow = document.createElement('canvas'); glow.width = glow.height = CELL;
    var gctx = glow.getContext('2d');

    for (var f = 0; f < N; f++) {
      // Clockwise seen from above: the front (+z) moves toward the viewer's left (-x).
      root.rotation.y = -(YAW0 + f * 360 / N) * Math.PI / 180;   // three.js +y is counter-clockwise seen from above
      renderer.render(scene, cam);
      tctx.clearRect(0, 0, CELL, CELL);
      tctx.imageSmoothingQuality = 'high';
      tctx.drawImage(renderer.domElement, 0, 0, CELL, CELL);
      // Glow: add a blurred copy back on top.
      gctx.clearRect(0, 0, CELL, CELL);
      gctx.filter = 'blur(' + (CELL / 70) + 'px)';
      gctx.drawImage(tmp, 0, 0);
      gctx.filter = 'none';
      tctx.globalCompositeOperation = 'lighter';
      tctx.globalAlpha = K_GLOW;
      tctx.drawImage(glow, 0, 0);
      tctx.globalAlpha = 1; tctx.globalCompositeOperation = 'source-over';
      // Brightness becomes alpha (hologram light on transparent), as in tools/ for the Gemini sheets.
      var img = tctx.getImageData(0, 0, CELL, CELL), d = img.data;
      for (var p = 0; p < d.length; p += 4) {
        var m = Math.max(d[p], d[p + 1], d[p + 2]);
        var a = Math.min(255, Math.max(0, (m - 6) * 1.12));
        if (m > 0) { d[p] = d[p] * 255 / m; d[p + 1] = d[p + 1] * 255 / m; d[p + 2] = d[p + 2] * 255 / m; }
        d[p + 3] = a;
      }
      actx.putImageData(img, (f % COLS) * CELL, Math.floor(f / COLS) * CELL);
    }
    log(GEN + ': rendered ' + N + ' frames, atlas ' + atlas.width + 'x' + atlas.height + ', R=' + R.toFixed(1));
    window.HOLO_DONE = true;
    if (q.get('save')) {
      atlas.toBlob(function (b) {
        fetch('http://localhost:5190/save?name=holo-' + GEN + '.png', { method: 'POST', body: b }).then(function () { log(document.getElementById('log').textContent + ' · uploaded'); window.HOLO_SAVED = true; });
      }, 'image/png');
    }
  }

  frame.addEventListener('load', function () { waitForStage(build); });
})();
</script>
</body>
</html>
