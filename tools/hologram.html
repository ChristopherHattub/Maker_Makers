<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hologram turntable renderer</title>
<style>body { background: #02050c; color: #8fe9ff; font: 12px ui-monospace, monospace; margin: 12px; } canvas { display: block; margin-top: 8px; background: #02050c; max-width: 100%; }
iframe { position: absolute; left: -9999px; top: 0; width: 1100px; height: 800px; border: 0; }</style>
</head>
<body>
<!--
  Renders each generator's real 3D model as a cyan hologram turntable (24 frames, 15 degrees apart, clockwise seen from above)
  and uploads a 6x4 sprite atlas per generator to scripts/receive-render.mjs (:5190) as holo-<id>.png.
  Open  tools/hologram.html?gen=all&save=1            every generator in js/programs.js
        tools/hologram.html?gen=ghost-builder&save=1   one generator (thumbnail id)
  Params: frames (24), cell (288), cols (6), ss (supersample, 4), wire/edge/body/glow/angle (look).
  Per-generator overrides live in scripts/hologram-config.json. Then run: python3 scripts/build-holo.py <receiver out dir>
-->
<div id="log">loading…</div>
<pre id="results"></pre>
<canvas id="atlas"></canvas>
<iframe id="gen"></iframe>
<script src="../js/programs.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var N = +(q.get('frames') || 24), CELL = +(q.get('cell') || 288), COLS = +(q.get('cols') || 6), SS = +(q.get('ss') || 4);
  var K_WIRE = +(q.get('wire') || 0.05), K_EDGE = +(q.get('edge') || 0.8), K_BODY = +(q.get('body') || 0.35), K_GLOW = +(q.get('glow') || 0.5), K_ANGLE = +(q.get('angle') || 22);
  var SAVE = !!q.get('save');
  var logEl = document.getElementById('log'), resEl = document.getElementById('results');
  var frame = document.getElementById('gen');
  var results = {};
  window.HOLO_RESULTS = results;
  var log = function (t) { logEl.textContent = t; };

  function thumbId(g) { return g.thumbnailUrl.split('/').pop().replace(/\.\w+$/, ''); }
  function hsl(h, s, l) { return 'hsl(' + h + ',' + s + '%,' + l + '%)'; }

  function loadGenerator(url) {
    return new Promise(function (resolve, reject) {
      var done = false;
      function finish(v, err) { if (done) return; done = true; frame.onload = null; err ? reject(err) : resolve(v); }
      frame.onload = function () {
        var tries = 0;
        (function poll() {
          var w = frame.contentWindow;
          try {
            if (w && w.MM_STAGE && w.MM_STAGE.getModelData) {
              var d = w.MM_STAGE.getModelData() || [];
              var n = 0; d.forEach(function (e) { n += e.positions.length; });
              if (n > 0) return finish(w.MM_STAGE);
            }
          } catch (e) { return finish(null, e); }
          if (++tries > 120) return finish(null, new Error('no model after 12s'));
          setTimeout(poll, 100);
        })();
      };
      frame.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now();
    });
  }

  // One shared renderer: a new WebGL context per generator would exhaust the browser's context limit.
  var shared = null;
  function rendererFor(T) {
    if (!shared || shared.T !== T) {
      var size = CELL * SS;
      var r = new T.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
      r.setSize(size, size, false);
      r.setClearColor(0x000000, 1);
      shared = { T: T, renderer: r };
    }
    return shared.renderer;
  }

  function renderModel(stage, cfg, id) {
    var T = stage.THREE;
    var data = stage.getModelData();
    var total = 0;
    data.forEach(function (e) { total += e.positions.length; });
    var pos = new Float32Array(total), o = 0;
    data.forEach(function (e) { pos.set(e.positions, o); o += e.positions.length; });

    function extents() {
      var b = { x0: 1e9, x1: -1e9, y0: 1e9, y1: -1e9, z0: 1e9, z1: -1e9 };
      for (var i = 0; i < pos.length; i += 3) {
        b.x0 = Math.min(b.x0, pos[i]); b.x1 = Math.max(b.x1, pos[i]);
        b.y0 = Math.min(b.y0, pos[i + 1]); b.y1 = Math.max(b.y1, pos[i + 1]);
        b.z0 = Math.min(b.z0, pos[i + 2]); b.z1 = Math.max(b.z1, pos[i + 2]);
      }
      return b;
    }
    var b = extents();
    var flat = (b.y1 - b.y0) < 0.22 * Math.max(b.x1 - b.x0, b.z1 - b.z0);
    var stand = cfg.stand === undefined ? flat : !!cfg.stand;
    if (stand) {   // a model that lies flat on the plate: stand it up so its top face looks at the camera
      for (var i = 0; i < pos.length; i += 3) { var y = pos[i + 1]; pos[i + 1] = -pos[i + 2]; pos[i + 2] = y; }
      b = extents();
    }
    var cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2, cz = (b.z0 + b.z1) / 2;
    var Rxz = 0;
    for (i = 0; i < pos.length; i += 3) {
      pos[i] -= cx; pos[i + 1] -= cy; pos[i + 2] -= cz;
      Rxz = Math.max(Rxz, Math.hypot(pos[i], pos[i + 2]));
    }
    var H = b.y1 - b.y0;
    var geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.BufferAttribute(pos, 3));
    geo.computeVertexNormals();

    var hue = cfg.hue === undefined ? 185 : cfg.hue;
    var dark = cfg.dark === true;   // black model: opaque near-black body with a light rim and edge glow, so it reads on the dark tile
    var col = new T.Color(dark ? hsl(hue, 45, 80) : hsl(hue, cfg.sat === undefined ? 100 : cfg.sat, cfg.light || 62));
    var body = dark ? new T.ShaderMaterial({
      uniforms: { uColor: { value: col } }, side: T.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
      vertexShader: 'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
      fragmentShader: 'uniform vec3 uColor; varying vec3 vN; varying vec3 vV; void main(){ float f = 1.0 - abs(dot(normalize(vN), normalize(vV))); gl_FragColor = vec4(vec3(0.015, 0.015, 0.022) + uColor * 0.32 * pow(f, 3.0), 1.0); }'
    }) : new T.ShaderMaterial({
      uniforms: { uColor: { value: col } },
      transparent: true, depthWrite: false, side: T.DoubleSide, blending: T.AdditiveBlending,
      vertexShader: 'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
      fragmentShader: 'const float K_BODY = ' + K_BODY.toFixed(3) + '; uniform vec3 uColor; varying vec3 vN; varying vec3 vV; void main(){ float f = 1.0 - abs(dot(normalize(vN), normalize(vV))); gl_FragColor = vec4(uColor * (0.03 + K_BODY * pow(f, 2.4)), 1.0); }'
    });
    var edges = new T.LineSegments(new T.EdgesGeometry(geo, K_ANGLE), new T.LineBasicMaterial({ color: col, transparent: true, opacity: dark ? 0.9 : K_EDGE, blending: dark ? T.NormalBlending : T.AdditiveBlending, depthWrite: false }));
    var mesh = new T.LineSegments(new T.WireframeGeometry(geo), new T.LineBasicMaterial({ color: col, transparent: true, opacity: K_WIRE, blending: T.AdditiveBlending, depthWrite: false }));
    var root = new T.Group();
    var bodyMesh = new T.Mesh(geo, body);
    root.add(bodyMesh, mesh, edges);
    var maskMat = new T.MeshBasicMaterial({ color: 0xffffff, side: T.DoubleSide });
    var scene = new T.Scene();
    scene.add(root);

    // Constant scale for the whole turn: the widest the model gets sideways, or its height, fills the cell.
    var FILL = cfg.fill || 0.8;
    var dim = Math.max(2 * Rxz, H) * 1.06;
    var fov = 26;
    var cam = new T.PerspectiveCamera(fov, 1, 1, 8000);
    var dist = (dim / 2 / FILL) / Math.tan(fov / 2 * Math.PI / 180);
    cam.position.set(0, dist * 0.22, dist);
    cam.lookAt(0, 0, 0);

    var renderer = rendererFor(T);
    var rows = Math.ceil(N / COLS);
    var atlas = document.getElementById('atlas');
    atlas.width = CELL * COLS; atlas.height = CELL * rows;
    var actx = atlas.getContext('2d', { willReadFrequently: true });
    actx.clearRect(0, 0, atlas.width, atlas.height);
    var tmp = document.createElement('canvas'); tmp.width = tmp.height = CELL;
    var tctx = tmp.getContext('2d', { willReadFrequently: true });
    var glow = document.createElement('canvas'); glow.width = glow.height = CELL;
    var gctx = glow.getContext('2d');
    var yaw0 = cfg.yaw0 || 0;

    for (var f = 0; f < N; f++) {
      root.rotation.y = -(yaw0 + f * 360 / N) * Math.PI / 180;   // three.js +y is counter-clockwise seen from above
      var maskD = null;
      if (dark) {   // coverage pass: the silhouette, so the near-black body can be opaque
        bodyMesh.material = maskMat; mesh.visible = edges.visible = false;
        renderer.render(scene, cam);
        tctx.clearRect(0, 0, CELL, CELL); tctx.drawImage(renderer.domElement, 0, 0, CELL, CELL);
        maskD = tctx.getImageData(0, 0, CELL, CELL).data;
        bodyMesh.material = body; mesh.visible = edges.visible = true;
      }
      renderer.render(scene, cam);
      tctx.clearRect(0, 0, CELL, CELL);
      tctx.imageSmoothingQuality = 'high';
      tctx.drawImage(renderer.domElement, 0, 0, CELL, CELL);
      gctx.clearRect(0, 0, CELL, CELL);
      gctx.filter = 'blur(' + (CELL / 70) + 'px)';
      gctx.drawImage(tmp, 0, 0);
      gctx.filter = 'none';
      tctx.globalCompositeOperation = 'lighter';
      tctx.globalAlpha = K_GLOW;
      tctx.drawImage(glow, 0, 0);
      tctx.globalAlpha = 1; tctx.globalCompositeOperation = 'source-over';
      var img = tctx.getImageData(0, 0, CELL, CELL), d = img.data;
      for (var p = 0; p < d.length; p += 4) {   // brightness becomes alpha: light on transparent
        var m = Math.max(d[p], d[p + 1], d[p + 2]);
        var a = Math.min(255, Math.max(0, (m - 6) * 1.12));
        if (maskD && maskD[p] > a) { d[p + 3] = maskD[p]; continue; }   // inside the silhouette keep the true (dark) colour
        if (m > 0) { d[p] = d[p] * 255 / m; d[p + 1] = d[p + 1] * 255 / m; d[p + 2] = d[p + 2] * 255 / m; }
        d[p + 3] = a;
      }
      actx.putImageData(img, (f % COLS) * CELL, Math.floor(f / COLS) * CELL);
    }
    geo.dispose();
    return { atlas: atlas, info: { flat: flat, stand: stand, Rxz: +Rxz.toFixed(1), H: +H.toFixed(1) } };
  }

  function upload(id, atlas) {
    return new Promise(function (resolve) {
      atlas.toBlob(function (blob) {
        fetch('http://localhost:5190/save?name=holo-' + id + '.png', { method: 'POST', body: blob }).then(function () { resolve(true); }, function () { resolve(false); });
      }, 'image/png');
    });
  }

  async function main() {
    var config = {};
    try { config = await (await fetch('../scripts/hologram-config.json')).json(); } catch (e) {}
    var want = q.get('gen') || 'ghost-builder';
    var list = GENERATORS.filter(function (g) { return g.programUrl; });
    if (want !== 'all') {   // one id, or several separated by commas
      var ids = want.split(',');
      list = list.filter(function (g) { return ids.some(function (w) { return thumbId(g) === w || g.programUrl.indexOf('/' + w + '.html') >= 0; }); });
    }
    var k = 0;
    for (var g of list) {
      var id = thumbId(g), cfg = config[id] || {};
      k++;
      if (cfg.skipRender) { results[id] = 'skipped'; continue; }
      log('[' + k + '/' + list.length + '] ' + id + ' …');
      try {
        var stage = await loadGenerator('../' + g.programUrl);
        var out = renderModel(stage, cfg, id);
        var ok = SAVE ? await upload(id, out.atlas) : null;
        results[id] = { ok: ok, info: out.info };
      } catch (e) {
        results[id] = 'ERROR ' + e.message;
      }
      resEl.textContent = Object.keys(results).map(function (n) { return n + ': ' + JSON.stringify(results[n]); }).join('\n');
    }
    log('done: ' + list.length + ' generators');
    window.HOLO_DONE = true;
  }
  main();
})();
</script>
</body>
</html>
