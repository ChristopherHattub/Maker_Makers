  <rect width="400" height="300" fill="url(#gridMajor)"/>
  <ellipse cx="200" cy="248" rx="128" ry="19" fill="url(#plate)" stroke="#00e5ff" stroke-opacity="0.5"/>
  <ellipse cx="200" cy="248" rx="104" ry="14" fill="none" stroke="#00e5ff" stroke-opacity="0.18"/>
  <ellipse cx="200" cy="249" rx="82" ry="11" fill="url(#shadow)"/>
