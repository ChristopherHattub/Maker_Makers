  <path d="M120 74 L120 232" stroke="url(#gloss)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <g fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="square">
