  <rect x="178" y="44" width="44" height="18" rx="6" fill="url(#warm)" stroke="#00e5ff" stroke-width="2" stroke-linejoin="round"/>
  <path d="M110 70 H290 V238 Q290 246 282 246 H118 Q110 246 110 238 Z" fill="url(#green)" stroke="#00e5ff" stroke-width="2" stroke-linejoin="round"/>
