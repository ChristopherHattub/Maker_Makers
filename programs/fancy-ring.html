          (p.scale !== 1 ? ' // printed at ' + p.scale + 'x' : '') +
          (Math.round(p.cut) === 2 ? ' // a princess stone needs small supports inside its cup' : '');
      }

      // Small line pictures for the pickers.
      function icon(body) {
        return '<svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round">' + body + '</g></svg>';
      }
      var CUT_ICONS = [
        '<circle cx="20" cy="20" r="14"/><path d="M20 6 26 14 34 20 26 26 20 34 14 26 6 20 14 14Z"/>',
        '<ellipse cx="20" cy="20" rx="11" ry="15"/><path d="M20 5 25 14 31 20 25 26 20 35 15 26 9 20 15 14Z"/>',
        '<rect x="7" y="7" width="26" height="26"/><path d="M7 7 20 20 33 7M7 33 20 20 33 33"/>',
        '<path d="M14 5H26L32 11V29L26 35H14L8 29V11Z"/><path d="M16 11H24L27 14V26L24 29H16L13 26V14Z"/>',
        '<path d="M20 4C24 11 31 17 31 25A11 11 0 0 1 9 25C9 17 16 11 20 4Z"/><path d="M20 12 25 24 20 32 15 24Z"/>',
        '<rect x="7" y="8" width="26" height="24" rx="8"/><path d="M20 8 28 20 20 32 12 20Z"/>'
      ];
      var SET_ICONS = [
        '<path d="M8 32A13 6 0 0 1 32 32"/><path d="M12 20H28L20 30Z"/><path d="M12 20V15M28 20V15M16 20V14M24 20V14"/>',
        '<path d="M8 32A13 6 0 0 1 32 32"/><path d="M12 20H28L20 30Z"/><path d="M12 20V15M28 20V15M20 20V12M15 20V13M25 20V13"/>',
        '<path d="M8 32A13 6 0 0 1 32 32"/><path d="M11 13H29V20L24 28H16L11 20Z"/>',
        '<circle cx="20" cy="18" r="6"/><circle cx="20" cy="18" r="12" stroke-dasharray="2 3"/><path d="M8 34A13 5 0 0 1 32 34"/>',
        '<path d="M7 33A14 6 0 0 1 33 33"/><path d="M14 16H26L20 27Z"/><path d="M5 22H13L9 28ZM27 22H35L31 28Z"/>'
      ];

      var DEFAULTS = { cut: 0, carat: 1, stone: 0, setting: 1, metal: 0, ringSize: 7, bandStyle: 0, profile: 1, bandWidth: 2.2, bandThick: 1.7, prong: 0.5, scale: 2, printAs: 0 };
      var SIGNATURES = [
        { label: 'Classic solitaire', values: { cut: 0, carat: 1, stone: 0, setting: 1, metal: 0, bandStyle: 0, profile: 1, bandWidth: 2.2 }, art: '<path d="M8 32A13 6 0 0 1 32 32"/><circle cx="20" cy="14" r="7"/>' },
        { label: 'Vintage halo', values: { cut: 5, carat: 1.25, stone: 0, setting: 3, metal: 1, bandStyle: 1, profile: 2, bandWidth: 2.2 }, art: '<rect x="13" y="7" width="14" height="14" rx="4"/><rect x="9" y="3" width="22" height="22" rx="7" stroke-dasharray="2 3"/><path d="M8 34A13 6 0 0 1 32 34"/>' },
        { label: 'Three stone', values: { cut: 1, carat: 1, stone: 0, setting: 4, metal: 3, bandStyle: 0, profile: 1, bandWidth: 2.4 }, art: '<ellipse cx="20" cy="13" rx="5" ry="7"/><ellipse cx="9" cy="17" rx="3" ry="4"/><ellipse cx="31" cy="17" rx="3" ry="4"/><path d="M8 34A13 6 0 0 1 32 34"/>' },
        { label: 'Modern bezel', values: { cut: 0, carat: 0.75, stone: 0, setting: 2, metal: 2, bandStyle: 0, profile: 0, bandWidth: 3 }, art: '<circle cx="20" cy="13" r="9"/><circle cx="20" cy="13" r="5"/><path d="M8 34A13 6 0 0 1 32 34"/>' },
        { label: 'Emerald statement', values: { cut: 3, carat: 2, stone: 3, setting: 0, metal: 3, bandStyle: 1, profile: 1, bandWidth: 2.4 }, art: '<path d="M15 4H25L29 8V20L25 24H15L11 20V8Z"/><path d="M8 34A13 6 0 0 1 32 34"/>' },
        { label: 'Pear romance', values: { cut: 4, carat: 1.25, stone: 4, setting: 3, metal: 1, bandStyle: 0, profile: 1, bandWidth: 2 }, art: '<path d="M20 3C23 8 28 12 28 17A8 8 0 0 1 12 17C12 12 17 8 20 3Z"/><path d="M8 34A13 6 0 0 1 32 34"/>' }
      ];

      window.MM_GENERATOR = {
        code: 'MM-102',
        sculpt: false,
        category: 'JEWELLERY // RINGS',
        title: 'Fancy Ring',
        fileName: 'FancyRing',
        minFrame: 70,
        tabsFirst: true,
        openGroups: ['Fine tuning'],
        palette: [
          { name: 'Yellow Gold', color: '#d9a93a' },
          { name: 'Rose Gold', color: '#d48d74' },
          { name: 'Silver Grey', color: '#b9bec5' },
          { name: 'Pearl White', color: '#f4f4ef' },
          { name: 'Diamond Clear', color: '#dbeeff' },
          { name: 'Sapphire Blue', color: '#1f4fd0' },
          { name: 'Ruby Red', color: '#c5152f' },
          { name: 'Emerald Green', color: '#0f8f55' }
        ],
        defaultColor: '#d9a93a',
        partNames: { band: 'Band', head: 'Setting', melee: 'Small stones', gem: 'Stone' },
        showcase: {
          tab: 'studio',
          materials: { band: 'metal', head: 'metal', melee: 'gem', gem: 'gem' },
          look: function (p) {
            var m = METALS[Math.round(p.metal)];
            return { metal: m.color, roughness: m.roughness, gem: STONES[Math.round(p.stone)].look };
          }
        },
        tabs: [{
          id: 'studio',
          label: 'Ring studio',
          hint: 'Drag to look around the ring',
          mount: function (box, api) {
            specNode = document.createElement('p');
            specNode.className = 'mm-note';
            box.appendChild(specNode);
            var cards = document.createElement('div');
            cards.className = 'mm-preset-cards';
            SIGNATURES.forEach(function (sig) {
              var b = document.createElement('button');
              b.type = 'button';
              b.className = 'mm-preset-card mm-preset-card--lines';
              b.innerHTML = icon(sig.art) + '<span>' + sig.label + '</span>';
              b.addEventListener('click', function () { api.setParams(sig.values); api.toast(sig.label); });
              cards.appendChild(b);
            });
            box.appendChild(cards);
            var spin = document.createElement('button');
            spin.type = 'button';
            spin.className = 'mm-btn mm-btn--block';
            spin.textContent = 'Pause turntable';
            var spinning = true;
            spin.addEventListener('click', function () {
              spinning = !spinning;
              api.setSpin(spinning);
              spin.textContent = spinning ? 'Pause turntable' : 'Start turntable';
            });
            box.appendChild(spin);
            updateSpec(api.params);
          }
        }],
        mount: function (box, api) {
          var note = document.createElement('p');
          note.className = 'mm-note';
          note.textContent = 'Cut into the inside of the band at the back of the ring. Letters, numbers, & and the heart. Leave empty for none.';
          var label = document.createElement('label');
          label.className = 'mm-group-title';
          label.textContent = 'Engraving';
          var input = document.createElement('input');
          input.type = 'text';
          input.maxLength = 24;
          input.value = engraving;
          input.setAttribute('aria-label', 'Engraving text');
          input.addEventListener('input', function () { engraving = input.value; api.rebuild(); });
          var heart = document.createElement('button');
          heart.type = 'button';
          heart.className = 'mm-chip';
          heart.textContent = 'Add ♥';
          heart.addEventListener('click', function () {
            if (input.value.length < 24) { input.value += '♥'; engraving = input.value; api.rebuild(); }
          });
          box.appendChild(label);
          box.appendChild(input);
          box.appendChild(heart);
          box.appendChild(note);
        },
        extrasTitle: 'Engraving',
        embedState: {
          get: function () { return { engraving: engraving }; },
          set: function (v) { if (v && typeof v.engraving === 'string') engraving = v.engraving; }
        },
        parameters: [
          { tab: 'studio', group: 'Stone', key: 'cut', label: 'Cut', min: 0, max: 5, step: 1, value: 0,
            choices: CUTS.map(function (n, i) { return { label: n, svg: icon(CUT_ICONS[i]) }; }) },
          { tab: 'studio', group: 'Stone', key: 'carat', label: 'Carat weight (over 2 ct may need supports)', unit: ' ct', min: 0.25, max: 3, step: 0.05, value: 1,
            format: function (v) { var size = stoneSize(cutNow, v); return v.toFixed(2) + ' ct / ' + size.w.toFixed(1) + ' mm wide'; } },
          { tab: 'studio', group: 'Stone', key: 'stone', label: 'Stone', min: 0, max: 4, step: 1, value: 0,
            format: function (v) { return STONES[v].name; } },
          { tab: 'studio', group: 'Setting', key: 'setting', label: 'Setting', min: 0, max: 4, step: 1, value: 1,
            choices: SETTINGS.map(function (n, i) { return { label: n, svg: icon(SET_ICONS[i]) }; }) },
          { tab: 'studio', group: 'Metal and band', key: 'metal', label: 'Metal look', min: 0, max: 3, step: 1, value: 0,
            format: function (v) { return METALS[v].name; } },
          { tab: 'studio', group: 'Metal and band', key: 'bandStyle', label: 'Band style', min: 0, max: 2, step: 1, value: 0,
            format: function (v) { return ['Plain', 'Tapered', 'Split shank (needs supports)'][v]; } },
          { tab: 'studio', group: 'Metal and band', key: 'ringSize', label: 'US ring size', min: 3, max: 13, step: 0.25, value: 7,
            format: function (v) { return 'US ' + v + ' / ' + ringDiameter(v).toFixed(1) + ' mm'; } },

          { group: 'Fine tuning', key: 'bandWidth', label: 'Band width', unit: ' mm', min: 1.6, max: 5, step: 0.1, value: 2.2 },
          { group: 'Fine tuning', key: 'bandThick', label: 'Band thickness', unit: ' mm', min: 1.3, max: 2.6, step: 0.1, value: 1.7 },
          { group: 'Fine tuning', key: 'profile', label: 'Band profile', min: 0, max: 3, step: 1, value: 1,
            format: function (v) { return ['Flat', 'Domed', 'Comfort fit', 'Knife edge'][v]; } },
          { group: 'Fine tuning', key: 'prong', label: 'Prong radius', unit: ' mm', min: 0.4, max: 0.8, step: 0.05, value: 0.5 },
          { group: 'Printing', key: 'scale', label: 'Display scale (1x = real size, resin only)', min: 1, max: 4, step: 0.5, value: 2,
            format: function (v) { return v + ' x'; } },
          { group: 'Printing', key: 'printAs', label: 'Ring prints as', min: 0, max: 1, step: 1, value: 0,
            options: ['Two halves', 'Whole (supports)'] }
        ],
        presets: SIGNATURES.map(function (sig) {
          var v = {};
          Object.keys(DEFAULTS).forEach(function (k) { v[k] = DEFAULTS[k]; });
          Object.keys(sig.values).forEach(function (k) { v[k] = sig.values[k]; });
          return { label: sig.label, values: v };
        }),

        // Display pose: the ring upright, stone on top. The real print layout is in printMeshes below.
        build: function (p) {
          var r = buildRing(p), s = p.scale, lift = r.ro * s;
          updateSpec(p);
          var metal = METALS[Math.round(p.metal)], stone = STONES[Math.round(p.stone)];
          var paint = { '#f2c14e': '#d9a93a', '#e8a58a': '#d48d74', '#e4e4dc': '#b9bec5', '#d3d6da': '#b9bec5' }[metal.color];
          var entries = [
            { name: 'band', positions: flatten(r.band.map(function (m) { return scaled(m, s, lift); })), color: paint },
            { name: 'head', positions: flatten(r.head.map(function (m) { return scaled(m, s, lift); })), color: paint },
            { name: 'gem', positions: flatten(r.gems.map(function (g) { return scaled(g.shell, s, lift); })), color: stone.color }
          ];
          if (r.melee.length) entries.push({ name: 'melee', positions: flatten(r.melee.map(function (m) { return scaled(m, s, lift); })), color: stone.color });
          return entries;
        },

        // The print plate: the ring (two halves with the cut face down, or whole and flat) and each stone, table up.
        printMeshes: function () {
          var r = last, s = r.scale, out = [], CUT = 0.0137;
          var groups = { band: r.band, head: r.head, melee: r.melee };
          var halves = r.printAs === 0;
          var half = r.ro * s + 3, topReach = (r.seatR + 3) * s;
          Object.keys(groups).forEach(function (name) {
            if (!groups[name].length) return;
            var shells = [];
            groups[name].forEach(function (m0) {
              var m = mapShell(m0, function (x, y, z) { return [x * s, y * s, z * s]; });
              if (halves) {
                // One half: keep z above the cut, then lay it on the cut face. The other half is its mirror image's partner.
                var a = clipShell(m, CUT), b = clipShell(mapShell(m, function (x, y, z) { return [-x, y, -z]; }), CUT);
                shells.push(mapShell(a, function (x, y, z) { return [x - half, z - CUT, -y + topReach / 2 - r.ro * s / 2]; }));
                shells.push(mapShell(b, function (x, y, z) { return [x + half, z - CUT, -y + topReach / 2 - r.ro * s / 2]; }));
              } else {
                shells.push(mapShell(m, function (x, y, z) { return [x - half * 0.2, z + r.width * s, -y + topReach / 2 - r.ro * s / 2]; }));
              }
            });
            out.push({ name: name, positions: flatten(shells) });
          });
          // Stones in a line in front of the ring, resting on their flat culets.
          var gemShells = [], x = -(r.gems.length - 1) * 0.5 * (r.gems[0].w * s + 4);
          var frontZ = (r.ro * s + topReach) / 2 + Math.max.apply(null, r.gems.map(function (g) { return g.l; })) * s / 2 + 4;
          r.gems.forEach(function (g) {
            gemShells.push(mapShell(g.raw, function (px, py, pz) { return [px * s + x, (py + g.depth) * s, pz * s + frontZ]; }));
            x += g.w * s + 4;
          });
          out.push({ name: 'gem', positions: flatten(gemShells) });
          return out;
        }
      };
    })();
