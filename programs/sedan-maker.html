  <script>
    (function () {
      'use strict';
      // Sedan Maker: a toy car with four wheels that are printed in place. Each wheel sits in a round wheel well on a

      // The body is a lofted shell (lower body, greenhouse, windows); the Car parts tab adds click-to-place stamps.
      // Y up, millimetres, +X is the front of the car, Z is across it. Every solid is a closed shell.
      //
      // More car types: a car type is a function that returns the "model" (see sedanModel): the half-width and deck
      // height along the car, the greenhouse profile, and where the axles are. Wheels, axles, lights and stamps only read
      // the model, so a truck or an ice cream van needs a new model function and an entry in CAR_TYPES.

      // Ellipsoid, for the lights. Poles are single points, so there are no zero-area triangles.
      function ellipsoid(cx, cy, cz, rx, ry, rz, nu, nv) {

      // ---------------------------------------------------------------------
      // Body sections
      // ---------------------------------------------------------------------

      // Always 4 * K + 6 points, so sections loft into one closed surface.
      function sectionLoop(x, hwB, hwT, y0, y1, rb, rt) {

        for (i = 0; i <= K; i++) pts.push([-hwB + cb * i / K, y0 + cb - cb * i / K]);

      }

      // x stations from a to b, closer together at both ends where the shape changes fastest.
      function stationsBetween(a, b, n) {
        var out = [], i;
        for (i = 0; i <= n; i++) out.push((a + b) / 2 - ((b - a) / 2) * Math.cos((Math.PI * i) / n));
        return out;
      }

      // ---------------------------------------------------------------------
      // Car types. A type returns the model that the wheels, lights and stamps read.
      // ---------------------------------------------------------------------
      function sedanModel(p) {

        // if the wheels need room, the axle never gets too thick for its wheel, and the roof clears the wells.
        var L = p.length, W2 = p.width / 2, R = Math.max(7.5, p.wheelD / 2), flat = R * TIRE_FLAT;
        var clr = clamp(p.clearance, 0.2, 0.6), d = Math.min(p.axle / 2, 0.28 * R), rH = d + clr;
        // The axle stops inside the wheel: the hole is a short neck that opens into a chamber, the pin ends in a head wider
        // than the neck, and the outer face of the wheel is closed, so no axle shows.
        var dF = rH + 0.5, headLen = 1.2 * (dF - d) + 0.5, chamberLen = headLen + 2 * clr;
        var wwMin = 1.2 + chamberLen + 1.2, out = clamp(p.wheelOut, -4, 2);
        // across the car (one side): the gap between the chassis wall and the wheel, and a chassis wall at least as thick as the axle
        var gapW = clr + 0.15, zcMin = d + 2.5;
        // The bottom of the wheel hole sits just above a cell centre of the print check's voxel grid (cells are L / 170
        // wide, at least 0.4 mm) and the pin sits less than one cell above it, so the pin's first layer has the hole's
        // last layer right under it and the print check sees no gap. The pin is moved down by up to 0.2 mm for this.
        var cell = Math.max(0.4, L / 170);
        var ax = rH + 0.5 * cell + 0.1 + cell * Math.round((R - flat - rH - 0.5 * cell - 0.1) / cell), pinDrop = Math.max(0, clr - (cell - 0.2));
        // the chamber is round about the wheel axis and must clear the head at every turn of the wheel
        var yb = -d - pinDrop, headTop = yb + 2 * dF - 0.6, headSide = Math.sqrt(dF * dF + Math.pow(yb + dF - 0.6, 2));
        var rC = Math.max(headTop, headSide) + clr;

        // side of the car. Going in towards the chassis its roof climbs at 45 degrees up to a 45 degree tent, so the
        // well prints with almost no bridge.

        // the body frames the whole wheel even where it narrows towards the nose

      var CAR_TYPES = { sedan: sedanModel };

      // Roof of a wheel well at dx from the axle and z across the car, hwx being the side of the body at that station.

      }

      // One cross-section of the body. Always the same number of points, so the sections loft into one closed surface.

      function cabinFrame(m, p, x, i) {

      // Longest run of stations for which test(i) holds.

      // Side windows: a thin proud skin on the greenhouse sides, from the door line to where the roof starts to curve.

      // Windshield (s = 1) or rear window (s = -1): a thin skin that follows the slope and the crown of the roof.

      function glassShells(m, p) {

        return list.length ? concat(list) : null;

      function lightShells(m, p) {

      // ---------------------------------------------------------------------
      // Wheels and axles
      // ---------------------------------------------------------------------
      // Layout across the car for the +Z side: chassis wall, gap, wheel (neck, chamber, closed outer wall), hub cap.
      function wheelLayout(m, p) {

        var zH0 = zi + neck + m.clr;

      }

      // The neck and the chamber: a circle with a pointed top, so they print without a sagging roof.
      function holeR(rH, th) {

      // The bottom of the tire is a polygon, not a circle: a flat on the bed, and a 56 degree facet each side that is
      // tangent to the round tire. A round tire is almost horizontal at the bed, which would sag; a facet at 56 degrees
      // from horizontal prints cleanly. Returns the distance from the wheel centre to that polygon at angle th, or 0 outside
      // the bottom sector (the tire is round there).
