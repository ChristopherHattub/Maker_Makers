        for (i = 0; i < N; i++) { t = (i / N) * TAU; c = Math.cos(t); s = Math.sin(t); pts.push([a * Math.sign(c) * Math.pow(Math.abs(c), 2 / n), b * Math.sign(s) * Math.pow(Math.abs(s), 2 / n)]); }
        return pts;
      }
      // Word-wrap text to a width in mm at glyph unit u (cap height = 6u).
      function wrapText(str, u, maxW) {
        var words = String(str).split(/\s+/).filter(Boolean), lines = [], cur = '';
        words.forEach(function (w) {
          var tryS = cur ? cur + ' ' + w : w;
          if (cur && textSegs(tryS, u, u * 0.3).w > maxW) { lines.push(cur); cur = w; } else cur = tryS;
        });
        if (cur) lines.push(cur);
        return lines;
      }


      var DEFAULTS = {
        potH: 38, topR: 30, botR: 21, belly: 3, rings: 0, lip: 3.5, wall: 2.8, soilD: 6, hollow: 1, stemH: 40, size: 100, leaves: 1, lean: 3
      };
      var KINDS = ['Tulip', 'Daisy', 'Daffodil', 'Crocus'], KIND_COLOR = ['#fda4af', '#fde047', '#fdba74', '#c4a3f5'];
      var plants = [], kind = 0, redrawPlan = null, api0 = null;

      function outerR(p, y) {
        var u = y / p.potH;
        return lerp(p.botR, p.topR, u) + p.belly * Math.sin(Math.PI * u) + (p.rings > 0 ? 0.7 * Math.sin(u * TAU * p.rings) * smoothstep(0.05, 0.2, u) : 0);
      }
      function soilInfo(p) { var fy = p.potH - p.soilD; return { y: fy, r: outerR(p, fy) - p.wall }; }
      function addPlant(p, x, z, type, h) {
        var s = soilInfo(p), d = Math.sqrt(x * x + z * z), k = d > s.r - 3.5 ? (s.r - 3.5) / d : 1;
        plants.push({ t: type, x: x * k, z: z * k, h: h || p.stemH * (0.85 + Math.random() * 0.3), rot: Math.random() * TAU });
      }
      function scatter(p, n) {
        var s = soilInfo(p), i, tries, x, z, ok;
        plants.length = 0;
        for (i = 0; i < n; i++) {
          for (tries = 0; tries < 40; tries++) {
            var a = Math.random() * TAU, r = Math.sqrt(Math.random()) * (s.r - 5); x = Math.cos(a) * r; z = Math.sin(a) * r;
            ok = plants.every(function (q) { return Math.hypot(q.x - x, q.z - z) > 11; });
            if (ok) break;
          }
          addPlant(p, x, z, Math.floor(Math.random() * 4));
        }
      }

      function leafTube(sx, rot, h, size) {
        var n = 12, path = [], i, L = h * 0.5, a0 = 55 * DEG;
        for (i = 0; i <= n; i++) {
          var t = i / n, a = a0 * (1 - 0.8 * t), px = sx * Math.sin(a) * L / n, py = Math.cos(a) * L / n;
          if (i) { var q = path[i - 1]; path.push([q[0] + px, q[1] + py, q[2]]); } else path.push([0, h * 0.18, 0]);
        }
        return xform(tube(path, function (t) { return t < 0.001 || t > 0.97 ? 0 : 1.7 * size * Math.sqrt(Math.sin(Math.PI * Math.min(1, t * 1.0 + 0.0))) * 0.9 + 0.0; }, 14, 0.38), { ry: rot });
      }
      function bloomParts(t, h, size, rot) {
        var out = { bloom: [], center: [] }, s = size / 100, i;
        if (t === 0 || t === 3) {
          var ht = (t === 0 ? 15 : 9) * s, rw = (t === 0 ? 7 : 6.2) * s, lobes = t === 0 ? 3 : 6;
          var prof = [], n = 18;
          for (i = 0; i <= n; i++) { var u = i / n; prof.push([i === 0 || i === n ? 0 : rw * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.75)), 0.75) * (1 - 0.25 * u * u), ht * u]); }
          out.bloom.push(xform(lathe(prof, 48, function (pt, r, y, th, idx) { var m = 1 + 0.11 * Math.cos(lobes * th) * Math.sin(Math.PI * idx / n) + 0.0; pt[0] *= m; pt[2] *= m; }), { ry: rot, t: [0, h - 2.2, 0] }));
        } else {
          var Rp = (t === 1 ? 11.5 : 10.5) * s, lo = t === 1 ? 12 : 6, th2 = 1.7, pr = [[0, 0]], k;
          for (k = 0; k <= 8; k++) { var rr = Rp * k / 8; pr.push([rr, rr * 0.9 + 0.0]); }
          var top = [];
          for (k = 8; k >= 0; k--) { var r2 = Rp * k / 8; top.push([r2, r2 * 0.9 + th2]); }
          var all = [[0, 0]].concat(pr.slice(1), top.slice(0, top.length - 1), [[0, th2]]);
          out.bloom.push(xform(lathe(all, 72, function (pt, r, y, th, idx) { if (r > 0.5) { var f = 1 + 0.2 * Math.pow(Math.abs(Math.cos(lo * th / 2)), 0.6) - 0.1; pt[0] *= f; pt[2] *= f; } }), { ry: rot, t: [0, h - 1.2, 0] }));
          if (t === 1) out.center.push(xform(ball(3.8 * s, 2.4 * s, 3.8 * s, 28), { t: [0, h + 0.3, 0] }));
          else { out.bloom.push(xform(lathe([[0, 0], [3.6 * s, 0], [5.8 * s, 9 * s], [4.9 * s, 9.2 * s], [0, 9.2 * s]], 40), { t: [0, h + 0.4, 0] })); out.center.push(xform(ball(1.5 * s, 1.1 * s, 1.5 * s, 12), { t: [0, h + 4 * s, 0] })); }
        }
        return out;
      }

      function build(p) {
        var H = p.potH, out = [], i, soil = soilInfo(p), fy = soil.y, wall = p.wall;
        var prof = [];
        if (p.hollow >= 1) {
          var rc = Math.max(4, p.botR - wall), yc = Math.min(rc, fy - 3.5);
          prof.push([0, yc]); if (yc < rc - 0.5) prof.push([rc - yc, yc]); prof.push([rc, 0]);
        } else prof.push([0, 0]);
        for (i = 0; i <= 28; i++) { var y = H * i / 28; prof.push([outerR(p, y), y]); }
        prof.push([outerR(p, H) + p.lip * 0.35, H]); prof.push([outerR(p, H) - wall * 0.9, H + 0.0]);
        for (i = 0; i <= 8; i++) { var y2 = H - (H - fy) * i / 8; prof.push([outerR(p, y2) - wall, y2]); }
        prof.push([0, fy]);
        // the lip band is a slight bulge at the very top, built into the outer profile
        var potAll = lathe(prof, 96, function (pt, r, y) { if (y > H - 5 && y <= H + 0.01 && r > 1) { var f = 1 + (p.lip / outerR(p, H)) * 0.45 * smoothstep(H - 5, H - 1.5, y); pt[0] *= f; pt[2] *= f; } });
        var pot = [], sl = [], k;
        for (k = 0; k < potAll.length; k += 9) {
          var flat = Math.abs(potAll[k + 1] - fy) < 0.002 && Math.abs(potAll[k + 4] - fy) < 0.002 && Math.abs(potAll[k + 7] - fy) < 0.002;
          var tgt = flat ? sl : pot; for (i = 0; i < 9; i++) tgt.push(potAll[k + i]);
        }
        out.push({ name: 'pot', positions: new Float32Array(pot), smoothGroup: 'pot' });
        if (sl.length) out.push({ name: 'soil', positions: new Float32Array(sl), smoothGroup: 'pot' });
        var stems = [], leaves = [], blooms = [], centers = [];
        plants.forEach(function (q) {
          var h = q.h, path = [], n = 10, lean = p.lean, sz = p.size / 100;
          for (i = 0; i <= n; i++) { var t = i / n; path.push([q.x + Math.cos(q.rot) * lean * Math.sin(t * 1.5) , fy - 1.5 + (h + 1.5) * t, q.z + Math.sin(q.rot) * lean * Math.sin(t * 1.5)]); }
          stems.push(tube(path, function (t) { return t < 0.001 || t > 0.999 ? 0 : 1.35 - 0.3 * t; }, 14));
          var top = path[n], bp = bloomParts(q.t, 0, p.size, q.rot);
          bp.bloom.forEach(function (m) { blooms.push(xform(m, { t: [top[0], fy + h, top[2]] })); });
          bp.center.forEach(function (m) { centers.push(xform(m, { t: [top[0], fy + h, top[2]] })); });
          if (p.leaves >= 1) { leaves.push(xform(leafTube(1, q.rot, h, sz), { t: [q.x, fy, q.z] })); leaves.push(xform(leafTube(-1, q.rot, h * 0.85, sz), { t: [q.x, fy, q.z] })); }
        });
        pushMesh(out, mesh('stems', stems)); pushMesh(out, mesh('leaves', leaves)); pushMesh(out, mesh('blooms', blooms)); pushMesh(out, mesh('centers', centers));
        return out;
      }

      // ---- Plan view: click the soil to plant, click a plant to remove it ----
      function drawPlan(cv) {
        var g = cv.getContext('2d'), w = cv.width, s = soilInfo(api0.params), sc = (w * 0.46) / s.r, c = w / 2;
        g.clearRect(0, 0, w, w); g.fillStyle = '#5b3a24'; g.beginPath(); g.arc(c, c, s.r * sc, 0, TAU); g.fill(); g.strokeStyle = '#00e5ff'; g.lineWidth = 2; g.stroke();
        plants.forEach(function (q) {
          g.fillStyle = KIND_COLOR[q.t]; g.beginPath(); g.arc(c + q.x * sc, c + q.z * sc, 8, 0, TAU); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 1.2; g.stroke();
          g.fillStyle = '#0d2b59'; g.font = 'bold 10px Courier New'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(KINDS[q.t].charAt(0), c + q.x * sc, c + q.z * sc);
        });
      }
      function mountPlan(container, api) {
        container.appendChild(mkEl('p', { class: 'mm-note' }, 'Pick a flower, then click the soil here or on the pot in 3D. Click a plant in this plan to pull it out.'));
        var row = mkEl('div', { class: 'mm-chips' }), btns = [];
        KINDS.forEach(function (nm, i) {
          var b = mkEl('button', { class: 'mm-chip', type: 'button', 'aria-pressed': String(i === kind), onclick: function () { kind = i; btns.forEach(function (q, k) { q.setAttribute('aria-pressed', String(k === i)); }); } }, nm);
          btns.push(b); row.appendChild(b);
        });
        container.appendChild(row);
        var cv = mkCanvas(container, 280, 280);
        redrawPlan = function () { if (api0) drawPlan(cv); };
        dragCanvas(cv, function (x, y, phase) {
          if (phase !== 'down') return;
          var s = soilInfo(api.params), sc = (cv.width * 0.46) / s.r, px = (x * cv.width - cv.width / 2) / sc, pz = (y * cv.height - cv.height / 2) / sc, hit = -1, bd = 1e9;
          plants.forEach(function (q, i) { var d = Math.hypot(q.x - px, q.z - pz); if (d < bd) { bd = d; hit = i; } });
          if (hit >= 0 && bd < 7) plants.splice(hit, 1); else if (Math.hypot(px, pz) < s.r) addPlant(api.params, px, pz, kind);
          redrawPlan(); api.rebuild();
        });
        var r2 = mkEl('div', { class: 'mm-export-row' });
        r2.appendChild(mkBtn('Plant a garden', function () { scatter(api.params, 6); redrawPlan(); api.rebuild(); }));
        r2.appendChild(mkBtn('Undo', function () { plants.pop(); redrawPlan(); api.rebuild(); }));
        r2.appendChild(mkBtn('Pull all up', function () { plants.length = 0; redrawPlan(); api.rebuild(); }));
        container.appendChild(r2);
        setTimeout(redrawPlan, 50);
      }

      window.MM_GENERATOR = {
        code: 'MM-033',
        category: 'SPRING // GARDEN',
        title: 'Flower Pot Planter',
        fileName: 'Flower_Pot',
        palette: [
          { name: 'Terracotta', color: '#e8a27a' },
          { name: 'Tulip Pink', color: '#fda4af' },
          { name: 'Daisy Yellow', color: '#fde047' },
          { name: 'Fern Green', color: '#86efac' },
          { name: 'Lilac', color: '#c4a3f5' },
          { name: 'Soil Brown', color: '#7a5233' },
          { name: 'Cream', color: '#fff4dc' },
          { name: 'Sky Blue', color: '#a5d8ff' }
        ],
        defaultColor: '#e8a27a',
        partNames: { pot: 'Pot', soil: 'Soil', stems: 'Stems', leaves: 'Leaves', blooms: 'Flowers', centers: 'Flower centres' },
        openGroups: ['Pot'],
        extrasTitle: 'Plant the flowers',
        parameters: [
          { group: 'Pot', key: 'potH', label: 'Pot height', unit: ' mm', min: 26, max: 60, step: 1, value: DEFAULTS.potH },
          { group: 'Pot', key: 'topR', label: 'Top radius', unit: ' mm', min: 20, max: 42, step: 1, value: DEFAULTS.topR },
          { group: 'Pot', key: 'botR', label: 'Bottom radius', unit: ' mm', min: 14, max: 36, step: 1, value: DEFAULTS.botR },
          { group: 'Pot', key: 'belly', label: 'Belly curve', unit: ' mm', min: 0, max: 8, step: 0.5, value: DEFAULTS.belly },
          { group: 'Pot', key: 'rings', label: 'Ridges', unit: '', min: 0, max: 8, step: 1, value: DEFAULTS.rings },
          { group: 'Pot', key: 'lip', label: 'Rim lip', unit: ' mm', min: 0, max: 7, step: 0.5, value: DEFAULTS.lip },
          { group: 'Pot', key: 'wall', label: 'Wall thickness', unit: ' mm', min: 2, max: 5, step: 0.2, value: DEFAULTS.wall },
          { group: 'Pot', key: 'soilD', label: 'Soil sits below rim', unit: ' mm', min: 3, max: 14, step: 0.5, value: DEFAULTS.soilD },
          toggle('Pot', 'hollow', 'Underneath', 'Solid', 'Hollow (saves plastic)', DEFAULTS.hollow),
          { group: 'Flowers', key: 'stemH', label: 'Stem height', unit: ' mm', min: 20, max: 70, step: 1, value: DEFAULTS.stemH },
          { group: 'Flowers', key: 'size', label: 'Flower size', unit: '%', min: 60, max: 150, step: 5, value: DEFAULTS.size },
          { group: 'Flowers', key: 'lean', label: 'Stem sway', unit: ' mm', min: 0, max: 8, step: 0.5, value: DEFAULTS.lean },
          toggle('Flowers', 'leaves', 'Leaves', 'None', 'Two leaves each', DEFAULTS.leaves)
        ],
        presets: [
          presetOf(DEFAULTS, 'Classic pot', {}),
          presetOf(DEFAULTS, 'Round bowl', { potH: 32, topR: 34, botR: 22, belly: 7, stemH: 34 }),
          presetOf(DEFAULTS, 'Tall planter', { potH: 54, topR: 26, botR: 20, belly: 2, stemH: 50 }),
          presetOf(DEFAULTS, 'Ridged pot', { rings: 6, belly: 2 }),
          presetOf(DEFAULTS, 'Tiny desk pot', { potH: 28, topR: 22, botR: 15, stemH: 28, size: 80 })
        ],
        testSetup: function (p) { if (!plants.length) scatter(p, 5); },
        mount: mountPlan,
        onPick: function (hit, api) {
          if (hit.meshName !== 'soil' && !(hit.meshName === 'pot' && hit.point.y > api.params.potH - api.params.soilD - 1)) { api.toast('Click the soil to plant'); return; }
          addPlant(api.params, hit.point.x, hit.point.z, kind);
          if (redrawPlan) redrawPlan(); api.rebuild();
        },
        build: function (p, api) { api0 = api; if (!plants.length && !window.__potInit) { window.__potInit = true; [[-10, -3, 0], [8, -8, 1], [4, 9, 2], [-9, 10, 3], [14, 6, 0]].forEach(function (q) { addPlant(p, q[0], q[1], q[2]); }); } return build(p); }
      };

    })();
  </script>
