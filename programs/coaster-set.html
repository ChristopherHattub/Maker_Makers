        keep.sort(function (x, y) { var tx = (x / NPT) * TAU, ty = (y / NPT) * TAU; tx = tx < Math.PI / 2 - half ? tx + TAU : tx; ty = ty < Math.PI / 2 - half ? ty + TAU : ty; return tx - ty; });
        if (p.notch < 1) { return [fanPrism(outer, 0, floorT, [0, 0]), ringPrism(outer, inner, floorT - 0.3, H)]; }
        keep.forEach(function (ix) { A.push(outer[ix]); B.push(inner[ix]); });
        return [fanPrism(outer, 0, floorT, [0, 0]), stripPrism(A, B, floorT - 0.3, H)];
      }

      function build(p) {
        var out = [], n = Math.round(p.count), a = p.size / 2, t = p.thick, i;
        var cols = Math.ceil(Math.sqrt(n)), rowsN = Math.ceil(n / cols), pitch = p.size + p.gap + 4;
        var outer = outlineAt(p, 1), rimW = p.rimW, rimInner = outlineAt(p, (a - rimW) / a);
        var inner = rimW > 0 ? minR(p, (a - rimW) / a) : minR(p, 1);
        var slab = [fanPrism(outer, 0, t, [0, 0])];
        var rim = [], pat = [];
        if (p.rimH > 0 && rimW > 0) rim.push(ringPrism(outer, rimInner, t - 0.3, t + p.rimH));
        if (Math.round(p.pattern) > 0) pat = patternShapes(p, inner - 1.2, t - 0.3, t + p.patH);
        var slabs = [], rims = [], pats = [];
        for (i = 0; i < n; i++) {
          var cx = (i % cols - (cols - 1) / 2) * pitch, cz = (Math.floor(i / cols) - (rowsN - 1) / 2) * pitch, tr = { t: [cx, 0, cz] };
          slab.forEach(function (m) { slabs.push(xform(m, tr)); });
          rim.forEach(function (m) { rims.push(xform(m, tr)); });
          pat.forEach(function (m) { pats.push(xform(m, tr)); });
        }
        pushMesh(out, mesh('coaster', slabs));
        pushMesh(out, mesh('rim', rims));
        pushMesh(out, mesh('pattern', pats));
        if (p.holder >= 1) {
          var hx = (cols * pitch) / 2 + p.size / 2 + p.holderWall + 12, hm = holderMeshes(p, n);
          pushMesh(out, mesh('holder', hm.map(function (m) { return xform(m, { t: [hx, 0, 0] }); })));
        }
        return out;
      }
