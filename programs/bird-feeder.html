<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MM-123 Bird Feeder // Maker Makers</title>
  <link rel="stylesheet" href="shared/generator.css">
  <script src="../vendor/three/three.min.js"></script>
  <script src="../vendor/three/OrbitControls.js"></script>
</head>
<body class="mm-gen">
  <script>
    (function () {
      'use strict';
      // Bird Feeder: a hanging gazebo feeder. A tray with posts, a seed hopper that stands on the tray and lets seed
      // slide out through arched ports, and a cone roof that rests on the posts. It prints as a kit of three parts laid
      // flat on the bed (printMeshes), none of them needing supports; the viewport shows it assembled.
      // Hang it from a cord that runs through the roof, the hopper and a hole in the middle of the tray.
      // Y up, millimetres. Radii are written for a round feeder; polygon outlines scale them by `fac` so that the
      // distance across the flats matches the round size and the posts sit on the middle of a flat.
      var TAU = Math.PI * 2, DEG = Math.PI / 180;
      var RIM_T = 2.0, LIP_W = 2.0, GUIDE_W = 2.0, POST_EMBED = 0.8, TOP_GAP = 8, DRAIN_R = 1.6;

      function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
      function tri(o, a, b, c) { o.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]); }
      function concat(list) {
        var n = 0, i, out, at = 0;
        for (i = 0; i < list.length; i++) n += list[i].length;
        out = new Float32Array(n);
        for (i = 0; i < list.length; i++) { out.set(list[i], at); at += list[i].length; }
        return out;
      }
      // Flip a closed shell inside out when its signed volume is negative.
      function orient(pos) {
        var v = 0, i, t;
        for (i = 0; i < pos.length; i += 9) {
          v += pos[i] * (pos[i + 4] * pos[i + 8] - pos[i + 5] * pos[i + 7])
             - pos[i + 1] * (pos[i + 3] * pos[i + 8] - pos[i + 5] * pos[i + 6])
             + pos[i + 2] * (pos[i + 3] * pos[i + 7] - pos[i + 4] * pos[i + 6]);
        }
        if (v < 0) {
          for (i = 0; i < pos.length; i += 9) {
            for (t = 0; t < 3; t++) { var s = pos[i + 3 + t]; pos[i + 3 + t] = pos[i + 6 + t]; pos[i + 6 + t] = s; }
          }
        }
        return pos;
      }
      function shift(pos, dx, dy, dz) {
        var out = new Float32Array(pos.length), i;
        for (i = 0; i < pos.length; i += 3) { out[i] = pos[i] + dx; out[i + 1] = pos[i + 1] + dy; out[i + 2] = pos[i + 2] + dz; }
        return out;
      }

      // Solid of revolution about Y from a closed (r, y) loop that never touches the axis. A point may carry a third
      // value; mod(point, theta) then returns its y (the hopper ports lift the bottom ring). Shared vertices keep it closed.
      function lathe(pts, seg, scale, mod) {
        var R = pts.length, P = [], o = [], i, j, row, th, r, y;
        for (i = 0; i < R; i++) {
          row = [];
          for (j = 0; j < seg; j++) {
            th = (j / seg) * TAU;
            r = pts[i][0] * scale;
            y = mod && pts[i][2] ? mod(pts[i], th) : pts[i][1];
            row.push([r * Math.cos(th), y, r * Math.sin(th)]);
          }
          P.push(row);
        }
        for (i = 0; i < R; i++) {
          var i2 = (i + 1) % R;
          for (j = 0; j < seg; j++) {
            var k = (j + 1) % seg, a = P[i][j], b = P[i][k], c = P[i2][k], d = P[i2][j];
            tri(o, a, d, c); tri(o, a, c, b);
          }
        }
        return orient(new Float32Array(o));
      }

      // A box standing on the floor: a = size along the tangent, b = size along the radius, rotated to polar angle ang.
      function post(r, ang, a, b, y0, y1) {
        var ca = Math.cos(ang), sa = Math.sin(ang), cx = r * ca, cz = r * sa, o = [];
        function pt(u, v, y) { return [cx + u * ca - v * sa, y, cz + u * sa + v * ca]; }
        var p0 = pt(-b / 2, -a / 2, y0), p1 = pt(b / 2, -a / 2, y0), p2 = pt(b / 2, a / 2, y0), p3 = pt(-b / 2, a / 2, y0);
        var q0 = pt(-b / 2, -a / 2, y1), q1 = pt(b / 2, -a / 2, y1), q2 = pt(b / 2, a / 2, y1), q3 = pt(-b / 2, a / 2, y1);
        tri(o, p0, p2, p1); tri(o, p0, p3, p2);
        tri(o, q0, q1, q2); tri(o, q0, q2, q3);
        tri(o, p0, p1, q1); tri(o, p0, q1, q0);
        tri(o, p1, p2, q2); tri(o, p1, q2, q1);
        tri(o, p2, p3, q3); tri(o, p2, q3, q2);
        tri(o, p3, p0, q0); tri(o, p3, q0, q3);
        return orient(new Float32Array(o));
      }

      // Flat plate (polygon outline, round holes) from y0 to y1, triangulated by three.js.
      function plate(THREE, outline, holes, y0, y1) {
        var v2 = function (p) { return new THREE.Vector2(p[0], p[1]); };
        var shape = new THREE.Shape(outline.map(v2));
        holes.forEach(function (h) { shape.holes.push(new THREE.Path(h.map(v2))); });
        var geo = new THREE.ExtrudeGeometry(shape, { depth: y1 - y0, bevelEnabled: false, curveSegments: 1, steps: 1 });
        if (geo.index) geo = geo.toNonIndexed();
        var src = geo.attributes.position.array, out = new Float32Array(src.length), i;
        for (i = 0; i < src.length; i += 3) { out[i] = src[i]; out[i + 1] = y0 + src[i + 2]; out[i + 2] = src[i + 1]; }
        return orient(out);
      }
      function ngon(n, r, cx, cz, phase) {
        var pts = [], i;
        for (i = 0; i < n; i++) pts.push([cx + r * Math.cos(phase + (i / n) * TAU), cz + r * Math.sin(phase + (i / n) * TAU)]);
        return pts;
      }

      // ---------------------------------------------------------------------
      // Dimensions: every derived size in one place, so build() and printMeshes() agree.
      // ---------------------------------------------------------------------
      function dims(p) {
        var d = {};
        d.o = Math.round(p.outline);
        d.n = [96, 6, 8, 4][d.o];
        d.fac = d.o === 0 ? 1 : 1 / Math.cos(Math.PI / d.n);
        d.N = d.o === 0 ? Math.round(p.posts) : d.n;
        d.clr = p.clearance;
        d.fT = p.floor;
        d.Rin = p.trayD / 2;                       // across the flats / 2
        d.pa = p.postW; d.pb = p.postT;
        d.Rp = d.Rin - RIM_T + 0.5 - d.pb / 2;     // post centre; the outer face overlaps the rim by 0.5
        d.rimH = p.rimH;
        d.cr = p.cordD / 2;
        d.hopper = p.hopper >= 1;
        d.bodyH = p.bodyH;
        d.postTop = d.fT + d.bodyH + TOP_GAP;

        // hopper
        var Rmax = d.Rp - d.pb / 2 - 4;
        d.Rho = Math.max(14, Rmax * p.hopperPct / 100);
        d.wallH = p.hopperWall;
        d.Rhi = d.Rho - d.wallH;
        d.portN = Math.round(p.ports);
        d.portW = Math.max(6, Math.min(p.portW, TAU * d.Rho / d.portN - 6));
        d.portH = Math.max(8, Math.min(p.portH, d.bodyH - 14));

        // tray hub and seed cone
        d.rHub = d.cr + 4.5; d.rp = d.cr + 3.0; d.rTop = d.cr + 1.6;
        d.Rc = d.hopper ? Math.max(d.Rhi - d.clr, d.rHub + 3) : d.rHub + 6;
        d.coneH = d.hopper ? Math.min((d.Rc - d.rTop) * Math.tan(p.coneAng * DEG), d.bodyH * 0.5) : 4;

        // drains sit between the hopper and the posts
        var inner = d.hopper ? d.Rho : d.Rc, gap = (d.Rp - d.pb / 2) - inner;
        d.drains = Math.round(p.drains);
        d.drainR = Math.min(DRAIN_R, gap / 2 - 1.2);
        if (d.drainR < 0.9) d.drains = 0;
        d.Rd = inner + gap / 2;

        // roof
        d.P = p.pitch * DEG; d.tanP = Math.tan(d.P); d.tv = p.roofT / Math.cos(d.P);
        d.rg0 = d.Rp - d.pb / 2 - d.clr; d.rg1 = d.Rp + d.pb / 2 + d.clr;
        d.ro = d.rg1 + GUIDE_W + 3.2 + p.overhang;
        d.lipH = 6 + d.tv;
        d.rn = d.cr + 2.8;                          // the little chimney at the apex that the cord leaves through
        d.fh = p.finial;
        d.yc = 6 + (d.ro - d.cr) * d.tanP;           // where the ceiling meets the cord hole
        d.H = Math.max(d.yc + 3, d.lipH + (d.ro - d.rn) * d.tanP + 1);
        return d;
      }
      function ceilY(d, r) { return 6 + (d.ro - r) * d.tanP; }   // roof underside at radius r (roof's own y = 0 on the bed)

      // ---------------------------------------------------------------------
      // The parts, each on y = 0 with its centre on the axis.
      // ---------------------------------------------------------------------
      function buildTray(d, THREE) {
        var shells = [], i, holes = [], a;
        // floor plate with the cord hole and the drain holes
        holes.push(ngon(32, d.rp, 0, 0, 0));
        for (i = 0; i < d.drains; i++) {
          a = (i + 0.5) / d.drains * TAU;
          holes.push(ngon(20, d.drainR, d.Rd * Math.cos(a), d.Rd * Math.sin(a), 0));
        }
        shells.push(plate(THREE, ngon(d.n, (d.Rin - RIM_T / 2) * d.fac, 0, 0, 0), holes, 0, d.fT));
        // rim wall
        var ri = d.Rin - RIM_T, ch = 1.2;
        shells.push(lathe([[ri, 0], [d.Rin, 0], [d.Rin, d.rimH - ch], [d.Rin - ch, d.rimH], [ri, d.rimH]], d.n, d.fac));
        // hub with the cord hole and the seed cone (its base sits inside the floor)
        shells.push(lathe([
          [d.cr, 0], [d.rHub, 0], [d.rHub, d.fT - 0.6], [d.Rc, d.fT - 0.6], [d.Rc, d.fT],
          [d.rTop, d.fT + d.coneH], [d.cr, d.fT + d.coneH]
        ], 64, 1));
        return concat(shells);
      }
      function buildPosts(d) {
        var shells = [], k, ang, y0 = d.fT - POST_EMBED;
        for (k = 0; k < d.N; k++) {
          ang = Math.PI / d.N + (k / d.N) * TAU;
          shells.push(post(d.Rp, ang, d.pa, d.pb, y0, d.postTop));
        }
        return concat(shells);
      }
      function buildHopper(d) {
        var H = d.bodyH, ym = d.portH + 4, halfW = d.portW / 2, k0 = Math.PI / 2;
        function notch(pt, th) {
          var h = 0, k, delta, dist, u;
          for (k = 0; k < d.portN; k++) {
            delta = th - (k0 + (k / d.portN) * TAU);
            delta = Math.atan2(Math.sin(delta), Math.cos(delta));
            dist = Math.abs(delta) * d.Rho;
            if (dist < halfW) {
              u = dist / halfW;
              h = Math.max(h, d.portH * Math.pow(1 - u, 0.62));
            }
          }
          return h;
        }
        return lathe([
          [d.Rho, 0, 1], [d.Rho, ym], [d.Rho, H], [d.Rhi, H], [d.Rhi, ym], [d.Rhi, 0, 1]
        ], 160, 1, notch);
      }
      function buildRoof(d) {
        var pts = [], i, phi;
        pts.push([d.ro, 0], [d.ro, d.lipH], [d.rn, d.lipH + (d.ro - d.rn) * d.tanP], [d.rn, d.H]);
        if (d.fh > 0) {
          // a finial: flares out at about 41 degrees from vertical, then rounds over to the top
          var rm = d.rn + Math.min(d.fh * 0.45, 7), ym = d.H + 1.15 * (rm - d.rn), rt = d.cr + 1.8, yt = d.H + d.fh;
          pts.push([rm, ym]);
          for (i = 1; i <= 5; i++) {
            phi = (i / 6) * Math.PI / 2;
            pts.push([rt + (rm - rt) * Math.cos(phi), ym + (yt - ym) * Math.sin(phi)]);
          }
          pts.push([rt, yt], [d.cr, yt]);
        } else {
          pts.push([d.cr, d.H]);
        }
        // underside: the ceiling, with an inner guide wall, the groove for the posts, and an outer guide wall
        var a0 = d.rg0 - GUIDE_W, a1 = d.rg1 + GUIDE_W, b = d.ro - LIP_W;
        pts.push([d.cr, d.yc], [a0, ceilY(d, a0)], [a0, 0], [d.rg0, 0], [d.rg0, ceilY(d, d.rg0)],
                 [d.rg1, ceilY(d, d.rg1)], [d.rg1, 0], [a1, 0], [a1, ceilY(d, a1)],
                 [b, ceilY(d, b)], [b, 0]);
        return lathe(pts, d.n, d.fac);
      }

      function allParts(p, api) {
        var d = dims(p);
        var parts = {
          tray: buildTray(d, api.THREE),
          posts: buildPosts(d),
          roof: buildRoof(d)
        };
        if (d.hopper) parts.hopper = buildHopper(d);
        return { d: d, parts: parts };
      }

      // Assembled pose for the viewport.
      function build(p, api) {
        var r = allParts(p, api), d = r.d, out = [];
        var yRoof = d.postTop - ceilY(d, d.Rp + d.pb / 2);
        out.push({ name: 'tray', positions: r.parts.tray, smoothGroup: 'tray' });
        out.push({ name: 'posts', positions: r.parts.posts, smoothGroup: 'posts' });
        if (r.parts.hopper) out.push({ name: 'hopper', positions: shift(r.parts.hopper, 0, d.fT, 0), smoothGroup: 'hopper' });
        out.push({ name: 'roof', positions: shift(r.parts.roof, 0, yRoof, 0), smoothGroup: 'roof' });
        return out;
      }

      // Print plate: the roof, the tray with its posts and the hopper laid out side by side on the bed.
      function printMeshes(p, api) {
        var r = allParts(p, api), d = r.d;
        var items = [
          { names: ['roof'], r: d.ro * d.fac },
          { names: ['tray', 'posts'], r: d.Rin * d.fac },
        ];
        if (r.parts.hopper) items.push({ names: ['hopper'], r: d.Rho });
        var gap = 10, maxW = 236, rows = [], cur = null, total = 0;
        items.forEach(function (it) {
          var w = it.r * 2;
          if (!cur || cur.w + gap + w > maxW) { cur = { w: 0, items: [], depth: 0 }; rows.push(cur); }
          cur.w += (cur.items.length ? gap : 0) + w;
          cur.items.push(it);
          cur.depth = Math.max(cur.depth, w);
        });
        rows.forEach(function (row) { total += row.depth; });
        total += gap * (rows.length - 1);
        var z = -total / 2, out = [];
        rows.forEach(function (row) {
          var x = -row.w / 2;
          row.items.forEach(function (it) {
            it.x = x + it.r; it.z = z + row.depth / 2;
            x += it.r * 2 + gap;
          });
          z += row.depth + gap;
        });
        items.forEach(function (it) {
          it.names.forEach(function (name) {
            out.push({ name: name, positions: shift(r.parts[name], it.x, 0, it.z), smoothGroup: name });
          });
        });
        return out;
      }

      // ---------------------------------------------------------------------
      // Parameters
      // ---------------------------------------------------------------------
      function choice(group, key, label, names, value, showIf) {
        var c = { group: group, key: key, label: label, unit: '', min: 0, max: names.length - 1, step: 1, value: value,
          format: function (v) { return names[Math.round(v)]; } };
        if (showIf) c.showIf = showIf;
        return c;
      }
      function hopperOn(p) { return p.hopper >= 1; }
      var PARAMS = [
        choice('Feeder', 'outline', 'Outline', ['Round', 'Hexagon', 'Octagon', 'Square'], 0),
        { group: 'Feeder', key: 'trayD', label: 'Tray width', unit: ' mm', min: 80, max: 150, step: 2, value: 100 },
        { group: 'Feeder', key: 'bodyH', label: 'Hopper height (sets the post height)', unit: ' mm', min: 40, max: 140, step: 2, value: 90 },
        choice('Feeder', 'hopper', 'Seed hopper', ['Off', 'On'], 1),
        { group: 'Feeder', key: 'posts', label: 'Posts (round outline)', unit: '', min: 3, max: 8, step: 1, value: 4,
          showIf: function (p) { return Math.round(p.outline) === 0; } },

        { group: 'Hopper', key: 'hopperPct', label: 'Hopper width', unit: '%', min: 45, max: 100, step: 1, value: 85, showIf: hopperOn },
        { group: 'Hopper', key: 'ports', label: 'Feeding ports', unit: '', min: 2, max: 6, step: 1, value: 4, showIf: hopperOn },
        { group: 'Hopper', key: 'portW', label: 'Port width (small seed = narrow)', unit: ' mm', min: 8, max: 28, step: 1, value: 16, showIf: hopperOn },
        { group: 'Hopper', key: 'portH', label: 'Port height (taller = faster flow)', unit: ' mm', min: 10, max: 40, step: 1, value: 20, showIf: hopperOn },
        { group: 'Hopper', key: 'hopperWall', label: 'Hopper wall', unit: ' mm', min: 1.2, max: 3, step: 0.2, value: 1.6, showIf: hopperOn },
        { group: 'Hopper', key: 'coneAng', label: 'Seed slope (steeper = empties better)', unit: '°', min: 25, max: 50, step: 1, value: 35, showIf: hopperOn },

        { group: 'Roof', key: 'pitch', label: 'Roof pitch (steeper = no supports)', unit: '°', min: 45, max: 70, step: 1, value: 48 },
        { group: 'Roof', key: 'overhang', label: 'Roof overhang', unit: ' mm', min: 0, max: 25, step: 1, value: 8 },
        { group: 'Roof', key: 'roofT', label: 'Roof thickness', unit: ' mm', min: 2, max: 4, step: 0.2, value: 2.4 },
        { group: 'Roof', key: 'finial', label: 'Finial height (0 = none)', unit: ' mm', min: 0, max: 24, step: 1, value: 10 },

        { group: 'Tray & posts', key: 'rimH', label: 'Rim height', unit: ' mm', min: 6, max: 24, step: 1, value: 12 },
        { group: 'Tray & posts', key: 'floor', label: 'Floor thickness', unit: ' mm', min: 2, max: 4, step: 0.2, value: 2.4 },
        { group: 'Tray & posts', key: 'drains', label: 'Drain holes (0 = none)', unit: '', min: 0, max: 12, step: 1, value: 6 },
        { group: 'Tray & posts', key: 'postW', label: 'Post width', unit: ' mm', min: 6, max: 20, step: 1, value: 10 },
        { group: 'Tray & posts', key: 'postT', label: 'Post thickness', unit: ' mm', min: 4, max: 10, step: 1, value: 6 },
        { group: 'Tray & posts', key: 'cordD', label: 'Cord hole', unit: ' mm', min: 3, max: 8, step: 0.5, value: 5 },

        { group: 'Fit', key: 'clearance', label: 'Fit clearance (higher = looser)', unit: ' mm', min: 0.2, max: 0.8, step: 0.05, value: 0.4 }
      ];
      var DEFAULTS = {};
      PARAMS.forEach(function (q) { DEFAULTS[q.key] = q.value; });
      function presetOf(label, over) {
        var values = {};
        Object.keys(DEFAULTS).forEach(function (k) { values[k] = DEFAULTS[k]; });
        Object.keys(over || {}).forEach(function (k) { values[k] = over[k]; });
        return { label: label, values: values };
      }

      window.MM_GENERATOR = {
        code: 'MM-123',
        category: 'GARDEN // BIRDS',
        title: 'Bird Feeder',
        fileName: 'Bird_Feeder',
        palette: [
          { name: 'Birch White', color: '#f1f5f9' }, { name: 'Cedar Tan', color: '#d9b38c' },
          { name: 'Barn Red', color: '#f28b82' }, { name: 'Leaf Green', color: '#9bd77e' },
          { name: 'Sky Blue', color: '#8ecae6' }, { name: 'Sunny Yellow', color: '#fde047' },
          { name: 'Plum', color: '#c4a1e8' }, { name: 'Charcoal', color: '#475569' }
        ],
        partNames: { tray: 'Tray', posts: 'Posts', hopper: 'Seed hopper', roof: 'Roof' },
        creaseShading: 40,
        parameters: PARAMS,
        presets: [
          presetOf('Default gazebo feeder'),
          presetOf('Finch feeder', { trayD: 90, bodyH: 70, hopperPct: 80, portW: 9, portH: 13, pitch: 52, overhang: 6 }),
          presetOf('Tray feeder (no hopper)', { hopper: 0, trayD: 130, bodyH: 60, rimH: 14, overhang: 12, finial: 8 }),
          presetOf('Hexagon cottage', { outline: 1, trayD: 100, pitch: 55, overhang: 10 }),
          presetOf('Pagoda', { outline: 2, trayD: 96, bodyH: 100, pitch: 60, overhang: 12, finial: 18 }),
          presetOf('Big hopper', { trayD: 120, overhang: 6, bodyH: 120, hopperPct: 90, ports: 5, portW: 20, portH: 26 })
        ],
        build: build,
        printMeshes: printMeshes
      };
    })();
  </script>
  <script src="shared/export-utils.js"></script>
  <script src="shared/mesh-utils.js"></script>
  <script src="shared/generator-core.js"></script>
</body>
