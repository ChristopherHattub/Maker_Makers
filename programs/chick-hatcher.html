        for (i = 0; i < N; i++) { t = (i / N) * TAU; c = Math.cos(t); s = Math.sin(t); pts.push([a * Math.sign(c) * Math.pow(Math.abs(c), 2 / n), b * Math.sign(s) * Math.pow(Math.abs(s), 2 / n)]); }

      }
      // Word-wrap text to a width in mm at glyph unit u (cap height = 6u).
      function wrapText(str, u, maxW) {
        var words = String(str).split(/\s+/).filter(Boolean), lines = [], cur = '';
        words.forEach(function (w) {
          var tryS = cur ? cur + ' ' + w : w;
          if (cur && textSegs(tryS, u, u * 0.3).w > maxW) { lines.push(cur); cur = w; } else cur = tryS;
        });
        if (cur) lines.push(cur);
        return lines;
      }


      var DEFAULTS = {
        height: 70, width: 25, shape: 0.6, flat: 9, wall: 2.2, crackY: 52, amp: 5, hatch: 0, chick: 106, beak: 100, eye: 2.0
      };
      var NS = 48, crack = new Float32Array(NS), redrawCrack = null;
      function crackFill(fn) { for (var i = 0; i < NS; i++) crack[i] = fn(i / NS * TAU, i); }
      var CRACKS = {
        'Zigzag': function (a) { return (2 / Math.PI) * Math.asin(Math.sin(7 * a)); },
        'Fine zigzag': function (a) { return (2 / Math.PI) * Math.asin(Math.sin(11 * a)); },
        'Wavy': function (a) { return Math.sin(3 * a); },
        'Scallops': function (a) { return Math.abs(Math.sin(4.5 * a)) * 2 - 1; },
        'Tilted straight': function (a) { return Math.cos(a - Math.PI / 4) * 0.8; },
        'Straight': function () { return 0; }
      };
      crackFill(CRACKS.Zigzag);
      function crackAt(th, amp) {
        var u = (((th / TAU) % 1) + 1) % 1 * NS, i = Math.floor(u), f = u - i;
        return amp * lerp(crack[i % NS], crack[(i + 1) % NS], f);
      }
      function eggR(t, W, shape) {
        var e = 1 - 0.28 * shape, u = Math.pow(Math.max(0, Math.min(1, t)), e);
        return W * Math.pow(Math.max(0, Math.sin(Math.PI * u)), 0.6);
      }
      function build(p) {
        var H = p.height, W = p.width, e = p.shape, wall = p.wall, SEGN = 96, n = 26;
        var tcut = 0.02; while (tcut < 0.3 && eggR(tcut, W, e) < Math.min(p.flat, W * 0.9)) tcut += 0.004;
        var Rf = function (y) { return eggR(tcut + (1 - tcut) * (Math.max(0, y) / H), W, e); };
        var hy = H * p.crackY / 100, i;
        var hOf = function (th) { return Math.max(wall + 6, Math.min(H - wall - 6, hy + crackAt(th, p.amp))); };

        // lower shell: flat floor, walls up to the crack line
        var D = [{ k: 'pole', y: 0 }], P = [[0, 0]];
        for (i = 0; i <= n; i++) { D.push({ k: 'o', t: i / n }); P.push([1, 0]); }
        for (i = n; i >= 0; i--) { D.push({ k: 'i', t: i / n }); P.push([1, 0]); }
        D.push({ k: 'pole', y: wall }); P.push([0, 0]);
        var lower = surface(P, SEGN, function (idx, j, th) {
          var d = D[idx], h = hOf(th), y, r;
          if (d.k === 'pole') return [0, d.y, 0];
          if (d.k === 'o') { y = h * d.t; r = Rf(y); } else { y = wall + (h - wall) * d.t; r = Math.max(0.3, Rf(y) - wall); }
          return [r * Math.cos(th), y, r * Math.sin(th)];
        });
        // cap: dome from the crack line to the tip
        var C = [], PC = [], m = 30;
        for (i = 0; i <= m; i++) { C.push({ k: 'o', t: i / m }); PC.push([i === m ? 0 : 1, 0]); }
        for (i = m; i >= 0; i--) { C.push({ k: 'i', t: i / m }); PC.push([1, 0]); }
        var cap = surface(PC, SEGN, function (idx, j, th) {
          var d = C[idx], h = hOf(th), y, r;
          if (d.k === 'o') { y = h + (H - h) * d.t; r = d.t >= 1 ? 0 : Rf(y); }
          else { y = h + (H - wall * 1.2 - h) * d.t; r = Math.max(0, Rf(y) - wall); }
          return [r * Math.cos(th), y, r * Math.sin(th)];
        }, true);
        var hb = hOf(-Math.PI / 2), pivot = [0, hb - 0.3, -Rf(hb)];
        var a = p.hatch * DEG;
        cap = xform(cap, { t: [0, -0.35, 0] });
        if (a > 0.001) cap = xform(xform(xform(cap, { t: [-pivot[0], -pivot[1], -pivot[2]] }), { rx: -a }), { t: pivot });
        // the chick
        var inner = W - wall, rb = inner * 0.62 * p.chick / 100, rh = rb * 0.64, by = wall + rb * 1.02, headY = by + rb * 0.8 + rh * 0.6;
        var body = [xform(ball(rb, rb * 0.95, rb * 0.92, 48), { t: [0, by, 0] })];
        var head = [xform(ball(rh, rh * 0.95, rh, 40), { t: [0, headY, rb * 0.08] })];
        var wings = [-1, 1].map(function (s) { return xform(ball(rb * 0.22, rb * 0.5, rb * 0.42, 24), { rz: s * 0.35, t: [s * rb * 0.92, by + rb * 0.05, -rb * 0.05] }); });
        var bk = p.beak / 100;
        var beak = [xform(cone(rh * 0.3 * bk, 0, 0, rh * 0.62 * bk, 18), { rx: Math.PI / 2, t: [0, headY - rh * 0.1, rb * 0.08 + rh * 0.88] }),
                    xform(cone(rh * 0.24 * bk, 0, 0, rh * 0.5 * bk, 18), { rx: Math.PI / 2 + 0.28, t: [0, headY - rh * 0.34, rb * 0.08 + rh * 0.8] })];
        var eyes = [-1, 1].map(function (s) { return xform(ball(p.eye, p.eye * 1.1, p.eye * 0.7, 20), { t: [s * rh * 0.44, headY + rh * 0.2, rb * 0.08 + rh * 0.9] }); });
        var tuft = [-1, 0, 1].map(function (s) { return xform(cone(rh * 0.1, 0, 0, rh * 0.45, 10), { rz: -s * 0.5, t: [s * rh * 0.12, headY + rh * 0.92, rb * 0.08] }); });
        var out = [{ name: 'shell', positions: lower, smoothGroup: 'shell' }, { name: 'cap', positions: cap, smoothGroup: 'cap' }];
        pushMesh(out, mesh('chick', body.concat(head, wings))); pushMesh(out, mesh('beak', beak)); pushMesh(out, mesh('eyes', eyes)); pushMesh(out, mesh('tuft', tuft));
        return out;
      }

      function drawCrack(cv, amp) {
        var g = cv.getContext('2d'), w = cv.width, h = cv.height, i;
        g.fillStyle = '#0a2246'; g.fillRect(0, 0, w, h);
        g.fillStyle = '#14407f'; g.fillRect(0, 0, w, h * 0.5 - 8); g.fillStyle = '#0e2e5c'; g.fillRect(0, h * 0.5 + 8, w, h * 0.5);
        g.strokeStyle = '#00e5ff44'; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke(); g.setLineDash([]);
        g.strokeStyle = '#ffd400'; g.lineWidth = 3; g.beginPath();
        for (i = 0; i <= NS; i++) { var X = i / NS * w, Y = h / 2 - crack[i % NS] * (h / 2 - 12); if (i) g.lineTo(X, Y); else g.moveTo(X, Y); }
        g.stroke();
        g.fillStyle = '#9fc4ff'; g.font = '11px Courier New'; g.fillText('front', 6, h - 6); g.fillText('back', w * 0.75 - 12, h - 6);
      }
      function mountCrack(container, api) {
        container.appendChild(mkEl('p', { class: 'mm-note' }, 'Draw the crack: this strip is the egg unrolled, left to right is once around. Drag to draw; the gold line becomes the break. Then raise Hatch in the Egg section to tip the cap open.'));
        var cv = mkCanvas(container, 336, 110), last = null;
        redrawCrack = function () { drawCrack(cv, 1); };
        dragCanvas(cv, function (x, y, phase) {
          if (phase === 'up') { last = null; return; }
          var c = Math.max(0, Math.min(NS - 1, Math.round(x * NS))), v = Math.max(-1, Math.min(1, (0.5 - y) * 2 * (cv.height / (cv.height - 24))));
          if (last) { var n = Math.max(1, Math.abs(c - last[0])), k; for (k = 0; k <= n; k++) crack[Math.round(lerp(last[0], c, k / n)) % NS] = lerp(last[1], v, k / n); } else crack[c] = v;
          last = [c, v]; redrawCrack(); api.rebuild();
        });
        var row = mkEl('div', { class: 'mm-export-row' });
        Object.keys(CRACKS).forEach(function (nm) { row.appendChild(mkBtn(nm, function () { crackFill(CRACKS[nm]); redrawCrack(); api.rebuild(); })); });
        row.appendChild(mkBtn('Random jag', function () { var r = rng(Date.now() & 0xffff), v = 0; crackFill(function () { v = Math.max(-1, Math.min(1, v + (r() - 0.5) * 1.6)); return v; }); redrawCrack(); api.rebuild(); }));
        container.appendChild(row);
        redrawCrack();
      }

          { name: 'Sky Blue', color: '#a5d8ff' },
          { name: 'Lavender', color: '#d8b4fe' },
          { name: 'Shadow Black', color: '#334155' }
        ],
        defaultColor: '#fff4dc',
        partNames: { shell: 'Lower shell', cap: 'Egg cap', chick: 'Chick', beak: 'Beak', eyes: 'Eyes', tuft: 'Head tuft' },
        openGroups: ['Egg'],
        extrasTitle: 'Draw the crack',
        parameters: [
          { group: 'Egg', key: 'hatch', label: 'Hatch (cap tilt; over 20° needs supports)', unit: '°', min: 0, max: 45, step: 1, value: DEFAULTS.hatch },
          { group: 'Egg', key: 'height', label: 'Egg height', unit: ' mm', min: 54, max: 100, step: 1, value: DEFAULTS.height },
          { group: 'Egg', key: 'width', label: 'Egg width', unit: ' mm', min: 20, max: 36, step: 0.5, value: DEFAULTS.width },
          { group: 'Egg', key: 'shape', label: 'Shape (round ↔ egg)', unit: '', min: 0, max: 1, step: 0.05, value: DEFAULTS.shape },
          { group: 'Egg', key: 'flat', label: 'Flat bottom width', unit: ' mm', min: 6, max: 20, step: 0.5, value: DEFAULTS.flat },
          { group: 'Egg', key: 'wall', label: 'Shell thickness', unit: ' mm', min: 1.6, max: 3.5, step: 0.2, value: DEFAULTS.wall },

          { group: 'Chick', key: 'eye', label: 'Eye size', unit: ' mm', min: 1.2, max: 3.5, step: 0.1, value: DEFAULTS.eye }
        ],
        presets: [
          presetOf(DEFAULTS, 'Closed egg', {}),
          presetOf(DEFAULTS, 'Peeking out', { hatch: 18, amp: 6 }),
          presetOf(DEFAULTS, 'Wide open', { hatch: 40, crackY: 48 }),
