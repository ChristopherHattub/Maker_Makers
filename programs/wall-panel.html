          else api.setPreview(null);
        }
        function up(ev) {
          window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
          if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
          api.setPreview(null);
          selVer++;
          if (!moved) { addItem(type, 0, 0, api); return; }
          var pt = planePoint(ev.clientX, ev.clientY, p.thick);
          if (pt && ev.type === 'pointerup') addItem(type, snapTo(pt[0], p), snapTo(pt[1], p), api);
        }
        window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
      }

      // ---- dragging elements on the panel ----
      var drag = null, shown = { active: false, ver: -1 };
      function attachStage(ctx) {
        stageCtx = ctx;
        var parent = ctx.renderer.domElement.parentNode;
        parent.addEventListener('pointerdown', function (e) {
          if (!tabActive() || e.button !== 0 || e.target !== ctx.renderer.domElement || !apiRef) return;
          var p = apiRef.params, pt = planePoint(e.clientX, e.clientY, p.thick);
          if (!pt) return;
          var hit = null, i;
          var cur = itemById(selId);
          if (cur && hitItem(cur, pt[0], pt[1], p, 1)) hit = cur;
          for (i = items.length - 1; i >= 0 && !hit; i--) if (hitItem(items[i], pt[0], pt[1], p, 1)) hit = items[i];
          if (!hit) { if (selId !== null) { selId = null; selVer++; if (ui) ui.refresh(); } return; }
          if (hit.id !== selId) { selId = hit.id; selVer++; if (ui) ui.refresh(); }
          ctx.controls.enabled = false;
          e.stopPropagation();
          drag = { id: hit.id, ox: hit.x - pt[0], oy: hit.y - pt[1], moved: false };
        }, true);
        window.addEventListener('pointermove', function (e) {
          if (!drag || !apiRef) return;
          var p = apiRef.params, it = itemById(drag.id), pt = planePoint(e.clientX, e.clientY, p.thick);
          if (!it || !pt) return;
          var nx = snapTo(pt[0] + drag.ox, p), ny = snapTo(pt[1] + drag.oy, p);
          if (nx === it.x && ny === it.y) return;
          if (!drag.moved) { pushUndo(); drag.moved = true; }
          it.x = nx; it.y = ny; selVer++;
          apiRef.rebuild();
        });
        var end = function () {
          if (!drag) return;
          drag = null; ctx.controls.enabled = true;
          if (ui) ui.refresh();
        };
        window.addEventListener('pointerup', end);
        window.addEventListener('pointercancel', end);
        window.addEventListener('keydown', function (e) {
          if (!tabActive() || !selId || (e.key !== 'Delete' && e.key !== 'Backspace')) return;
          var t = e.target;
          if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || (t.tagName === 'INPUT' && t.type !== 'range'))) return;
          e.preventDefault(); deleteSel(apiRef);
        });
      }
      // Camera straight above the panel, the view for placing things. Done once when the Elements tab first opens, and by its button.
      var topShown = false;
      function topView() {
        if (!stageCtx || !apiRef) return;
        var p = apiRef.params, cam = stageCtx.camera, d = Math.max(p.height / 2 * 1.2, p.width / 2 * 1.2 / (cam.aspect || 1)) / Math.tan((cam.fov || 45) * DEG / 2) + 10;
        stageCtx.controls.target.set(0, p.thick, 0);
        stageCtx.camera.position.set(0, p.thick + d, d * 0.001 + 0.01);
        stageCtx.camera.lookAt(0, p.thick, 0);
        stageCtx.controls.update();
      }
      function onFrame() {
        if (!apiRef) return;
        var act = tabActive();
        if (act && !topShown) { topShown = true; topView(); }
        if (act === shown.active && selVer === shown.ver) return;
        shown.active = act; shown.ver = selVer;
        var it = act ? itemById(selId) : null;
        apiRef.setPreview(it ? ringFor2(it, apiRef.params) : null);
      }

      function sampler(p) {
        // check-mesh.mjs: the layout plus one of every element, some rotated, so the checks cover them all.
        // Each extra goes in the first free spot of a coarse grid (overlapping elements are the visitor's own problem and are flagged in the tab).
        var kinds = [['checkbox', 0], ['slider', 90], ['dial', 15], ['icon', 0], ['divider', 45], ['text', 30], ['progress', 180]];
        kinds.forEach(function (q) {
          var it = newItem(q[0], 0, 0);
          if (q[0] === 'icon') it.kind = 'heart';
          if (q[0] === 'progress') { it.ticks = 6; it.len = 30; }
          if (q[0] === 'slider') { it.len = 30; it.ticks = 4; }
          it.angle = q[1];
          var e = ext(it, p), gx, gy, placed = false;
          for (gy = -p.height / 2; gy <= p.height / 2 && !placed; gy += 6) {
            for (gx = -p.width / 2; gx <= p.width / 2 && !placed; gx += 6) {
              it.x = gx; it.y = gy;
              var before = it.x + ',' + it.y;
              fitItem(it, p);
              if (it.x + ',' + it.y !== before) continue;
              var clash = items.some(function (o) { return obbOverlap(it, e, o, ext(o, p), p) || (Math.abs(it.x - o.x) < 1 && Math.abs(it.y - o.y) < 1); });
              if (!clash) placed = true;
            }
          }
          if (placed) items.push(it);
        });
      }

      function defaults(over) {
        var o = { layout: 0, width: 140, height: 170, thick: 3.6, corner: 10, rim: 2, rimH: 1.2, hang: 1, holeD: 5, raise: 1.6, bold: 0, tracking: 0.3, clearance: 0.35, gap: 0.3, snap: 1 };
        Object.keys(over || {}).forEach(function (k) { o[k] = over[k]; });
        return o;
      }
      var DEFAULTS = defaults();
      function preset(label, over) { return { label: label, values: defaults(over) }; }
      function slider(group, key, label, unit, min, max, step, value, extra) {
        var o = { group: group, key: key, label: label, unit: unit, min: min, max: max, step: step, value: value };
        Object.keys(extra || {}).forEach(function (k) { o[k] = extra[k]; });
        return o;
      }

      window.MM_GENERATOR = {
        code: 'MM-116',
        category: 'WALL // DECOR',
        title: 'Wall Panel Maker',
        fileName: 'wall-panel',
        palette: [
          { name: 'Bone White', color: '#f1ece1' }, { name: 'Slate Navy', color: '#2f4a73' }, { name: 'Sky Blue', color: '#7ab3ff' }, { name: 'Mint', color: '#7be0b0' },
          { name: 'Sunset Orange', color: '#ff9a4d' }, { name: 'Rose Pink', color: '#ff8fb1' }, { name: 'Lilac', color: '#b8a2f0' }, { name: 'Charcoal', color: '#33363d' }
        ],
        sculpt: false,
        partNames: { plate: 'Panel', rim: 'Border', text: 'Text', deco: 'Dividers & icons', rails: 'Slider rails', chips: 'Sliding chips', pins: 'Dial pins', knobs: 'Dial knobs', marks: 'Scale marks & grips' },
        printCheckOptions: { bridgeGap: 0.8 },
        openGroups: ['Panel'],
        parameters: [
          { group: 'Panel', key: 'layout', label: 'Starting layout (loads a set of elements)', unit: '', min: 0, max: LAYOUTS.length - 1, step: 1, value: DEFAULTS.layout, options: LAYOUTS },
          slider('Panel', 'width', 'Width', ' mm', 90, 220, 5, DEFAULTS.width),
          slider('Panel', 'height', 'Height', ' mm', 110, 260, 5, DEFAULTS.height),
          slider('Panel', 'thick', 'Panel thickness', ' mm', 2.4, 8, 0.2, DEFAULTS.thick),
          slider('Panel', 'corner', 'Corner roundness', ' mm', 0, 40, 1, DEFAULTS.corner),
          slider('Border', 'rim', 'Border width (0 = none)', ' mm', 0, 5, 0.5, DEFAULTS.rim, { format: function (v) { return v < 0.4 ? 'None' : v + ' mm'; } }),
          slider('Border', 'rimH', 'Border height', ' mm', 0.6, 3, 0.2, DEFAULTS.rimH),
          { group: 'Hanging', key: 'hang', label: 'Hanging holes', unit: '', min: 0, max: 2, step: 1, value: DEFAULTS.hang, options: ['None', 'Two holes', 'Keyhole'] },
          slider('Hanging', 'holeD', 'Hole size', ' mm', 3, 9, 0.5, DEFAULTS.holeD),
          slider('Text', 'raise', 'Text height above the panel', ' mm', 0.8, 3, 0.2, DEFAULTS.raise),
          slider('Text', 'bold', 'Boldness (thickens thin letters)', ' mm', 0, 0.6, 0.05, DEFAULTS.bold),
          slider('Text', 'tracking', 'Letter spacing', ' mm', -1, 4, 0.1, DEFAULTS.tracking),
          slider('Print fit', 'clearance', 'Slide clearance (sides and top, looser = freer)', ' mm', 0.25, 0.6, 0.05, DEFAULTS.clearance),
          slider('Print fit', 'gap', 'Gap above the panel (1 to 2 layers)', ' mm', 0.2, 0.5, 0.05, DEFAULTS.gap),
          { group: 'Placing', tab: 'elements', key: 'snap', label: 'Snap to grid (0 = free)', unit: ' mm', min: 0, max: 10, step: 1, value: DEFAULTS.snap, format: function (v) { return v === 0 ? 'Free' : v + ' mm'; } }
        ],
        presets: [
          preset('Default (to-do list)', {}),
          preset('Habit tracker', { layout: 1 }),
          preset('Progress board', { layout: 2, width: 150, height: 150 }),
          preset('Dial dashboard', { layout: 3, width: 150, height: 160 }),
          preset('Blank panel, keyhole', { layout: 4, width: 120, height: 120, hang: 2 }),
          preset('Pocket to-do', { layout: 0, width: 110, height: 150, corner: 14 }),
          preset('Loose fit', { clearance: 0.45, gap: 0.35 })
        ],
        tabs: [{
          id: 'elements',
          label: 'Elements',
          hint: 'Drag elements to move them, or drag a tile in from the tab',
          mount: function (container, api) { apiRef = api; tabBody = container; mountTab(container, api); }
        }],
        onStage: attachStage,
        onFrame: onFrame,
        embedState: { get: function () { return { items: items, nextId: nextId, layout: lastLayout }; }, set: function (v) {
          if (!v || !v.items) return;
          items = v.items; nextId = v.nextId || 100; lastLayout = v.layout; selId = null; selVer++;
          if (ui) ui.refresh();
        } },
        testSetup: function (params) { lastLayout = -1; ensureLayout(params); sampler(params); },
        // Exposed for the clearance test (scripts in docs/wall-panel.md): the print-in-place sections.
        sections: { rail: railSection, chip: chipSection, pin: pinProfile, knob: knobProfile, chipTopY: chipTopY },
        build: function (p) { return build(p); }
      };
    })();
  </script>
