        // rear leg (profile in its own frame, straight down is theta = 0): a hip disc round the hinge, a narrow neck,
        // and a foot ring (a ring sector whose outer edge is the foot arc). The hip disc holds the hinge hole and the stop slot.
        var Rd = m.Rd, rf = 0.62 * r, bn = 10 * DEG, sideY = -0.3 * Rd, i, right, left;

      window.MM_GENERATOR = {
        code: 'MM-122',
        category: 'TOYS // ACTION',
        title: 'Gravity Walker',
        fileName: 'Gravity_Walker',
        palette: [
          { name: 'Bone White', color: '#f1f5f9' }, { name: 'Glow Mint', color: '#a7f3d0' },
          { name: 'Pumpkin Matte', color: '#fdba74' }, { name: 'Lavender Mist', color: '#d8b4fe' },
          { name: 'Phantom Ice', color: '#93c5fd' }, { name: 'Berry Sorbet', color: '#fda4af' },
          { name: 'Shadow Black', color: '#334155' }, { name: 'Sunny Yellow', color: '#fde047' }
        ],
        partNames: { body: 'Body and foot', head: 'Head', eyes: 'Eyes', legs: 'Rear legs', pins: 'Hinge pins', ramp: 'Ramp', rails: 'Ramp rails' },
        parameters: [
          { group: 'Walker', key: 'legR', label: 'Leg length', unit: ' mm', min: 42, max: 64, step: 1, value: 50 },
          { group: 'Walker', key: 'bodyW', label: 'Body width', unit: ' mm', min: 24, max: 40, step: 1, value: 28 },
          { group: 'Walker', key: 'bodyTop', label: 'Body above hinge (% of leg)', unit: '%', min: 4, max: 10, step: 1, value: 6 },
          { group: 'Walker', key: 'head', label: 'Head', unit: '', min: 0, max: 2, step: 1, value: 0, format: function (v) { return HEAD_STYLES[v]; } },
          { group: 'Walker', key: 'headSize', label: 'Head size (% of leg)', unit: '%', min: 14, max: 18, step: 1, value: 16 },
          { group: 'Print in place', key: 'fit', label: 'Clearance (loose ↔ tight)', unit: ' mm', min: 0.2, max: 0.5, step: 0.05, value: 0.3 },
          { group: 'Print in place', key: 'foot', label: 'Foot weight (rear legs)', unit: ' mm', min: 8, max: 16, step: 1, value: 14 },
          { group: 'Print in place', key: 'legT', label: 'Rear leg thickness', unit: ' mm', min: 2.4, max: 4, step: 0.2, value: 2.4 },
          { group: 'Ramp', key: 'part', label: 'Print', unit: '', min: 0, max: 2, step: 1, value: 0, format: function (v) { return ['Walker only', 'Ramp only', 'Walker and ramp'][v]; } },
          { group: 'Ramp', key: 'slope', label: 'Ramp slope', unit: '°', min: 5, max: 12, step: 0.5, value: 8.5 },
          { group: 'Ramp', key: 'rampLen', label: 'Ramp length', unit: ' mm', min: 100, max: 220, step: 5, value: 170 }
        ],
        presets: [
          { label: 'Default duck', values: { legR: 50, bodyW: 28, bodyTop: 6, head: 0, headSize: 16, fit: 0.3, foot: 14, legT: 2.4, part: 0, slope: 8.5, rampLen: 170 } },
          { label: 'Robot', values: { head: 1 } },
          { label: 'Cat', values: { head: 2 } },
          { label: 'Walker and ramp together', values: { part: 2 } },
          { label: 'Ramp only', values: { part: 1 } },
          { label: 'Small walker', values: { legR: 42, bodyW: 26, foot: 14 } },
          { label: 'Big walker', values: { legR: 62, bodyW: 34, foot: 14 } }
        ],
        mount: function (container) {
          var note = document.createElement('div');
          note.className = 'mm-note';
          note.textContent = 'Print the walker, then the ramp (Ramp group: Print). The rear legs are printed free, nothing to assemble: swing them to check they move. Stand the walker at the top of the ramp, facing down. If it stops, raise the slope a little; if it slides or tumbles, lower it.';
          container.appendChild(note);
          balanceEl = document.createElement('div');
          balanceEl.className = 'mm-note';
          container.appendChild(balanceEl);
        },
        walkProps: function (p) { return props(p); },
        build: function (p, api) {
          var T = api.THREE, w = buildWalker(p, T, 0), meshes = [], ramp, rw, zW = 0, zR = 0, pr = props(p);
          lastProps = pr;
          if (balanceEl) {
            balanceEl.textContent = 'Balance: centre of weight ' + (pr.cA / pr.r).toFixed(2) + ' x leg length under the hinge (aim 0.25 to 0.45); rear legs ' + Math.round(100 * pr.mB / (pr.mA + pr.mB)) + '% of the weight (aim 8 to 20%).';
          }
          ramp = rampSolids(T, p, w.m, 0); rw = ramp.width;
          if (p.part === 2) { zW = -(rw / 2 + 14 + w.halfWidth); }
          if (p.part !== 1) {
            w = buildWalker(p, T, zW);
            w.meshes.forEach(function (e) { meshes.push(e); });
          }
          if (p.part !== 0) {
            meshes.push({ name: 'ramp', positions: f32(ramp.deck, 0, 0, zR) });
            meshes.push({ name: 'rails', positions: f32(ramp.rails, 0, 0, zR) });
          }
          return meshes;
        }
      };
    })();
  </script>
