  <script>
    (function () {
      'use strict';
      // Self-Watering Planter: a water-tight pot, a planting insert that hangs in it on a wick, and a drainage saucer.
      // All three print in place, assembled, with a small gap (Clearance) between them, and need no supports.
      // Y up, millimetres. Every solid is a surface of revolution (scaled by a plan shape), so it is closed by construction.
      var TAU = Math.PI * 2;

          }

      // ---------------------------------------------------------------------
      // Plan shapes: rho[j] scales every ring so the pot is round, square, hexagonal ...
      // Largest value is 1 (the corner radius); the smallest (apo) is the flat. Widths are measured across flats.
      // ---------------------------------------------------------------------
      var rhoCache = {};

        var NS = [0, 4, 6, 8, 3, 6];

            rho[j] = Math.pow(s, -1 / p);

      }

      // ---------------------------------------------------------------------
      // Outline of the pot: shape(t) is 0..1 around the foot width bw, t is height 0..1.
      // ---------------------------------------------------------------------
      var OUTLINES = ['Tapered', 'Straight', 'Bowl', 'Tulip', 'Urn', 'Barrel', 'Hourglass'];
      var PLANS = ['Round', 'Square', 'Hexagon', 'Octagon', 'Triangle', 'Flower'];
      var WALLS = ['Smooth', 'Ribbed', 'Scalloped', 'Twisted', 'Rings', 'Waves', 'Diamonds', 'Pleated'];
      function outlineAt(kind, t, bw) {
        var k = 1 - bw;

          case 1: return 1;
          case 2: return bw + k * Math.sin(t * Math.PI / 2);
          case 3: return bw + k * Math.pow(t, 2.2);
          case 4: return bw + k * Math.sin(Math.PI * Math.pow(t, 0.8));

      // Wall pattern 0..1 (0 = plain wall, 1 = fully raised). The pattern only ever adds to the wall.
      function wallPat(style, n, th, y, H, tw, kd) {
        var u;
        switch (style) {
          case 1: return 0.5 + 0.5 * Math.cos(n * th);
          case 2: return Math.pow(Math.abs(Math.sin(n * th / 2)), 0.8);

      // ---------------------------------------------------------------------
      // Loop solid: a closed cross-section loop [{ y, r }] (r is a number, or one value per column) turned around the Y axis.
      // Points with r = 0 are poles. opt.hole cuts a diamond window through two walls of the loop (see below).
      // ---------------------------------------------------------------------
      function loopSolid(pts, rho, opt) {

          });

            key = p + ',' + j;

            if (pole[q]) { if (sk !== 0) tris.push(a, b, c); continue; }
            if (dg === 1) { if (sk !== 0) tris.push(a, b, c); if (sk !== 1) tris.push(a, c, d); }
            else { if (sk !== 0) tris.push(a, b, d); if (sk !== 1) tris.push(b, c, d); }
          }
        }

          // so the outer vertex N meets the inner vertex S and the other way round.
          var dir = {}, i;

          }
          var oN = id(hole.mo - 1, hole.j), oE = id(hole.mo, hole.j + 1), oS = id(hole.mo + 1, hole.j), oW = id(hole.mo, hole.j - 1);
          var iN = id(hole.mi + 1, hole.j), iE = id(hole.mi, hole.j + 1), iS = id(hole.mi - 1, hole.j), iW = id(hole.mi, hole.j - 1);
          var ring = [[oN, iN], [oE, iE], [oS, iS], [oW, iW]];
          for (i = 0; i < 4; i++) {
            var X = ring[i], Y = ring[(i + 1) % 4];
            if (dir[X[0] + '>' + Y[0]]) tris.push(Y[0], X[0], X[1], Y[0], X[1], Y[1]);
            else tris.push(X[0], Y[0], Y[1], X[0], Y[1], X[1]);
          }

        var out = new Float32Array(tris.length * 3), k;
        for (k = 0; k < tris.length; k++) {
          out[k * 3] = V[tris[k] * 3]; out[k * 3 + 1] = V[tris[k] * 3 + 1]; out[k * 3 + 2] = V[tris[k] * 3 + 2];
        }

      }

      // ---------------------------------------------------------------------
      // Derived geometry shared by the three parts. Pot coordinates: y = 0 is the lowest point of the pot.
      // ---------------------------------------------------------------------
      function derive(p, tune) {
        var d = { p: p, tune: tune };
        var rho = planRho(Math.round(p.plan), p.soft / 100);
        var apo = rho.apo;
        function h(x) { return x / apo; }       // a thickness measured on a flat, as a radius change
        d.rho = rho; d.h = h;
        var H = p.height, wall = p.wall, gv = p.clear;
        d.H = H; d.gv = gv;
        var rw = p.wick / 2;
        var rc = rw + h(wall) * Math.SQRT2;                  // insert tip outer radius
        var space = Math.max(p.space, 5.5);
        var hW = h(space);                                   // water space on the flats

        var yf = wall + tune.dy;                             // pot floor thickness (nudged by tune, see build)

          for (k = 0; k < ysList.length; k++) {

            R[k] = k === 0 ? r0 : Math.min(pr, R[k - 1] + (ysList[k] - ysList[k - 1]) * SLOPE);
          }

          for (k = ysList.length - 2; k > 0; k--) R[k] = Math.min(R[k], R[k + 1] + (ysList[k + 1] - ysList[k]) * SLOPE);

        var yo = clamp(yoWant, yf + dcell + 1, collarBottom - dcell - 1.5);

          var ka = Math.max(0, k - 1), kb = Math.min(K - 1, k + 1);
          var sl = clamp((d.Rb[kb] - d.Rb[ka]) / Math.max(1e-6, ys[kb] - ys[ka]), -1, 1);

        // the collar underside leans out at 45 degrees from the neck until it meets the wall
        d.kCol = 0; d.yCol = d.yn - 16; d.rCol = d.Rw[0];
        for (k = K - 1; k >= 0; k--) {

          if (u >= d.Rw[k] - 0.05 || d.yn - ys[k] > 16) { d.kCol = k; d.yCol = ys[k]; d.rCol = Math.min(u, d.Rw[k]); break; }
        }

      // ---------------------------------------------------------------------
      // The pot (the water reservoir)
      // ---------------------------------------------------------------------
      function buildPot(d) {
        var p = d.p, ys = d.ys, K = ys.length, H = d.H, rho = d.rho, pts = [], k, j;
        var style = Math.round(p.style), n = Math.round(p.count), tw = p.twist * Math.PI / 180;
        var depth = style === 0 ? 0 : p.depth, kd = n / Math.max(30, p.width / 2);

      }

      // ---------------------------------------------------------------------
      // The planting insert: a funnel that hangs on a 45 degree seat in the pot, with a wick hole at the bottom
      // ---------------------------------------------------------------------
      function buildInsert(d) {
        var p = d.p, rho = d.rho, h = d.h, H = d.H, gv = d.gv, wall = p.wall, j, k;
        var y0 = d.yf + gv, top = H + p.lip;

          var t = clamp((y - ysP[kk]) / Math.max(1e-6, ysP[kk + 1] - ysP[kk]), 0, 1);
          return d.Rw[kk] * (1 - t) + d.Rw[kk + 1] * t;

        for (k = K - 1; k >= 0; k--) {
          var tv = potWall(ys[k]) - d.hW;
          if (ys[k] > d.yCol) tv = Math.min(tv, d.rneck - margin);

          flare[k] = d.rneck + (Math.min(ys[k], H) - d.ys0) - gv;

        for (j = 0; j < SEG; j++) {

        for (k = 0; k < K; k++) pts.push({ y: ys[k], r: outer[k] });

      }

      // ---------------------------------------------------------------------
      // The saucer: a pedestal with a 45 degree seat for the pot and a moat around it that catches the overflow
      // ---------------------------------------------------------------------
      function buildSaucer(d) {

          { y: ys0, r: d.r0 }, { y: ys0, r: 0 }

      }

      // A small eight-sided post, used for the snap-off tacks.
      function post(cx, cz, ya, yb, r) {
        var o = [], i, a, b, A, B, N = 8;
        function ring(y, i2) { var t = i2 / N * TAU; return [cx + r * Math.cos(t), y, cz + r * Math.sin(t)]; }
        for (i = 0; i < N; i++) {

          o.push(A[0], A[1], A[2], B[0], B[1], B[2], b[0], b[1], b[2], A[0], A[1], A[2], b[0], b[1], b[2], a[0], a[1], a[2]);
          o.push(cx, ya, cz, B[0], B[1], B[2], A[0], A[1], A[2]);
          o.push(cx, yb, cz, a[0], a[1], a[2], b[0], b[1], b[2]);

        for (i = 0; i < list.length; i++) { out.set(list[i], at); at += list[i].length; }
        return out;
      }

      function shift(pos, dy) { for (var i = 1; i < pos.length; i += 3) pos[i] += dy; return pos; }

      function assemble(p, tune) {

      function spanOf(list) {

            if (sc > bestScore) { bestScore = sc; best = { ys0: a, dy: b }; }
