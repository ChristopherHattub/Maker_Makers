  <title>MM-004 Snowman Stacker // Maker Makers</title>

<body class="mm-gen">
  <script>
    // Snowman Stacker: parameters, presets, palette and geometry. The page layout, the viewport,
    // the Color tool and the exports come from shared/generator-core.js.
    (function () {
      'use strict';

      // ---- Geometry kit: closed shells built from rings (shared vertices, so always watertight) ----
      var TAU = Math.PI * 2;
      function rad(d) { return (d * Math.PI) / 180; }
      function sqr(x) { return x * x; }
      function vsub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
      function vadd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
      function vmul(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }
      function vcross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
      function vnorm(a) { var l = Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }

      // rings: array of closed point loops [[x,y,z],...] or { pole: [x,y,z] } (a single point cap).
      // Neighbouring rings must have the same winding. wrap = true joins the last ring to the first (torus).
      // The winding of the whole shell is fixed afterwards from its signed volume.
      function shell(rings, wrap) {
        var verts = [], idx = [], info = [], i, j;
        rings.forEach(function (r) {
          if (r.pole) { info.push({ pole: true, s: verts.length, n: 1 }); verts.push(r.pole); }
          else { info.push({ s: verts.length, n: r.length }); r.forEach(function (q) { verts.push(q); }); }
        });
        var n = rings.length, last = wrap ? n : n - 1;
        for (i = 0; i < last; i++) {
          var A = info[i], B = info[(i + 1) % n];
          if (A.pole && B.pole) continue;
          if (A.pole) { for (j = 0; j < B.n; j++) idx.push(A.s, B.s + (j + 1) % B.n, B.s + j); }
          else if (B.pole) { for (j = 0; j < A.n; j++) idx.push(A.s + j, A.s + (j + 1) % A.n, B.s); }
          else {
            for (j = 0; j < A.n; j++) {
              var a = A.s + j, b = A.s + (j + 1) % A.n, c = B.s + (j + 1) % B.n, d = B.s + j;
              idx.push(a, b, c, a, c, d);
            }
          }
        }
        var vol = 0, p, q, r;
        for (i = 0; i < idx.length; i += 3) {
          p = verts[idx[i]]; q = verts[idx[i + 1]]; r = verts[idx[i + 2]];
          vol += (p[0] * (q[1] * r[2] - q[2] * r[1]) - p[1] * (q[0] * r[2] - q[2] * r[0]) + p[2] * (q[0] * r[1] - q[1] * r[0])) / 6;
        }
        var out = new Float32Array(idx.length * 3), o = 0, v;
        for (i = 0; i < idx.length; i += 3) {
          var tri = vol < 0 ? [idx[i], idx[i + 2], idx[i + 1]] : [idx[i], idx[i + 1], idx[i + 2]];
          for (j = 0; j < 3; j++) { v = verts[tri[j]]; out[o++] = v[0]; out[o++] = v[1]; out[o++] = v[2]; }
        }
        return out;
      }

      function cat(list) {
        var n = 0, i;
        for (i = 0; i < list.length; i++) n += list[i].length;
        var out = new Float32Array(n), at = 0;
        for (i = 0; i < list.length; i++) { out.set(list[i], at); at += list[i].length; }
        return out;
      }

      // Circle / ellipse loop in the XZ plane at height y. o: { cx, cz, sx, sz, rot }.
      function loopXZ(r, y, seg, o) {
        o = o || {};
        var cx = o.cx || 0, cz = o.cz || 0, sx = o.sx || 1, sz = o.sz || 1, rot = o.rot || 0;
        var cr = Math.cos(rot), sr = Math.sin(rot), out = [], j, a, x, z;
        for (j = 0; j < seg; j++) {
          a = (j / seg) * TAU;
          x = r * sx * Math.cos(a); z = r * sz * Math.sin(a);
          out.push([cx + x * cr - z * sr, y, cz + x * sr + z * cr]);
        }
        return out;
      }

      // Solid of revolution from a profile [[r, y, dx, dz], ...] (bottom to top). r = 0 makes a pole.
      function lathe(profile, seg, o) {
        o = o || {};
        var rings = profile.map(function (p) {
          var oo = { cx: (o.cx || 0) + (p[2] || 0), cz: (o.cz || 0) + (p[3] || 0), sx: o.sx, sz: o.sz, rot: o.rot };
          if (p[0] < 1e-6) return { pole: [oo.cx, p[1], oo.cz] };
          return loopXZ(p[0], p[1], seg, oo);
        });
        return shell(rings, false);
      }

      // Closed ring-shaped solid (torus-like): cross-section polygon [[r, y], ...] revolved around Y.
      function bandRing(poly, seg, o) {
        return shell(poly.map(function (p) { return loopXZ(p[0], p[1], seg, o); }), true);
      }

      // Sphere or ellipsoid. tFrom > 0 starts the sphere at a flat cut (polar angle from the bottom pole).
      function ball(cx, cy, cz, rx, ry, rz, seg, steps) {
        var prof = [], k, t;
        for (k = 0; k <= steps; k++) {
          t = (k / steps) * Math.PI;
          prof.push([Math.sin(t), cy - ry * Math.cos(t)]);
        }
        prof[0][0] = 0; prof[steps][0] = 0;
        return lathe(prof, seg, { cx: cx, cz: cz, sx: rx, sz: rz });
      }

      // Rounded rectangle loop (counter-clockwise from above) at height y.
      function rrect(hx, hz, cr, y, arcN, cx, cz) {
        cr = Math.max(0.05, Math.min(cr, Math.min(hx, hz) - 0.02));
        var out = [], k, a, corners = [[hx - cr, hz - cr, 0], [-(hx - cr), hz - cr, 90], [-(hx - cr), -(hz - cr), 180], [hx - cr, -(hz - cr), 270]];
        corners.forEach(function (c) {
          for (k = 0; k <= arcN; k++) {
            a = rad(c[2] + (k / arcN) * 90);
            out.push([(cx || 0) + c[0] + cr * Math.cos(a), y, (cz || 0) + c[1] + cr * Math.sin(a)]);
          }
        });
        return out;
      }
      function centroid(loop) {
        var c = [0, 0, 0];
        loop.forEach(function (p) { c[0] += p[0]; c[1] += p[1]; c[2] += p[2]; });
        return [c[0] / loop.length, c[1] / loop.length, c[2] / loop.length];
      }
      // Loft of loops with flat end caps.
      function loftCapped(loops) {
        var rings = [{ pole: centroid(loops[0]) }].concat(loops, [{ pole: centroid(loops[loops.length - 1]) }]);
        return shell(rings, false);
      }

      // Rod with rounded ends from a to b, radius ra at a and rb at b.
      function capsule(a, b, ra, rb, seg, capN) {
        var d = vnorm(vsub(b, a));
        var ax = Math.abs(d[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
        var u = vnorm(vcross(d, ax)), v = vcross(d, u);
        function ring(c, r) {
          var out = [], j, ang;
          for (j = 0; j < seg; j++) {
            ang = (j / seg) * TAU;
            out.push(vadd(c, vadd(vmul(u, r * Math.cos(ang)), vmul(v, r * Math.sin(ang)))));
          }
          return out;
        }
        var rings = [{ pole: vsub(a, vmul(d, ra)) }], k, phi;
        for (k = 1; k <= capN; k++) {
          phi = (k / capN) * (Math.PI / 2);
          rings.push(ring(vsub(a, vmul(d, ra * Math.cos(phi))), ra * Math.sin(phi)));
        }
        for (k = 0; k < capN; k++) {
          phi = (Math.PI / 2) * (1 - k / capN);
          rings.push(ring(vadd(b, vmul(d, rb * Math.cos(phi))), rb * Math.sin(phi)));
        }
        rings.push({ pole: vadd(b, vmul(d, rb)) });
        return shell(rings, false);
      }

      function smootherstep(x) {
        var t = Math.max(0, Math.min(1, x));
        return t * t * t * (t * (t * 6 - 15) + 10);
      }
      function el(tag, attrs, text) {
        var node = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (k) {
          if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
          else node.setAttribute(k, attrs[k]);
        });
        if (text) node.textContent = text;
        return node;
      }
      // Picture-card style picker for the "Styles" tab. cardSvg(values) draws a small icon.
      function mountStyleCards(container, api, styles, cardSvg, defaults, heading, note) {
        container.appendChild(el('h3', { class: 'mm-group-title' }, heading));
        var grid = el('div', { class: 'mm-preset-cards' });
        styles.forEach(function (s) {
          var vals = {};
          Object.keys(defaults).forEach(function (k) { vals[k] = defaults[k]; });
          Object.keys(s.values).forEach(function (k) { vals[k] = s.values[k]; });
          var card = el('button', { class: 'mm-preset-card', type: 'button', title: s.name, onclick: function () {
            api.setParams(vals);
            api.toast('Style: ' + s.name);
          } });
          card.innerHTML = cardSvg(vals) + '<span>' + s.name + '</span>';
          grid.appendChild(card);
        });
        container.appendChild(grid);
        container.appendChild(el('p', { class: 'mm-note' }, note));
      }
      function withDefaults(defaults, over) {
        var values = {};
        Object.keys(defaults).forEach(function (k) { values[k] = defaults[k]; });
        Object.keys(over).forEach(function (k) { values[k] = over[k]; });
        return values;
      }

      var SEG = 72;

      var PARAMS = [
        { group: 'Snowman', key: 'bodyR', label: 'Bottom ball size', unit: ' mm', min: 16, max: 34, step: 1, value: 24 },
        { group: 'Snowman', key: 'midPct', label: 'Middle ball (% of bottom)', unit: '%', min: 60, max: 95, step: 1, value: 74 },
        { group: 'Snowman', key: 'headPct', label: 'Head (% of bottom)', unit: '%', min: 40, max: 85, step: 1, value: 56 },
        { group: 'Snowman', key: 'joinAngle', label: 'Ball join (shallow ↔ sunk in)', unit: '°', min: 48, max: 80, step: 1, value: 56 },
        { group: 'Snowman', key: 'baseFlat', label: 'Flat base (wider = safer print)', unit: '%', min: 72, max: 96, step: 1, value: 80 },
        { group: 'Face', key: 'noseLen', label: 'Carrot nose length (0 = none)', unit: ' mm', min: 0, max: 22, step: 0.5, value: 11,
          format: function (v) { return v < 2 ? 'None' : v + ' mm'; } },
        { group: 'Face', key: 'noseR', label: 'Carrot nose width', unit: ' mm', min: 1.6, max: 5, step: 0.1, value: 2.8 },
        { group: 'Face', key: 'noseTilt', label: 'Nose tilt (level ↔ drooping)', unit: '°', min: 8, max: 50, step: 1, value: 22 },
        { group: 'Face', key: 'eyeSize', label: 'Eye size (0 = none)', unit: ' mm', min: 0, max: 4, step: 0.1, value: 2.1,
          format: function (v) { return v < 1 ? 'None' : v + ' mm'; } },
        { group: 'Face', key: 'eyeSpread', label: 'Eye spacing', unit: '°', min: 10, max: 40, step: 1, value: 22 },
        { group: 'Face', key: 'eyeHeight', label: 'Eye height', unit: '°', min: 0, max: 40, step: 1, value: 16 },
        { group: 'Face', key: 'mouthCount', label: 'Mouth coals', unit: '', min: 0, max: 9, step: 1, value: 5 },
        { group: 'Face', key: 'mouthSize', label: 'Mouth coal size', unit: ' mm', min: 1, max: 2.8, step: 0.1, value: 1.5 },
        { group: 'Face', key: 'mouthWidth', label: 'Mouth width', unit: '°', min: 20, max: 70, step: 1, value: 44 },
        { group: 'Face', key: 'mouthCurve', label: 'Mouth curve (flat ↔ big smile)', unit: '°', min: -8, max: 26, step: 1, value: 12 },
        { group: 'Hat & scarf', key: 'hatStyle', label: 'Hat', unit: '', min: 0, max: 3, step: 1, value: 1,
          format: function (v) { return ['None', 'Top hat', 'Beanie', 'Santa hat'][Math.round(v)]; } },
        { group: 'Hat & scarf', key: 'hatH', label: 'Hat height', unit: ' mm', min: 8, max: 34, step: 1, value: 15 },
        { group: 'Hat & scarf', key: 'hatLean', label: 'Santa tip lean (low = no supports)', unit: ' mm', min: 0, max: 14, step: 1, value: 8 },
        { group: 'Hat & scarf', key: 'scarf', label: 'Scarf thickness (0 = none)', unit: ' mm', min: 0, max: 5, step: 0.2, value: 3.2,
          format: function (v) { return v < 1.4 ? 'None' : v + ' mm'; } },
        { group: 'Buttons & arms', key: 'buttonCount', label: 'Coal buttons', unit: '', min: 0, max: 5, step: 1, value: 3 },
        { group: 'Buttons & arms', key: 'buttonSize', label: 'Button size', unit: ' mm', min: 1.5, max: 4.5, step: 0.1, value: 2.4 },
        { group: 'Buttons & arms', key: 'armLen', label: 'Arm length (0 = none)', unit: ' mm', min: 0, max: 26, step: 1, value: 12,
          format: function (v) { return v < 2 ? 'None' : v + ' mm'; } },
        { group: 'Buttons & arms', key: 'armAngle', label: 'Arm droop (steeper = safer print)', unit: '°', min: 25, max: 70, step: 1, value: 40 },
        { group: 'Buttons & arms', key: 'armR', label: 'Arm thickness', unit: ' mm', min: 2, max: 4.5, step: 0.1, value: 2.6 }
      ];
      var DEFAULTS = {};
      PARAMS.forEach(function (d) { DEFAULTS[d.key] = d.value; });

      function setup(p) {
        var g = { p: p };
        g.R1 = p.bodyR;
        g.R2 = g.R1 * p.midPct / 100;
        g.R3 = Math.min(g.R2 * 0.96, g.R1 * p.headPct / 100);
        g.flat = p.baseFlat / 100;
        g.tb = Math.asin(g.flat);
        g.c1 = g.R1 * Math.cos(g.tb);               // flat cut sits at y = 0
        g.th = rad(p.joinAngle);
        g.c2 = g.c1 + Math.sqrt(sqr(g.R1) - sqr(g.R2 * Math.sin(g.th))) + g.R2 * Math.cos(g.th);
        g.c3 = g.c2 + Math.sqrt(sqr(g.R2) - sqr(g.R3 * Math.sin(g.th))) + g.R3 * Math.cos(g.th);
        return g;
      }

      function bottomBall(g) {
        var prof = [[0, 0], [g.R1 * g.flat, 0]], steps = 30, k, t;
        for (k = 1; k <= steps; k++) {
          t = g.tb + (k / steps) * (Math.PI - g.tb);
          prof.push([k === steps ? 0 : g.R1 * Math.sin(t), g.c1 - g.R1 * Math.cos(t)]);
        }
        return lathe(prof, SEG);
      }

      // Point on the head surface at a latitude/longitude (degrees), pushed in by `sink` mm.
      function headPoint(g, lat, lon, sink) {
        var la = rad(lat), lo = rad(lon), r = g.R3 - sink;
        return [r * Math.cos(la) * Math.sin(lo), g.c3 + r * Math.sin(la), r * Math.cos(la) * Math.cos(lo)];
      }

      function hatMeshes(g, p, out) {
        if (p.hatStyle < 1) return;
        var style = Math.round(p.hatStyle), H = p.hatH;
        var a = rad(52), yRim = g.c3 + g.R3 * Math.cos(a), hr = g.R3 * Math.sin(a);
        var yb = yRim - 3, k, s;
        var parts = [], trim = [], pom = [];
        if (style === 1) {
          var Rb = hr + 5, ye = yRim + 1, rc = hr * 0.94, yTop = ye + H;
          parts.push(lathe([[0, yb], [Rb - 4, yb], [Rb, ye], [Rb, ye + 1.6], [rc + 1, ye + 1.6], [rc, ye + 2.6], [rc, yTop - 1.4], [rc - 1.4, yTop], [0, yTop]], SEG));
          trim.push(bandRing([[rc - 1, ye + 2.2], [rc + 0.3, ye + 2.2], [rc + 1.2, ye + 3.1], [rc + 1.2, ye + 6.3], [rc + 0.3, ye + 7.2], [rc - 1, ye + 7.2]], SEG));
        } else {
          var rb = hr + 0.9, y0 = yb, dome = [[0, y0], [rb - 0.5, y0]];
          if (style === 2) {
            for (k = 1; k <= 14; k++) {
              s = (k / 14) * (Math.PI / 2);
              dome.push([k === 14 ? 0 : rb * Math.cos(s), y0 + 2 + (H + 2) * Math.sin(s)]);
            }
          } else {
            var L = H * 1.5, n = 22;
            for (k = 1; k <= n; k++) {
              s = k / n;
              dome.push([k === n ? 0 : Math.max(0.9, rb * Math.pow(1 - s, 1.25)), y0 + 2 + L * s, p.hatLean * s * s, 0]);
            }
          }
          parts.push(lathe(dome, SEG));
          trim.push(bandRing([[rb - 3.5, y0 + 0.2], [rb + 0.4, y0 + 0.2], [rb + 1.7, y0 + 1.5], [rb + 1.7, y0 + 5.2], [rb + 0.4, y0 + 6.5], [rb - 3.5, y0 + 6.5]], SEG));
          var top = style === 2 ? [0, y0 + 2 + H + 2] : [p.hatLean, y0 + 2 + H * 1.5];
          pom.push(ball(top[0], top[1] + 1.2, 0, 3.4, 3.4, 3.4, 28, 14));
        }
        out.push({ name: 'hat', positions: cat(parts), singlePart: true });
        out.push({ name: 'trim', positions: cat(trim), singlePart: true });
        if (pom.length) out.push({ name: 'pom', positions: cat(pom), singlePart: true });
      }

      function build(p) {
        var g = setup(p), out = [], i, k;
        out.push({ name: 'bottom', positions: bottomBall(g), singlePart: true });
        out.push({ name: 'middle', positions: ball(0, g.c2, 0, g.R2, g.R2, g.R2, SEG, 30), singlePart: true });
        out.push({ name: 'head', positions: ball(0, g.c3, 0, g.R3, g.R3, g.R3, SEG, 28), singlePart: true });
        hatMeshes(g, p, out);
        // Scarf: a soft ring sitting in the neck between the middle ball and the head.
        if (p.scarf >= 1.4) {
          var T = p.scarf, yj = g.c3 - g.R3 * Math.cos(g.th), rj = g.R3 * Math.sin(g.th) + T * 0.35, poly = [];
          for (k = 0; k < 14; k++) {
            var ang = (k / 14) * TAU;
            poly.push([rj + T * 1.15 * Math.cos(ang), yj + T * 0.9 * Math.sin(ang)]);
          }
          out.push({ name: 'scarf', positions: bandRing(poly, SEG), singlePart: true });
        }
        // Carrot nose, drooping a little so it prints without support.
        if (p.noseLen >= 2) {
          var t = rad(p.noseTilt), a0 = [0, g.c3 - 0.8, g.R3 - 2.4];
          var dir = [0, -Math.sin(t), Math.cos(t)];
          out.push({ name: 'nose', positions: capsule(a0, vadd(a0, vmul(dir, p.noseLen + 2.4)), p.noseR, 0.7, 20, 4), singlePart: true });
        }
        if (p.eyeSize >= 1) {
          var e = [];
          [-1, 1].forEach(function (sg) {
            var c = headPoint(g, p.eyeHeight, sg * p.eyeSpread, p.eyeSize * 0.45);
            e.push(ball(c[0], c[1], c[2], p.eyeSize, p.eyeSize, p.eyeSize, 20, 10));
          });
          out.push({ name: 'eyes', positions: cat(e), singlePart: true });
        }
        if (p.mouthCount > 0) {
          var m = [], n = Math.round(p.mouthCount), u, lat, lon, c;
          for (i = 0; i < n; i++) {
            u = n === 1 ? 0 : (i / (n - 1)) * 2 - 1;
            lat = -24 + p.mouthCurve * u * u - p.mouthCurve * 0.3;
            lon = u * p.mouthWidth / 2;
            c = headPoint(g, lat, lon, p.mouthSize * 0.45);
            m.push(ball(c[0], c[1], c[2], p.mouthSize, p.mouthSize, p.mouthSize, 16, 8));
          }
          out.push({ name: 'mouth', positions: cat(m), singlePart: true });
        }
        if (p.buttonCount > 0) {
          var b = [], nb = Math.round(p.buttonCount), la, sy, rr;
          for (i = 0; i < nb; i++) {
            la = nb === 1 ? 0 : 34 - (i / (nb - 1)) * 62;
            rr = g.R2 - p.buttonSize * 0.45;
            sy = g.c2 + rr * Math.sin(rad(la));
            b.push(ball(0, sy, rr * Math.cos(rad(la)), p.buttonSize, p.buttonSize, p.buttonSize, 20, 10));
          }
          out.push({ name: 'buttons', positions: cat(b), singlePart: true });
        }
        if (p.armLen >= 2) {
          var arms = [], ang2 = rad(p.armAngle);
          [-1, 1].forEach(function (sg) {
            var sh = [sg * (g.R2 * 0.95 - 3), g.c2 + g.R2 * 0.28, 0];
            var d = [sg * Math.cos(ang2), -Math.sin(ang2), 0];
            arms.push(capsule(sh, vadd(sh, vmul(d, p.armLen + 3)), p.armR, p.armR * 1.25, 20, 5));
          });
          out.push({ name: 'arms', positions: cat(arms), singlePart: true });
        }
        return out;
      }

      // Picture card: a flat sketch of the snowman style.
      function cardSvg(v) {
        var r1 = 15 * (v.bodyR / 24), r2 = r1 * v.midPct / 100, r3 = Math.min(r2 * 0.96, r1 * v.headPct / 100);
        var cy1 = 60 - r1, cy2 = cy1 - r1 * 0.55 - r2 * 0.55, cy3 = cy2 - r2 * 0.55 - r3 * 0.55;
        var svg = '<svg viewBox="0 0 64 64" aria-hidden="true">';
        var snow = 'fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"';
        svg += '<circle cx="32" cy="' + cy1 + '" r="' + r1 + '" ' + snow + '/><circle cx="32" cy="' + cy2 + '" r="' + r2 + '" ' + snow + '/>';
        if (v.armLen >= 2) {
          var al = 4 + v.armLen * 0.35;
          svg += '<path d="M' + (32 - r2 * 0.9) + ' ' + (cy2 - r2 * 0.1) + 'l-' + al + ' ' + al * 0.7 + 'M' + (32 + r2 * 0.9) + ' ' + (cy2 - r2 * 0.1) + 'l' + al + ' ' + al * 0.7 + '" stroke="#a16207" stroke-width="2" fill="none" stroke-linecap="round"/>';
