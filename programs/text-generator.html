          { group: 'Loose letters', showIf: function () { return state.mode === 'loose'; }, key: 'looseThick', label: 'Letter thickness', unit: ' mm', min: 1.2, max: 20, step: 0.2, value: 6 },
          { group: 'Engraved mode', showIf: function () { return state.mode === 'engraved'; }, key: 'engraveDepth', label: 'Engraving depth', unit: ' mm', min: 0.4, max: 6, step: 0.2, value: 1.2 },
          { group: 'Hanging hole', showIf: function () { return state.mode !== 'loose' && state.hole !== 'none'; }, key: 'holeDia', label: 'Hole diameter', unit: ' mm', min: 3, max: 12, step: 0.5, value: 5 },
          { group: 'Hanging hole', showIf: function () { return state.mode !== 'loose' && state.hole !== 'none'; }, key: 'holeWall', label: 'Ring wall', unit: ' mm', min: 2, max: 6, step: 0.5, value: 3 },
          { group: 'Shadowbox mode', showIf: function () { return state.mode === 'shadowbox'; }, key: 'boxDepth', label: 'Box depth', unit: ' mm', min: 6, max: 40, step: 1, value: 14 },
          { group: 'Shadowbox mode', showIf: function () { return state.mode === 'shadowbox'; }, key: 'frameWall', label: 'Frame wall', unit: ' mm', min: 1.6, max: 8, step: 0.2, value: 3 },
          { group: 'Shadowbox mode', showIf: function () { return state.mode === 'shadowbox'; }, key: 'backThick', label: 'Back thickness', unit: ' mm', min: 1, max: 5, step: 0.2, value: 2 },
          { group: 'Shadowbox mode', showIf: function () { return state.mode === 'shadowbox'; }, key: 'layers', label: 'Letter layers', unit: '', min: 2, max: 6, step: 1, value: 4 },
          { group: 'Shadowbox mode', showIf: function () { return state.mode === 'shadowbox'; }, key: 'layerThick', label: 'Layer thickness', unit: ' mm', min: 1, max: 4, step: 0.2, value: 2 },
          { group: 'Shadowbox mode', showIf: function () { return state.mode === 'shadowbox'; }, key: 'layerStep', label: 'Step in per layer (thin fonts: keep small)', unit: ' mm', min: 0, max: 1.5, step: 0.1, value: 0.5 }
        ],

        presets: [
          { label: 'Default plaque', values: { textHeight: 16, spacing: 0.5, lineSpacing: 150, bold: 0, plateThick: 3, pad: 6, corner: 6, raise: 1.6, rimWidth: 1.6, rimHeight: 1, engraveDepth: 1.2, holeDia: 5, holeWall: 3, boxDepth: 14, frameWall: 3, backThick: 2, layers: 4, layerThick: 2, layerStep: 0.5, looseThick: 6 } },
          { label: 'Big and chunky', values: { textHeight: 30, spacing: 1.5, plateThick: 4, raise: 3 } },
          { label: 'Small and neat', values: { textHeight: 10, spacing: 0.4, plateThick: 2.4, raise: 1.2, rimWidth: 1 } }
        ],

        tabs: [{
          id: 'text',
          label: 'Text',
          hint: 'Type your text, pick a font and a style, then fine-tune the sliders',
          mount: function (container, api) {
            var h = function (tag, attrs, text) {
              var node = document.createElement(tag);
              Object.keys(attrs || {}).forEach(function (k) {
                if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
                else node.setAttribute(k, attrs[k]);
              });
              if (text) node.textContent = text;
              return node;
            };
            var field = function (label, control) {
              var wrap = h('div', { class: 'mm-slider' });
              var head = h('div', { class: 'mm-slider-head' });
              head.appendChild(h('label', {}, label));
              wrap.appendChild(head);
              wrap.appendChild(control);
              return wrap;
            };
            var select = function (key, options) {
              var sel = h('select', {});
              options.forEach(function (o) { sel.appendChild(h('option', { value: o[0] }, o[1])); });
              sel.value = state[key];
              sel.addEventListener('change', function () { state[key] = sel.value; syncFields(); api.rebuild(); });
              return sel;
            };

            container.appendChild(h('h3', { class: 'mm-group-title' }, 'Your text'));
            var ta = h('textarea', { rows: '3', maxlength: '120', placeholder: 'Type here (new line = new row)', spellcheck: 'false', autocomplete: 'off' });
            ta.value = state.text;
            ta.addEventListener('input', function () { state.text = ta.value; api.rebuild(); });
            container.appendChild(field('Text (up to 5 lines)', ta));
            container.appendChild(h('p', { class: 'mm-note' }, 'Letters, numbers and common symbols and accents work. Characters a font does not have show as ?.'));

            container.appendChild(h('h3', { class: 'mm-group-title' }, 'Style'));
            var selMode = select('mode', MODES);
            var selFont = select('font', FONT_IDS.map(function (k) { return [k, FONTDATA[k].label]; }));
            var selCase = select('caps', CASES);
            var selAlign = select('align', ALIGNS);
            var selShape = select('shape', SHAPES);
            var selHole = select('hole', HOLES);
            container.appendChild(field('Build style', selMode));
            container.appendChild(field('Font', selFont));
            container.appendChild(field('Capitals', selCase));
            container.appendChild(field('Alignment', selAlign));
            var fShape = field('Plate / frame shape', selShape), fHole = field('Hanging hole', selHole);
            container.appendChild(fShape);
            container.appendChild(fHole);
            var syncFields = function () { fShape.hidden = fHole.hidden = state.mode === 'loose'; };
            syncFields();

            noteEl = h('p', { class: 'mm-note' });
            container.appendChild(noteEl);

            container.appendChild(h('h3', { class: 'mm-group-title' }, 'Quick looks'));
            var chips = h('div', { class: 'mm-chips' });
            LOOKS.forEach(function (look) {
              chips.appendChild(h('button', {
                class: 'mm-chip', type: 'button', 'aria-pressed': 'false',
                onclick: function () {
                  Object.keys(look.state).forEach(function (k) { state[k] = look.state[k]; });
                  api.setParams(look.params);
                  refreshUI();
                  api.toast(look.label + ' applied');
                }
              }, look.label));
            });
            container.appendChild(chips);
            container.appendChild(h('p', { class: 'mm-note' }, 'Fonts are open-licence (SIL OFL). Thin script fonts print best large and a little bold. Everything is flat on the bed, no supports.'));

            refreshUI = function () {
              ta.value = state.text; selMode.value = state.mode; selFont.value = state.font; selCase.value = state.caps;
              selAlign.value = state.align; selShape.value = state.shape; selHole.value = state.hole;
              syncFields();
            };
            setTimeout(function () { api.centerCamera('iso'); }, 60);
          }
        }],

        build: function (p) { return build(p); }
      };
    })();
  </script>
  <script src="shared/export-utils.js"></script>
  <script src="shared/mesh-utils.js"></script>
  <script src="shared/sculpt.js"></script>
  <script src="shared/generator-core.js"></script>
</body>
</html>
