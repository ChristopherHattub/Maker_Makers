            });
          });
          pushMesh(meshes, 'face', face);
          pushMesh(meshes, 'wall', wall);
          return meshes;
        }

        // plated modes
        var pad = p.pad + (mode === 'shadowbox' ? p.frameWall : p.rimWidth);
        var outline = plateOutline(state.shape, lay.W, lay.H, pad, p.corner);
        var plateT = mode === 'shadowbox' ? p.backThick : p.plateThick;
        var base = [], rim = [], text = [], i2;

        if (mode === 'raised') {
          extrude(base, makeShape(outline, []), 0, 0, 0, plateT);
          var rimShape = p.rimWidth >= 0.2 ? ringFor(outline, false, p.rimWidth) : null;
          if (rimShape) extrude(rim, rimShape, 0, 0, plateT - 0.2, plateT + p.rimHeight);
          inst.forEach(function (it) { it.gs.shapes.forEach(function (s) { extrude(text, s, it.x, it.y, plateT - 0.2, plateT + p.raise); }); });
        } else if (mode === 'engraved') {
          var dep = Math.min(p.engraveDepth, plateT - 0.8);
          var floorY = plateT - dep;
          extrude(base, makeShape(outline, []), 0, 0, 0, floorY);
          var holes = [], islands = [];
          inst.forEach(function (it) {
            it.gs.shapes.forEach(function (s) {
              holes.push(s.outer.map(function (q) { return [q[0] + it.x, q[1] + it.y]; }).reverse());
              s.holes.forEach(function (h) { islands.push(h.map(function (q) { return [q[0] + it.x, q[1] + it.y]; }).reverse()); });
            });
          });
          extrude(rim, makeShape(outline, holes), 0, 0, floorY - 0.2, plateT);
          islands.forEach(function (isl) { extrude(rim, makeShape(isl, []), 0, 0, floorY - 0.2, plateT); });
        } else if (mode === 'shadowbox') {
          extrude(base, makeShape(outline, []), 0, 0, 0, plateT);
          var frame = [], frameShape = ringFor(outline, false, p.frameWall);
          if (frameShape) extrude(frame, frameShape, 0, 0, 0, p.boxDepth);
          pushMesh(meshes, 'frame', frame);
          var layers = Math.floor(clamp((p.boxDepth - plateT - 0.4) / p.layerThick, 1, p.layers));
          for (i2 = 0; i2 < layers; i2++) {
            var arr = [], y0 = plateT - 0.2 + i2 * p.layerThick, y1 = plateT + (i2 + 1) * p.layerThick;
            inst.forEach(function (it) {
              it.gs.shapes.forEach(function (s) {
                var d = safeOffset(s, i2 * p.layerStep);
                extrude(arr, offsetShape(s, d, it.gs.key + '|' + it.gs.shapes.indexOf(s)), it.x, it.y, y0, y1);
              });
            });
            pushMesh(meshes, 'layer' + (i2 + 1), arr);
          }
        }

        if (state.hole !== 'none') {
          var holeR = p.holeDia / 2, hw = p.holeWall;
          var c = holeCenter(outline, state.hole, holeR, hw);
          var ringOut = circle(c[0], c[1], holeR + hw, 48), ringIn = circle(c[0], c[1], holeR, 48).reverse();
          extrude(base, makeShape(ringOut, [ringIn]), 0, 0, 0, plateT);
        }

        meshes.unshift({ name: 'base', positions: new Float32Array(base) });
        if (rim.length) meshes.splice(1, 0, { name: mode === 'engraved' ? 'surface' : 'rim', positions: new Float32Array(rim) });
        if (text.length) meshes.push({ name: 'text', positions: new Float32Array(text) });
        return meshes;
      }

      // -----------------------------------------------------------------------
      // Quick looks
      // -----------------------------------------------------------------------
      var LOOKS = [
        { label: 'Name keychain', state: { mode: 'raised', font: 'bubble', shape: 'pill', hole: 'left', caps: 'typed', align: 'center' }, params: { textHeight: 14, spacing: 0.5, plateThick: 3, pad: 4, raise: 1.6, rimWidth: 1.2 } },
        { label: 'Door sign', state: { mode: 'raised', font: 'slab', shape: 'rounded', hole: 'none', caps: 'upper', align: 'center' }, params: { textHeight: 22, spacing: 1, plateThick: 4, pad: 8, corner: 8, raise: 2, rimWidth: 2.4 } },
        { label: 'Engraved plaque', state: { mode: 'engraved', font: 'tall', shape: 'rounded', hole: 'none', caps: 'upper', align: 'center' }, params: { textHeight: 18, spacing: 1.5, plateThick: 4, pad: 8, corner: 6, engraveDepth: 1.6 } },
        { label: 'Wall letters', state: { mode: 'loose', font: 'arcade', hole: 'none', caps: 'upper', align: 'center' }, params: { textHeight: 40, spacing: 2, plateThick: 3, raise: 3 } },
        { label: 'Shadowbox name', state: { mode: 'shadowbox', font: 'block', shape: 'rounded', hole: 'none', caps: 'upper', align: 'center' }, params: { textHeight: 22, spacing: 1, backThick: 2, frameWall: 3, boxDepth: 14, layers: 4, layerThick: 2, layerStep: 0.5, pad: 6 } },
        { label: 'LED sign letters', state: { mode: 'led', font: 'arcade', hole: 'none', caps: 'upper', align: 'center' }, params: { textHeight: 40, spacing: 4, ledFace: 1.2, ledWall: 1.6, ledDepth: 20 } },
        { label: 'Script keepsake', state: { mode: 'raised', font: 'script', shape: 'oval', hole: 'top', caps: 'typed', align: 'center' }, params: { textHeight: 16, spacing: 0, bold: 0.3, plateThick: 3, pad: 5, raise: 1.4, rimWidth: 1.2 } }
      ];

      window.MM_GENERATOR = {
        code: 'MM-101',
        category: 'PERSONALISED // TEXT',
        title: 'Text Generator',
        fileName: 'Text',
        palette: [
          { name: 'Bone White', color: '#f1f5f9' }, { name: 'Glow Mint', color: '#a7f3d0' },
          { name: 'Pumpkin Matte', color: '#fdba74' }, { name: 'Lavender Mist', color: '#d8b4fe' },
          { name: 'Phantom Ice', color: '#93c5fd' }, { name: 'Berry Sorbet', color: '#fda4af' },
          { name: 'Shadow Black', color: '#334155' }, { name: 'Sunny Yellow', color: '#fde047' }
        ],
        partNames: {
          base: 'Plate', rim: 'Border', surface: 'Plate top', text: 'Lettering', frame: 'Frame',
          layer1: 'Letter layer 1', layer2: 'Letter layer 2', layer3: 'Letter layer 3', layer4: 'Letter layer 4', layer5: 'Letter layer 5', layer6: 'Letter layer 6',
          face: 'Letter faces', wall: 'Letter walls'
        },
        openGroups: ['Lettering'],
        testState: state,

        parameters: [
          { group: 'Lettering', tab: 'text', key: 'textHeight', label: 'Letter height (capitals)', unit: ' mm', min: 6, max: 60, step: 0.5, value: 16 },
          { group: 'Lettering', tab: 'text', key: 'spacing', label: 'Letter spacing', unit: ' mm', min: -1, max: 10, step: 0.1, value: 0.5 },
          { group: 'Lettering', tab: 'text', key: 'lineSpacing', label: 'Line spacing', unit: '%', min: 100, max: 220, step: 5, value: 150 },
          { group: 'Lettering', tab: 'text', key: 'bold', label: 'Boldness (below 0 = thinner)', unit: ' mm', min: -0.6, max: 1.5, step: 0.05, value: 0 },
          { group: 'Plate', key: 'plateThick', label: 'Plate thickness', unit: ' mm', min: 1.6, max: 8, step: 0.2, value: 3 },
          { group: 'Plate', key: 'pad', label: 'Space around the text', unit: ' mm', min: 2, max: 25, step: 0.5, value: 6 },
          { group: 'Plate', key: 'corner', label: 'Corner rounding (rounded rectangle)', unit: ' mm', min: 0, max: 25, step: 0.5, value: 6 },
          { group: 'Plate', key: 'raise', label: 'Letters stand up', unit: ' mm', min: 0.8, max: 8, step: 0.2, value: 1.6 },
          { group: 'Plate', key: 'rimWidth', label: 'Border width (0 = none)', unit: ' mm', min: 0, max: 5, step: 0.2, value: 1.6 },
          { group: 'Plate', key: 'rimHeight', label: 'Border height', unit: ' mm', min: 0.4, max: 4, step: 0.2, value: 1 },
          { group: 'Engraved mode', key: 'engraveDepth', label: 'Engraving depth', unit: ' mm', min: 0.4, max: 6, step: 0.2, value: 1.2 },
          { group: 'Hanging hole', key: 'holeDia', label: 'Hole diameter', unit: ' mm', min: 3, max: 12, step: 0.5, value: 5 },
          { group: 'Hanging hole', key: 'holeWall', label: 'Ring wall', unit: ' mm', min: 2, max: 6, step: 0.5, value: 3 },
          { group: 'Shadowbox mode', key: 'boxDepth', label: 'Box depth', unit: ' mm', min: 6, max: 40, step: 1, value: 14 },
          { group: 'Shadowbox mode', key: 'frameWall', label: 'Frame wall', unit: ' mm', min: 1.6, max: 8, step: 0.2, value: 3 },
          { group: 'Shadowbox mode', key: 'backThick', label: 'Back thickness', unit: ' mm', min: 1, max: 5, step: 0.2, value: 2 },
          { group: 'Shadowbox mode', key: 'layers', label: 'Letter layers', unit: '', min: 2, max: 6, step: 1, value: 4 },
          { group: 'Shadowbox mode', key: 'layerThick', label: 'Layer thickness', unit: ' mm', min: 1, max: 4, step: 0.2, value: 2 },
          { group: 'Shadowbox mode', key: 'layerStep', label: 'Step in per layer (thin fonts: keep small)', unit: ' mm', min: 0, max: 1.5, step: 0.1, value: 0.5 },
          { group: 'LED channel mode', key: 'ledFace', label: 'Front face (light diffuses through)', unit: ' mm', min: 0.6, max: 2.4, step: 0.2, value: 1.2 },
          { group: 'LED channel mode', key: 'ledWall', label: 'Side wall (bold fonts only for thick walls)', unit: ' mm', min: 1.2, max: 4, step: 0.2, value: 1.6 },
          { group: 'LED channel mode', key: 'ledDepth', label: 'Letter depth', unit: ' mm', min: 8, max: 50, step: 1, value: 20 }
        ],

        presets: [
          { label: 'Default plaque', values: { textHeight: 16, spacing: 0.5, lineSpacing: 150, bold: 0, plateThick: 3, pad: 6, corner: 6, raise: 1.6, rimWidth: 1.6, rimHeight: 1, engraveDepth: 1.2, holeDia: 5, holeWall: 3, boxDepth: 14, frameWall: 3, backThick: 2, layers: 4, layerThick: 2, layerStep: 0.5, ledFace: 1.2, ledWall: 1.6, ledDepth: 20 } },
          { label: 'Big and chunky', values: { textHeight: 30, spacing: 1.5, plateThick: 4, raise: 3 } },
          { label: 'Small and neat', values: { textHeight: 10, spacing: 0.4, plateThick: 2.4, raise: 1.2, rimWidth: 1 } }
        ],

        tabs: [{
          id: 'text',
          label: 'Text',
          hint: 'Type your text, pick a font and a style, then fine-tune the sliders',
          mount: function (container, api) {
            var h = function (tag, attrs, text) {
              var node = document.createElement(tag);
              Object.keys(attrs || {}).forEach(function (k) {
                if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
                else node.setAttribute(k, attrs[k]);
              });
              if (text) node.textContent = text;
              return node;
            };
            var field = function (label, control) {
              var wrap = h('div', { class: 'mm-slider' });
              var head = h('div', { class: 'mm-slider-head' });
              head.appendChild(h('label', {}, label));
              wrap.appendChild(head);
              wrap.appendChild(control);
              return wrap;
            };
            var select = function (key, options) {
              var sel = h('select', {});
              options.forEach(function (o) { sel.appendChild(h('option', { value: o[0] }, o[1])); });
              sel.value = state[key];
              sel.addEventListener('change', function () { state[key] = sel.value; api.rebuild(); });
              return sel;
            };

            container.appendChild(h('h3', { class: 'mm-group-title' }, 'Your text'));
            var ta = h('textarea', { rows: '3', maxlength: '120', placeholder: 'Type here (new line = new row)', spellcheck: 'false', autocomplete: 'off' });
            ta.value = state.text;
            ta.addEventListener('input', function () { state.text = ta.value; api.rebuild(); });
            container.appendChild(field('Text (up to 5 lines)', ta));
            container.appendChild(h('p', { class: 'mm-note' }, 'Letters, numbers and common symbols and accents work. Characters a font does not have show as ?.'));

            container.appendChild(h('h3', { class: 'mm-group-title' }, 'Style'));
            var selMode = select('mode', MODES);
            var selFont = select('font', FONT_IDS.map(function (k) { return [k, FONTDATA[k].label]; }));
            var selCase = select('caps', CASES);
            var selAlign = select('align', ALIGNS);
            var selShape = select('shape', SHAPES);
            var selHole = select('hole', HOLES);
            container.appendChild(field('Build style', selMode));
            container.appendChild(field('Font', selFont));
            container.appendChild(field('Capitals', selCase));
            container.appendChild(field('Alignment', selAlign));
            container.appendChild(field('Plate / frame shape', selShape));
            container.appendChild(field('Hanging hole', selHole));

            container.appendChild(h('h3', { class: 'mm-group-title' }, 'Quick looks'));
            var chips = h('div', { class: 'mm-chips' });
            LOOKS.forEach(function (look) {
              chips.appendChild(h('button', {
                class: 'mm-chip', type: 'button', 'aria-pressed': 'false',
                onclick: function () {
                  Object.keys(look.state).forEach(function (k) { state[k] = look.state[k]; });
                  api.setParams(look.params);
                  refreshUI();
                  api.toast(look.label + ' applied');
                }
              }, look.label));
            });
            container.appendChild(chips);
            container.appendChild(h('p', { class: 'mm-note' }, 'Fonts are open-licence (SIL OFL). Thin script fonts print best large and a little bold. Everything is flat on the bed, no supports.'));

            refreshUI = function () {
              ta.value = state.text; selMode.value = state.mode; selFont.value = state.font; selCase.value = state.caps;
              selAlign.value = state.align; selShape.value = state.shape; selHole.value = state.hole;
            };
            setTimeout(function () { api.centerCamera('iso'); }, 60);
          }
        }],

        build: function (p) { return build(p); }
      };
    })();
  </script>
  <script src="shared/generator-core.js"></script>
</body>
