        });
        if (cur) lines.push(cur);

      }


      var DEFAULTS = {
        angle: 52, power: 100, spread: 22, count: 34, size: 4.2, seed: 7, mix: 0, thick: 3, ribbon: 1.6,
        cannonLen: 36, cannonW: 11, stripes: 3
      };

      // Centre line of the spray: leaves the muzzle, climbs, then droops. Returns [x, z] points (z is up-screen negative).
      function arcPts(p, n) {
        var a = p.angle * DEG, P = p.power, out = [], i, t, G = P * Math.sin(a) * 1.15;

        for (i = 0; i <= n; i++) {

      }
      function sideEdges(path, wFn) {

      }

      function build(p) {
        var out = [], a = p.angle * DEG, N = 40, path = arcPts(p, N), T = p.thick;
        var wFn = function (t) { return p.spread * (0.22 + 0.78 * t); };
        var e = sideEdges(path, wFn);
        var ribbon = [stripPrism(e.A, e.B, 0, p.ribbon)];
        // Cannon: a flared cone lying along the aim direction, base at the origin.
        var L = p.cannonLen, W = p.cannonW, pts = [], i, c = Math.cos(a), s = -Math.sin(a);
        function loc(x, y) { return [x * c - y * s, x * s + y * c]; }
        pts.push(loc(-2, -W * 0.28), loc(L * 0.5, -W * 0.5), loc(L, -W), loc(L + 1.5, -W * 0.6), loc(L + 1.5, W * 0.6), loc(L, W), loc(L * 0.5, W * 0.5), loc(-2, W * 0.28));
        for (i = 0; i < 6; i++) { var q = Math.PI / 2 + (i / 5) * Math.PI; pts.push(loc(-2 + Math.cos(q) * W * 0.28 * 0.0 - 0.0, 0)); }

        // round the back end

        var cannon = [slab(poly, 0, T + 2)];
        var stripes = [], k;
        for (k = 0; k < p.stripes; k++) {
          var u = L * (0.18 + 0.62 * (k + 0.5) / p.stripes), w0 = loc(u, -W * (0.28 + 0.4 * u / L) * 1.02), w1 = loc(u, W * (0.28 + 0.4 * u / L) * 1.02);
          stripes.push(capsule(w0[0], w0[1], w1[0], w1[1], 2.2, T - 0.3, T + 2.6));
        }
        // Confetti scattered inside the spray.
        var rnd = rng(Math.round(p.seed) * 977 + 13), cs = [[], [], []], n = Math.round(p.count), t, off, j;
        for (j = 0; j < n; j++) {
          t = 0.1 + 0.9 * Math.pow(rnd(), 0.8);
          off = (rnd() * 2 - 1) * 0.82;
          var idx = Math.min(N, Math.round(t * N)), c0 = path[idx], ed = sideEdges(path, wFn);
          var px = lerp(ed.B[idx][0], ed.A[idx][0], (off + 1) / 2), pz = lerp(ed.B[idx][1], ed.A[idx][1], (off + 1) / 2);
          var sz = p.size * (0.7 + 0.5 * rnd()) * (0.75 + 0.35 * t), rot = rnd() * TAU, kind = p.mix >= 1 ? 0 : j % 3;

          else if (kind === 1) cs[1].push(slab(movePts(starPoly(sz * 1.25, sz * 0.55, 5, rot, 10), px, pz, 0, 1), 0, T));
          else cs[2].push(capsule(px - Math.cos(rot) * sz, pz - Math.sin(rot) * sz, px + Math.cos(rot) * sz, pz + Math.sin(rot) * sz, Math.max(1.8, sz * 0.55), 0, T));
        }
        var parts = [['ribbon', ribbon], ['cannon', cannon], ['stripes', stripes], ['dots', cs[0]], ['stars', cs[1]], ['streamers', cs[2]]], all = [];
        parts.forEach(function (pt) { all = all.concat(pt[1]); });

        var shift = [-(x0 + x1) / 2, 0, -(z0 + z1) / 2];
        parts.forEach(function (pt) { pushMesh(out, mesh(pt[0], pt[1].map(function (m) { return xform(m, { t: shift }); }))); });
        return out;
      }

      // ---- Aim canvas: drag from the cannon to set the angle and how far the confetti flies ----
      var redraw = null, api0 = null, lastSig = '';
      function drawAim(cv, p) {
        var g = cv.getContext('2d'), w = cv.width, h = cv.height, ox = 34, oy = h - 28, sc = 1.7, i;
        g.clearRect(0, 0, w, h);
        g.strokeStyle = '#00e5ff22'; g.lineWidth = 1;
        for (i = 0; i < w; i += 30) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); }
        for (i = 0; i < h; i += 30) { g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); }

        e.A.forEach(function (pt, k) { var X = ox + pt[0] * sc * 0.7, Y = oy + pt[1] * sc * 0.7; if (k) g.lineTo(X, Y); else g.moveTo(X, Y); });
        for (i = e.B.length - 1; i >= 0; i--) g.lineTo(ox + e.B[i][0] * sc * 0.7, oy + e.B[i][1] * sc * 0.7);

        container.appendChild(mkEl('p', { class: 'mm-note' }, 'Drag anywhere in the box: the cannon swings to point at your finger and the spray reaches as far as you drag.'));
        var cv = mkCanvas(container, 300, 220);
        redraw = function () { drawAim(cv, api.params); };
        dragCanvas(cv, function (x, y) {
          var X = x * cv.width - 34, Y = cv.height - 28 - y * cv.height;
          var ang = Math.max(15, Math.min(85, Math.atan2(Y, Math.max(1, X)) / DEG)), pw = Math.max(50, Math.min(150, Math.sqrt(X * X + Y * Y) / (1.7 * 0.7)));
          api.setParams({ angle: Math.round(ang), power: Math.round(pw) });
        });
        var row = mkEl('div', { class: 'mm-export-row' });
        row.appendChild(mkBtn('New scatter', function () { api.setParams({ seed: Math.floor(Math.random() * 99) + 1 }); }));
        row.appendChild(mkBtn('Straight up', function () { api.setParams({ angle: 82, power: 90 }); }));
        row.appendChild(mkBtn('Low blast', function () { api.setParams({ angle: 25, power: 130 }); }));
        container.appendChild(row);
        redraw();
      }

      window.MM_GENERATOR = {
        code: 'MM-025',
        category: 'NEW YEAR // PARTY POPPER',
        title: 'Confetti Cannon',
        fileName: 'Confetti_Cannon',
        palette: [
          { name: 'Party Pink', color: '#fda4af' },
          { name: 'Sunny Yellow', color: '#fde047' },
          { name: 'Glow Mint', color: '#a7f3d0' },
          { name: 'Sky Blue', color: '#93c5fd' },
          { name: 'Lavender Mist', color: '#d8b4fe' },
          { name: 'Orange Pop', color: '#fdba74' },
          { name: 'Bone White', color: '#f1f5f9' },
          { name: 'Midnight Navy', color: '#334a7a' }
        ],
        defaultColor: '#fda4af',
        partNames: { ribbon: 'Spray trail', cannon: 'Cannon', stripes: 'Cannon stripes', dots: 'Round confetti', stars: 'Star confetti', streamers: 'Streamers' },
        openGroups: ['Spray'],
        extrasTitle: 'Aim the cannon',
        parameters: [
          { group: 'Spray', key: 'angle', label: 'Aim angle', unit: '°', min: 15, max: 85, step: 1, value: DEFAULTS.angle },
          { group: 'Spray', key: 'power', label: 'Power (how far it flies)', unit: '', min: 50, max: 150, step: 1, value: DEFAULTS.power },
          { group: 'Spray', key: 'spread', label: 'Spread', unit: ' mm', min: 10, max: 34, step: 1, value: DEFAULTS.spread },
          { group: 'Spray', key: 'count', label: 'Pieces of confetti', unit: '', min: 8, max: 80, step: 1, value: DEFAULTS.count },
          { group: 'Spray', key: 'size', label: 'Piece size', unit: ' mm', min: 2.4, max: 7, step: 0.2, value: DEFAULTS.size },
          choice('Spray', 'mix', 'Shapes', ['Mixed', 'Dots only', 'Stars only', 'Streamers only'], DEFAULTS.mix),
          { group: 'Spray', key: 'seed', label: 'Scatter pattern', unit: '', min: 1, max: 99, step: 1, value: DEFAULTS.seed },

          { group: 'Build', key: 'stripes', label: 'Cannon stripes', unit: '', min: 0, max: 5, step: 1, value: DEFAULTS.stripes }
        ],
        presets: [
          presetOf(DEFAULTS, 'Default blast', {}),

          presetOf(DEFAULTS, 'Big spray', { count: 64, spread: 30, size: 3.4 }),

    })();
