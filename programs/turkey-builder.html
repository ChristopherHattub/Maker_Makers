<body class="mm-gen">
  <script>
    (function () {
      'use strict';
      // Turkey Builder: a plump turkey with an adjustable tail fan. The page layout, viewport, Color tool
      // and exports come from shared/generator-core.js.
      // -----------------------------------------------------------------------
      // Geometry helpers. Y up, millimetres. Every solid is a closed shell.
      // -----------------------------------------------------------------------
      var TAU = Math.PI * 2, DEG = Math.PI / 180;
      function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
      function smoothstep(e0, e1, x) { var t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
      function tri(o, a, b, c) { o.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]); }

      function concat(list) {
        var n = 0, i, out, at = 0;
        for (i = 0; i < list.length; i++) n += list[i].length;
        out = new Float32Array(n);
        for (i = 0; i < list.length; i++) { out.set(list[i], at); at += list[i].length; }
        return out;
      }

      // Flip a closed shell inside out when its signed volume is negative.
      function orient(pos) {
        var v = 0, i, t;
        for (i = 0; i < pos.length; i += 9) {
          v += pos[i] * (pos[i + 4] * pos[i + 8] - pos[i + 5] * pos[i + 7])
             - pos[i + 1] * (pos[i + 3] * pos[i + 8] - pos[i + 5] * pos[i + 6])
             + pos[i + 2] * (pos[i + 3] * pos[i + 7] - pos[i + 4] * pos[i + 6]);
        }
        if (v < 0) {
          for (i = 0; i < pos.length; i += 9) {
            for (t = 0; t < 3; t++) { var s = pos[i + 3 + t]; pos[i + 3 + t] = pos[i + 6 + t]; pos[i + 6 + t] = s; }
          }
        }
        return pos;
      }

      // Scale, then rotate about X, Z and Y (radians), then move. o = { s, rx, ry, rz, t }.
      function xform(pos, o) {
        var s = o.s == null ? [1, 1, 1] : (typeof o.s === 'number' ? [o.s, o.s, o.s] : o.s);
        var rx = o.rx || 0, ry = o.ry || 0, rz = o.rz || 0, t = o.t || [0, 0, 0];
        var cx = Math.cos(rx), sx = Math.sin(rx), cz = Math.cos(rz), sz = Math.sin(rz), cy = Math.cos(ry), sy = Math.sin(ry);
        var out = new Float32Array(pos.length), i, x, y, z, nx, ny, nz;
        for (i = 0; i < pos.length; i += 3) {
          x = pos[i] * s[0]; y = pos[i + 1] * s[1]; z = pos[i + 2] * s[2];
          ny = y * cx - z * sx; nz = y * sx + z * cx; y = ny; z = nz;
          nx = x * cz - y * sz; ny = x * sz + y * cz; x = nx; y = ny;
          nx = x * cy + z * sy; nz = -x * sy + z * cy; x = nx; z = nz;
          out[i] = x + t[0]; out[i + 1] = y + t[1]; out[i + 2] = z + t[2];
        }
        if (s[0] * s[1] * s[2] < 0) {
          for (i = 0; i < out.length; i += 9) {
            for (var k = 0; k < 3; k++) { var q = out[i + 3 + k]; out[i + 3 + k] = out[i + 6 + k]; out[i + 6 + k] = q; }
          }
        }
        return out;
      }

      // Grid surface: prof = [[r, ...]] rings; pt(i, j, theta) -> [x,y,z]. Rings with r ~ 0 are poles.
      function surface(prof, seg, pt, wrap) {
        var R = prof.length, P = [], i, j, o = [], row;
        for (i = 0; i < R; i++) {
          row = [];
          for (j = 0; j < seg; j++) row.push(pt(i, j, (j / seg) * TAU));
          P.push(row);
        }
        var last = wrap ? R : R - 1;
        for (i = 0; i < last; i++) {
          var i2 = (i + 1) % R, d0 = !wrap && prof[i][0] < 1e-6, d1 = !wrap && prof[i2][0] < 1e-6;
          if (d0 && d1) continue;
          for (j = 0; j < seg; j++) {
            var k = (j + 1) % seg, a = P[i][j], b = P[i][k], c = P[i2][k], d = P[i2][j];
            if (d0) tri(o, a, d, c);
            else if (d1) tri(o, a, c, b);
            else { tri(o, a, d, c); tri(o, a, c, b); }
          }
        }
        return orient(new Float32Array(o));
      }

      // Solid of revolution about Y. prof = [[r, y], ...] running up the outside; post(p, r, y, theta, i) may nudge a point.
      function lathe(prof, seg, post, wrap) {
        return surface(prof, seg, function (i, j, th) {
          var r = prof[i][0], y = prof[i][1], p = [r * Math.cos(th), y, r * Math.sin(th)];
          if (post) post(p, r, y, th, i);
          return p;
        }, wrap);
      }

      // Unit-ish sphere profile (pole to pole) scaled to rx / ry.
      function ballProf(rx, ry, n) {
        var prof = [], i, a;
        for (i = 0; i <= n; i++) {
          a = -Math.PI / 2 + (Math.PI * i) / n;
          prof.push([i === 0 || i === n ? 0 : rx * Math.cos(a), ry * Math.sin(a)]);
        }
        return prof;
      }
      function ball(rx, ry, rz, seg, post) {
        var n = Math.max(8, Math.round(seg / 2));
        var pos = lathe(ballProf(1, 1, n), seg, post);
        return xform(pos, { s: [rx, ry, rz] });
      }
      // Cone/cylinder along Y from y0 (radius r0) to y1 (radius r1, 0 = point); flat caps.
      function cone(r0, r1, y0, y1, seg) {
        var prof = [[0, y0], [r0, y0]];
        if (r1 > 1e-6) { prof.push([r1, y1]); prof.push([0, y1]); } else prof.push([0, y1]);
        return lathe(prof, seg);
      }
      // Ring (torus) of centre radius R and tube radius r in the XZ plane around Y.
      function torus(R, r, seg, tube) {
        var prof = [], i, a;
        for (i = 0; i < tube; i++) { a = (i / tube) * TAU; prof.push([R + r * Math.cos(a), r * Math.sin(a)]); }
        return lathe(prof, seg, null, true);
      }

      // --- flat shapes in XZ (extruded along Y) ---
      // Star-shaped outline about its centre (ccw loop of [x, z]).
      function fanPrism(pts, y0, y1, c) {
        var o = [], n = pts.length, i, a, b, ct = c || [0, 0];
        for (i = 0; i < n; i++) {
          a = pts[i]; b = pts[(i + 1) % n];
          var at = [a[0], y1, a[1]], bt = [b[0], y1, b[1]], ab = [a[0], y0, a[1]], bb = [b[0], y0, b[1]];
          tri(o, [ct[0], y1, ct[1]], at, bt);
          tri(o, [ct[0], y0, ct[1]], bb, ab);
          tri(o, bt, at, ab); tri(o, bt, ab, bb);
        }
        return orient(new Float32Array(o));
      }
      // Ring between two loops of equal vertex count.
      function ringPrism(A, B, y0, y1) {
        var o = [], n = A.length, i, a, a2, b, b2;
        for (i = 0; i < n; i++) {
          a = A[i]; a2 = A[(i + 1) % n]; b = B[i]; b2 = B[(i + 1) % n];
          var at = [a[0], y1, a[1]], a2t = [a2[0], y1, a2[1]], bt = [b[0], y1, b[1]], b2t = [b2[0], y1, b2[1]];
          var ab = [a[0], y0, a[1]], a2b = [a2[0], y0, a2[1]], bb = [b[0], y0, b[1]], b2b = [b2[0], y0, b2[1]];
          tri(o, at, a2t, b2t); tri(o, at, b2t, bt);
          tri(o, ab, b2b, a2b); tri(o, ab, bb, b2b);
          tri(o, a2t, at, ab); tri(o, a2t, ab, a2b);
          tri(o, bt, b2t, b2b); tri(o, bt, b2b, bb);
        }
        return orient(new Float32Array(o));
      }
      // Band between two open polylines of equal length (with end caps).
      function stripPrism(A, B, y0, y1) {
        var o = [], n = A.length, i, a, a2, b, b2;
        for (i = 0; i < n - 1; i++) {
          a = A[i]; a2 = A[i + 1]; b = B[i]; b2 = B[i + 1];
          var at = [a[0], y1, a[1]], a2t = [a2[0], y1, a2[1]], bt = [b[0], y1, b[1]], b2t = [b2[0], y1, b2[1]];
          var ab = [a[0], y0, a[1]], a2b = [a2[0], y0, a2[1]], bb = [b[0], y0, b[1]], b2b = [b2[0], y0, b2[1]];
          tri(o, at, a2t, b2t); tri(o, at, b2t, bt);
          tri(o, ab, b2b, a2b); tri(o, ab, bb, b2b);
          tri(o, a2t, at, ab); tri(o, a2t, ab, a2b);
          tri(o, bt, b2t, b2b); tri(o, bt, b2b, bb);
        }
        var s0 = [A[0][0], y1, A[0][1]], s1 = [B[0][0], y1, B[0][1]], s2 = [B[0][0], y0, B[0][1]], s3 = [A[0][0], y0, A[0][1]];
        tri(o, s0, s1, s2); tri(o, s0, s2, s3);
        var e0 = [A[n - 1][0], y1, A[n - 1][1]], e1 = [B[n - 1][0], y1, B[n - 1][1]], e2 = [B[n - 1][0], y0, B[n - 1][1]], e3 = [A[n - 1][0], y0, A[n - 1][1]];
        tri(o, e1, e0, e3); tri(o, e1, e3, e2);
        return orient(new Float32Array(o));
      }
      // Rectangle stroke from (x0,z0) to (x1,z1), width w.
      function stroke(x0, z0, x1, z1, w, y0, y1) {
        var dx = x1 - x0, dz = z1 - z0, l = Math.sqrt(dx * dx + dz * dz) || 1, nx = -dz / l * w / 2, nz = dx / l * w / 2;
        var ex = dx / l * w * 0.2, ez = dz / l * w * 0.2;
        var pts = [[x0 - ex - nx, z0 - ez - nz], [x1 + ex - nx, z1 + ez - nz], [x1 + ex + nx, z1 + ez + nz], [x0 - ex + nx, z0 - ez + nz]];
        return fanPrism(pts, y0, y1, [(x0 + x1) / 2, (z0 + z1) / 2]);
      }
      function circlePts(cx, cz, r, n) {
        var pts = [], i;
        for (i = 0; i < n; i++) pts.push([cx + r * Math.cos((i / n) * TAU), cz + r * Math.sin((i / n) * TAU)]);
        return pts;
      }

      function mesh(name, list, group) {
        return list.length ? { name: name, positions: concat(list), smoothGroup: group || name } : null;
      }
      function pushMesh(out, m) { if (m) out.push(m); }

      // Param helpers: a 0..1 switch and a named-option picker, both stored as plain numbers.
      function toggle(group, key, label, off, on, value) {
        return { group: group, key: key, label: label, unit: '', min: 0, max: 1, step: 1, value: value,
          format: function (v) { return v >= 1 ? on : off; } };
      }
      function choice(group, key, label, names, value) {
        return { group: group, key: key, label: label, unit: '', min: 0, max: names.length - 1, step: 1, value: value,
          format: function (v) { return names[Math.round(v)]; } };
      }
      function presetOf(DEFAULTS, label, over) {
        var values = {};
        Object.keys(DEFAULTS).forEach(function (k) { values[k] = DEFAULTS[k]; });
        Object.keys(over).forEach(function (k) { values[k] = over[k]; });
        return { label: label, values: values };
      }

      var SEG = 56;

      var DEFAULTS = {
        bodyW: 22, bodyH: 44, bodyD: 26, headSize: 8, neck: 10, beak: 6,
        feathers: 9, featherLen: 46, featherW: 14, spread: 100, featherT: 3.6, inner: 1,
        base: 1, baseSize: 40
      };

      function build(p) {
        var out = [], y0 = p.base >= 1 ? 3 : 0;
        var rx = p.bodyW, ry = p.bodyH / 1.8, rz = p.bodyD;
        var cy = y0 + ry * 0.8; // flat-cut belly sits on the floor
        var body = [], head = [], beak = [], wattle = [], eyes = [], fOut = [], fIn = [], baseL = [];

        if (p.base >= 1) {
          var br = Math.max(p.baseSize, rx + 8);
          baseL.push(lathe([[0, 0], [br, 0], [br, 2.2], [br - 1.2, 3], [0, 3]], 72));
        }
        var lo = (y0 - cy) / ry;
        body.push(xform(ball(1, 1, 1, SEG, function (pt) { if (pt[1] < lo) pt[1] = lo; }), { s: [rx, ry, rz], t: [0, cy, 0] }));

        // Head and neck at the front.
        var hs = p.headSize, neckTopY = cy + ry * 0.75 + p.neck * 0.6;
        var hz = rz * 0.6 + hs * 0.55;
        var hy = neckTopY + hs * 0.3;
        body.push(xform(ball(hs * 0.75, (p.neck * 0.5 + hs * 0.9), hs * 0.75, 28), { t: [0, (cy + ry * 0.55 + hy) / 2 - 1, hz - hs * 0.35], rx: -0.12 }));
        head.push(xform(ball(hs, hs * 1.05, hs, 36), { t: [0, hy, hz] }));
        beak.push(xform(cone(hs * 0.42, 0, 0, p.beak, 24), { rx: Math.PI / 2, t: [0, hy - hs * 0.1, hz + hs * 0.8] }));
        wattle.push(xform(ball(hs * 0.2, hs * 0.55, hs * 0.2, 16), { t: [0, hy - hs * 0.85, hz + hs * 0.72] }));
        [-1, 1].forEach(function (s) {
          eyes.push(xform(ball(hs * 0.17, hs * 0.17, hs * 0.17, 14), { t: [s * hs * 0.62, hy + hs * 0.25, hz + hs * 0.6] }));
        });

        // Tail fan: vertical feathers pivoting at the back, in the XY plane.
        var n = Math.round(p.feathers), len = p.featherLen, w = p.featherW, th = p.featherT;
        var pivY = cy + ry * 0.1, zf = -rz * 0.55, k, beta, a, b, lim, row;
        function addRow(list, count, scale, off, zOff) {
          for (k = 0; k < count; k++) {
            var u = count === 1 ? 0 : k / (count - 1) - 0.5;
            beta = (p.spread * u + off) * DEG;
            a = len * scale / 2; b = w * scale / 2;
            // keep the feather above the floor
            for (lim = 0; lim < 90; lim++) {
              var cyF = pivY + a * Math.cos(beta), hy2 = Math.sqrt(a * a * Math.cos(beta) * Math.cos(beta) + b * b * Math.sin(beta) * Math.sin(beta));
              if (cyF - hy2 >= y0 + 0.2) break;
              beta += (beta > 0 ? -1 : 1) * DEG;
            }
            var f = ball(b, a, th / 2, 28);
            list.push(xform(f, { rz: -beta, t: [Math.sin(beta) * a * 0.92, pivY + Math.cos(beta) * a * 0.92, zf + zOff] }));
          }
        }
        addRow(fOut, n, 1, 0, 0);
        if (p.inner >= 1 && n > 1) addRow(fIn, n - 1, 0.62, 0, th * 0.55);

        pushMesh(out, mesh('body', body, 'turkey'));
        pushMesh(out, mesh('head', head, 'turkey'));
        pushMesh(out, mesh('beak', beak));
        pushMesh(out, mesh('wattle', wattle));
        pushMesh(out, mesh('eyes', eyes));
        pushMesh(out, mesh('feathers', fOut));
        pushMesh(out, mesh('inner', fIn));
        pushMesh(out, mesh('base', baseL));
        return out;
      }

      window.MM_GENERATOR = {
        code: 'MM-017',
        category: 'FALL // FIGURES',
        title: 'Turkey Builder',
        fileName: 'Turkey_Builder',
        palette: [
          { name: 'Gobbler Brown', color: '#b4783c' },
          { name: 'Harvest Orange', color: '#fdba74' },
          { name: 'Cranberry Red', color: '#e11d48' },
          { name: 'Corn Gold', color: '#fde047' },
          { name: 'Sage Green', color: '#86efac' },
          { name: 'Cream', color: '#fff4dc' },
          { name: 'Cocoa', color: '#5b3a24' },
          { name: 'Berry Plum', color: '#9d6bd6' }
        ],
        defaultColor: '#b4783c',
        partNames: { body: 'Body', head: 'Head', beak: 'Beak', wattle: 'Wattle', eyes: 'Eyes', feathers: 'Tail feathers', inner: 'Inner feathers', base: 'Base' },
        parameters: [
          { group: 'Body', key: 'bodyW', label: 'Body width', unit: ' mm', min: 14, max: 34, step: 1, value: DEFAULTS.bodyW },
          { group: 'Body', key: 'bodyH', label: 'Body height', unit: ' mm', min: 28, max: 64, step: 1, value: DEFAULTS.bodyH },
          { group: 'Body', key: 'bodyD', label: 'Body length (front to back)', unit: ' mm', min: 16, max: 38, step: 1, value: DEFAULTS.bodyD },
          { group: 'Head', key: 'headSize', label: 'Head size', unit: ' mm', min: 5, max: 12, step: 0.5, value: DEFAULTS.headSize },
          { group: 'Head', key: 'neck', label: 'Neck length', unit: ' mm', min: 2, max: 20, step: 1, value: DEFAULTS.neck },
          { group: 'Head', key: 'beak', label: 'Beak length', unit: ' mm', min: 2, max: 12, step: 0.5, value: DEFAULTS.beak },
          { group: 'Tail fan', key: 'feathers', label: 'Feather count', unit: '', min: 3, max: 15, step: 1, value: DEFAULTS.feathers },
          { group: 'Tail fan', key: 'featherLen', label: 'Feather length', unit: ' mm', min: 24, max: 70, step: 1, value: DEFAULTS.featherLen },
          { group: 'Tail fan', key: 'featherW', label: 'Feather width', unit: ' mm', min: 7, max: 24, step: 0.5, value: DEFAULTS.featherW },
          { group: 'Tail fan', key: 'spread', label: 'Fan spread (wide = more overhang)', unit: '°', min: 40, max: 150, step: 5, value: DEFAULTS.spread },
          { group: 'Tail fan', key: 'featherT', label: 'Feather thickness', unit: ' mm', min: 2, max: 7, step: 0.2, value: DEFAULTS.featherT },
          toggle('Tail fan', 'inner', 'Inner feather row', 'Off', 'On', DEFAULTS.inner),
          toggle('Base', 'base', 'Base plate', 'No base', 'Base', DEFAULTS.base),
          { group: 'Base', key: 'baseSize', label: 'Base radius', unit: ' mm', min: 24, max: 60, step: 1, value: DEFAULTS.baseSize }
        ],
        presets: [
          presetOf(DEFAULTS, 'Classic tom', {}),
          presetOf(DEFAULTS, 'Big fan', { feathers: 13, featherLen: 58, featherW: 15, spread: 130, bodyH: 40 }),
          presetOf(DEFAULTS, 'Plump hen', { bodyW: 28, bodyH: 40, bodyD: 32, feathers: 7, featherLen: 34, featherW: 15, spread: 80, headSize: 7, neck: 6 }),
          presetOf(DEFAULTS, 'Tiny desk turkey', { bodyW: 15, bodyH: 30, bodyD: 17, headSize: 5.5, neck: 5, beak: 3.5, featherLen: 30, featherW: 9, featherT: 2.6, baseSize: 26 }),
          presetOf(DEFAULTS, 'Default turkey', {})
        ],
        build: build
      };

    })();
  </script>
