<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MM-015 Pottery Wheel // Maker Makers</title>
  <link rel="stylesheet" href="shared/generator.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap">
  <style>
    body.mm-soft.studio {
      --s-bg: #efd9bd; --s-panel: #fbf2e4; --s-panel-a: rgba(251,242,228,0.96); --s-accent: #c4613a; --s-accent-dim: rgba(196,97,58,0.35);
      --s-text: #4a3426; --s-muted: #8a6a52; --s-amber: #c9803c; --s-green: #5f8f5a; --s-edge: #e3c8a4;
      --s-card: #f4e3cc; --s-card-a: rgba(251,242,228,0.9); --s-stage: #e8cfae;
      --s-font: 'Nunito', 'Trebuchet MS', 'Segoe UI', sans-serif;
      --s-bg-img: linear-gradient(#f0dcc0, #e6c9a5);
    }
    .studio .mm-gen-title { font-weight: 700; }
    .pw-tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem; margin-bottom: 0.6rem; }
    .pw-tool { position: relative; display: flex; flex-direction: column; align-items: center; gap: 0.1rem; padding: 0.45rem 0.1rem 0.35rem; border: 2px solid var(--s-edge);
      border-radius: 14px; background: var(--s-card); color: var(--s-text); font: inherit; font-size: 0.72rem; cursor: pointer; box-shadow: 0 2px 0 var(--s-edge); }
    .pw-tool svg { width: 1.9rem; height: 1.9rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pw-tool kbd { position: absolute; top: 3px; right: 5px; font: 700 0.62rem var(--s-font); color: var(--s-muted); }
    .pw-tool:hover { border-color: var(--s-accent); }
    .pw-tool[aria-pressed="true"] { background: var(--s-accent); border-color: var(--s-accent); color: #fff; }
    .pw-tool[aria-pressed="true"] kbd { color: #ffe9dc; }
    .pw-tool:focus-visible, .pw-menu summary:focus-visible { outline: 3px solid var(--s-accent); outline-offset: 2px; }
    .pw-menu { position: absolute; top: 3.1rem; left: 0.6rem; z-index: 5; width: min(21rem, calc(100% - 1.2rem)); max-height: calc(100% - 4rem); overflow: auto;
      background: var(--s-panel-a); color: var(--s-text); border: 2px solid var(--s-edge); border-radius: 16px; box-shadow: 0 4px 0 var(--s-edge), 0 8px 24px rgba(74,52,38,0.25); }
    .pw-menu > summary { list-style: none; cursor: pointer; padding: 0.55rem 0.9rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .pw-menu > summary::-webkit-details-marker { display: none; }
    .pw-menu > summary::after { content: '\25BE'; transition: transform .15s; }
    .pw-menu[open] > summary::after { transform: rotate(180deg); }
    .pw-menu-body { padding: 0 0.8rem 0.8rem; }
    .pw-menu .mm-section-title { display: none; }
    .pw-keys { font-size: 0.74rem; color: var(--s-muted); margin: 0.2rem 0 0.8rem; }
    .pw-keys kbd { font: 700 0.72rem var(--s-font); border: 1px solid var(--s-edge); border-radius: 5px; padding: 0 0.3rem; background: #fff; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body class="mm-gen mm-soft studio">
  <script>
    // Pottery Wheel: a spinning lump of clay you mold with the mouse or your finger. The wheel tab draws
    // the clay turning; pressing on the wall pushes it in and out, and the 3D model on the right is the
    // same pot, ready to export as .STL. The page layout, the viewport, the Color tool and the exports
    // come from shared/generator-core.js.
    (function () {
      'use strict';

      // ---- Geometry kit: closed shells built from rings (shared vertices, so always watertight) ----
      var TAU = Math.PI * 2;
      function rad(d) { return (d * Math.PI) / 180; }
      function rad(d) { return (d * Math.PI) / 180; }
      function sqr(x) { return x * x; }
      function vsub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
      function vadd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
      function shell(rings, wrap) {
        var verts = [], idx = [], info = [], i, j;
        rings.forEach(function (r) {
          if (r.pole) { info.push({ pole: true, s: verts.length, n: 1 }); verts.push(r.pole); }
          else { info.push({ s: verts.length, n: r.length }); r.forEach(function (q) { verts.push(q); }); }
        });
        var n = rings.length, last = wrap ? n : n - 1;
        for (i = 0; i < last; i++) {
          var A = info[i], B = info[(i + 1) % n];
          if (A.pole && B.pole) continue;
          if (A.pole) { for (j = 0; j < B.n; j++) idx.push(A.s, B.s + (j + 1) % B.n, B.s + j); }
          else if (B.pole) { for (j = 0; j < A.n; j++) idx.push(A.s + j, A.s + (j + 1) % A.n, B.s); }
          else {
            for (j = 0; j < A.n; j++) {
              var a = A.s + j, b = A.s + (j + 1) % A.n, c = B.s + (j + 1) % B.n, d = B.s + j;
              idx.push(a, b, c, a, c, d);
            }
          }
        }
        var vol = 0, p, q, r;
        for (i = 0; i < idx.length; i += 3) {
          p = verts[idx[i]]; q = verts[idx[i + 1]]; r = verts[idx[i + 2]];
          vol += (p[0] * (q[1] * r[2] - q[2] * r[1]) - p[1] * (q[0] * r[2] - q[2] * r[0]) + p[2] * (q[0] * r[1] - q[1] * r[0])) / 6;
        }
        var out = new Float32Array(idx.length * 3), o = 0, v;
        for (i = 0; i < idx.length; i += 3) {
          var tri = vol < 0 ? [idx[i], idx[i + 2], idx[i + 1]] : [idx[i], idx[i + 1], idx[i + 2]];
          for (j = 0; j < 3; j++) { v = verts[tri[j]]; out[o++] = v[0]; out[o++] = v[1]; out[o++] = v[2]; }
        }
        return out;
      }
      function cat(list) {
        var n = 0, i;
        for (i = 0; i < list.length; i++) n += list[i].length;
        var out = new Float32Array(n), at = 0;
        for (i = 0; i < list.length; i++) { out.set(list[i], at); at += list[i].length; }
        return out;
      }
      function smootherstep(x) {
        var t = Math.max(0, Math.min(1, x));
        return t * t * t * (t * (t * 6 - 15) + 10);
      }
      function el(tag, attrs, text) {
        var node = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (k) {
          if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
          else node.setAttribute(k, attrs[k]);
        });
        if (text) node.textContent = text;
        return node;
      }
      function withDefaults(defaults, over) {
        var values = {};
        Object.keys(defaults).forEach(function (k) { values[k] = defaults[k]; });
        Object.keys(over).forEach(function (k) { values[k] = over[k]; });
        return values;
      }

      function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }

      // ---- The clay: an outer radius sample for every slice of the pot, bottom (t = 0) to rim (t = 1) ----
      var NS = 80;              // slices in the sculpted profile
      var NR = 80;              // rings per wall in the mesh
      var SEGN = 96;            // points around every ring
      var MIN_R = 6, MAX_R = 72, MIN_HOLE = 3.5;
      var prof = new Float64Array(NS + 1);
      var history = [];
      var refreshWheel = null;

      // Smooth profile through [t, radius] control points (cubic Hermite, Catmull-Rom tangents).
      function fromPoints(pts) {
        var out = new Float64Array(NS + 1), i, j;
        for (i = 0; i <= NS; i++) {
          var t = i / NS;
          for (j = 0; j < pts.length - 2 && t > pts[j + 1][0]; j++) { /* find segment */ }
          var a = pts[j], b = pts[j + 1], dt = b[0] - a[0], u = clamp((t - a[0]) / dt, 0, 1);
          var m0 = (j > 0 ? (b[1] - pts[j - 1][1]) / (b[0] - pts[j - 1][0]) : (b[1] - a[1]) / dt) * dt;
          var m1 = (j < pts.length - 2 ? (pts[j + 2][1] - a[1]) / (pts[j + 2][0] - a[0]) : (b[1] - a[1]) / dt) * dt;
          var u2 = u * u, u3 = u2 * u;
          out[i] = (2 * u3 - 3 * u2 + 1) * a[1] + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * b[1] + (u3 - u2) * m1;
        }
        return out;
      }

      // Starting lumps. Each also sets the height, wall and handle so it prints well straight away.
      var SHAPES = [
        { name: 'Fresh clay', pts: [[0, 34], [1, 34]], values: { height: 70, wall: 3.4, baseThick: 5, handle: 0 } },
        { name: 'Vase', pts: [[0, 24], [0.3, 36], [0.5, 35], [0.8, 19], [0.92, 18], [1, 24]], values: { height: 100, wall: 3.2, baseThick: 5, handle: 0 } },
        { name: 'Bowl', pts: [[0, 22], [0.3, 38], [0.7, 50], [1, 56]], values: { height: 55, wall: 3.4, baseThick: 4, handle: 0 } },
        { name: 'Mug', pts: [[0, 31], [0.5, 32], [1, 33]], values: { height: 90, wall: 3.4, baseThick: 6, handle: 1, handleTop: 82, handleBottom: 22 } },
        { name: 'Bottle', pts: [[0, 26], [0.35, 30], [0.55, 27], [0.7, 12], [0.86, 8.5], [0.97, 9.5], [1, 11]], values: { height: 130, wall: 3.2, baseThick: 5, handle: 0 } },
        { name: 'Jug', pts: [[0, 28], [0.45, 38], [0.75, 28], [0.9, 24], [1, 28]], values: { height: 110, wall: 3.4, baseThick: 6, handle: 1, handleTop: 80, handleBottom: 30 } },
        { name: 'Dish', pts: [[0, 40], [1, 64]], values: { height: 26, wall: 3.4, baseThick: 4, handle: 0 } }
      ];
      function loadShape(i) { prof = fromPoints(SHAPES[i].pts); history = []; }
      loadShape(1);

      function snapshot(api) { history.push({ prof: new Float64Array(prof), height: api.params.height }); if (history.length > 40) history.shift(); }

      var PARAMS = [
        { group: 'Pot', key: 'height', label: 'Height', unit: ' mm', min: 30, max: 150, step: 1, value: 100 },
        { group: 'Pot', key: 'widthScale', label: 'Width (squeeze ↔ widen all)', unit: '%', min: 60, max: 130, step: 1, value: 100 },
        { group: 'Pot', key: 'wall', label: 'Wall thickness', unit: ' mm', min: 2.4, max: 8, step: 0.2, value: 3.2 },
        { group: 'Fine tuning', key: 'baseThick', label: 'Base thickness', unit: ' mm', min: 3, max: 12, step: 0.5, value: 5 },
        { group: 'Fine tuning', key: 'maxAngle', label: 'Overhang limit (low = no supports)', unit: '°', min: 35, max: 85, step: 1, value: 52,
          format: function (v) { return v >= 80 ? 'Free (may need supports)' : v + '° from upright'; } },
        { group: 'Decoration', key: 'rings', label: 'Throwing rings', unit: ' mm', min: 0, max: 2.5, step: 0.1, value: 0,
          format: function (v) { return v < 0.1 ? 'Smooth' : v + ' mm'; } },
        { group: 'Fine tuning', key: 'ringCount', label: 'Number of rings', unit: '', min: 3, max: 30, step: 1, value: 12 },
        { group: 'Fine tuning', key: 'spiral', label: 'Rings (level ↔ spiral)', unit: '', min: 0, max: 1, step: 1, value: 0,
          format: function (v) { return v >= 1 ? 'Spiral' : 'Level'; } },
        { group: 'Decoration', key: 'flutes', label: 'Fluting grooves', unit: '', min: 0, max: 16, step: 1, value: 0,
          format: function (v) { return v < 3 ? 'None' : Math.round(v) + ' grooves'; } },
        { group: 'Fine tuning', key: 'fluteDepth', label: 'Groove depth', unit: ' mm', min: 0.4, max: 3, step: 0.1, value: 1.4 },
        { group: 'Fine tuning', key: 'twist', label: 'Groove twist', unit: '°', min: -180, max: 180, step: 5, value: 0 },
        { group: 'Decoration', key: 'facets', label: 'Faceted sides (0 = round)', unit: '', min: 0, max: 10, step: 1, value: 0,
          format: function (v) { return v < 3 ? 'Round' : Math.round(v) + ' sides'; } },
        { group: 'Fine tuning', key: 'oval', label: 'Oval squash', unit: '%', min: 0, max: 25, step: 1, value: 0 },
        { group: 'Fine tuning', key: 'wobble', label: 'Hand-made wobble', unit: ' mm', min: 0, max: 3, step: 0.1, value: 0,
          format: function (v) { return v < 0.1 ? 'None' : v + ' mm'; } },
        { group: 'Decoration', key: 'handle', label: 'Mug handle', unit: '', min: 0, max: 1, step: 1, value: 0,
          format: function (v) { return v >= 1 ? 'On' : 'Off'; } },
        { group: 'Fine tuning', key: 'handleTop', label: 'Top joins at (height)', unit: '%', min: 40, max: 95, step: 1, value: 80 },
        { group: 'Fine tuning', key: 'handleBottom', label: 'Bottom joins at (height)', unit: '%', min: 8, max: 70, step: 1, value: 25 },
        { group: 'Fine tuning', key: 'handleOut', label: 'Reach (shortened if too tall to print)', unit: ' mm', min: 10, max: 45, step: 1, value: 26 },
        { group: 'Fine tuning', key: 'handleThick', label: 'Handle thickness', unit: ' mm', min: 2.4, max: 5, step: 0.1, value: 3.4 },
        { group: 'Hands', key: 'brush', label: 'Finger size', unit: ' mm', min: 4, max: 40, step: 1, value: 16 },
        { group: 'Hands', key: 'pressure', label: 'Pressure (gentle ↔ firm)', unit: '%', min: 20, max: 100, step: 1, value: 60 },
        { group: 'Hands', key: 'speed', label: 'Wheel speed', unit: '', min: 0, max: 100, step: 1, value: 50,
          format: function (v) { return v < 1 ? 'Stopped' : Math.round(v * 1.2) + ' rpm'; } }
      ];
      (function () {
        var rank = { 'Pot': 0, 'Hands': 1, 'Decoration': 2, 'Fine tuning': 3 };
        PARAMS = PARAMS.map(function (q, i) { return [q, i]; }).sort(function (a, b) { return (rank[a[0].group] - rank[b[0].group]) || (a[1] - b[1]); }).map(function (x) { return x[0]; });
      })();
      var DEFAULTS = {};
      PARAMS.forEach(function (d) { DEFAULTS[d.key] = d.value; });

      // Radius profile as it will print: width scale applied, then the overhang limit trims anything steeper.
      function effProfile(p) {
        var r = new Float64Array(NS + 1), trimmed = new Array(NS + 1), i, ws = p.widthScale / 100;
        for (i = 0; i <= NS; i++) { r[i] = clamp(prof[i] * ws, MIN_R, MAX_R); trimmed[i] = false; }
        if (p.maxAngle < 80) {
          var lim = Math.tan(rad(p.maxAngle)) * (p.height / NS);
          for (i = 1; i <= NS; i++) {
            var v = clamp(r[i], r[i - 1] - lim, r[i - 1] + lim);
            if (Math.abs(v - r[i]) > 0.01) trimmed[i] = true;
            r[i] = v;
          }
        }
        return { r: r, trimmed: trimmed };
      }
      function rAt(eff, t) {
        var f = clamp(t, 0, 1) * NS, i = Math.min(NS - 1, Math.floor(f)), u = f - i;
        return eff.r[i] * (1 - u) + eff.r[i + 1] * u;
      }
      function slopeAt(eff, t, H) {
        var h = 1 / NS;
        return (rAt(eff, t + h) - rAt(eff, t - h)) / ((Math.min(1, t + h) - Math.max(0, t - h)) * H);
      }
      function innerBase(eff, y, H, W) {
        var t = y / H, s = slopeAt(eff, t, H);
        return Math.max(rAt(eff, t) - Math.min(W * 1.8, W * Math.sqrt(1 + s * s)), MIN_HOLE);
      }

      // ---- Mesh ----
      function mods(p, W) {
        var m = {
          rings: p.rings, ringCount: Math.round(p.ringCount), spiral: p.spiral >= 1,
          flutes: p.flutes >= 3 ? Math.round(p.flutes) : 0, fluteD: Math.max(0, Math.min(p.fluteDepth, W - 1.6)), twist: rad(p.twist),
          facets: p.facets >= 3 ? Math.round(p.facets) : 0, oval: p.oval / 100, wobble: p.wobble
        };
        return m;
      }
      function ringPoint(m, base, y, a, outer, H, Hp) {
        var t = y / H, env = smootherstep(t / 0.09) * smootherstep((Hp - y) / (H * 0.08));
        var r = base;
        if (m.rings > 0) r += m.rings * env * Math.sin(TAU * m.ringCount * t + (m.spiral ? a : 0));
        if (outer && m.flutes) r -= m.fluteD * env * (0.5 + 0.5 * Math.cos(m.flutes * a + m.twist * t));
        if (m.wobble > 0) r += m.wobble * env * (0.6 * Math.sin(3 * a + t * 7) + 0.4 * Math.sin(5 * a - t * 4.5));
        if (m.facets) {
          var seg = TAU / m.facets, loc = ((a % seg) + seg) % seg - seg / 2;
          r *= Math.cos(Math.PI / m.facets) / Math.cos(loc);
        }
        return [r * Math.cos(a) * (1 + m.oval), y, r * Math.sin(a) * (1 - m.oval)];
      }

      var stats = { volume: 0, widest: 0, trimmed: 0 };
      function potMeshes(p) {
        var H = p.height, W = p.wall, B = Math.min(p.baseThick, H - 10), eff = effProfile(p), m = mods(p, W);
        var ay = Math.min(W * 0.5, 2.4), Hp = H - ay, rings = [], i, s, j;
        function row(y, base, outer, inset) {
          var out = [];
          for (s = 0; s < SEGN; s++) out.push(ringPoint(m, base - (inset || 0), y, (s / SEGN) * TAU, outer, H, Hp));
          return out;
        }
        rings.push({ pole: [0, 0, 0] });
        for (i = 0; i <= NR; i++) { var yo = Hp * i / NR; rings.push(row(yo, rAt(eff, yo / H), true, i === 0 ? 1.0 : 0)); }
        var outerTop = rings[rings.length - 1], M = 10, innerRows = [];
        for (i = 0; i <= NR; i++) { var yi = Hp - (Hp - B) * i / NR; innerRows.push(row(yi, innerBase(eff, yi, H, W), false)); }
        var innerTop = innerRows[0];
        for (j = 1; j < M; j++) {
          var th = (j / M) * Math.PI, ring = [];
          for (s = 0; s < SEGN; s++) {
            var po = outerTop[s], pi = innerTop[s], c = Math.cos(th);
            ring.push([(po[0] + pi[0]) / 2 + (po[0] - pi[0]) / 2 * c, Hp + ay * Math.sin(th), (po[2] + pi[2]) / 2 + (po[2] - pi[2]) / 2 * c]);
          }
          rings.push(ring);
        }
        innerRows.forEach(function (r) { rings.push(r); });
        rings.push({ pole: [0, B, 0] });
        var tris = shell(rings, false), n = SEGN;
        var outerCount = (n + 2 * n * NR) * 9, rimCount = (2 * n * M) * 9;
        var body = [
          { name: 'outer', positions: tris.subarray(0, outerCount), smoothGroup: 'pot', singlePart: true },
          { name: 'rim', positions: tris.subarray(outerCount, outerCount + rimCount), smoothGroup: 'pot', singlePart: true },
          { name: 'inner', positions: tris.subarray(outerCount + rimCount), smoothGroup: 'pot', singlePart: true }
        ];
        // Stats for the editor: how much it holds, how wide it is, how much the overhang limit trimmed.
        var vol = 0, widest = 0, tr = 0;
        for (i = 0; i < NR; i++) {
          var y1 = Hp - (Hp - B) * i / NR, ri = innerBase(eff, y1, H, W);
          vol += Math.PI * ri * ri * ((Hp - B) / NR);
        }
        for (i = 0; i <= NS; i++) { widest = Math.max(widest, eff.r[i]); if (eff.trimmed[i]) tr++; }
        stats = { volume: vol / 1000, widest: widest * 2, trimmed: tr };
        return { meshes: body, eff: eff };
      }

      // ---- Handle: a tube swept along a rounded ear shape on the +X side ----
      function handlePath(p, eff) {
        var H = p.height, yt = H * p.handleTop / 100, yb = H * p.handleBottom / 100;
        if (yt - yb < 14) yt = yb + 14;
        var tr = Math.min(p.handleThick, (p.wall - 0.8) / 0.75) / 2 * 2;
        tr = Math.min(p.handleThick / 2 * 2, (p.wall - 0.8) / 0.75);
        var rT = rAt(eff, yt / H) - 0.6, rB = rAt(eff, yb / H) - 0.6;
        var out = Math.min(p.handleOut, (yt - yb) / 2);
        var A = [rT, yt], D = [rB, yb], P = [Math.max(rT, rB) + out, (yt + yb) / 2];
        var pts = [A, P, D], k, q;
        for (k = 0; k < 3; k++) {
          var next = [pts[0]];
          for (q = 0; q < pts.length - 1; q++) {
            var a = pts[q], b = pts[q + 1];
            next.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
          }
          next.push(pts[pts.length - 1]);
          pts = next;
        }
        return { pts: pts, tr: tr / 2 };
      }
      function handleMesh(p, eff) {
        var hp = handlePath(p, eff), pts = hp.pts, tr = hp.tr, rings = [], i, k, SEGH = 20;
        function dir(i) {
          var a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.sqrt(dx * dx + dy * dy) || 1;
          return [dx / l, dy / l];
        }
        var d0 = dir(0), d1 = dir(pts.length - 1);
        rings.push({ pole: [pts[0][0] - d0[0] * tr * 0.9, pts[0][1] - d0[1] * tr * 0.9, 0] });
        for (i = 0; i < pts.length; i++) {
          var d = dir(i), nx = -d[1], ny = d[0], ring = [];
          for (k = 0; k < SEGH; k++) {
            var ang = (k / SEGH) * TAU;
            ring.push([pts[i][0] + nx * Math.cos(ang) * tr, pts[i][1] + ny * Math.cos(ang) * tr, Math.sin(ang) * tr]);
          }
          rings.push(ring);
        }
        rings.push({ pole: [pts[pts.length - 1][0] + d1[0] * tr * 0.9, pts[pts.length - 1][1] + d1[1] * tr * 0.9, 0] });
        return shell(rings, false);
      }
