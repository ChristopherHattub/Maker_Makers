      }
      // 3D click -> grid cell on a lathe surface whose pattern zone spans y0..y1.
      function pickStamp(hit, api, y0, y1) {
        var u = ((Math.atan2(hit.point.z, hit.point.x) / TAU) % 1 + 1) % 1, v = (hit.point.y - y0) / (y1 - y0);

      grid.forEach(function (x, i) { grid[i] = PATTERNS.Spiral(i % PCOLS, Math.floor(i / PCOLS)); });

      /*PATT*/
      var DEFAULTS = { height: 72, width: 25, shape: 0.6, flat: 8, depth: 1.0, zoneLo: 8, zoneHi: 94, hollow: 0, wall: 2.4, loop: 0, spin: 0 };
