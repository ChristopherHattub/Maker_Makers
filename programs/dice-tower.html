  <script>
    // Dice Tower: parameters, presets, palette and geometry. The page layout, the viewport,
    // the Color tool and the exports come from shared/generator-core.js.
    (function () {
      'use strict';

      // -----------------------------------------------------------------------
      // Geometry kit: watertight solids from polygons (XZ plane, Y up). Triangles go into plain arrays.
      // -----------------------------------------------------------------------
      var K = (function () {
        var TAU = Math.PI * 2;

        function area2(p) {
          var s = 0;
          for (var i = 0; i < p.length; i++) { var a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; }

        }
        // Outer loops have area2 < 0 (their top cap faces up); holes have area2 > 0.
        function orient(p, outer) { return (area2(p) < 0) === outer ? p : p.slice().reverse(); }
        function push(out, a, b, c) { out.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]); }
        function cross(a, b, c) { return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]); }
        function same(a, b) { return Math.abs(a[0] - b[0]) < 1e-9 && Math.abs(a[1] - b[1]) < 1e-9; }

        function segHit(p1, p2, p3, p4) {
          if (same(p1, p3) || same(p1, p4) || same(p2, p3) || same(p2, p4)) return false;
          var d1 = cross(p3, p4, p1), d2 = cross(p3, p4, p2), d3 = cross(p1, p2, p3), d4 = cross(p1, p2, p4);
          return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
        }

        // Join each hole to the outer loop with a zero-width bridge so one ear-clipping pass handles it.
        function bridge(poly, holes) {
          var hs = holes.slice().sort(function (a, b) { return maxX(b) - maxX(a); });
          var all = hs.slice();
          hs.forEach(function (h, hi) {
            var mi = 0;
            for (var i = 1; i < h.length; i++) if (h[i][0] > h[mi][0]) mi = i;
            var M = h[mi];
            var order = poly.map(function (p, i) { return i; }).sort(function (a, b) {
              return dist2(poly[a], M) - dist2(poly[b], M);
            });
            var pick = -1;
            for (var k = 0; k < order.length && pick < 0; k++) {
              var V = poly[order[k]];
              var ok = true;
              for (var e = 0; e < poly.length && ok; e++) if (segHit(M, V, poly[e], poly[(e + 1) % poly.length])) ok = false;
              for (var q = 0; q < all.length && ok; q++) {
                var L = all[q];
                for (var f = 0; f < L.length && ok; f++) if (segHit(M, V, L[f], L[(f + 1) % L.length])) ok = false;
              }
              if (ok) pick = order[k];
            }
            if (pick < 0) pick = order[0];
            var rot = h.slice(mi).concat(h.slice(0, mi));
            poly = poly.slice(0, pick + 1).concat(rot, [rot[0]], [poly[pick]], poly.slice(pick + 1));
          });
          return poly;
        }
        function maxX(p) { var m = -Infinity; for (var i = 0; i < p.length; i++) if (p[i][0] > m) m = p[i][0]; return m; }
        function dist2(a, b) { var x = a[0] - b[0], z = a[1] - b[1]; return x * x + z * z; }

        // Ear clipping for a loop with area2 < 0. Returns triangles [a, b, c] of [x, z] points facing up.
        function earClip(poly) {
          var idx = poly.map(function (p, i) { return i; });
          var tris = [];
          var i = 0, guard = 0, limit = poly.length * poly.length * 3 + 50;
          while (idx.length > 3 && guard++ < limit) {
            var m = idx.length;
            i = i % m;
            var a = poly[idx[(i + m - 1) % m]], b = poly[idx[i]], c = poly[idx[(i + 1) % m]];
            var cr = cross(a, b, c);
            var ear = false;
            if (cr <= 1e-12) {
              ear = true;
              if (cr < -1e-12) {
                for (var k = 0; k < m && ear; k++) {
                  var q = poly[idx[k]];
                  if (same(q, a) || same(q, b) || same(q, c)) continue;
                  if (cross(a, b, q) <= 1e-12 && cross(b, c, q) <= 1e-12 && cross(c, a, q) <= 1e-12) ear = false;
                }
              }
            }
            if (ear) { tris.push([a, b, c]); idx.splice(i, 1); } else i++;
          }
          if (idx.length === 3) tris.push([poly[idx[0]], poly[idx[1]], poly[idx[2]]]);
          else if (guard >= limit) {
            // numerical trouble: fan the rest so the surface stays closed
            for (var j = 1; j + 1 < idx.length; j++) tris.push([poly[idx[0]], poly[idx[j]], poly[idx[j + 1]]]);
          }
          return tris;
        }

        function triangulate(outer, holes) {
          var poly = outer;
          if (holes && holes.length) poly = bridge(outer, holes);
          return earClip(poly);
        }

        function wallStrip(out, a, b, y0, y1) {
          push(out, [a[0], y0, a[1]], [b[0], y0, b[1]], [b[0], y1, b[1]]);
          push(out, [a[0], y0, a[1]], [b[0], y1, b[1]], [a[0], y1, a[1]]);
        }
        function walls(out, loop, y0, y1) {
          for (var i = 0; i < loop.length; i++) wallStrip(out, loop[i], loop[(i + 1) % loop.length], y0, y1);
        }
        function cap(out, tris, y, up) {
          tris.forEach(function (t) {
            if (up) push(out, [t[0][0], y, t[0][1]], [t[1][0], y, t[1][1]], [t[2][0], y, t[2][1]]);
            else push(out, [t[0][0], y, t[0][1]], [t[2][0], y, t[2][1]], [t[1][0], y, t[1][1]]);
          });
        }

        // Straight extrusion of a loop (with optional holes) from y0 to y1.
        function extrude(out, outer, holes, y0, y1) {
          outer = orient(outer, true);
          holes = (holes || []).map(function (h) { return orient(h, false); });
          var tris = triangulate(outer, holes);
          cap(out, tris, y1, true);
          cap(out, tris, y0, false);
          walls(out, outer, y0, y1);
          holes.forEach(function (h) { walls(out, h, y0, y1); });
        }

        // A stack of loops with the same point count joined by wall strips (bevels, tapers, domes).
        // rings: [{ p: loop, y }], bottom to top. Holes pass straight through.
        function rings(out, rs, holes) {
          holes = (holes || []).map(function (h) { return orient(h, false); });
          var ps = rs.map(function (r) { return orient(r.p, true); });
          var y0 = rs[0].y, y1 = rs[rs.length - 1].y;
          cap(out, triangulate(ps[0], holes), y0, false);
          cap(out, triangulate(ps[ps.length - 1], holes), y1, true);
          for (var r = 0; r + 1 < rs.length; r++) {
            var A = ps[r], B = ps[r + 1], n = A.length;
            for (var i = 0; i < n; i++) {
              var j = (i + 1) % n;
              push(out, [A[i][0], rs[r].y, A[i][1]], [A[j][0], rs[r].y, A[j][1]], [B[j][0], rs[r + 1].y, B[j][1]]);
              push(out, [A[i][0], rs[r].y, A[i][1]], [B[j][0], rs[r + 1].y, B[j][1]], [B[i][0], rs[r + 1].y, B[i][1]]);
            }
          }
          holes.forEach(function (h) { walls(out, h, y0, y1); });
        }

        function box(out, x0, y0, z0, x1, y1, z1) {
          extrude(out, [[x0, z0], [x1, z0], [x1, z1], [x0, z1]], null, y0, y1);
        }

        // Revolve a profile [[r, y], ...] (bottom to top) around the Y axis. r = 0 makes a pole,
        // r > 0 at either end gets a flat cap. Optional cuts split the result into several lists.
        function lathe(out, prof, seg, cx, cz, open0, open1) {
          cx = cx || 0; cz = cz || 0;
          var m = prof.length;
          function pt(i, j) {
            var a = (j % seg) / seg * TAU;
            return [cx + prof[i][0] * Math.cos(a), prof[i][1], cz + prof[i][0] * Math.sin(a)];
          }
          var pole = function (i) { return prof[i][0] < 1e-9; };
          var c0 = [cx, prof[0][1], cz], c1 = [cx, prof[m - 1][1], cz];
          if (!pole(0) && !open0) for (var j = 0; j < seg; j++) push(out, c0, pt(0, j), pt(0, j + 1));
          if (!pole(m - 1) && !open1) for (var j2 = 0; j2 < seg; j2++) push(out, c1, pt(m - 1, j2 + 1), pt(m - 1, j2));
          for (var i = 0; i + 1 < m; i++) {
            if (pole(i) && pole(i + 1)) continue;
            for (var k = 0; k < seg; k++) {
              if (pole(i)) push(out, [cx, prof[i][1], cz], pt(i + 1, k), pt(i + 1, k + 1));
              else if (pole(i + 1)) push(out, pt(i, k), [cx, prof[i + 1][1], cz], pt(i, k + 1));
              else {
                push(out, pt(i, k), pt(i + 1, k + 1), pt(i, k + 1));
                push(out, pt(i, k), pt(i + 1, k), pt(i + 1, k + 1));
              }
            }
          }
        }

        // ---- loops
        function circle(cx, cz, r, n, ph) {
          var p = [];
          for (var i = 0; i < n; i++) { var a = (ph || 0) + i / n * TAU; p.push([cx + r * Math.cos(a), cz + r * Math.sin(a)]); }
          return p;
        }
        function ellipse(cx, cz, rx, rz, n, ph) {
          var p = [];
          for (var i = 0; i < n; i++) { var a = (ph || 0) + i / n * TAU; p.push([cx + rx * Math.cos(a), cz + rz * Math.sin(a)]); }
          return p;
        }
        function rrect(cx, cz, w, d, r, seg) {
          r = Math.max(0.01, Math.min(r, w / 2 - 0.01, d / 2 - 0.01));
          seg = seg || 6;
          var p = [];
          var cs = [[w / 2 - r, d / 2 - r, 0], [-(w / 2 - r), d / 2 - r, 90], [-(w / 2 - r), -(d / 2 - r), 180], [w / 2 - r, -(d / 2 - r), 270]];
          cs.forEach(function (c) {
            for (var i = 0; i <= seg; i++) {
              var a = (c[2] + i / seg * 90) * Math.PI / 180;
              p.push([cx + c[0] + r * Math.cos(a), cz + c[1] + r * Math.sin(a)]);
            }
          });
          return p;
        }
        function rect(cx, cz, w, d) { return [[cx - w / 2, cz - d / 2], [cx + w / 2, cz - d / 2], [cx + w / 2, cz + d / 2], [cx - w / 2, cz + d / 2]]; }
        // Thick line from a to b (2D) as a 4-point loop, ends extended by half the width.
        function strokeQuad(a, b, w, ext) {
          var dx = b[0] - a[0], dz = b[1] - a[1], l = Math.sqrt(dx * dx + dz * dz) || 1e-6;
          dx /= l; dz /= l;
          var e = ext ? w / 2 : 0, nx = -dz * w / 2, nz = dx * w / 2;
          var ax = a[0] - dx * e, az = a[1] - dz * e, bx = b[0] + dx * e, bz = b[1] + dz * e;
          return [[ax + nx, az + nz], [bx + nx, bz + nz], [bx - nx, bz - nz], [ax - nx, az - nz]];
        }
        // Convex loop moved inwards by d (negative d grows it).
        function inset(p, d) {
          var n = p.length, s = area2(p) > 0 ? 1 : -1, out = [];
          for (var i = 0; i < n; i++) {
            var a = p[(i + n - 1) % n], b = p[i], c = p[(i + 1) % n];
            var e0 = unit(b[0] - a[0], b[1] - a[1]), e1 = unit(c[0] - b[0], c[1] - b[1]);
            var n0 = [-e0[1] * s, e0[0] * s], n1 = [-e1[1] * s, e1[0] * s];
            var k = d / Math.max(0.2, 1 + n0[0] * n1[0] + n0[1] * n1[1]);
            out.push([b[0] + (n0[0] + n1[0]) * k, b[1] + (n0[1] + n1[1]) * k]);
          }
          return out;
        }
        function unit(x, z) { var l = Math.sqrt(x * x + z * z) || 1e-9; return [x / l, z / l]; }
        function inside(p, x, z) {
          var s = area2(p) > 0 ? 1 : -1;
          for (var i = 0; i < p.length; i++) {
            var a = p[i], b = p[(i + 1) % p.length];
            if (((b[0] - a[0]) * (z - a[1]) - (b[1] - a[1]) * (x - a[0])) * s < 0) return false;
          }
          return true;
        }
        function centroid(p) {
          var x = 0, z = 0;
          p.forEach(function (q) { x += q[0]; z += q[1]; });
          return [x / p.length, z / p.length];
        }
        function xf(p, fn) { return p.map(function (q) { return fn(q); }); }
        function rotate2(p, ang, cx, cz) {
          var c = Math.cos(ang), s = Math.sin(ang);
          return p.map(function (q) { var x = q[0] - (cx || 0), z = q[1] - (cz || 0); return [(cx || 0) + x * c - z * s, (cz || 0) + x * s + z * c]; });
        }

        // ---- transforms on a flat triangle array, from index `from` on
        function map(out, from, fn) {
          for (var i = from; i < out.length; i += 3) {
            var r = fn(out[i], out[i + 1], out[i + 2]);
            out[i] = r[0]; out[i + 1] = r[1]; out[i + 2] = r[2];
          }
        }
        function move(out, from, dx, dy, dz) { map(out, from, function (x, y, z) { return [x + dx, y + dy, z + dz]; }); }
        function spinY(out, from, ang) {
          var c = Math.cos(ang), s = Math.sin(ang);
          map(out, from, function (x, y, z) { return [x * c + z * s, y, -x * s + z * c]; });
        }
        // Move local (x, y, z) into the frame o + x*ex + y*ey + z*ez (ex, ey, ez right-handed).
        function place(out, from, o, ex, ey, ez) {
          map(out, from, function (x, y, z) {
            return [o[0] + ex[0] * x + ey[0] * y + ez[0] * z, o[1] + ex[1] * x + ey[1] * y + ez[1] * z, o[2] + ex[2] * x + ey[2] * y + ez[2] * z];
          });
        }
        // Stand a flat build (polygon in x/z, thickness in y) upright: (x, y, z) -> (x, -z, y), polygon z becomes -height.
        function standUp(out, from) { map(out, from, function (x, y, z) { return [x, -z, y]; }); }
        function f32(a) { return new Float32Array(a); }

        function rng(seed) {
          var s = seed >>> 0;
          return function () {
            s = (s + 0x6D2B79F5) >>> 0;
            var t = s;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        // Stroke font for digits, unit box 0..0.6 wide, 0..1 high.
        var DIGITS = {
          '0': [[[0, .15], [0, .85], [.1, 1], [.5, 1], [.6, .85], [.6, .15], [.5, 0], [.1, 0], [0, .15]]],
          '1': [[[.08, .78], [.3, 1], [.3, 0]]],
          '2': [[[0, .85], [.1, 1], [.5, 1], [.6, .85], [.6, .6], [0, 0], [.6, 0]]],
          '3': [[[0, .9], [.1, 1], [.5, 1], [.6, .9], [.6, .62], [.45, .52], [.2, .52]], [[.45, .52], [.6, .4], [.6, .1], [.5, 0], [.1, 0], [0, .1]]],
          '4': [[[.45, 0], [.45, 1], [0, .32], [.6, .32]]],
          '5': [[[.55, 1], [.05, 1], [0, .55], [.4, .6], [.55, .5], [.6, .2], [.5, 0], [.1, 0], [0, .1]]],
          '6': [[[.55, 1], [.15, .8], [0, .4], [0, .12], [.1, 0], [.5, 0], [.6, .12], [.6, .4], [.5, .52], [.1, .52], [0, .4]]],
          '7': [[[0, 1], [.6, 1], [.2, 0]]],
          '8': [[[.3, .52], [.05, .62], [.05, .9], [.15, 1], [.45, 1], [.55, .9], [.55, .62], [.3, .52], [.0, .4], [0, .1], [.1, 0], [.5, 0], [.6, .1], [.6, .4], [.3, .52]]],
          '9': [[[.05, 0], [.45, .2], [.6, .6], [.6, .88], [.5, 1], [.1, 1], [0, .88], [0, .6], [.1, .48], [.5, .48], [.6, .6]]]
        };
        // Strokes of a whole number: list of [[x0, y0], [x1, y1]] in a box of the given height, centred on 0, 0.
        function numberStrokes(text, height, underline) {
          var s = String(text), adv = 0.8, w = (s.length - 1) * adv + 0.6, segs = [];
          for (var i = 0; i < s.length; i++) {
            (DIGITS[s.charAt(i)] || []).forEach(function (pl) {
              for (var k = 0; k + 1 < pl.length; k++) {
                segs.push([[(pl[k][0] + i * adv - w / 2) * height, (pl[k][1] - 0.5) * height], [(pl[k + 1][0] + i * adv - w / 2) * height, (pl[k + 1][1] - 0.5) * height]]);
              }
            });

          if (underline) segs.push([[-w / 2 * height, -0.62 * height], [w / 2 * height, -0.62 * height]]);
          return { segs: segs, width: w * height };
        }

        return {
          TAU: TAU, area2: area2, orient: orient, push: push, extrude: extrude, rings: rings, box: box, lathe: lathe,
          circle: circle, ellipse: ellipse, rrect: rrect, rect: rect, strokeQuad: strokeQuad, inset: inset, inside: inside,
          centroid: centroid, xf: xf, rotate2: rotate2, map: map, move: move, spinY: spinY, place: place, standUp: standUp,
          f32: f32, rng: rng, numberStrokes: numberStrokes, DIGITS: DIGITS
        };
      })();

      // Extrude a polygon given in (z, y) side-view coordinates across x0..x1.
      function prismX(out, polyZY, x0, x1) {
        var from = out.length;
        K.extrude(out, polyZY, null, 0, x1 - x0);
        K.map(out, from, function (a, b, c) { return [x0 + b, c, a]; });
      }

      // -----------------------------------------------------------------------
      // Themes: decoration added around the plain tower. The dice path, baffles and tray stay the same.
      // Built before the final turn: the exit window faces -z, the tray lies at z < -D / 2.
      // -----------------------------------------------------------------------
      var THEMES = ['Classic', 'Castle', 'Pagoda', 'Tavern', 'Sci-fi'];
      // Default colours per theme: tower body, trim, accents.
      var THEME_COLORS = [
        null,
        ['#94a3b8', '#cbd5e1', '#475569'],
        ['#f87171', '#334155', '#fde047'],
        ['#f1f5f9', '#b45309', '#7c2d12'],
        ['#64748b', '#334155', '#22d3ee']
      ];

      // Outer wall faces: o on the face, n outward, u along the face (u x up = n, so placing keeps triangles outward).
      function towerFaces(W, D) {
        return {
          front: { o: [0, 0, -D / 2], n: [0, 0, -1], u: [-1, 0, 0], len: W },
          back: { o: [0, 0, D / 2], n: [0, 0, 1], u: [1, 0, 0], len: W },
          left: { o: [-W / 2, 0, 0], n: [-1, 0, 0], u: [0, 0, 1], len: D },
          right: { o: [W / 2, 0, 0], n: [1, 0, 0], u: [0, 0, -1], len: D }
        };
      }
      // A loop drawn on a face in [u, y], extruded from z0 to z1 along the face normal (z0 < 0 sinks it into the wall).
      function onFace(out, f, poly, z0, z1, holes) {
        var from = out.length, flip = function (l) { return l.map(function (q) { return [q[0], -q[1]]; }); };
        K.extrude(out, flip(poly), (holes || []).map(flip), z0, z1);
        K.standUp(out, from);
        K.place(out, from, f.o, f.u, [0, 1, 0], f.n);
      }
      // Running-bond blocks over u0..u1, y0..y1 of a face, raised by d (bricks, stones, hull panels).
      function courses(out, f, u0, u1, y0, y1, bh, bl, d, gap) {
        for (var row = 0, y = y0; y + bh * 0.6 <= y1; y += bh, row++) {
          var top = Math.min(y1, y + bh) - gap;
          for (var u = u0 - (row % 2) * bl / 2; u < u1; u += bl) {
            var a = Math.max(u0, u) + gap / 2, b = Math.min(u1, u + bl) - gap / 2;
            if (b - a > 1) onFace(out, f, [[a, y], [b, y], [b, top], [a, top]], -0.4, d);
          }
        }
      }
      // Evenly spaced blocks with equal gaps, a block at each end (battlements).
      function teeth(len, m, fn) {
        var n = Math.max(2, Math.round((len + m) / (2 * m))), w = len / (2 * n - 1);
        for (var i = 0; i < n; i++) fn(-len / 2 + 2 * i * w, -len / 2 + (2 * i + 1) * w);
      }
      // A flared skirt around the tower: 45° underside out by e, an edge, then a top that slopes back in
      // to `topW` x `topD` (the tower outline, or the dice opening for a roof). The hole runs inside the walls.
      function skirt(out, c, y, e, edge, topW, topD, rise, holeW, holeD) {
        var r = Math.min(e * 0.6, 4);
        var rs = [
          { p: K.rrect(0, 0, c.W + 0.6, c.D + 0.6, 1), y: y },
          { p: K.rrect(0, 0, c.W + 2 * e, c.D + 2 * e, r), y: y + e },
          { p: K.rrect(0, 0, c.W + 2 * e, c.D + 2 * e, r), y: y + e + edge }
        ];

        var out = [], w1 = themeRelief(c.style, c.p) + (st.raise || 1.5);

          if (c.round) onCurve(out, c, st.rel, s.outer, -0.5, w1, s.holes, 3);

      }
      // A viewport hit on the outside of the tower wall, as an angle and a height. Null anywhere else.
      function wallSpot(hit) {
        var c = lastC;
        if (!hit || !c || (hit.meshName !== 'tower' && hit.meshName !== 'trim' && hit.meshName !== 'stamp')) return null;
        if (Math.abs(hit.normal.y) > 0.7) return null;
        var x = -hit.point.x, z = lastZMid - hit.point.z;

      }

      function buildTower(p) {
        var t = p.wall, die = p.dieSize;
        var iw = die * 1.75, idp = die * 2.3;
        var round = Math.round(p.shape || 0) === 1;
        // Round: the same rectangular dice channel inside a cylinder, thinnest (the wall setting) at its corners.
        var R = Math.sqrt(iw * iw + idp * idp) / 2 + t;
        var W = round ? 2 * R : iw + 2 * t, D = round ? 2 * R : idp + 2 * t, H = p.height;
        var floorT = 3, winH = die * 1.7;

        if (round) {
          // floor, the wall beside the exit window (a C seen from above), the full ring above the window
          var N = 64, halfW = Math.asin(iw / 2 / R), cLoop = [];
          K.extrude(tower, K.circle(0, 0, R, N), null, 0, floorT);
          for (var q = 0; q <= N; q++) {
            var A = FRONT + halfW + (K.TAU - 2 * halfW) * q / N;
            cLoop.push([R * Math.cos(A), R * Math.sin(A)]);
          }
          cLoop.push([-iw / 2, idp / 2], [iw / 2, idp / 2]);
          K.extrude(tower, cLoop, null, floorT * 0.5, floorT + winH + 0.5);
          K.extrude(tower, K.circle(0, 0, R, N), [K.rect(0, 0, iw, idp)], floorT + winH, H);
        } else {
          // floor, side walls, back wall, front wall above the exit window
          K.box(tower, -W / 2, 0, -D / 2, W / 2, floorT, D / 2);
          K.box(tower, -W / 2, floorT * 0.5, -D / 2, -W / 2 + t, H, D / 2);
          K.box(tower, W / 2 - t, floorT * 0.5, -D / 2, W / 2, H, D / 2);
          K.box(tower, -W / 2 + t - 0.6, floorT * 0.5, D / 2 - t, W / 2 - t + 0.6, H, D / 2);
          K.box(tower, -W / 2 + t - 0.6, floorT + winH, -D / 2, W / 2 - t + 0.6, H, -D / 2 + t);
        }

        // baffle ramps, alternating back / front, the lowest one runs out through the window
        var tan = Math.tan(p.angle * Math.PI / 180);
        var tkv = 2.4 / Math.cos(p.angle * Math.PI / 180);
        var zBack = idp / 2, zFront = -idp / 2;
        var yA0 = floorT + 2 + idp * tan;
        var gap = die * 1.25;
        var span = H - 1.2 * die - yA0;
        var minPitch = (idp - gap) * tan + 1.3 * die;
        var n = Math.max(1, Math.min(Math.round(p.baffles), 1 + Math.floor(span / minPitch)));
        var pitch = n > 1 ? span / (n - 1) : 0;
        for (var k = 0; k < n; k++) {
          var fromBack = k % 2 === 0;
          var s = fromBack ? 1 : -1;
          var zw = fromBack ? zBack : zFront;
          var run = k === 0 ? idp : Math.max(die * 0.8, Math.min(idp - gap, (pitch - 1.3 * die) / tan));

          K.box(tray, -trayW / 2, floorT * 0.5, zt0 + rim - 0.6, -trayW / 2 + rim, floorT + p.rimH, round ? zMeet : -D / 2 - 0.5);
          K.box(tray, trayW / 2 - rim, floorT * 0.5, zt0 + rim - 0.6, trayW / 2, floorT + p.rimH, round ? zMeet : -D / 2 - 0.5);
        } else {

          var Tw = trayW / 2, path = [[Tw, rimBack]], arcN = 14, ia;
          if (shape === 1) {
            var rr = Math.min(Tw * 0.7, p.trayLen * 0.7);
            for (ia = 0; ia <= arcN; ia++) { var a1 = -ia / arcN * Math.PI / 2; path.push([Tw - rr + rr * Math.cos(a1), zt0 + rr + rr * Math.sin(a1)]); }

            var rz = Math.min(p.trayLen - 1, Tw * 1.3);
            for (ia = 0; ia <= 2 * arcN; ia++) { var a3 = -ia / (2 * arcN) * Math.PI; path.push([Tw * Math.cos(a3), zt0 + rz + rz * Math.sin(a3)]); }
          } else if (shape === 3) {
            path.push([Tw, zt0 + p.trayLen * 0.4], [Tw * 0.35, zt0], [-Tw * 0.35, zt0], [-Tw, zt0 + p.trayLen * 0.4]);

          path.push([-Tw, rimBack]);

          K.extrude(tray, path.map(function (q, i) { return i === 0 || i === path.length - 1 ? [q[0], floorBack] : q; }), null, 0, floorT);
