        '<': [[[.3, .05], [.02, .45], [.02, .8], [.15, .95], [.3, .85], [.45, .95], [.58, .8], [.58, .45], [.3, .05]]]

      // Stroke quads of a string, in local units (x along the baseline, y up), centred on the middle of the text.

      function revolveLoop(out, loop, seg) {

      function buildSpinner(p) {
        var N = Math.round(p.lobes), style = Math.round(p.style), R = p.size;
        var centre = Math.round(p.centre), ends = Math.round(p.ends), bearing = centre === 1;
        var Rb = 11 + p.bearingFit, Rl = 9, d = 1.6, c = p.gap;
        var needDeep = bearing || (ends === 1 && p.pocketDia >= 21);
        var T = needDeep ? Math.max(p.thick, 8.6) : p.thick;
        var Rh = p.hubSize;
        var Rc = bearing ? Rb + 3 : Rh + d + 3;
        var wLobe = p.lobeWidth / 200, wb = Math.min(0.88, 2 * wLobe * 0.9);
        var rw = Math.max(p.neck, Rc + 2.5);

        // outline r(theta)
