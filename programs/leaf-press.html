<body class="mm-gen">
  <script>
    (function () {
      'use strict';
      // Leaf Press Ornament: a flat leaf with raised veins, as an ornament, a coaster or a cookie stamp.
      // -----------------------------------------------------------------------
      // Geometry helpers. Y up, millimetres. Every solid is a closed shell.
      // -----------------------------------------------------------------------
      var TAU = Math.PI * 2, DEG = Math.PI / 180;
      function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
      function smoothstep(e0, e1, x) { var t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
      function tri(o, a, b, c) { o.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]); }

      function concat(list) {
        var n = 0, i, out, at = 0;
        for (i = 0; i < list.length; i++) n += list[i].length;
        out = new Float32Array(n);
        for (i = 0; i < list.length; i++) { out.set(list[i], at); at += list[i].length; }
        return out;
      }

      // Flip a closed shell inside out when its signed volume is negative.
      function orient(pos) {
        var v = 0, i, t;
        for (i = 0; i < pos.length; i += 9) {
          v += pos[i] * (pos[i + 4] * pos[i + 8] - pos[i + 5] * pos[i + 7])
             - pos[i + 1] * (pos[i + 3] * pos[i + 8] - pos[i + 5] * pos[i + 6])
             + pos[i + 2] * (pos[i + 3] * pos[i + 7] - pos[i + 4] * pos[i + 6]);
        }
        if (v < 0) {
          for (i = 0; i < pos.length; i += 9) {
            for (t = 0; t < 3; t++) { var s = pos[i + 3 + t]; pos[i + 3 + t] = pos[i + 6 + t]; pos[i + 6 + t] = s; }
          }
        }
        return pos;
      }

      // Scale, then rotate about X, Z and Y (radians), then move. o = { s, rx, ry, rz, t }.
      function xform(pos, o) {
        var s = o.s == null ? [1, 1, 1] : (typeof o.s === 'number' ? [o.s, o.s, o.s] : o.s);
        var rx = o.rx || 0, ry = o.ry || 0, rz = o.rz || 0, t = o.t || [0, 0, 0];
        var cx = Math.cos(rx), sx = Math.sin(rx), cz = Math.cos(rz), sz = Math.sin(rz), cy = Math.cos(ry), sy = Math.sin(ry);
        var out = new Float32Array(pos.length), i, x, y, z, nx, ny, nz;
        for (i = 0; i < pos.length; i += 3) {
          x = pos[i] * s[0]; y = pos[i + 1] * s[1]; z = pos[i + 2] * s[2];
          ny = y * cx - z * sx; nz = y * sx + z * cx; y = ny; z = nz;
          nx = x * cz - y * sz; ny = x * sz + y * cz; x = nx; y = ny;
          nx = x * cy + z * sy; nz = -x * sy + z * cy; x = nx; z = nz;
          out[i] = x + t[0]; out[i + 1] = y + t[1]; out[i + 2] = z + t[2];
        }
        if (s[0] * s[1] * s[2] < 0) {
          for (i = 0; i < out.length; i += 9) {
            for (var k = 0; k < 3; k++) { var q = out[i + 3 + k]; out[i + 3 + k] = out[i + 6 + k]; out[i + 6 + k] = q; }
          }
        }
        return out;
      }

      // Grid surface: prof = [[r, ...]] rings; pt(i, j, theta) -> [x,y,z]. Rings with r ~ 0 are poles.
      function surface(prof, seg, pt, wrap) {
        var R = prof.length, P = [], i, j, o = [], row;
        for (i = 0; i < R; i++) {
          row = [];
          for (j = 0; j < seg; j++) row.push(pt(i, j, (j / seg) * TAU));
          P.push(row);
        }
        var last = wrap ? R : R - 1;
        for (i = 0; i < last; i++) {
          var i2 = (i + 1) % R, d0 = !wrap && prof[i][0] < 1e-6, d1 = !wrap && prof[i2][0] < 1e-6;
          if (d0 && d1) continue;
          for (j = 0; j < seg; j++) {
            var k = (j + 1) % seg, a = P[i][j], b = P[i][k], c = P[i2][k], d = P[i2][j];
            if (d0) tri(o, a, d, c);
            else if (d1) tri(o, a, c, b);
            else { tri(o, a, d, c); tri(o, a, c, b); }
          }
        }
        return orient(new Float32Array(o));
      }

      // Solid of revolution about Y. prof = [[r, y], ...] running up the outside; post(p, r, y, theta, i) may nudge a point.
      function lathe(prof, seg, post, wrap) {
        return surface(prof, seg, function (i, j, th) {
          var r = prof[i][0], y = prof[i][1], p = [r * Math.cos(th), y, r * Math.sin(th)];
          if (post) post(p, r, y, th, i);
          return p;
        }, wrap);
      }

      // Unit-ish sphere profile (pole to pole) scaled to rx / ry.
      function ballProf(rx, ry, n) {
        var prof = [], i, a;
        for (i = 0; i <= n; i++) {
          a = -Math.PI / 2 + (Math.PI * i) / n;
          prof.push([i === 0 || i === n ? 0 : rx * Math.cos(a), ry * Math.sin(a)]);
        }
        return prof;
      }
      function ball(rx, ry, rz, seg, post) {
        var n = Math.max(8, Math.round(seg / 2));
        var pos = lathe(ballProf(1, 1, n), seg, post);
        return xform(pos, { s: [rx, ry, rz] });
      }
      // Cone/cylinder along Y from y0 (radius r0) to y1 (radius r1, 0 = point); flat caps.
      function cone(r0, r1, y0, y1, seg) {
        var prof = [[0, y0], [r0, y0]];
        if (r1 > 1e-6) { prof.push([r1, y1]); prof.push([0, y1]); } else prof.push([0, y1]);
        return lathe(prof, seg);
      }
      // Ring (torus) of centre radius R and tube radius r in the XZ plane around Y.
      function torus(R, r, seg, tube) {
        var prof = [], i, a;
        for (i = 0; i < tube; i++) { a = (i / tube) * TAU; prof.push([R + r * Math.cos(a), r * Math.sin(a)]); }
        return lathe(prof, seg, null, true);
      }

      // --- flat shapes in XZ (extruded along Y) ---
      // Star-shaped outline about its centre (ccw loop of [x, z]).
      function fanPrism(pts, y0, y1, c) {
        var o = [], n = pts.length, i, a, b, ct = c || [0, 0];
        for (i = 0; i < n; i++) {
          a = pts[i]; b = pts[(i + 1) % n];
          var at = [a[0], y1, a[1]], bt = [b[0], y1, b[1]], ab = [a[0], y0, a[1]], bb = [b[0], y0, b[1]];
          tri(o, [ct[0], y1, ct[1]], at, bt);
          tri(o, [ct[0], y0, ct[1]], bb, ab);
          tri(o, bt, at, ab); tri(o, bt, ab, bb);
        }
        return orient(new Float32Array(o));
      }
      // Ring between two loops of equal vertex count.
      function ringPrism(A, B, y0, y1) {
        var o = [], n = A.length, i, a, a2, b, b2;
        for (i = 0; i < n; i++) {
          a = A[i]; a2 = A[(i + 1) % n]; b = B[i]; b2 = B[(i + 1) % n];
          var at = [a[0], y1, a[1]], a2t = [a2[0], y1, a2[1]], bt = [b[0], y1, b[1]], b2t = [b2[0], y1, b2[1]];
          var ab = [a[0], y0, a[1]], a2b = [a2[0], y0, a2[1]], bb = [b[0], y0, b[1]], b2b = [b2[0], y0, b2[1]];
          tri(o, at, a2t, b2t); tri(o, at, b2t, bt);
          tri(o, ab, b2b, a2b); tri(o, ab, bb, b2b);
          tri(o, a2t, at, ab); tri(o, a2t, ab, a2b);
          tri(o, bt, b2t, b2b); tri(o, bt, b2b, bb);
        }
        return orient(new Float32Array(o));
      }
      // Band between two open polylines of equal length (with end caps).
      function stripPrism(A, B, y0, y1) {
        var o = [], n = A.length, i, a, a2, b, b2;
        for (i = 0; i < n - 1; i++) {
          a = A[i]; a2 = A[i + 1]; b = B[i]; b2 = B[i + 1];
          var at = [a[0], y1, a[1]], a2t = [a2[0], y1, a2[1]], bt = [b[0], y1, b[1]], b2t = [b2[0], y1, b2[1]];
          var ab = [a[0], y0, a[1]], a2b = [a2[0], y0, a2[1]], bb = [b[0], y0, b[1]], b2b = [b2[0], y0, b2[1]];
          tri(o, at, a2t, b2t); tri(o, at, b2t, bt);
          tri(o, ab, b2b, a2b); tri(o, ab, bb, b2b);
          tri(o, a2t, at, ab); tri(o, a2t, ab, a2b);
          tri(o, bt, b2t, b2b); tri(o, bt, b2b, bb);
        }
        var s0 = [A[0][0], y1, A[0][1]], s1 = [B[0][0], y1, B[0][1]], s2 = [B[0][0], y0, B[0][1]], s3 = [A[0][0], y0, A[0][1]];
        tri(o, s0, s1, s2); tri(o, s0, s2, s3);
        var e0 = [A[n - 1][0], y1, A[n - 1][1]], e1 = [B[n - 1][0], y1, B[n - 1][1]], e2 = [B[n - 1][0], y0, B[n - 1][1]], e3 = [A[n - 1][0], y0, A[n - 1][1]];
        tri(o, e1, e0, e3); tri(o, e1, e3, e2);
        return orient(new Float32Array(o));
      }
      // Rectangle stroke from (x0,z0) to (x1,z1), width w.
      function stroke(x0, z0, x1, z1, w, y0, y1) {
        var dx = x1 - x0, dz = z1 - z0, l = Math.sqrt(dx * dx + dz * dz) || 1, nx = -dz / l * w / 2, nz = dx / l * w / 2;
        var ex = dx / l * w * 0.2, ez = dz / l * w * 0.2;
        var pts = [[x0 - ex - nx, z0 - ez - nz], [x1 + ex - nx, z1 + ez - nz], [x1 + ex + nx, z1 + ez + nz], [x0 - ex + nx, z0 - ez + nz]];
        return fanPrism(pts, y0, y1, [(x0 + x1) / 2, (z0 + z1) / 2]);
      }
      function circlePts(cx, cz, r, n) {
        var pts = [], i;
        for (i = 0; i < n; i++) pts.push([cx + r * Math.cos((i / n) * TAU), cz + r * Math.sin((i / n) * TAU)]);
        return pts;
      }

      function mesh(name, list, group) {
        return list.length ? { name: name, positions: concat(list), smoothGroup: group || name } : null;
      }
      function pushMesh(out, m) { if (m) out.push(m); }

      // Param helpers: a 0..1 switch and a named-option picker, both stored as plain numbers.
      function toggle(group, key, label, off, on, value) {
        return { group: group, key: key, label: label, unit: '', min: 0, max: 1, step: 1, value: value,
          format: function (v) { return v >= 1 ? on : off; } };
      }
      function choice(group, key, label, names, value) {
        return { group: group, key: key, label: label, unit: '', min: 0, max: names.length - 1, step: 1, value: value,
          format: function (v) { return names[Math.round(v)]; } };
      }
      function presetOf(DEFAULTS, label, over) {
        var values = {};
        Object.keys(DEFAULTS).forEach(function (k) { values[k] = DEFAULTS[k]; });
        Object.keys(over).forEach(function (k) { values[k] = over[k]; });
        return { label: label, values: values };
      }

      var N_OUT = 240;
      var LEAVES = ['Maple', 'Oak', 'Birch'];
      var MODES = ['Ornament', 'Coaster', 'Cookie stamp'];

      var DEFAULTS = {
        leaf: 0, mode: 0, size: 56, thick: 3, veinW: 1.6, veinH: 1.2, pairs: 3, serr: 0.5,
        stemW: 3, loopR: 4.5, discR: 52, lip: 1
      };

      // Radial outline: rho(phi) with phi measured from the leaf tip (+z), unit size 1.
      function rho(kind, phi, serr) {
        var a = Math.abs(Math.atan2(Math.sin(phi), Math.cos(phi))), r, saw;
        if (kind === 0) {
          var lobes = [[0, 1.0, 34], [55, 0.92, 33], [112, 0.6, 32], [160, 0.34, 30]];
          r = 0.4;
          lobes.forEach(function (l) {
            var u = Math.abs(a / DEG - l[0]) / l[2];
            r = Math.max(r, l[1] * Math.max(0, 1 - Math.pow(u, 1.5)));
          });
          saw = Math.abs(((a / DEG) * 0.28) % 1 - 0.5) * 2;
          return r * (1 + serr * 0.07 * (saw - 0.5));
        }
        if (kind === 1) {
          var s = Math.sin(a), c = Math.cos(a);
          r = 1 / Math.sqrt((s / 0.55) * (s / 0.55) + (c / 1) * (c / 1));
          return r * (1 + (0.12 + 0.12 * serr) * Math.cos(10 * a) * (1 - 0.3 * Math.cos(a))) * (0.9 + 0.1 * Math.cos(a));
        }
        var s2 = Math.sin(a), c2 = Math.cos(a);
        r = 1 / Math.sqrt((s2 / 0.58) * (s2 / 0.58) + (c2 / 1) * (c2 / 1));
        r *= 1 + 0.35 * Math.pow(Math.max(0, c2), 6) - 0.12 * Math.max(0, -c2);
        saw = Math.abs(((a / DEG) * 0.4) % 1 - 0.5) * 2;
        return r * (1 + serr * 0.08 * (saw - 0.5));
      }

      function outline(kind, size, serr) {
        var pts = [], i, phi, r;
        for (i = 0; i < N_OUT; i++) {
          phi = (i / N_OUT) * TAU;
          r = rho(kind, phi, serr) * size * 0.5;
          pts.push([r * Math.sin(phi), r * Math.cos(phi)]);
        }
        return pts;
      }

      function veinLines(kind, size, pairs, serr) {
        var h = size * 0.5, lines = [], tipR = rho(kind, 0, serr) * h;
        lines.push([0, -0.18 * h, 0, tipR * 0.9]);
        function edge(angDeg, f) { // end point along a ray from the leaf centre, kept inside the outline
          var phi = angDeg * DEG, r = rho(kind, phi, serr) * h * f;
          return [r * Math.sin(phi), r * Math.cos(phi)];
        }
        if (kind === 0) {
          [52, -52, 105, -105].forEach(function (d) {
            var e = edge(d, 0.84);
            lines.push([0, 0, e[0], e[1]]);
          });
          return lines;
        }
        var k, z, d, e, dx, dz, len, ok;
        for (k = 0; k < pairs; k++) {
          z = -0.05 * h + ((k + 0.5) / Math.max(1, pairs)) * tipR * 0.62;
          [1, -1].forEach(function (sg) {
            var ang = 52 * DEG;
            dx = Math.sin(ang) * sg; dz = Math.cos(ang);
            len = h * 0.9;
            for (var t = 0; t < 50; t++) {
              var ex = dx * len, ez = z + dz * len, rr = Math.sqrt(ex * ex + ez * ez), ph = Math.atan2(ex, ez);
              if (rr <= rho(kind, ph, serr) * h * 0.82) break;
              len *= 0.95;
            }
            lines.push([0, z, dx * len, z + dz * len]);
          });
        }
        return lines;
      }

      function build(p) {
        var out = [], size = p.size, kind = Math.round(p.leaf), mode = Math.round(p.mode);
        var t = p.thick, vh = p.veinH, h = size * 0.5;
        var pts = outline(kind, size, p.serr);
        var leaf = [], veins = [], baseL = [], loop = [], stem = [], knob = [];
        var lines = veinLines(kind, size, Math.round(p.pairs), p.serr);
        var plateY0, plateY1, veinY0, veinY1;

        if (mode === 0) { // ornament: leaf flat on the bed, veins on top, loop at the stem
          plateY0 = 0; plateY1 = t; veinY0 = t - 0.4; veinY1 = t + vh;
          leaf.push(fanPrism(pts, plateY0, plateY1));
          var sEnd = -0.18 * h - h * 0.5;
          stem.push(stroke(0, -0.1 * h, 0, sEnd, p.stemW, 0, t));
          var cz = sEnd - p.loopR * 0.8;
          loop.push(ringPrism(circlePts(0, cz, p.loopR + 2.2, 36), circlePts(0, cz, p.loopR, 36), 0, t));
        } else if (mode === 1) { // coaster: round plate with a raised leaf and rim lip
          var dr = Math.max(p.discR, h * 1.3 + 4), pl = 3;
          baseL.push(fanPrism(circlePts(0, 0, dr, 120), 0, pl));
          if (p.lip >= 1) baseL.push(ringPrism(circlePts(0, 0, dr, 120), circlePts(0, 0, dr - 2.2, 120), pl - 0.4, pl + 1.2));
          plateY0 = pl - 0.4; plateY1 = pl + 1.2; veinY0 = pl + 1.0; veinY1 = pl + 1.2 + vh;
          leaf.push(fanPrism(pts, plateY0, plateY1));
          stem.push(stroke(0, -0.1 * h, 0, -0.18 * h - h * 0.5, p.stemW, plateY0, plateY1));
        } else { // cookie stamp: veins on the bed face, plate above, knob on top
          var sr = h * 1.05;
          veinY0 = 0; veinY1 = vh + 0.4;
          plateY0 = vh; plateY1 = vh + t;
          leaf.push(fanPrism(pts, plateY0, plateY1));
          var kr = Math.max(7, h * 0.35);
          knob.push(lathe([[0, plateY1 - 0.4], [kr, plateY1 - 0.4], [kr * 0.7, plateY1 + kr * 0.8], [kr * 0.85, plateY1 + kr * 1.4], [kr * 0.5, plateY1 + kr * 1.9], [0, plateY1 + kr * 2]], 48));
        }
        lines.forEach(function (l) { veins.push(stroke(l[0], l[1], l[2], l[3], p.veinW, veinY0, veinY1)); });

        pushMesh(out, mesh('leaf', leaf));
        pushMesh(out, mesh('veins', veins));
        pushMesh(out, mesh('base', baseL));
        pushMesh(out, mesh('stem', stem));
        pushMesh(out, mesh('loop', loop));
        pushMesh(out, mesh('knob', knob));
        return out;
      }

      window.MM_GENERATOR = {
        code: 'MM-019',
        category: 'FALL // LEAVES',
        title: 'Leaf Press Ornament',
        fileName: 'Leaf_Press',
        palette: [

          { name: 'Corn Gold', color: '#fde047' },
          { name: 'Moss Green', color: '#86efac' },
          { name: 'Acorn Brown', color: '#b4783c' },
          { name: 'Cream', color: '#fff4dc' },
          { name: 'Cocoa', color: '#5b3a24' },
          { name: 'Plum', color: '#9d6bd6' }
        ],
        defaultColor: '#e5503a',
        partNames: { leaf: 'Leaf', veins: 'Veins', base: 'Coaster disc', stem: 'Stem', loop: 'Hang loop', knob: 'Handle' },
        parameters: [
          choice('Leaf', 'leaf', 'Leaf type', LEAVES, DEFAULTS.leaf),
          choice('Leaf', 'mode', 'Use as', MODES, DEFAULTS.mode),
          { group: 'Leaf', key: 'size', label: 'Leaf size', unit: ' mm', min: 25, max: 90, step: 1, value: DEFAULTS.size },
          { group: 'Leaf', key: 'thick', label: 'Leaf thickness', unit: ' mm', min: 1.6, max: 6, step: 0.2, value: DEFAULTS.thick },
          { group: 'Leaf', key: 'serr', label: 'Jagged edge', unit: '', min: 0, max: 1, step: 0.05, value: DEFAULTS.serr },
          { group: 'Veins', key: 'veinW', label: 'Vein width', unit: ' mm', min: 0.8, max: 3, step: 0.1, value: DEFAULTS.veinW },
          { group: 'Veins', key: 'veinH', label: 'Vein height', unit: ' mm', min: 0.6, max: 2.5, step: 0.1, value: DEFAULTS.veinH },
          { group: 'Veins', key: 'pairs', label: 'Side veins (oak and birch)', unit: '', min: 1, max: 7, step: 1, value: DEFAULTS.pairs },
          { group: 'Ornament & coaster', key: 'stemW', label: 'Stem width', unit: ' mm', min: 2, max: 6, step: 0.2, value: DEFAULTS.stemW },
          { group: 'Ornament & coaster', key: 'loopR', label: 'Hang hole radius', unit: ' mm', min: 2, max: 8, step: 0.25, value: DEFAULTS.loopR },
          { group: 'Ornament & coaster', key: 'discR', label: 'Coaster radius', unit: ' mm', min: 35, max: 70, step: 1, value: DEFAULTS.discR },
          toggle('Ornament & coaster', 'lip', 'Coaster rim', 'Flat', 'Rim', DEFAULTS.lip)
        ],
        presets: [
          presetOf(DEFAULTS, 'Maple ornament', {}),
          presetOf(DEFAULTS, 'Oak ornament', { leaf: 1, size: 48, pairs: 4 }),
          presetOf(DEFAULTS, 'Birch ornament', { leaf: 2, size: 44, pairs: 5, serr: 0.8 }),
          presetOf(DEFAULTS, 'Maple coaster', { mode: 1, size: 60, discR: 50 }),
          presetOf(DEFAULTS, 'Oak cookie stamp', { leaf: 1, mode: 2, size: 55, veinW: 2, veinH: 1.4, pairs: 4 }),
          presetOf(DEFAULTS, 'Default leaf', {})
        ],
        build: build
      };

    })();
