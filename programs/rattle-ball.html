          append(cage, diamondBar(sub3(a, mul3(u, 0.15 + 0.011 * k)), add3(b, mul3(u, 0.25 + 0.017 * k)), rs * 1.25));
        });
        V.forEach(function (q, k) { append(cage, mv(rotY(sphere(rj, 6, 14), 0.23 + 0.11 * k), q[0], q[1], q[2])); });

        // The ball may be as large as the clearance to the struts and the face planes allow, and must be
        // larger than the biggest opening of the cage.
        var lo = D.esc * Rc - rs + 0.4, hi = Math.min(D.dEdge * Rc - rs - gap, D.face * Rc - 0.8);
        var Rb = lo + (Math.max(hi, lo) - lo) * p.ball;
        var out = [{ name: 'cage', positions: toF32(cage) }];
        var rb0 = 1.6, ball, yBallBottom;
        if (p.round >= 1) { ball = sphere(Rb, 14, 28); yBallBottom = -Rb; }
        else { var h = Rb - rb0; ball = lathe([[0, -h], [rb0, -h], [Rb, 0], [rb0, h], [0, h]], 28); yBallBottom = -h; }
        out.push({ name: 'ball', positions: toF32(ball) });

        // Raft under the resting face and a thin pin that holds the ball for printing.
        var ymin = 1e9;
        V.forEach(function (q) { ymin = Math.min(ymin, q[1]); });
        ymin -= rj;
        var rr = 0;
        V.forEach(function (q) { if (q[1] - rj < ymin + 1) rr = Math.max(rr, Math.sqrt(q[0] * q[0] + q[2] * q[2])); });
        if (p.raft >= 1) {
          out.push({ name: 'raft', positions: toF32(cylY(rr + rj + 2.5, ymin, ymin + 1.0, 48)) });
          if (p.pin >= 1) out.push({ name: 'pin', positions: toF32(cylY(0.65, ymin + 0.6, yBallBottom + 0.4, 10)) });
        }
        return out;
      }
