          { label: 'Plain spinner', values: { size: 18.5, width: 8, thick: 2.5, gap: 0.4, text: 0, textSize: 100, textDepth: 0.8, copies: 1 } },
          { label: 'Wide statement band', values: { size: 20, width: 14, thick: 3.5, gap: 0.45, text: 1, textSize: 100, textDepth: 1, copies: 1 } },
          { label: 'Small finger', values: { size: 15, width: 8, thick: 2.5, gap: 0.4, text: 0, textSize: 100, textDepth: 0.8, copies: 1 } }
        ],
        extrasTitle: 'Ring text',
        mount: function (container, api) {
          var h = function (tag, attrs, text) {
            var node = document.createElement(tag);
            Object.keys(attrs || {}).forEach(function (a) {
              if (a.indexOf('on') === 0) node.addEventListener(a.slice(2), attrs[a]);
              else node.setAttribute(a, attrs[a]);
            });
            if (text) node.textContent = text;
            return node;
          };
          container.appendChild(h('p', { class: 'mm-note' }, 'Up to 14 characters: letters, numbers and + - = * / ! ? # . < > ^ plus ♥ ★ ☺. A wider band prints bigger text.'));
          var input = h('input', { type: 'text', maxlength: '14', value: ringText, 'aria-label': 'Text on the ring' });
          input.style.cssText = 'width:100%;box-sizing:border-box;padding:.5em;font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:3px;text-transform:uppercase';
          input.addEventListener('input', function () { ringText = input.value.toUpperCase(); api.rebuild(); });
          container.appendChild(input);
        },
        build: function (p) { return buildRing(p); }
      };
    })();
  </script>
  <script src="shared/generator-core.js"></script>
</body>
</html>
