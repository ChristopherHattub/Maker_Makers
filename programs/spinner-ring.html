      // Print tab demo: pieces on the bed, the inner band is squeezed shut, lifts and drops into the spinning band, click,
      // the ring tilts toward the viewer and the spinning band is flicked. Purely visual: it moves the meshes, never
      // the exported geometry. The engine calls onStage once and onFrame every frame.
      // -----------------------------------------------------------------------
      var demo = { T: null, group: null, caption: null, live: false, start: 0, shown: '' };
      var LOOP = 12;
      function sm(x) { return x * x * (3 - 2 * x); }
      function seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }

      function demoReset() {
        if (!demo.group) return;
        demo.group.children.forEach(function (mesh) {
          mesh.matrixAutoUpdate = true;
          mesh.matrix.identity();
          mesh.matrixWorldNeedsUpdate = true;
        });
        if (demo.caption) demo.caption.hidden = true;
        demo.shown = '';
      }

      function demoApply(t) {
        var L = lastLayout, T = demo.T;
        if (!L) return;
        var lift = sm(seg(t, 1.6, 2.5)) - sm(seg(t, 4.0, 5.0));          // inner band rises, travels, drops in
        var travel = sm(seg(t, 2.5, 3.7));
        var press = (sm(seg(t, 1.6, 2.4)) - sm(seg(t, 4.8, 5.0))) * 0.05;       // inner band squeezed shut, released in the groove
        var ring = t > 5.0 ? 0.018 * Math.sin((t - 5.0) * 38) * Math.exp(-(t - 5.0) * 7) : 0;   // the click
        var tilt = sm(seg(t, 5.6, 6.6)) - sm(seg(t, 11.0, 11.8));
        var a = tilt * 1.0;
        var us = seg(t, 6.6, 11.0), spin = 3.1 * TAU * (1 - Math.pow(1 - us, 2.2));
        var yc = L.ym + L.rout * Math.sin(a) + (L.Wb / 2) * (Math.cos(a) - 1) + 0.3 * sm(clamp(a * 10, 0, 1));
        var world = new T.Matrix4().makeTranslation(L.xo, yc, 0).multiply(new T.Matrix4().makeRotationX(a));
        function place(mesh, cx, offx, offy, sx, sz, phi) {
          var m = world.clone();
          m.multiply(new T.Matrix4().makeTranslation(offx, offy, 0));
          m.multiply(new T.Matrix4().makeRotationY(phi));
          m.multiply(new T.Matrix4().makeScale(sx, 1, sz));
          m.multiply(new T.Matrix4().makeTranslation(-cx, -L.ym, 0));
          mesh.matrixAutoUpdate = false;
          mesh.matrix.copy(m);
          mesh.matrixWorldNeedsUpdate = true;
        }
        demo.group.children.forEach(function (mesh) {
          if (mesh.name === 'inner') {
            place(mesh, L.xi, (L.xi - L.xo) * (1 - travel), lift * (L.Wb + 5), 1 - press + ring, 1 - press + ring, 0);
          } else {
            place(mesh, L.xo, 0, 0, 1, 1, spin);
          }
        });
        var say = t < 1.6 ? '1  Print both bands flat on the bed. No supports.'
          : t < 5.6 ? '2  Squeeze the inner band until its slit closes, push it into the spinning band, let go. Click.'
          : '3  Flick it: the spinning band turns freely around the inner band.';
        if (say !== demo.shown && demo.caption) { demo.caption.textContent = say; demo.shown = say; }
        if (demo.caption) demo.caption.hidden = false;
      }

      function demoFrame() {
        var tab = document.getElementById('mm-tab-print');
        var on = !!tab && tab.getAttribute('aria-selected') === 'true';
        if (!on) {
          if (demo.live) { demo.live = false; demoReset(); }
          return;
        }
        if (!demo.live) { demo.live = true; demo.start = performance.now(); }
        demoApply(((performance.now() - demo.start) / 1000) % LOOP);
      }

      var PARAMS = [
        { group: 'Ring', key: 'size', label: 'Finger diameter', unit: ' mm', min: 14, max: 24, step: 0.5, value: 18.5 },
        { group: 'Ring', key: 'width', label: 'Band width', unit: ' mm', min: 8, max: 16, step: 0.5, value: 10 },
        { group: 'Ring', key: 'thick', label: 'Spinning band thickness', unit: ' mm', min: 2.75, max: 5, step: 0.25, value: 3 },
        { group: 'Spinning band', key: 'deco', label: 'Show on the band', unit: '', min: 0, max: 3, step: 1, value: 1, options: ['Plain', 'Text', 'Pattern', 'Shape'] },
        { group: 'Text', key: 'font', label: 'Font', unit: '', min: 0, max: FONT_LABELS.length - 1, step: 1, value: 1, options: FONT_LABELS, showIf: function (p) { return p.deco === 1; } },
        { group: 'Text', key: 'textSize', label: 'Text height (of band)', unit: '%', min: 60, max: 100, step: 5, value: 100, format: function (v) { return Math.round(v) + '%'; }, showIf: function (p) { return p.deco === 1; } },
        { group: 'Text', key: 'textDepth', label: 'Text height off the band', unit: ' mm', min: 0.5, max: 1.5, step: 0.1, value: 0.8, showIf: function (p) { return p.deco === 1; } },
        { group: 'Text', key: 'copies', label: 'Repeat around the ring', unit: '', min: 1, max: 4, step: 1, value: 1, showIf: function (p) { return p.deco === 1; } },
        { group: 'Band shape', key: 'shapeKind', label: 'Shape', unit: '', min: 0, max: 4, step: 1, value: 0, options: SHAPE_NAMES, showIf: function (p) { return p.deco === 3; } },
        { group: 'Band shape', key: 'shapeCount', label: 'Teeth, lobes or facets', unit: '', min: 3, max: 16, step: 1, value: 10, showIf: function (p) { return p.deco === 3 && p.shapeKind < 4; } },
        { group: 'Band shape', key: 'shapeAmp', label: 'Shape depth', unit: ' mm', min: 0.4, max: 2.5, step: 0.1, value: 1.2, showIf: function (p) { return p.deco === 3; } },
        { group: 'Band shape', key: 'shapeTwist', label: 'Twist over the band height', unit: '°', min: 0, max: 120, step: 5, value: 45, showIf: function (p) { return p.deco === 3 && p.shapeKind === 3; } },
        { group: 'Band shape', key: 'shapeRipples', label: 'Ripples up the band', unit: '', min: 2, max: 6, step: 1, value: 3, showIf: function (p) { return p.deco === 3 && p.shapeKind === 4; } },
        { group: 'Pattern', key: 'pattern', label: 'Pattern', unit: '', min: 0, max: 4, step: 1, value: 0, options: PATTERN_NAMES, showIf: function (p) { return p.deco === 2; } },
        { group: 'Pattern', key: 'patScale', label: 'Pattern size', unit: ' mm', min: 3, max: 10, step: 0.5, value: 6, showIf: function (p) { return p.deco === 2; } },
        { group: 'Pattern', key: 'patLine', label: 'Line weight', unit: ' mm', min: 0.8, max: 2.4, step: 0.1, value: 1.2, showIf: function (p) { return p.deco === 2 && p.pattern !== 2; } },
        { group: 'Pattern', key: 'patDepth', label: 'Relief height (engraved depth)', unit: ' mm', min: 0.4, max: 1, step: 0.1, value: 0.7, showIf: function (p) { return p.deco === 2; } },
        { group: 'Pattern', key: 'patRelief', label: 'Relief', unit: '', min: 0, max: 1, step: 1, value: 0, options: ['Raised', 'Engraved'], showIf: function (p) { return p.deco === 2; } },
        { group: 'Pattern', key: 'hexDot', label: 'Centre dot size', unit: '%', min: 0, max: 60, step: 5, value: 25, format: function (v) { return Math.round(v) + '%'; }, showIf: function (p) { return p.deco === 2 && p.pattern === 0; } },
        { group: 'Pattern', key: 'hexInner', label: 'Inner hexagon (0 = off)', unit: '%', min: 0, max: 80, step: 5, value: 0, format: function (v) { return v < 1 ? 'Off' : Math.round(v) + '%'; }, showIf: function (p) { return p.deco === 2 && p.pattern === 0; } },
        { group: 'Pattern', key: 'scaleRings', label: 'Rings in each scale', unit: '', min: 1, max: 4, step: 1, value: 3, showIf: function (p) { return p.deco === 2 && p.pattern === 1; } },
        { group: 'Pattern', key: 'scaleFill', label: 'Scales', unit: '', min: 0, max: 1, step: 1, value: 0, options: ['All rings', 'Alternate solid'], showIf: function (p) { return p.deco === 2 && p.pattern === 1; } },
        { group: 'Pattern', key: 'weaveGap', label: 'Gap between ribbons', unit: ' mm', min: 0.3, max: 1.5, step: 0.1, value: 0.6, showIf: function (p) { return p.deco === 2 && p.pattern === 2; } },
        { group: 'Pattern', key: 'rosePetals', label: 'Petals', unit: '', min: 4, max: 12, step: 1, value: 8, showIf: function (p) { return p.deco === 2 && p.pattern === 3; } },
        { group: 'Pattern', key: 'roseInner', label: 'Inner petals (0 = off)', unit: '%', min: 0, max: 80, step: 5, value: 50, format: function (v) { return v < 1 ? 'Off' : Math.round(v) + '%'; }, showIf: function (p) { return p.deco === 2 && p.pattern === 3; } },
        { group: 'Pattern', key: 'mazeStyle', label: 'Tile style', unit: '', min: 0, max: 2, step: 1, value: 0, options: ['Curves', 'Double curves', 'Diagonals'], showIf: function (p) { return p.deco === 2 && p.pattern === 4; } },
        { group: 'Pattern', key: 'mazeSeed', label: 'Shuffle (changes the layout)', unit: '', min: 1, max: 40, step: 1, value: 7, showIf: function (p) { return p.deco === 2 && p.pattern === 4; } }
      ];
      var DEF = {};
      PARAMS.forEach(function (q) { DEF[q.key] = q.value; });
      function preset(label, over) { return { label: label, values: Object.assign({}, DEF, over) }; }

      window.MM_GENERATOR = {
        code: 'MM-046',
        category: 'WEARABLE // FIDGETS',
        title: 'Spinner Ring',
        fileName: 'Spinner_Ring',
        palette: [
          { name: 'Bone White', color: '#f1f5f9' }, { name: 'Glow Mint', color: '#a7f3d0' },
          { name: 'Pumpkin Matte', color: '#fdba74' }, { name: 'Lavender Mist', color: '#d8b4fe' },
          { name: 'Phantom Ice', color: '#93c5fd' }, { name: 'Berry Sorbet', color: '#fda4af' },
          { name: 'Shadow Black', color: '#334155' }, { name: 'Sunny Yellow', color: '#fde047' }
        ],
        partNames: { inner: 'Inner band', outer: 'Spinning band', text: 'Text' },
        parameters: PARAMS,
        presets: [
          preset('Default ring with text', {}),
          preset('Plain spinner', { width: 8, deco: 0 }),
          preset('Wide statement band', { size: 20, width: 14, thick: 3.5, textDepth: 1 }),
          preset('Small finger', { size: 15, width: 8, deco: 0 }),
          preset('Pixel text', { font: 0 }),
          preset('Honeycomb band', { deco: 2, pattern: 0, hexInner: 55 }),
          preset('Sea waves band', { deco: 2, pattern: 1, patScale: 5, patLine: 1, scaleRings: 3 }),
          preset('Woven band', { deco: 2, pattern: 2, patScale: 5.5, weaveGap: 0.6 }),
          preset('Rosette band', { deco: 2, pattern: 3, patScale: 7, patLine: 1, rosePetals: 8, roseInner: 50, width: 11 }),
          preset('Gear band', { deco: 3, shapeKind: 0, shapeCount: 12, shapeAmp: 1.2 }),
          preset('Flower band', { deco: 3, shapeKind: 1, shapeCount: 8, shapeAmp: 1.5 }),
          preset('Gem band', { deco: 3, shapeKind: 2, shapeCount: 8, shapeAmp: 1.5 }),
          preset('Twisted band', { deco: 3, shapeKind: 3, shapeCount: 6, shapeAmp: 1.3, shapeTwist: 60 }),
          preset('Rippled band', { deco: 3, shapeKind: 4, shapeRipples: 3, shapeAmp: 1 }),
          preset('Flow maze band', { deco: 2, pattern: 4, patScale: 5, patLine: 1.1, mazeStyle: 0, mazeSeed: 7 })
        ],
        openGroups: ['Ring', 'Spinning band'],
        extrasTitle: 'Ring text',
        mount: function (container, api) {
          var h = function (tag, attrs, text) {
            var node = document.createElement(tag);
            Object.keys(attrs || {}).forEach(function (a) {
              if (a.indexOf('on') === 0) node.addEventListener(a.slice(2), attrs[a]);
              else node.setAttribute(a, attrs[a]);
            });
            if (text) node.textContent = text;
            return node;
          };
          container.appendChild(h('p', { class: 'mm-note' }, 'Up to 16 characters. Pixel dots take capitals, numbers and + - = * / ! ? # . < > ^ ♥ ★ ☺; the other fonts take letters, numbers and common symbols. The text shows when "Show on the band" is set to Text.'));
          var input = h('input', { type: 'text', maxlength: '16', value: ringText, 'aria-label': 'Text on the ring' });
          input.style.cssText = 'width:100%;box-sizing:border-box;padding:.5em;font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:3px';
          input.addEventListener('input', function () { ringText = input.value; api.rebuild(); });
          container.appendChild(input);
        },
        onStage: function (info) {
          demo.T = info.THREE;
          demo.group = info.modelGroup;
          var cap = document.createElement('div');
          cap.className = 'mm-anim-caption';
          cap.hidden = true;
          info.container.appendChild(cap);
          demo.caption = cap;
        },
        onFrame: function () { demoFrame(); },
        build: function (p) { return buildRing(p); }
      };
    })();
  </script>
  <script src="shared/export-utils.js"></script>
  <script src="shared/mesh-utils.js"></script>
  <script src="shared/generator-core.js"></script>
</body>
