        var fieldHalf = (n * w + (n + 1) * g) / 2;

        // Labels: placed past the tine tips, each one clear of every slit and of the labels already placed.
        var labelMode = Math.round(p.labels), shapes = [], placed = [], topLabel = 0, maxW = 2 * pitch - 1.2;
        if (labelMode > 0) {
          var size = p.labelSize;
          for (i = 0; i < n; i++) {
            var str = tn[i].name + (labelMode === 2 ? tn[i].oct : '');
            var sz = size, tw = textWidth(str, sz);
            if (tw > maxW) { sz = sz * maxW / tw; tw = maxW; }
            var xl = xc[i] - tw / 2, xr = xc[i] + tw / 2, near = 0, zb;
            for (j = 0; j < n; j++) {
              if (xc[j] + w / 2 + g > xl && xc[j] - w / 2 - g < xr) near = Math.max(near, L[j]);
            }
            zb = near + g + 1;
            for (k = 0; k < 8; k++) {
              var moved = false;
              placed.forEach(function (r) {
                if (xl < r.xr + 0.6 && xr > r.xl - 0.6 && zb < r.z1 + 0.8 && zb + sz > r.z0 - 0.8) { zb = r.z1 + 0.8; moved = true; }
              });
              if (!moved) break;
            }
            placed.push({ xl: xl, xr: xr, z0: zb, z1: zb + sz });
            topLabel = Math.max(topLabel, zb + sz);
            shapes = shapes.concat(textShapes(str, xc[i], -(zb + sz), sz, i + 1));
          }
        }

        // Plan outline and roof.
        var rail = Math.max(9, topLabel + 1.4 - Lmax - g);
        var zFin = -(Lmax + g + rail), zo0 = zFin - wl;
        var zrIn = Math.max(p.barD, Math.min(p.corner, 30)), zo1 = zrIn + wl;
        var hwi = fieldHalf + p.margin, hwo = hwi + wl, cz = (zo0 + zo1) / 2, hdo = (zo1 - zo0) / 2;
        var Rc = clamp(p.corner, 2, Math.min(hwo, hdo) - 1);
        var outline = clean(rrectPts(0, cz, hwo, hdo, Rc, NA));

        // ---- board: the tines and the playing face. One closed surface; the labels are shallow pits in the face. ----
        var pocket = pocketLoop(xc, L, w, g), d = Math.min(ENGRAVE, t * 0.4), bo = [];
        cap(THREE, bo, outline, [pocket], t, true);
        wall(bo, outline, 0, t, true);
        wall(bo, pocket, 0, t, false);
        cap(THREE, bo, outline, [pocket].concat(shapes.map(function (s) { return s.outer; })), 0, false);
        shapes.forEach(function (s) {
          wall(bo, s.outer, 0, d, false);
          cap(THREE, bo, s.outer, s.holes, d, false);
          s.holes.forEach(function (h) { wall(bo, h, 0, d, true); cap(THREE, bo, h, [], 0, false); });
        });
        out.push({ name: 'board', positions: new Float32Array(bo), smoothGroup: 'board' });

        // ---- roof geometry ----
        var cosf = 1 / Math.sqrt(1 + SLOPE * SLOPE), whs = wl / cosf; // horizontal wall thickness on the slope
        var hold = Math.max(p.hold, 3), y0 = t + hold;
        var dTopIn = hdo - p.hole / 2, dmax = Math.max(0.6, dTopIn - whs);
        var y1 = y0 + dmax / SLOPE, yk = y0 - (whs - wl) / SLOPE;
        var NS = clamp(Math.ceil(dmax / 1.8), 4, 24);
        function ring(dd, y) {
          return rrectPts(0, cz, hwo - dd, hdo - dd, Rc - dd, NA).map(function (q) { return [q[0], y, q[1]]; });
        }
        var rO = [ring(0, t), ring(0, y0)], rI = [ring(wl, t), ring(wl, yk)], s;
        for (s = 1; s <= NS; s++) {
          rO.push(ring(dmax * s / NS, y0 + (y1 - y0) * s / NS));
          rI.push(ring(wl + (dmax + whs - wl) * s / NS, yk + (y1 - yk) * s / NS));
        }
        var bd = [], A, B, a, b, c, e, m = rO[0].length;
        function strip(R, outward) {
          for (var r = 0; r < R.length - 1; r++) {
            for (var q = 0; q < m; q++) {
              a = R[r][q]; b = R[r][(q + 1) % m]; c = R[r + 1][(q + 1) % m]; e = R[r + 1][q];
              if (outward) { tri(bd, a, c, b); tri(bd, a, e, c); } else { tri(bd, a, b, c); tri(bd, a, c, e); }
            }
          }
        }
        strip(rO, true);
        strip(rI, false);
        A = rO[rO.length - 1]; B = rI[rI.length - 1];
        var A0 = rO[0], B0 = rI[0], q2;
        for (j = 0; j < m; j++) {
          q2 = (j + 1) % m;
          tri(bd, A[j], B[q2], A[q2]); tri(bd, A[j], B[j], B[q2]);       // the rim around the sound hole, facing up
          tri(bd, A0[j], A0[q2], B0[q2]); tri(bd, A0[j], B0[q2], B0[j]); // the foot of the wall, facing down onto the board
        }
        out.push({ name: 'body', positions: new Float32Array(bd), smoothGroup: 'body', color: '#8a5a3b' });

        // ---- root bar: a thick bridge across the rear that the tines grow out of ----
        var zb0 = 0.6, hwm = hwi + wl / 2, hdm = hdo - wl / 2, rb = Math.max(1, Rc - wl / 2);
        var mid = rrectPts(0, cz, hwm, hdm, rb, NA), barLoop = [[hwm, zb0]];
        for (i = 0; i <= 2 * NA + 1; i++) barLoop.push(mid[i]);
        barLoop.push([-hwm, zb0]);
        var barTop = t + Math.min(p.barH, hold - 1.3), br = [];
        prism(THREE, br, clean(barLoop), t - 0.8, barTop);
        out.push({ name: 'bridge', positions: new Float32Array(br), smoothGroup: 'bridge', color: '#8a5a3b' });

        out.height = y1;
        return out;
      }

      // The shown pose is the print pose turned over: playing face up, sound hole down. A half turn about X.
      function flipOver(meshes, H) {
        return meshes.map(function (m) {
          var src = m.positions, dst = new Float32Array(src.length), i;
          for (i = 0; i < src.length; i += 3) { dst[i] = src[i]; dst[i + 1] = H - src[i + 1]; dst[i + 2] = -src[i + 2]; }
          var r = { name: m.name, positions: dst, smoothGroup: m.smoothGroup };
          if (m.color) r.color = m.color;
          return r;
        });
      }

      // ---------- hear a tine ----------
      var audio = null;
      function pluck(f) {
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          if (!audio) audio = new AC();
          if (audio.state === 'suspended') audio.resume();
          var now = audio.currentTime, master = audio.createGain();
          master.gain.value = 0.3; master.connect(audio.destination);
          // A tine rings with its fundamental and, much fainter and shorter, its second bending mode at 6.27 times the pitch.
          [[1, 0.7, 1.8], [6.267, 0.12, 0.25]].forEach(function (mode) {
            if (f * mode[0] > 12000) return;
            var o = audio.createOscillator(), gn = audio.createGain();
            o.type = 'sine'; o.frequency.value = f * mode[0];
            gn.gain.setValueAtTime(0.0001, now);
            gn.gain.exponentialRampToValueAtTime(mode[1], now + 0.004);
            gn.gain.exponentialRampToValueAtTime(0.0001, now + mode[2]);
            o.connect(gn); gn.connect(master); o.start(now); o.stop(now + mode[2] + 0.05);
          });
        } catch (err) { /* no audio here: the model still works */ }
      }

      // ---------- parameters ----------
      function sh(param, fn) { param.showIf = fn; return param; }
      function slider(group, key, label, unit, min, max, step, value) {
        return { group: group, key: key, label: label, unit: unit, min: min, max: max, step: step, value: value };
      }
      function options(group, key, label, names, value) {
        return { group: group, key: key, label: label, unit: '', min: 0, max: names.length - 1, step: 1, value: value, options: names };
      }
      function presetOf(label, over) {
        var values = {};
        Object.keys(DEFAULTS).forEach(function (k) { values[k] = DEFAULTS[k]; });
        Object.keys(over).forEach(function (k) { values[k] = over[k]; });
        return { label: label, values: values };
      }

      window.MM_GENERATOR = {
        code: 'MM-120',
        category: 'MUSIC // INSTRUMENTS',
        title: 'Kalimba Maker',
        fileName: 'Kalimba',
        palette: [
          { name: 'Maple Wood', color: '#e3b978' }, { name: 'Walnut', color: '#8a5a3b' },
          { name: 'Bone White', color: '#f1f5f9' }, { name: 'Glow Mint', color: '#a7f3d0' },
          { name: 'Berry Sorbet', color: '#fda4af' }, { name: 'Phantom Ice', color: '#93c5fd' },
          { name: 'Lavender Mist', color: '#d8b4fe' }, { name: 'Shadow Black', color: '#334155' }
        ],
        partNames: { board: 'Playing board', body: 'Resonator body', bridge: 'Root bar' },
        parameters: [
          options('Notes', 'key', 'Key', NAMES, DEFAULTS.key),
          options('Notes', 'scale', 'Scale', SCALE_NAMES, DEFAULTS.scale),
          slider('Notes', 'octave', 'Lowest note octave (4 = middle C)', '', 2, 5, 1, DEFAULTS.octave),
          slider('Notes', 'tines', 'How many tines', '', 5, 21, 1, DEFAULTS.tines),
          options('Notes', 'layout', 'Order', ['Low in the middle', 'Low to high'], DEFAULTS.layout),
          options('Notes', 'labels', 'Note labels engraved on the board', ['Off', 'Note names', 'Names and octave'], DEFAULTS.labels),
          sh(slider('Notes', 'labelSize', 'Label size', ' mm', 3, 6, 0.2, DEFAULTS.labelSize), function (q) { return Math.round(q.labels) > 0; }),
          slider('Tines', 'tineW', 'Tine width', ' mm', 4, 9, 0.5, DEFAULTS.tineW),
          slider('Tines', 'gap', 'Slit between tines (under 1.2 mm may fuse at the bed)', ' mm', 0.8, 2, 0.1, DEFAULTS.gap),
          slider('Tines', 'thick', 'Tine thickness (thicker = longer tines, louder)', ' mm', 1.6, 3.6, 0.2, DEFAULTS.thick),
          slider('Tines', 'stiff', 'Material stiffness (tines print flat? lower this)', '%', 50, 150, 5, DEFAULTS.stiff),
          slider('Body', 'wall', 'Wall thickness', ' mm', 1.6, 3.2, 0.4, DEFAULTS.wall),
          slider('Body', 'hold', 'Straight wall height', ' mm', 4, 30, 1, DEFAULTS.hold),
          slider('Body', 'hole', 'Sound hole width (smaller = taller roof)', ' mm', 10, 60, 1, DEFAULTS.hole),
          slider('Body', 'corner', 'Corner roundness', ' mm', 4, 30, 1, DEFAULTS.corner),
          slider('Body', 'margin', 'Side margin', ' mm', 4, 16, 1, DEFAULTS.margin),
          slider('Body', 'barD', 'Root bar depth', ' mm', 6, 20, 1, DEFAULTS.barD),
          slider('Body', 'barH', 'Root bar height', ' mm', 2, 12, 0.5, DEFAULTS.barH)
        ],
        presets: [
          presetOf('Default 17-key C kalimba', {}),
          presetOf('Pocket 8-key (C pentatonic)', { scale: 2, tines: 8, tineW: 7, margin: 8, hole: 22, labels: 2 }),
          presetOf('Lullaby 10-key (A minor pentatonic)', { key: 9, scale: 3, tines: 10, tineW: 6.5, octave: 4, labels: 1 }),
          presetOf('Deep 15-key (C3 bass)', { octave: 3, tines: 15, thick: 3, tineW: 6.5, gap: 1.4, barD: 11, barH: 6 }),
          presetOf('Chromatic 13-key', { scale: 4, tines: 13, layout: 1, labels: 2 }),
          presetOf('Stiff PETG 17-key', { stiff: 70, thick: 2.6 })
        ],
        mount: function (container) {
          var note = document.createElement('p');
          note.className = 'mm-note';
          note.textContent = 'Click the board in the 3D view to hear a tine. The lengths are worked out from the beam formula for PLA, so print the longest tine, tap it against a tuner app and, if it is flat or sharp, move the stiffness slider (about 12 percent per semitone). Tines are cut free of the board, so nothing needs gluing.';
          container.appendChild(note);
        },
        onPick: function (hit) {
          if (!hit || !lastTuning || hit.meshName !== 'board') return;
          var n = lastTuning.length, i = Math.round(hit.point.x / lastPitch + (n - 1) / 2);
          if (i < 0 || i >= n) return;
          pluck(lastTuning[i].f);
        },
        build: function (p, api) {
          var meshes = model(p, api);
          return flipOver(meshes, meshes.height);
        },
        printMeshes: function (p, api) {
          return model(p, api);
        }
      };
    })();
  </script>
  <script src="shared/export-utils.js"></script>
  <script src="shared/mesh-utils.js"></script>
  <script src="shared/sculpt.js"></script>
  <script src="shared/generator-core.js"></script>
</body>
</html>
