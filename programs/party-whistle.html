        });

      }


      var DEFAULTS = {

      // Prism of a convex 2D polygon in the XY plane, extruded along Z.
      function prismZ(poly, z0, z1) {
        var o = [], n = poly.length, i, a, b, c = cent(poly);
        for (i = 0; i < n; i++) {
          a = poly[i]; b = poly[(i + 1) % n];
          tri(o, [c[0], c[1], z1], [a[0], a[1], z1], [b[0], b[1], z1]);
          tri(o, [c[0], c[1], z0], [b[0], b[1], z0], [a[0], a[1], z0]);
          tri(o, [a[0], a[1], z0], [b[0], b[1], z0], [b[0], b[1], z1]);
          tri(o, [a[0], a[1], z0], [b[0], b[1], z1], [a[0], a[1], z1]);

      }
