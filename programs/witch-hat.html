<html lang="en">
<head>

  <link rel="stylesheet" href="shared/generator.css">

<body class="mm-gen">
  <script>
    // Witch's Hat: parameters, presets, palette and geometry. The page layout, the viewport,
    // the Color tool and the exports come from shared/generator-core.js.
    (function () {
      'use strict';

      var SEG = 144;       // Segments around the hat
      var BU = 10;         // Rings on the underside of the brim
      var BT = 10;         // Rings on the top of the brim
      var EDGE_PSI = [-72, -36, 0, 36, 72]; // Rounded brim edge (degrees)
      var N_LOWER = 22, N_HOLD = 5, N_UPPER = 44, N_INNER = 36;
      var BAND_EDGE_MM = 1.0;
      var TABLE_N = 240;

      function smootherstep(x) {
        var t = Math.max(0, Math.min(1, x));
        return t * t * t * (t * (t * 6 - 15) + 10);
      }
      function smoothstep(e0, e1, x) {
        var t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
        return t * t * (3 - 2 * t);
      }

      // Everything a build needs, derived from the sliders.
      function setup(p) {
        var g = {};
        g.L = p.coneHeight;
        g.rBase = p.coneBase;
        g.p = p.coneCurve;
        g.rTip = p.tipRadius;
        g.wrAmp = p.wrinkleAmp;
        g.wrN = Math.round(p.wrinkleCount);
        g.squash = p.squash / 100;
        g.hollow = p.hollow >= 1;
        g.wall = Math.max(1.6, Math.min(p.wall, g.rBase * 0.4));
        g.tTop = g.hollow ? g.wall : p.brimThickness;
        g.Rb = Math.max(p.brimRadius, g.rBase + 8);
        g.curl = p.brimCurl;
        g.wave = p.brimWave;
        g.waveN = Math.round(p.brimWaveCount);
        g.tiltB = Math.tan((p.brimTilt * Math.PI) / 180);
        g.hE = g.hollow ? Math.min(1.2, g.wall / 2) : 0.8;
        g.re = g.Rb - g.hE;
        // Band: sA..sB along the cone (0 = brim, 1 = tip)
        var bh = p.bandHeight < 1 ? 0 : Math.max(p.bandHeight, 3.2);
        g.bandOn = bh > 0 && p.bandThickness > 0.05;
        g.bandT = g.bandOn ? p.bandThickness : 0;
        g.sA = Math.max(0.03, Math.min(0.85, p.bandPos / g.L));
        g.sB = Math.min(0.94, g.sA + (bh || 4) / g.L);
        g.eS = BAND_EDGE_MM / g.L;
        if (g.sB - g.sA < 2.2 * g.eS) g.sB = g.sA + 2.2 * g.eS;
        // Centre line of the cone: lean plus an increasing tip flop.
        var tilt = (p.coneTilt * Math.PI) / 180, bend = (p.tipFlop * Math.PI) / 180;
        var dirA = (p.leanDirection * Math.PI) / 180;
        g.dx = Math.cos(dirA); g.dz = Math.sin(dirA);
        g.tab = new Float32Array((TABLE_N + 1) * 4);
        var cx = 0, cy = g.tTop, cz = 0, dL = g.L / TABLE_N;
        for (var i = 0; i <= TABLE_N; i++) {
          var s = i / TABLE_N, a = tilt * s + bend * s * s;
          if (i > 0) {
            var sm = (i - 0.5) / TABLE_N, am = tilt * sm + bend * sm * sm;
            cx += dL * Math.sin(am) * g.dx; cy += dL * Math.cos(am); cz += dL * Math.sin(am) * g.dz;
          }
          g.tab[i * 4] = cx; g.tab[i * 4 + 1] = cy; g.tab[i * 4 + 2] = cz; g.tab[i * 4 + 3] = a;
        }
        return g;
      }

      function frame(g, s) {
        var f = Math.max(0, Math.min(1, s)) * TABLE_N;
        var i = Math.min(TABLE_N - 1, Math.floor(f)), t = f - i, T = g.tab;
        function l(k) { return T[i * 4 + k] + (T[(i + 1) * 4 + k] - T[i * 4 + k]) * t; }
        return { x: l(0), y: l(1), z: l(2), a: l(3) };
      }

      function bulge(g, s) {
        if (!g.bandOn) return 0;
        var up = smootherstep((s - g.sA) / g.eS);
        var down = 1 - smootherstep((s - (g.sB - g.eS)) / g.eS);
        return g.bandT * Math.min(up, down);
      }
      // Smooth cone radius: straight (1), round (<1) or swoopy (>1), with the band bulge.
      function coneR(g, s) {
        return g.rTip + (g.rBase - g.rTip) * Math.pow(Math.max(1 - s, 0), g.p) + bulge(g, s);
      }
      function offsetAt(g, s) {
        var h = 0.004;
        var slope = (coneR(g, Math.min(1, s + h)) - coneR(g, Math.max(0, s - h))) / (Math.min(1, s + h) - Math.max(0, s - h)) / g.L;
        return Math.min(g.wall * 3, g.wall * Math.sqrt(1 + slope * slope));
      }
      function wrinkle(g, s, theta) {
        return g.wrAmp * Math.cos(g.wrN * theta) * Math.sin(Math.PI * s);
      }

      // Point on the cone (or its inner shell) at height fraction s and angle theta.
      function conePoint(g, s, theta, inner, out) {
        var f = frame(g, s), a = f.a;
        var r = coneR(g, s) + wrinkle(g, s, theta);
        var y = f.y;
        if (inner) { r = Math.max(0.4, r - offsetAt(g, s)); y -= g.wall; }
        var sq = g.squash * smoothstep(0, 0.35, s);
        var sn = Math.sin(theta) * r * (1 + sq), cs = Math.cos(theta) * r * (1 - sq);
        var e1x = Math.cos(a) * g.dx, e1y = -Math.sin(a), e1z = Math.cos(a) * g.dz;
        out[0] = f.x + sn * e1x - cs * g.dz;
        out[1] = y + sn * e1y;
        out[2] = f.z + sn * e1z + cs * g.dx;
      }

      // Brim height offset (both faces move together) at radius r and angle theta.
      function delta(g, r, theta) {
        var d = Math.max(0, r - g.rBase);
        var u = Math.min(1, d / (g.Rb - g.rBase));
        return (g.curl + g.wave * Math.cos(g.waveN * theta)) * u * u + g.tiltB * d * Math.cos(theta);
      }
      function yBottom(g, r, theta) { return g.hollow ? delta(g, r, theta) : 0; }
      function yTop(g, r, theta) {
        return g.hollow ? g.wall + delta(g, r, theta) : Math.max(1.6, g.tTop + delta(g, r, theta));
      }

      // Ring descriptors from bottom to top. label -> paintable part.
      function buildRings(g) {
        var rings = [];
        var i;
        var sEnd = 0.3;
        if (g.hollow) {
          for (i = 0; i <= 400; i++) {
            var s0 = 1 - i / 400;
            if (coneR(g, s0) - offsetAt(g, s0) >= 0.9) { sEnd = s0; break; }
          }
          for (i = 0; i < N_INNER; i++) rings.push({ k: 'in', s: sEnd * (1 - i / (N_INNER - 1)), label: 'inside' });
          var rin = coneR(g, 0) - offsetAt(g, 0);
          for (i = 0; i < BU; i++) rings.push({ k: 'under', r: rin + (g.re - rin) * (i + 1) / BU, label: 'brim' });
        } else {
          for (i = 0; i < BU; i++) rings.push({ k: 'under', r: g.re * (i + 1) / (BU + 1), label: 'brim' });
          rings.push({ k: 'under', r: g.re, label: 'brim' });
        }
        EDGE_PSI.forEach(function (psi) { rings.push({ k: 'edge', psi: (psi * Math.PI) / 180, label: 'brim' }); });
        for (i = 0; i < BT; i++) rings.push({ k: 'top', r: g.re - (g.re - g.rBase) * i / BT, label: 'brim' });
        var bandLabel = g.bandOn ? 'band' : 'cone';
        for (i = 0; i <= N_LOWER; i++) rings.push({ k: 'cone', s: g.sA * i / N_LOWER, label: i === N_LOWER ? bandLabel : 'cone' });
        for (i = 1; i <= 3; i++) rings.push({ k: 'cone', s: g.sA + g.eS * i / 3, label: bandLabel });
        var w = g.sB - g.sA - 2 * g.eS;
        for (i = 1; i <= N_HOLD; i++) rings.push({ k: 'cone', s: g.sA + g.eS + w * i / (N_HOLD + 1), label: bandLabel });
        for (i = 1; i <= 3; i++) rings.push({ k: 'cone', s: g.sB - g.eS + g.eS * i / 3, label: i === 3 ? bandLabel : bandLabel });
        for (i = 1; i <= N_UPPER; i++) rings.push({ k: 'cone', s: g.sB + (1 - g.sB) * i / N_UPPER, label: 'cone' });
        rings.push({ k: 'cap', phi: Math.PI / 6, label: 'cone' });
        rings.push({ k: 'cap', phi: Math.PI / 3, label: 'cone' });
        return { rings: rings, sEnd: sEnd };
      }

      var tmp = [0, 0, 0];
      function ringPoint(g, ring, theta, out) {
        var r, yb, yt, t;
        switch (ring.k) {
          case 'under':
            out[0] = ring.r * Math.sin(theta); out[1] = yBottom(g, ring.r, theta); out[2] = ring.r * Math.cos(theta);
            break;
          case 'edge':
            yb = yBottom(g, g.re, theta); yt = yTop(g, g.re, theta);
            r = g.re + g.hE * Math.cos(ring.psi);
            out[0] = r * Math.sin(theta); out[1] = yb + (yt - yb) * (1 + Math.sin(ring.psi)) / 2; out[2] = r * Math.cos(theta);
            break;
          case 'top':
            out[0] = ring.r * Math.sin(theta); out[1] = yTop(g, ring.r, theta); out[2] = ring.r * Math.cos(theta);
            break;
          case 'cap':
            conePoint(g, 1, theta, false, tmp);
            var f = frame(g, 1), a = f.a, rr = g.rTip * Math.cos(ring.phi), up = g.rTip * Math.sin(ring.phi);
            var c = frame(g, 1);
            var sn = Math.sin(theta) * rr, cs = Math.cos(theta) * rr;
            out[0] = c.x + sn * Math.cos(a) * g.dx - cs * g.dz + up * Math.sin(a) * g.dx;
            out[1] = c.y - sn * Math.sin(a) + up * Math.cos(a);
            out[2] = c.z + sn * Math.cos(a) * g.dz + cs * g.dx + up * Math.sin(a) * g.dz;
            break;
          case 'in':
            conePoint(g, ring.s, theta, true, out);
            break;
          default:
            conePoint(g, ring.s, theta, false, out);
        }
      }

      function buildHat(p) {
        var g = setup(p);
        var built = buildRings(g);
        var rings = built.rings, R = rings.length;
        var pos = new Float32Array((2 + R * SEG) * 3);
        var pt = [0, 0, 0], j, i;
        for (i = 0; i < R; i++) {
          for (j = 0; j < SEG; j++) {
            ringPoint(g, rings[i], (j / SEG) * Math.PI * 2, pt);
            var v = 1 + i * SEG + j;
            pos[v * 3] = pt[0]; pos[v * 3 + 1] = pt[1]; pos[v * 3 + 2] = pt[2];
          }
        }
        var top = 1 + R * SEG;
        var f1 = frame(g, 1), a1 = f1.a, tipUp = g.rTip;
        pos[top * 3] = f1.x + tipUp * Math.sin(a1) * g.dx;
        pos[top * 3 + 1] = f1.y + tipUp * Math.cos(a1);
        pos[top * 3 + 2] = f1.z + tipUp * Math.sin(a1) * g.dz;
        if (g.hollow) {
          var fe = frame(g, built.sEnd);
          pos[0] = fe.x + 0.8 * Math.sin(fe.a) * g.dx;
          pos[1] = fe.y - g.wall + 0.8 * Math.cos(fe.a);
          pos[2] = fe.z + 0.8 * Math.sin(fe.a) * g.dz;
        }
        // Triangles per paintable part.
        var tris = { brim: [], cone: [], band: [], inside: [] };
        function strip(la, lb, fallback) {
          if (la === lb) return la;
          if (la === 'cone' || lb === 'cone') return 'cone';
          return fallback;
        }
        var k, nk, a, b, c, d, L;
        L = rings[0].label;
        for (j = 0; j < SEG; j++) tris[L].push(0, 1 + (j + 1) % SEG, 1 + j);
        for (i = 0; i < R - 1; i++) {
          L = strip(rings[i].label, rings[i + 1].label, rings[i].label);
          for (k = 0; k < SEG; k++) {
            nk = (k + 1) % SEG;
            a = 1 + i * SEG + k; b = 1 + i * SEG + nk; c = 1 + (i + 1) * SEG + nk; d = 1 + (i + 1) * SEG + k;
            tris[L].push(a, b, c, a, c, d);
          }
        }
        L = rings[R - 1].label;
        for (j = 0; j < SEG; j++) tris[L].push(1 + (R - 1) * SEG + j, 1 + (R - 1) * SEG + (j + 1) % SEG, top);
        return { pos: pos, tris: tris };
      }

      function expand(pos, idx, name) {
        var out = new Float32Array(idx.length * 3);
        for (var i = 0; i < idx.length; i++) {
          out[i * 3] = pos[idx[i] * 3]; out[i * 3 + 1] = pos[idx[i] * 3 + 1]; out[i * 3 + 2] = pos[idx[i] * 3 + 2];
        }
        return { name: name, positions: out, smoothGroup: 'hat' };
      }

      var DEFAULTS = {
        coneHeight: 80, coneBase: 24, coneCurve: 1.3, tipRadius: 1.6, squash: 0, wrinkleAmp: 0.6, wrinkleCount: 7,
        coneTilt: 8, tipFlop: 40, leanDirection: 0, brimTilt: 0,
        brimRadius: 52, brimThickness: 3, brimCurl: 3, brimWave: 0, brimWaveCount: 5,
        bandHeight: 8, bandPos: 6, bandThickness: 1.6,
        hollow: 0, wall: 2.4
      };

      function preset(label, over) {
        var values = {};
        Object.keys(DEFAULTS).forEach(function (k) { values[k] = DEFAULTS[k]; });
        Object.keys(over).forEach(function (k) { values[k] = over[k]; });
        return { label: label, values: values };
      }

      function signed(v) { return (v > 0 ? '+' : '') + v; }

      window.MM_GENERATOR = {
        code: 'MM-005',
        category: 'SPOOKY // HEADWEAR',
        title: 'Witch\'s Hat',
        fileName: 'Witch_Hat',
        palette: [
          { name: 'Shadow Black', color: '#334155' },
          { name: 'Lavender Mist', color: '#d8b4fe' },
          { name: 'Pumpkin Matte', color: '#fdba74' },
          { name: 'Vine Green', color: '#86efac' },
          { name: 'Bone White', color: '#f1f5f9' },
          { name: 'Berry Sorbet', color: '#fda4af' },
          { name: 'Phantom Ice', color: '#93c5fd' },
          { name: 'Sunny Yellow', color: '#fde047' }
        ],
        defaultColor: '#334155',
        partNames: { brim: 'Brim', cone: 'Cone', band: 'Hat band', inside: 'Inside' },
        printSettings: {
          material: 'PLA',
          nozzle: 0.4,
          layerHeight: 0.2,
          infill: 10,
          walls: 3,
          topLayers: 5,
          bottomLayers: 4,
          supports: false,
          brim: 0,
          notes: 'Prints upright on its flat brim. Strong tip flop leans over 50 degrees may need supports; the hollow (open-bottom) option needs supports under the cone unless printed upside down.'
        },

        parameters: [
          { group: 'Cone & point', key: 'coneHeight', label: 'Cone height', unit: ' mm', min: 30, max: 130, step: 1, value: DEFAULTS.coneHeight },
          { group: 'Cone & point', key: 'coneBase', label: 'Cone width at base', unit: ' mm', min: 14, max: 45, step: 1, value: DEFAULTS.coneBase },
          { group: 'Cone & point', key: 'coneCurve', label: 'Cone profile (round ↔ swoopy)', unit: '', min: 0.6, max: 2.2, step: 0.05, value: DEFAULTS.coneCurve },
          { group: 'Cone & point', key: 'tipRadius', label: 'Tip roundness (pointy ↔ blunt)', unit: ' mm', min: 1, max: 6, step: 0.1, value: DEFAULTS.tipRadius },
          { group: 'Cone & point', key: 'squash', label: 'Oval cone (round ↔ squashed)', unit: '%', min: 0, max: 30, step: 1, value: DEFAULTS.squash },
          { group: 'Cone & point', key: 'wrinkleAmp', label: 'Crinkles (depth)', unit: ' mm', min: 0, max: 2.5, step: 0.1, value: DEFAULTS.wrinkleAmp },
          { group: 'Cone & point', key: 'wrinkleCount', label: 'Crinkle count', unit: '', min: 3, max: 14, step: 1, value: DEFAULTS.wrinkleCount },
          { group: 'Tilt & flop', key: 'coneTilt', label: 'Cone lean', unit: '°', min: -30, max: 40, step: 1, value: DEFAULTS.coneTilt, format: signed },
          { group: 'Tilt & flop', key: 'tipFlop', label: 'Tip flop (floppy point)', unit: '°', min: -20, max: 100, step: 1, value: DEFAULTS.tipFlop, format: signed },
          { group: 'Tilt & flop', key: 'leanDirection', label: 'Lean direction', unit: '°', min: 0, max: 355, step: 5, value: DEFAULTS.leanDirection },
          { group: 'Tilt & flop', key: 'brimTilt', label: 'Brim tilt (front ↔ back)', unit: '°', min: -20, max: 20, step: 1, value: DEFAULTS.brimTilt, format: signed },
          { group: 'Brim', key: 'brimRadius', label: 'Brim radius', unit: ' mm', min: 30, max: 90, step: 1, value: DEFAULTS.brimRadius },
          { group: 'Brim', key: 'brimThickness', label: 'Brim thickness', unit: ' mm', min: 1.6, max: 8, step: 0.2, value: DEFAULTS.brimThickness },
          { group: 'Brim', key: 'brimCurl', label: 'Brim curl (down ↔ up)', unit: ' mm', min: -10, max: 20, step: 0.5, value: DEFAULTS.brimCurl, format: signed },
          { group: 'Brim', key: 'brimWave', label: 'Brim waves (depth)', unit: ' mm', min: 0, max: 8, step: 0.5, value: DEFAULTS.brimWave },
          { group: 'Brim', key: 'brimWaveCount', label: 'Brim wave count', unit: '', min: 2, max: 10, step: 1, value: DEFAULTS.brimWaveCount },
          { group: 'Hat band', key: 'bandHeight', label: 'Band height (0 = no band)', unit: ' mm', min: 0, max: 24, step: 1, value: DEFAULTS.bandHeight,
            format: function (v) { return v < 1 ? 'None' : v + ' mm'; } },
          { group: 'Hat band', key: 'bandPos', label: 'Band position (up from brim)', unit: ' mm', min: 2, max: 50, step: 1, value: DEFAULTS.bandPos },
          { group: 'Hat band', key: 'bandThickness', label: 'Band thickness (raised)', unit: ' mm', min: 0, max: 4, step: 0.2, value: DEFAULTS.bandThickness },
          { group: 'Bottom', key: 'hollow', label: 'Underside (flat solid ↔ hollow)', unit: '', min: 0, max: 1, step: 1, value: DEFAULTS.hollow,
            format: function (v) { return v >= 1 ? 'Hollow, open' : 'Flat, solid'; } },
          { group: 'Bottom', key: 'wall', label: 'Hollow wall thickness', unit: ' mm', min: 1.6, max: 5, step: 0.2, value: DEFAULTS.wall }
        ],

        presets: [
          preset('Classic witch', {}),
          preset('Tall & swoopy', { coneHeight: 115, coneBase: 20, coneCurve: 1.8, tipRadius: 1.2, coneTilt: 4, tipFlop: 55, brimRadius: 48 }),
          preset('Floppy tip', { coneHeight: 90, coneCurve: 1.15, coneTilt: 14, tipFlop: 90, tipRadius: 2.5, wrinkleAmp: 1 }),
          preset('Wide brim', { brimRadius: 78, brimThickness: 3.4, brimCurl: -4, coneHeight: 65, coneBase: 26, coneTilt: 0, tipFlop: 15 }),
          preset('Wavy brim', { brimWave: 5, brimWaveCount: 6, brimCurl: 6, brimRadius: 60, brimTilt: 6 }),
          preset('Round & friendly', { coneHeight: 55, coneBase: 28, coneCurve: 0.8, tipRadius: 5, coneTilt: 0, tipFlop: 20, wrinkleAmp: 0, bandHeight: 10 }),
          preset('Hollow lightweight', { hollow: 1, wall: 2 }),
          preset('Default witch hat', {})
        ],

        build: function (p) {
          var hat = buildHat(p);
          var meshes = [];
          ['brim', 'cone', 'band', 'inside'].forEach(function (name) {
            if (hat.tris[name].length) meshes.push(expand(hat.pos, hat.tris[name], name));
          });
          return meshes;
        }
      };
    })();
  </script>
