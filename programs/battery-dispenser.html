          trim.push(yPrism(roundRect(-nl / 2, nl / 2, -nw / 2, nw / 2, nw / 2 - 0.05, 8), H - 0.9, H + p.nub));
        }
        lastH = H;
        var meshes = [{ name: 'body', positions: body, smoothGroup: 'body' }];
        if (wraps.length) meshes.push({ name: 'sleeve', positions: concat(wraps), smoothGroup: 'sleeve' });
        if (trim.length) meshes.push({ name: 'terminal', positions: concat(trim), smoothGroup: 'terminal' });
        if (labels.length) meshes.push({ name: 'label', positions: concat(labels), smoothGroup: 'label' });
        return meshes;
      }

      var DEFAULTS = { shape: 0, labels: 1, sleeve: 1, stack: 8, clear: 0.5, lip: 3.5, shelf: 9, floor: 2.4, wall: 5, divider: 8, corner: 5, band: 1, nub: 3 };
      function presetOf(label, over) {
        var values = {}, k;
        for (k in DEFAULTS) values[k] = DEFAULTS[k];
        for (k in over) values[k] = over[k];
        return { label: label, values: values };
      }

      window.MM_GENERATOR = {
        code: 'MM-111',
        category: 'HOME // ORGANISERS',
        title: 'Battery Dispenser',
        fileName: 'Battery_Dispenser',
        palette: [
          { name: 'Volt Green', color: '#86efac' }, { name: 'Bone White', color: '#f1f5f9' },
          { name: 'Copper Top', color: '#fdba74' }, { name: 'Phantom Ice', color: '#93c5fd' },
          { name: 'Lavender Mist', color: '#d8b4fe' }, { name: 'Sunny Yellow', color: '#fde047' },
          { name: 'Berry Sorbet', color: '#fda4af' }, { name: 'Shadow Black', color: '#334155' }
        ],
        // Tap a part on the Parametric tab to highlight and move it; its own settings (the `part` tags below) open over the 3D view.
        partEdit: true,
        partNames: { body: 'Battery body', sleeve: 'Sleeve', terminal: 'Terminal nub', label: 'Labels' },
        sculptLink: function (name, lo, hi, ctx) {
          if (name === 'body') return { key: 'body', label: 'Battery body' };
          if (name === 'terminal') return { key: 'terminal', label: 'Terminal nub' };
          if (name === 'sleeve') return lo[1] > lastH - 12.3 ? { key: 'band', label: 'Top band' } : { key: 'sleeve', label: 'Sleeve' };
          if (name === 'label') return (lo[2] + hi[2]) / 2 > (ctx.lo[2] + ctx.hi[2]) / 2 ? { key: 'lab1', label: 'AA label' } : { key: 'lab2', label: 'AAA label' };
          return null;
        },
        parameters: [
          { group: 'Capacity', key: 'stack', part: 'Battery body', label: 'Batteries per stack (AA, AAA fit more)', unit: '', min: 4, max: 14, step: 1, value: DEFAULTS.stack },
          { group: 'Fit', key: 'clear', part: 'Battery body', label: 'Battery clearance (snug ↔ roomy)', unit: ' mm', min: 0.3, max: 0.7, step: 0.05, value: DEFAULTS.clear },
          { group: 'Fit', key: 'lip', part: 'Battery body', label: 'Lip height (holds the battery in)', unit: ' mm', min: 3.0, max: 4.5, step: 0.1, value: DEFAULTS.lip },
          { group: 'Fit', key: 'shelf', part: 'Battery body', label: 'Pull-out shelf depth', unit: ' mm', min: 5, max: 16, step: 0.5, value: DEFAULTS.shelf },
          { group: 'Body', key: 'shape', part: 'Battery body', label: 'Body shape', unit: '', min: 0, max: 1, step: 1, value: DEFAULTS.shape, options: ['Block', 'Round'] },
          { group: 'Body', key: 'wall', part: 'Battery body', label: 'Side wall', unit: ' mm', min: 3, max: 12, step: 0.5, value: DEFAULTS.wall },
          { group: 'Body', key: 'divider', part: 'Battery body', label: 'Divider between slots', unit: ' mm', min: 6, max: 16, step: 0.5, value: DEFAULTS.divider },
          { group: 'Body', key: 'floor', part: 'Battery body', label: 'Floor thickness', unit: ' mm', min: 1.6, max: 5, step: 0.2, value: DEFAULTS.floor },
          { group: 'Body', key: 'corner', part: 'Battery body', label: 'Corner rounding (max = side wall)', unit: ' mm', min: 0.5, max: 12, step: 0.5, value: DEFAULTS.corner, showIf: function (p) { return p.shape === 0; } },
          { group: 'Look', key: 'sleeve', part: 'Sleeve', label: 'Battery sleeve (raised wrap)', unit: '', min: 0, max: 1, step: 1, value: DEFAULTS.sleeve, options: ['Off', 'On'] },
          { group: 'Look', key: 'labels', part: ['AA label', 'AAA label'], label: 'Top labels (AA / AAA letters)', unit: '', min: 0, max: 1, step: 1, value: DEFAULTS.labels, options: ['Off', 'On'] },
          { group: 'Look', key: 'band', part: 'Top band', label: 'Top sleeve band', unit: ' mm', min: 0, max: 2, step: 0.25, value: DEFAULTS.band },
          { group: 'Look', key: 'nub', part: 'Terminal nub', label: 'Terminal nub height', unit: ' mm', min: 0, max: 6, step: 0.5, value: DEFAULTS.nub }
        ],
        presets: [
          presetOf('Default dispenser', {}),
          presetOf('Desk top-up (4 stack)', { stack: 4 }),
          presetOf('Drawer tower (12 stack)', { stack: 12 }),
          presetOf('Snug fit', { clear: 0.3, lip: 3.2 }),
          presetOf('Roomy fit', { clear: 0.7, lip: 3.8 }),
          presetOf('Round cell', { shape: 1, wall: 4, band: 1.5, nub: 4 }),
          presetOf('Plain (no labels or sleeve)', { labels: 0, sleeve: 0 }),
          presetOf('Chunky battery', { wall: 8, divider: 12, corner: 8, band: 1.5, nub: 4 })
        ],
        build: function (params) { return buildBody(params); },
        info: { layout: layout, dispenseCheck: dispenseCheck }
      };
    })();
  </script>
  <script src="shared/export-utils.js"></script>

</body>
