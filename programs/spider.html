<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MM-003 Spider // Maker Makers</title>
  <link rel="stylesheet" href="shared/generator.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body class="mm-gen">
  <script>
    // Spider: head, abdomen, eyes, bent legs and embossed stamps. The page layout, the viewport,
    // the Color tool and the exports come from shared/generator-core.js.
    (function () {
      'use strict';

      // -----------------------------------------------------------------------
      // Topology: closed manifold lathe surface (pole -> rings -> pole). Built once per size.
      // -----------------------------------------------------------------------
      var B_RINGS = 44, B_SEG = 56;  // head and abdomen
      var L_RINGS = 56, L_SEG = 14;  // one leg tube
      var E_RINGS = 8, E_SEG = 16;   // one eye
      var BLOB_TOPO = buildTopology(B_RINGS, B_SEG);
      var LEG_TOPO = buildTopology(L_RINGS, L_SEG);
      var EYE_TOPO = buildTopology(E_RINGS, E_SEG);

      function buildTopology(rings, seg) {
        var indices = [];
        var topPole = 1 + rings * seg;
        function rs(r) { return 1 + r * seg; }
        for (var j = 0; j < seg; j++) indices.push(0, rs(0) + (j + 1) % seg, rs(0) + j);
        for (var r = 0; r < rings - 1; r++) {
          for (var k = 0; k < seg; k++) {
            var nk = (k + 1) % seg;
            indices.push(rs(r) + k, rs(r) + nk, rs(r + 1) + nk);
            indices.push(rs(r) + k, rs(r + 1) + nk, rs(r + 1) + k);
          }
        }
        for (var m = 0; m < seg; m++) indices.push(rs(rings - 1) + m, rs(rings - 1) + (m + 1) % seg, topPole);
        return new Uint32Array(indices);
      }

      function expand(topo, pos) {
        var out = new Float32Array(topo.length * 3);
        for (var i = 0; i < topo.length; i++) {
          var v = topo[i];
          out[i * 3] = pos[v * 3];
          out[i * 3 + 1] = pos[v * 3 + 1];
          out[i * 3 + 2] = pos[v * 3 + 2];
        }
        return out;
      }

      // -----------------------------------------------------------------------
      // Body parts: a lathe blob along the spider's long axis (z), with its own width and height.
      // t runs 0 (rear pole) to 1 (front pole). shape < 1 is round, > 1 is pointed. egg > 0 puts the bulge to the rear.
      // -----------------------------------------------------------------------
      function blobPoint(s, t, phi) {
        var q = Math.exp(-s.egg / 60);
        var r = Math.pow(Math.max(Math.sin(Math.PI * Math.pow(t, q)), 0), s.shape);
        var lx = s.rx * r * Math.sin(phi), ly = -s.len / 2 + s.len * t, lz = s.rz * r * Math.cos(phi);
        // Lathe axis (y) becomes the body axis (z); lathe z becomes down. Then pitch around the front pole.
        var X = lx, Y = -lz, Z = ly - s.shiftZ;
        var c = Math.cos(s.pitch), sn = Math.sin(s.pitch);
        return [X + s.ox, Math.max(Y * c - Z * sn + s.oy, 0), Y * sn + Z * c + s.oz];
      }

      function blobPositions(s) {
        var pos = new Float32Array((2 + B_RINGS * B_SEG) * 3);
        var p = blobPoint(s, 0, 0);
        pos[0] = p[0]; pos[1] = p[1]; pos[2] = p[2];
        for (var i = 0; i < B_RINGS; i++) {
          var t = (i + 1) / (B_RINGS + 1);
          for (var j = 0; j < B_SEG; j++) {
            var q = blobPoint(s, t, (j / B_SEG) * Math.PI * 2);
            var v = 1 + i * B_SEG + j;
            pos[v * 3] = q[0]; pos[v * 3 + 1] = q[1]; pos[v * 3 + 2] = q[2];
          }
        }
        var top = blobPoint(s, 1, 0), tv = 1 + B_RINGS * B_SEG;
        pos[tv * 3] = top[0]; pos[tv * 3 + 1] = top[1]; pos[tv * 3 + 2] = top[2];
        return pos;
      }

      function setupBody(p) {
        var yc = p.bodyLift; // head and abdomen are flattened at the bed (see blobPoint), so a low body sits on a flat belly
        // shiftZ is 0 for the head (centred) and half the length for the abdomen (its front pole is the pivot).
        var head = { len: p.headLength, rx: p.headWidth / 2, rz: p.headHeight / 2, shape: p.headShape, egg: 0, shiftZ: 0, pitch: 0, ox: 0, oy: yc, oz: 0 };
        // The abdomen's front pole sits inside the rear of the head so the two shells overlap well.
        var overlap = Math.min(0.38 * p.headLength, 0.45 * p.abdLength);
        var abd = { len: p.abdLength, rx: p.abdWidth / 2, rz: p.abdHeight / 2, shape: p.abdShape, egg: p.abdEgg, shiftZ: p.abdLength / 2, pitch: (p.abdTilt * Math.PI) / 180, ox: 0, oy: yc, oz: -p.headLength / 2 + overlap };
        return { yc: yc, head: head, abd: abd };
      }

      // -----------------------------------------------------------------------
      // Eyes
      // -----------------------------------------------------------------------
      var EYE_TABLE = [ // t along the head, angle off the top, size factor
        [0.86, 0.34, 1.0], [0.9, 0.85, 0.72], [0.8, 0.62, 0.72], [0.93, 0.5, 0.5]
      ];
      function buildEyes(p, body) {
        var out = [];
        var n = Math.round(p.eyes / 2);
        for (var k = 0; k < n; k++) {
          [-1, 1].forEach(function (side) {
            var e = EYE_TABLE[k];
            var c = blobPoint(body.head, e[0], Math.PI + side * e[1]);
            var rad = (p.eyeSize / 2) * e[2];
            var pos = new Float32Array((2 + E_RINGS * E_SEG) * 3);
            pos[0] = c[0]; pos[1] = c[1] - rad; pos[2] = c[2];
            for (var i = 0; i < E_RINGS; i++) {
              var a = -Math.PI / 2 + ((i + 1) / (E_RINGS + 1)) * Math.PI;
              for (var j = 0; j < E_SEG; j++) {
                var th = (j / E_SEG) * Math.PI * 2, v = 1 + i * E_SEG + j;
                pos[v * 3] = c[0] + rad * Math.cos(a) * Math.sin(th);
                pos[v * 3 + 1] = c[1] + rad * Math.sin(a);
                pos[v * 3 + 2] = c[2] + rad * Math.cos(a) * Math.cos(th);
              }
            }
            var tv = 1 + E_RINGS * E_SEG;
            pos[tv * 3] = c[0]; pos[tv * 3 + 1] = c[1] + rad; pos[tv * 3 + 2] = c[2];
            out.push({ name: 'eyes', positions: expand(EYE_TOPO, pos) });
          });
        }
        return out;
      }

      // -----------------------------------------------------------------------
      // Legs: a bent path (hip -> knee -> ankle -> foot on the bed) swept with a round tube.
      // -----------------------------------------------------------------------
      var FOOT_RUN = 5; // the last bit of every leg runs flat along the bed

      function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
      function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
      function mul(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }
      function len3(a) { return Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]); }
      function norm(a) { var l = len3(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
      function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
      function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }

      // Rounded polyline through the control points; round (0.2..1) is how much of each corner is smoothed.
      function legPath(P, round) {
        var pts = [P[0]];
        for (var c = 1; c < P.length - 1; c++) {
          var e1 = norm(sub(P[c], P[c - 1])), e2 = norm(sub(P[c + 1], P[c]));
          var u = round * 0.5 * Math.min(len3(sub(P[c], P[c - 1])), len3(sub(P[c + 1], P[c])));
          var a = sub(P[c], mul(e1, u)), b = add(P[c], mul(e2, u));
          for (var i = 0; i <= 14; i++) {
            var s = i / 14, w0 = (1 - s) * (1 - s), w1 = 2 * s * (1 - s), w2 = s * s;
            pts.push([w0 * a[0] + w1 * P[c][0] + w2 * b[0], w0 * a[1] + w1 * P[c][1] + w2 * b[1], w0 * a[2] + w1 * P[c][2] + w2 * b[2]]);
          }
        }
        pts.push(P[P.length - 1]);
        return pts;
      }

      function resample(pts, n) {
        var acc = [0];
        for (var i = 1; i < pts.length; i++) acc.push(acc[i - 1] + len3(sub(pts[i], pts[i - 1])));
        var total = acc[acc.length - 1], out = [], k = 1;
        for (var m = 0; m < n; m++) {
          var d = (m / (n - 1)) * total;
          while (k < pts.length - 1 && acc[k] < d) k++;
          var seg = acc[k] - acc[k - 1] || 1, f = Math.max(0, Math.min(1, (d - acc[k - 1]) / seg));
          out.push(add(pts[k - 1], mul(sub(pts[k], pts[k - 1]), f)));
        }
        return { pts: out, total: total };
      }

      function buildLeg(P, p, kneeFrac) {
        var path = resample(legPath(P, p.legRound), L_RINGS);
        var pts = path.pts;
        var n1 = norm(cross(sub(pts[1], pts[0]), [0, 1, 0])); // sideways of the first stretch of the leg
        var pos = new Float32Array((2 + L_RINGS * L_SEG) * 3);
        for (var i = 0; i < L_RINGS; i++) {
          var T = norm(sub(pts[Math.min(i + 1, L_RINGS - 1)], pts[Math.max(i - 1, 0)]));
          n1 = norm(sub(n1, mul(T, dot(n1, T))));
          var n2 = cross(n1, T);
          var s = i / (L_RINGS - 1);
          var r = (p.legThick / 2) * (1 - (p.legTaper / 100) * s);
          r *= 1 + (p.legKnob / 100) * Math.exp(-Math.pow((s - kneeFrac) / 0.07, 2));
          r = Math.max(r, 1.0);
          var rb = r * (1 - p.legFlat / 100);
          for (var j = 0; j < L_SEG; j++) {
            var phi = (j / L_SEG) * Math.PI * 2, sn = Math.sin(phi) * r, cs = Math.cos(phi) * rb, v = 1 + i * L_SEG + j;
            pos[v * 3] = pts[i][0] + sn * n1[0] + cs * n2[0];
            pos[v * 3 + 1] = pts[i][1] + sn * n1[1] + cs * n2[1];
            pos[v * 3 + 2] = pts[i][2] + sn * n1[2] + cs * n2[2];
          }
        }
        var a = pts[0], b = pts[L_RINGS - 1], tv = 1 + L_RINGS * L_SEG;
        pos[0] = a[0]; pos[1] = a[1]; pos[2] = a[2];
        pos[tv * 3] = b[0]; pos[tv * 3 + 1] = b[1]; pos[tv * 3 + 2] = b[2];
        return expand(LEG_TOPO, pos);
      }

      // Legs rest on the bed (no supports needed): hip -> knee -> ankle -> foot, with the foot and knee at bed level
      // unless the knee is lifted. Front pairs sweep forward and rear pairs backward below the knee, so legs fan out.
      function buildLegs(p, body) {
        var out = [];
        var pairs = Math.round(p.legPairs);
        var tipR = Math.max(1, (p.legThick / 2) * (1 - p.legTaper / 100));
        var kneeS = p.legFemur / 100;
        var kneeR = Math.max(1, (p.legThick / 2) * (1 - (p.legTaper / 100) * kneeS)) * (1 + p.legKnob / 100);
        for (var i = 0; i < pairs; i++) {
          var f = pairs > 1 ? i / (pairs - 1) : 0.5; // 0 = front pair, 1 = rear pair
          var theta = ((p.legLean + p.legSpread * (1 - 2 * f)) * Math.PI) / 180;
          var theta2 = theta + ((p.legSweep * (1 - 2 * f)) * Math.PI) / 180;
          var reach = p.legReach * (1 + (p.legLenDiff / 100) * (2 * f - 1));
          [-1, 1].forEach(function (side) {
            var dir = [side * Math.cos(theta), 0, Math.sin(theta)];
            var dir2 = [side * Math.cos(theta2), 0, Math.sin(theta2)];
            var hip = [dir[0] * p.headWidth * 0.2, body.yc, dir[2] * p.headLength * 0.22];
            var knee = [hip[0] + dir[0] * reach * kneeS, kneeR + p.kneeLift, hip[2] + dir[2] * reach * kneeS];
            var foot = [knee[0] + dir2[0] * reach * (1 - kneeS), tipR, knee[2] + dir2[2] * reach * (1 - kneeS)];
            var ankle = [foot[0] - dir2[0] * FOOT_RUN, tipR, foot[2] - dir2[2] * FOOT_RUN];
            var d1 = len3(sub(knee, hip)), d2 = len3(sub(ankle, knee));
            out.push({ name: 'legs', positions: buildLeg([hip, knee, ankle, foot], p, d1 / (d1 + d2 + FOOT_RUN)) });
          });
        }
        return out;
      }

      // -----------------------------------------------------------------------
      // Stamps: embossed 2D shapes on the head or abdomen
      // -----------------------------------------------------------------------
      var STAMP_NAMES = { spider: 'Mini spider', skull: 'Skull', web: 'Web', bat: 'Bat', star: 'Star', hourglass: 'Hourglass' };
      var STAMP_PICKER = ['spider', 'skull', 'web', 'bat', 'star', 'hourglass'];
      var stamps = []; // { type, size, rotation (degrees), point: [x, y, z], normal: [x, y, z] }
      var stampType = 'spider';
      var refreshStampUI = null;

      function isBody(name) { return name === 'head' || name === 'abdomen'; }

      function circlePts(cx, cy, r, n) {
        var pts = [];
        for (var i = 0; i < n; i++) pts.push([cx + Math.cos((i / n) * Math.PI * 2) * r, cy + Math.sin((i / n) * Math.PI * 2) * r]);
        return pts;
      }
      function scaled(pts, r) { return pts.map(function (pt) { return [pt[0] * r, pt[1] * r]; }); }

      // Outline { outer, holes } for a stamp of radius r, counter-clockwise.
      function stampDef(type, r) {
        var i, pts = [], holes = [];
        if (type === 'star') {
          for (i = 0; i < 10; i++) {
            var angle = (i * Math.PI) / 5 + Math.PI / 2, rad = i % 2 === 0 ? 1 : 0.44;
            pts.push([Math.cos(angle) * rad, Math.sin(angle) * rad]);
          }
        } else if (type === 'bat') {
          pts = [
            [0.0, 0.32], [0.12, 0.56], [0.20, 0.28], [0.52, 0.50], [0.82, 0.42], [1.00, 0.08], [0.74, -0.05],
            [0.58, -0.32], [0.36, -0.18], [0.20, -0.44], [0.0, -0.58], [-0.20, -0.44], [-0.36, -0.18],
            [-0.58, -0.32], [-0.74, -0.05], [-1.00, 0.08], [-0.82, 0.42], [-0.52, 0.50], [-0.20, 0.28], [-0.12, 0.56]
          ];
          pts = pts.map(function (pt) { return [pt[0], pt[1]]; });
        } else if (type === 'hourglass') {
          pts = [[-0.55, 0.95], [0.55, 0.95], [0.1, 0], [0.55, -0.95], [-0.55, -0.95], [-0.1, 0]];
        } else if (type === 'skull') {
          for (i = 0; i <= 20; i++) {
            var a = (-20 + (i / 20) * 220) * Math.PI / 180;
            pts.push([Math.cos(a) * 0.82, 0.2 + Math.sin(a) * 0.8]);
          }
          pts.push([-0.62, -0.2], [-0.46, -0.34], [-0.46, -0.9], [0.46, -0.9], [0.46, -0.34], [0.62, -0.2]);
          holes.push(circlePts(-0.33, 0.1, 0.2, 14).reverse(), circlePts(0.33, 0.1, 0.2, 14).reverse());
          holes.push([[0, -0.06], [-0.15, -0.4], [0.15, -0.4]].reverse());
        } else if (type === 'web') {
          for (i = 0; i < 8; i++) {
            var tip = (i / 8) * Math.PI * 2;
            pts.push([Math.cos(tip), Math.sin(tip)]);
            for (var k = 1; k <= 3; k++) {
              var s = k / 4, rr = 1 - 0.4 * Math.sin(s * Math.PI), an = tip + s * (Math.PI / 4);
              pts.push([Math.cos(an) * rr, Math.sin(an) * rr]);
            }
          }
          for (i = 0; i < 8; i++) {
            var ca = ((i + 0.5) / 8) * Math.PI * 2, hw = 0.16;
            var hp = [];
            [[0.3, -hw], [0.55, 0], [0.3, hw], [0.2, 0]].forEach(function (q) {
              var an2 = ca + q[1], rr2 = q[0];
              hp.push([Math.cos(an2) * rr2, Math.sin(an2) * rr2]);
            });
            holes.push(hp.reverse());
          }
        } else { // spider: body disc and abdomen lobe with eight leg spikes
          var legAngles = [50, 20, -10, -42, 130, 160, 190, 222];
          for (i = 0; i < 200; i++) {
            var th = (i / 200) * Math.PI * 2 - Math.PI;
            var base = 0.3 + 0.17 * Math.exp(-Math.pow(angDiff(th, -Math.PI / 2) / 0.8, 2));
            var rd = base;
            legAngles.forEach(function (d) { rd = Math.max(rd, Math.exp(-Math.pow(angDiff(th, (d * Math.PI) / 180) / 0.2, 2))); });
            pts.push([Math.cos(th) * rd, Math.sin(th) * rd]);
          }
        }
        return { outer: scaled(pts, r), holes: holes.map(function (h) { return scaled(h, r); }) };
      }
      function angDiff(a, b) {
        var d = a - b;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        return d;
      }

      function stampShape(type, size) {
        var def = stampDef(type, size * 0.5), THREE = window.THREE;
        var shape = new THREE.Shape();
        def.outer.forEach(function (pt, i) { if (i === 0) shape.moveTo(pt[0], pt[1]); else shape.lineTo(pt[0], pt[1]); });
        shape.closePath();
        def.holes.forEach(function (h) {
          var path = new THREE.Path();
          h.forEach(function (pt, i) { if (i === 0) path.moveTo(pt[0], pt[1]); else path.lineTo(pt[0], pt[1]); });
          path.closePath();
          shape.holes.push(path);
        });
        return shape;
      }

      // Small inline picture of a stamp for its card. SVG y points down, so flip y.
      function stampIcon(type) {
        var def = stampDef(type, 1);
        var d = [def.outer].concat(def.holes).map(function (ring) {
          return 'M' + ring.map(function (pt) { return pt[0].toFixed(3) + ' ' + (-pt[1]).toFixed(3); }).join('L') + 'Z';
        }).join('');
        return '<svg viewBox="-1.1 -1.1 2.2 2.2" aria-hidden="true"><path fill-rule="evenodd" d="' + d + '"/></svg>';
      }

      // Stamp mesh in model space. It sits 1.8 mm into the surface and 1.5 mm proud of it.
      function stampPositions(stamp) {
        var THREE = window.THREE;
        var geo = new THREE.ExtrudeGeometry(stampShape(stamp.type, stamp.size), {
          depth: 3.3, bevelEnabled: true, bevelThickness: 0.3, bevelSize: 0.25, bevelSegments: 2, curveSegments: 16
        });
        geo.rotateZ(((stamp.rotation || 0) * Math.PI) / 180);
        geo.translate(0, 0, -1.8);
        var normal = new THREE.Vector3().fromArray(stamp.normal).normalize();
        var upVec = Math.abs(normal.y) > 0.92 ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0);
        var tangentX = new THREE.Vector3().crossVectors(upVec, normal).normalize();
        var tangentY = new THREE.Vector3().crossVectors(normal, tangentX).normalize();
        var quat = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(tangentX, tangentY, normal));
        var matrix = new THREE.Matrix4().compose(new THREE.Vector3().fromArray(stamp.point), quat, new THREE.Vector3(1, 1, 1));
        var flat = geo.toNonIndexed();
        flat.applyMatrix4(matrix);
        return flat.attributes.position.array.slice();
      }

      // -----------------------------------------------------------------------
      // Generator contract
      // -----------------------------------------------------------------------
      var DEFAULTS = {
        abdLength: 50, abdWidth: 42, abdHeight: 38, abdShape: 0.55, abdEgg: 20, abdTilt: 6,
        headLength: 30, headWidth: 26, headHeight: 20, headShape: 0.6, eyes: 8, eyeSize: 3.4,
        legPairs: 4, legReach: 55, bodyLift: 9, legSpread: 50, legLean: 0, legLenDiff: 0,
        legFemur: 45, kneeLift: 0, legSweep: 25, legRound: 0.7, legThick: 5.5, legTaper: 45, legKnob: 25, legFlat: 0,
        stampSize: 14, stampRotation: 0
      };
      function preset(label, over) {
        var values = {};
        Object.keys(DEFAULTS).forEach(function (k) { values[k] = DEFAULTS[k]; });
        Object.keys(over).forEach(function (k) { values[k] = over[k]; });
        return { label: label, values: values };
      }

      window.MM_GENERATOR = {
        code: 'MM-003',
        category: 'SPOOKY // CREATURES',
        title: 'Spider',
        fileName: 'Spider',
        printerLink: '../index.html#map-screen',
        defaultColor: '#334155',
        palette: [
          { name: 'Shadow Black', color: '#334155' },
          { name: 'Bone White', color: '#f1f5f9' },
          { name: 'Pumpkin Matte', color: '#fdba74' },
          { name: 'Lavender Mist', color: '#d8b4fe' },
          { name: 'Berry Sorbet', color: '#fda4af' },
          { name: 'Glow Mint', color: '#a7f3d0' },
          { name: 'Phantom Ice', color: '#93c5fd' },
          { name: 'Sunny Yellow', color: '#fde047' }
        ],
        partNames: { head: 'Head', abdomen: 'Abdomen', eyes: 'Eyes', legs: 'Legs', detail: 'Stamp' },
        printSettings: {
          material: 'PLA',
          nozzle: 0.4,
          layerHeight: 0.2,
          infill: 15,
          walls: 3,
          topLayers: 5,
          bottomLayers: 4,
          supports: false,
          brim: 3,
          notes: 'Prints flat with no supports: the belly is flattened onto the bed and the legs lie along it. Lifting the body or knees (Body height, Knee lift) leaves gaps under them that need supports. A brim helps the thin leg tips stick.'
        },

        parameters: [
          { group: 'Abdomen', key: 'abdLength', label: 'Abdomen length', unit: ' mm', min: 20, max: 80, step: 1, value: 50 },
          { group: 'Abdomen', key: 'abdWidth', label: 'Abdomen width', unit: ' mm', min: 20, max: 70, step: 1, value: 42 },
          { group: 'Abdomen', key: 'abdHeight', label: 'Abdomen height', unit: ' mm', min: 18, max: 70, step: 1, value: 38 },
          { group: 'Abdomen', key: 'abdShape', label: 'Shape (round ↔ pointed)', unit: '', min: 0.45, max: 1.2, step: 0.05, value: 0.55 },
          { group: 'Abdomen', key: 'abdEgg', label: 'Egg shape (front ↔ rear fat)', unit: '', min: -50, max: 50, step: 5, value: 20 },
          { group: 'Abdomen', key: 'abdTilt', label: 'Tilt up at the back', unit: '°', min: -10, max: 50, step: 1, value: 6 },
          { group: 'Head & eyes', key: 'headLength', label: 'Head length', unit: ' mm', min: 16, max: 50, step: 1, value: 30 },
          { group: 'Head & eyes', key: 'headWidth', label: 'Head width', unit: ' mm', min: 14, max: 44, step: 1, value: 26 },
          { group: 'Head & eyes', key: 'headHeight', label: 'Head height', unit: ' mm', min: 12, max: 40, step: 1, value: 20 },
          { group: 'Head & eyes', key: 'headShape', label: 'Shape (round ↔ pointed)', unit: '', min: 0.45, max: 1.2, step: 0.05, value: 0.6 },
          { group: 'Head & eyes', key: 'eyes', label: 'Number of eyes', unit: '', min: 0, max: 8, step: 2, value: 8 },
          { group: 'Head & eyes', key: 'eyeSize', label: 'Eye size', unit: ' mm', min: 1.5, max: 6, step: 0.1, value: 3.4 },
          { group: 'Leg count & stance', key: 'legPairs', label: 'Leg pairs (2 legs each)', unit: '', min: 1, max: 6, step: 1, value: 4,
            format: function (v) { return v + ' pairs = ' + v * 2 + ' legs'; } },
          { group: 'Leg count & stance', key: 'legReach', label: 'Leg reach (sideways)', unit: ' mm', min: 25, max: 90, step: 1, value: 55 },
          { group: 'Leg count & stance', key: 'bodyLift', label: 'Body height (low = no supports)', unit: ' mm', min: 6, max: 50, step: 1, value: 9 },
          { group: 'Leg count & stance', key: 'legSpread', label: 'Leg fan spread (front ↔ back)', unit: '°', min: 10, max: 80, step: 1, value: 50 },
          { group: 'Leg count & stance', key: 'legLean', label: 'Legs lean (back ↔ forward)', unit: '°', min: -30, max: 30, step: 1, value: 0 },
          { group: 'Leg count & stance', key: 'legLenDiff', label: 'Front vs back length', unit: '%', min: -40, max: 40, step: 5, value: 0 },
          { group: 'Leg segments', key: 'legFemur', label: 'Upper leg share (to the knee)', unit: '%', min: 25, max: 70, step: 1, value: 45 },
          { group: 'Leg segments', key: 'kneeLift', label: 'Knee lift (0 = flat on the bed)', unit: ' mm', min: 0, max: 40, step: 1, value: 0 },
          { group: 'Leg segments', key: 'legSweep', label: 'Lower leg sweep (fan out)', unit: '°', min: -40, max: 40, step: 1, value: 25 },
          { group: 'Leg segments', key: 'legRound', label: 'Knee bend (sharp ↔ smooth)', unit: '', min: 0.3, max: 1, step: 0.05, value: 0.7 },
          { group: 'Leg segments', key: 'legThick', label: 'Leg thickness', unit: ' mm', min: 3, max: 10, step: 0.1, value: 5.5 },
          { group: 'Leg segments', key: 'legTaper', label: 'Taper to the foot', unit: '%', min: 0, max: 70, step: 5, value: 45 },
          { group: 'Leg segments', key: 'legKnob', label: 'Knee knob', unit: '%', min: 0, max: 60, step: 5, value: 25 },
          { group: 'Leg segments', key: 'legFlat', label: 'Leg shape (round ↔ flat)', unit: '%', min: 0, max: 50, step: 5, value: 0 },
          { group: 'Stamp size & rotation', key: 'stampSize', label: 'Stamp size', unit: ' mm', min: 10, max: 30, step: 1, value: 14 },
          { group: 'Stamp size & rotation', key: 'stampRotation', label: 'Stamp rotation', unit: '°', min: 0, max: 355, step: 5, value: 0 }
        ],

        presets: [
          preset('House spider', {}),
          preset('Tarantula', { abdLength: 46, abdWidth: 48, abdHeight: 42, abdShape: 0.5, abdTilt: 4, headLength: 34, headWidth: 36, headHeight: 26, legReach: 46, bodyLift: 13, legThick: 8.5, legTaper: 30, legFemur: 50, legKnob: 40, legSweep: 15 }),
          preset('Daddy long legs', { abdLength: 28, abdWidth: 18, abdHeight: 16, abdTilt: 4, headLength: 20, headWidth: 16, headHeight: 13, eyes: 2, eyeSize: 3, legReach: 85, bodyLift: 8, legThick: 3.4, legTaper: 30, legFemur: 55, legKnob: 40, legRound: 0.9, legSweep: 35 }),
          preset('Black widow', { abdLength: 46, abdWidth: 46, abdHeight: 46, abdShape: 0.5, abdEgg: 0, abdTilt: 10, headLength: 22, headWidth: 20, headHeight: 16, eyes: 4, legReach: 62, bodyLift: 10, legThick: 4.2, legTaper: 55, legKnob: 15, legSweep: 30 }),
          preset('Chibi spider', { abdLength: 40, abdWidth: 44, abdHeight: 40, abdShape: 0.5, abdEgg: 0, abdTilt: 0, headLength: 36, headWidth: 40, headHeight: 32, eyes: 4, eyeSize: 6, legPairs: 3, legReach: 40, bodyLift: 12, legThick: 6.5, legSweep: 20 }),
          preset('Default spider', {})
        ],

        // Stamp picker: tap a picture card, then tap the spider's head or abdomen.
        mount: function (container, api) {
          var h = function (tag, attrs, text) {
            var node = document.createElement(tag);
            Object.keys(attrs || {}).forEach(function (k) {
              if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
              else node.setAttribute(k, attrs[k]);
            });
            if (text) node.textContent = text;
            return node;
          };
          container.appendChild(h('h3', { class: 'mm-group-title' }, 'Stamp (tap a card, then the spider)'));
          var chips = h('div', { class: 'mm-icon-chips' });
          var buttons = {};
          STAMP_PICKER.forEach(function (type) {
            var btn = h('button', {
              class: 'mm-icon-chip', type: 'button', title: STAMP_NAMES[type], 'aria-pressed': String(type === stampType),
              onclick: function () {
                stampType = type;
                Object.keys(buttons).forEach(function (k) { buttons[k].setAttribute('aria-pressed', String(k === type)); });
                api.toast('Selected ' + STAMP_NAMES[type] + '. Tap the head or abdomen to place it.');
              }
            });
            btn.innerHTML = stampIcon(type) + '<span>' + STAMP_NAMES[type] + '</span>';
            buttons[type] = btn;
            chips.appendChild(btn);
          });
          container.appendChild(chips);

          var count = h('p', { class: 'mm-note' }, '0 stamps placed');
          var undo = h('button', { class: 'mm-btn', type: 'button', onclick: function () {
            if (!stamps.length) return;
            stamps.pop();
            api.rebuild();
            api.toast('Removed last stamp');
          } }, 'Undo last stamp');
          var clear = h('button', { class: 'mm-btn', type: 'button', onclick: function () {
            if (!stamps.length) return;
            stamps = [];
            api.rebuild();
            api.toast('Cleared all stamps');
          } }, 'Clear stamps');
          var row = h('div', { class: 'mm-export-row' });
          row.appendChild(undo);
          row.appendChild(clear);
          container.appendChild(count);
          container.appendChild(row);
          refreshStampUI = function () {
            count.textContent = stamps.length + (stamps.length === 1 ? ' stamp placed' : ' stamps placed');
            undo.disabled = stamps.length === 0;
            clear.disabled = stamps.length === 0;
          };
          refreshStampUI();
        },

        build: function (p) {
          var body = setupBody(p);
          var meshes = [
            { name: 'head', positions: expand(BLOB_TOPO, blobPositions(body.head)) },
            { name: 'abdomen', positions: expand(BLOB_TOPO, blobPositions(body.abd)) }
          ];
          if (p.eyes > 0) buildEyes(p, body).forEach(function (m) { meshes.push(m); });
          buildLegs(p, body).forEach(function (m) { meshes.push(m); });
          stamps.forEach(function (stamp) { meshes.push({ name: 'detail', positions: stampPositions(stamp) }); });
          if (refreshStampUI) refreshStampUI();
          return meshes;
        },

        onHover: function (hit, api) {
          if (!hit || !isBody(hit.meshName)) {
            api.setPreview(null);
            return;
          }
          api.setPreview({
            positions: stampPositions({
              type: stampType,
              size: api.params.stampSize,
              rotation: api.params.stampRotation,
              point: hit.point.toArray(),
              normal: hit.normal.toArray()
            })
          });
        },

        onPick: function (hit, api) {
          if (!isBody(hit.meshName)) return;
          stamps.push({ type: stampType, size: api.params.stampSize, rotation: api.params.stampRotation, point: hit.point.toArray(), normal: hit.normal.toArray() });
          api.rebuild();
          api.toast('Stamped ' + STAMP_NAMES[stampType] + ' (+1.5 mm)');
        }
      };
    })();
  </script>
  <script src="shared/generator-core.js"></script>
