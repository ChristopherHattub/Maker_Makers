        for (i = 0; i < N; i++) { t = (i / N) * TAU; c = Math.cos(t); s = Math.sin(t); pts.push([a * Math.sign(c) * Math.pow(Math.abs(c), 2 / n), b * Math.sign(s) * Math.pow(Math.abs(s), 2 / n)]); }

      }
      // Word-wrap text to a width in mm at glyph unit u (cap height = 6u).
      function wrapText(str, u, maxW) {
        var words = String(str).split(/\s+/).filter(Boolean), lines = [], cur = '';
        words.forEach(function (w) {
          var tryS = cur ? cur + ' ' + w : w;
          if (cur && textSegs(tryS, u, u * 0.3).w > maxW) { lines.push(cur); cur = w; } else cur = tryS;
        });
        if (cur) lines.push(cur);
        return lines;
      }


      var DEFAULTS = {
        height: 36, topR: 40, botR: 30, belly: 3, wall: 2.6, cols: 20, rows: 7, weave: 1.9, rimBand: 1, handle: 1, handleH: 38, handleT: 3.2,
        eggL: 24, stand: 0, band: 1, floorT: 3
      };
      var eggs = [], tool = 0, redrawBasket = null, api0 = null, seeded = false;

      function basketR(p, y) { var u = y / p.height; return lerp(p.botR, p.topR, u) + p.belly * Math.sin(Math.PI * u); }
      function floorRadius(p) { return basketR(p, p.floorT) - p.wall; }
      function eggDims(p) { var W = p.eggL * 0.36; return { W: W, L: p.eggL }; }
      function eggR(t, W) { var u = Math.pow(Math.max(0, Math.min(1, t)), 0.78); return W * Math.pow(Math.max(0, Math.sin(Math.PI * u)), 0.6); }
      function scatterEggs(p, n) {
        var d = eggDims(p), lim = floorRadius(p) - d.L * (p.stand >= 1 ? 0.4 : 0.55), i, tries, x, z, ok;
        eggs.length = 0;
        for (i = 0; i < n; i++) {
          for (tries = 0; tries < 60; tries++) {
            var a = Math.random() * TAU, r = Math.sqrt(Math.random()) * Math.max(4, lim); x = Math.cos(a) * r; z = Math.sin(a) * r;
            ok = eggs.every(function (q) { return Math.hypot(q.x - x, q.z - z) > d.W * 1.9; });
            if (ok) break;
          }
          eggs.push({ x: x, z: z, rot: Math.random() * TAU });
        }
      }

      function eggSolid(p, q, bandOut) {
        var d = eggDims(p), prof = [], n = 28, i, L = d.L, W = d.W, flat = p.stand >= 1;
        var t0 = flat ? 0.05 : 0;
        for (i = 0; i <= n; i++) { var t = t0 + (1 - t0) * (i / n); prof.push([i === n || (i === 0 && !flat) ? 0 : eggR(t, W), L * (i / n)]); }
        if (flat) prof.unshift([0, 0]);
        var egg = lathe(prof, 40);
        var y0 = p.floorT - 1.0, pos;
        if (flat) pos = xform(egg, { ry: q.rot, t: [q.x, y0, q.z] });
        else pos = xform(xform(egg, { t: [0, -L / 2, 0] }), { rz: Math.PI / 2, ry: q.rot, t: [q.x, y0 + W * 0.95, q.z] });
        if (p.band >= 1) {
          var tb = 0.45, rb = eggR(t0 + (1 - t0) * tb, W), ring = torus(rb * 0.985, 0.85, 40, 10), by = L * tb;
          var rp = flat ? xform(ring, { ry: q.rot, t: [q.x, y0 + by, q.z] }) : xform(xform(ring, { t: [0, by - L / 2, 0] }), { rz: Math.PI / 2, ry: q.rot, t: [q.x, y0 + W * 0.95, q.z] });
          bandOut.push(rp);
        }
        return pos;
      }

      function build(p) {
        var H = p.height, prof = [], i, out = [], wall = p.wall, fl = p.floorT;
        prof.push([0, 0]);
        for (i = 0; i <= 32; i++) { var y = H * i / 32; prof.push([basketR(p, y), y]); }
        prof.push([basketR(p, H) - wall * 0.5, H + 0.5]);
        for (i = 0; i <= 10; i++) { var y2 = H - (H - fl) * i / 10; prof.push([basketR(p, y2) - wall, y2]); }
        prof.push([0, fl]);
        var yw0 = H * 0.14, yw1 = H * (p.rimBand >= 1 ? 0.82 : 0.95);
        var basket = lathe(prof, 96, function (pt, r, y, th, idx) {
          if (r < 2) return;
          var f = 0;
          if (y > yw0 && y < yw1 && idx > 33 === false) {
            var v = (y - yw0) / (yw1 - yw0) * p.rows, row = Math.floor(v), fr = v - row;
            f = p.weave * Math.pow(Math.sin(Math.PI * fr), 0.7) * (0.5 + 0.5 * Math.cos(p.cols * th + Math.PI * (row % 2))) * smoothstep(0, 0.4, y - yw0) * (1 - smoothstep(0, 0.4, yw1 - y));
          }
          if (p.rimBand >= 1 && y > H * 0.84 && idx <= 33) f += 1.4 * smoothstep(H * 0.84, H * 0.88, y);
          if (f !== 0) { var m = (r + f) / r; pt[0] *= m; pt[2] *= m; }
        });
        out.push({ name: 'basket', positions: basket, smoothGroup: 'basket' });
        if (p.handle >= 1) {
          var rx = p.topR - wall * 0.3, path = [], n = 36, hh = p.handleH;
          for (i = 0; i <= n; i++) { var s = (i / n) * Math.PI; path.push([-rx * Math.cos(s), H - 1.2 + hh * Math.sin(s), 0]); }
          out.push({ name: 'handle', positions: tube(path, function (t) { return p.handleT * Math.min(1, t * 14, (1 - t) * 14); }, 20, 1), smoothGroup: 'handle' });
        }
        var es = [], bands = [];
        eggs.forEach(function (q) { es.push(eggSolid(p, q, bands)); });
        pushMesh(out, mesh('eggs', es)); pushMesh(out, mesh('bands', bands));
        return out;
      }

      function drawPlan(cv) {
        var g = cv.getContext('2d'), w = cv.width, p = api0.params, R = floorRadius(p), sc = (w * 0.47) / (p.topR), c = w / 2, d = eggDims(p);
        g.clearRect(0, 0, w, w);
        g.fillStyle = '#7a5233'; g.beginPath(); g.arc(c, c, p.topR * sc, 0, TAU); g.fill();
        g.fillStyle = '#c9a36b'; g.beginPath(); g.arc(c, c, R * sc, 0, TAU); g.fill(); g.strokeStyle = '#00e5ff'; g.lineWidth = 2; g.stroke();
        eggs.forEach(function (q) {
          g.save(); g.translate(c + q.x * sc, c + q.z * sc); g.rotate(p.stand >= 1 ? 0 : q.rot);
          g.fillStyle = '#fbb6ce'; g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.beginPath();
          if (p.stand >= 1) g.arc(0, 0, d.W * sc, 0, TAU); else g.ellipse(0, 0, d.L / 2 * sc, d.W * sc, 0, 0, TAU);
          g.fill(); g.stroke(); g.restore();
        });
      }
      function mountPlan(container, api) {
        container.appendChild(mkEl('p', { class: 'mm-note' }, 'Top view of the basket floor. Drag an egg to move it, click empty floor to add an egg, or switch to Remove and click an egg.'));
        var row = mkEl('div', { class: 'mm-chips' }), btns = [];
        ['Move or add', 'Remove'].forEach(function (nm, i) {
          var b = mkEl('button', { class: 'mm-chip', type: 'button', 'aria-pressed': String(i === tool), onclick: function () { tool = i; btns.forEach(function (q, k) { q.setAttribute('aria-pressed', String(k === i)); }); } }, nm);
          btns.push(b); row.appendChild(b);
        });
        container.appendChild(row);
        var cv = mkCanvas(container, 280, 280), held = -1;
        redrawBasket = function () { if (api0) drawPlan(cv); };
        dragCanvas(cv, function (x, y, phase) {
          var p = api.params, sc = (cv.width * 0.47) / p.topR, px = (x * cv.width - cv.width / 2) / sc, pz = (y * cv.height - cv.height / 2) / sc, R = floorRadius(p), d = eggDims(p);
          var lim = Math.max(3, R - d.W);
          function clampXZ(q) { var m = Math.hypot(px, pz), k = m > lim ? lim / m : 1; q.x = px * k; q.z = pz * k; }
          if (phase === 'down') {
            var bd = 1e9; held = -1;
            eggs.forEach(function (q, i) { var dd = Math.hypot(q.x - px, q.z - pz); if (dd < bd) { bd = dd; held = i; } });
            if (bd > d.L * 0.55) held = -1;
            if (tool === 1) { if (held >= 0) eggs.splice(held, 1); held = -1; }
            else if (held < 0) { eggs.push({ x: 0, z: 0, rot: Math.random() * TAU }); held = eggs.length - 1; clampXZ(eggs[held]); }
          } else if (held >= 0 && phase === 'move') clampXZ(eggs[held]);
          if (phase === 'up') held = -1;
          redrawBasket(); api.rebuild();
        });
        var r2 = mkEl('div', { class: 'mm-export-row' });
        r2.appendChild(mkBtn('Shake out 5 eggs', function () { scatterEggs(api.params, 5); redrawBasket(); api.rebuild(); }));
        r2.appendChild(mkBtn('Shake out 8', function () { scatterEggs(api.params, 8); redrawBasket(); api.rebuild(); }));
        r2.appendChild(mkBtn('Empty basket', function () { eggs.length = 0; redrawBasket(); api.rebuild(); }));
        container.appendChild(r2);
        setTimeout(redrawBasket, 50);
      }

      window.MM_GENERATOR = {
        code: 'MM-035',
        category: 'EASTER // BASKETS',
        title: 'Egg Hunt Basket',
        fileName: 'Egg_Basket',
        palette: [
          { name: 'Wicker Tan', color: '#d9b382' },
          { name: 'Spring Pink', color: '#fbb6ce' },
          { name: 'Mint Green', color: '#a7f3d0' },
          { name: 'Sky Blue', color: '#a5d8ff' },
          { name: 'Chick Yellow', color: '#fde68a' },
          { name: 'Lavender', color: '#d8b4fe' },
          { name: 'Ribbon Red', color: '#e5503a' },
          { name: 'Cream', color: '#fff4dc' }
        ],
        defaultColor: '#d9b382',
        partNames: { basket: 'Basket', handle: 'Handle', eggs: 'Eggs', bands: 'Egg stripes' },
        openGroups: ['Basket'],
        extrasTitle: 'Place the eggs',
        parameters: [
          { group: 'Basket', key: 'height', label: 'Basket height', unit: ' mm', min: 24, max: 56, step: 1, value: DEFAULTS.height },
          { group: 'Basket', key: 'topR', label: 'Top radius', unit: ' mm', min: 28, max: 56, step: 1, value: DEFAULTS.topR },
          { group: 'Basket', key: 'botR', label: 'Bottom radius', unit: ' mm', min: 20, max: 48, step: 1, value: DEFAULTS.botR },
          { group: 'Basket', key: 'belly', label: 'Belly curve', unit: ' mm', min: 0, max: 8, step: 0.5, value: DEFAULTS.belly },
          { group: 'Basket', key: 'wall', label: 'Wall thickness', unit: ' mm', min: 2, max: 4, step: 0.2, value: DEFAULTS.wall },
          { group: 'Basket', key: 'floorT', label: 'Floor thickness', unit: ' mm', min: 2, max: 6, step: 0.5, value: DEFAULTS.floorT },
          { group: 'Weave', key: 'cols', label: 'Weave strands around', unit: '', min: 8, max: 30, step: 1, value: DEFAULTS.cols },
          { group: 'Weave', key: 'rows', label: 'Weave rows', unit: '', min: 3, max: 10, step: 1, value: DEFAULTS.rows },
          { group: 'Weave', key: 'weave', label: 'Weave depth', unit: ' mm', min: 0, max: 3, step: 0.1, value: DEFAULTS.weave },
          toggle('Weave', 'rimBand', 'Rim band', 'None', 'Thick rim band', DEFAULTS.rimBand),
          toggle('Handle', 'handle', 'Handle', 'None', 'Arched handle', DEFAULTS.handle),
          { group: 'Handle', key: 'handleH', label: 'Handle height', unit: ' mm', min: 20, max: 60, step: 1, value: DEFAULTS.handleH },
          { group: 'Handle', key: 'handleT', label: 'Handle thickness', unit: ' mm', min: 2, max: 5, step: 0.2, value: DEFAULTS.handleT },
          { group: 'Eggs', key: 'eggL', label: 'Egg length', unit: ' mm', min: 14, max: 36, step: 1, value: DEFAULTS.eggL },
          choice('Eggs', 'stand', 'Eggs', ['Lying down', 'Standing up'], DEFAULTS.stand),
          toggle('Eggs', 'band', 'Stripe around each egg', 'Plain', 'Striped', DEFAULTS.band)
        ],
        presets: [
          presetOf(DEFAULTS, 'Classic basket', {}),
          presetOf(DEFAULTS, 'Wide and shallow', { height: 28, topR: 48, botR: 38, handleH: 30, eggL: 26 }),
          presetOf(DEFAULTS, 'Tall tote', { height: 52, topR: 34, botR: 28, handleH: 46 }),
          presetOf(DEFAULTS, 'No handle bowl', { handle: 0, height: 30, belly: 6 }),
          presetOf(DEFAULTS, 'Standing eggs', { stand: 1, eggL: 22, band: 1 })
        ],
        testSetup: function (p) { if (!eggs.length) scatterEggs(p, 5); },
        mount: mountPlan,
        build: function (p, api) {
          api0 = api;
          if (!seeded) { seeded = true; scatterEggs(p, 5); }
          return build(p);
        }
      };

    })();
