        for (i = 0; i < N; i++) { t = (i / N) * TAU; c = Math.cos(t); s = Math.sin(t); pts.push([a * Math.sign(c) * Math.pow(Math.abs(c), 2 / n), b * Math.sign(s) * Math.pow(Math.abs(s), 2 / n)]); }
        return pts;
      }
      // Word-wrap text to a width in mm at glyph unit u (cap height = 6u).
      function wrapText(str, u, maxW) {
        var words = String(str).split(/\s+/).filter(Boolean), lines = [], cur = '';
        words.forEach(function (w) {
          var tryS = cur ? cur + ' ' + w : w;
          if (cur && textSegs(tryS, u, u * 0.3).w > maxW) { lines.push(cur); cur = w; } else cur = tryS;
        });
        if (cur) lines.push(cur);

      }


      var DEFAULTS = {
        span: 100, thick: 2.4, veins: 6, border: 1, spotAuto: 5, spotR: 3.2, bodyL: 44, antenna: 22, ant: 1, ridge: 0.9
      };
      // Wing outline handles: angle from the front of the body (0 = nose, 180 = tail) and distance in mm.
      var SHAPES = {
        'Monarch': [[8, 34], [28, 52], [48, 58], [68, 50], [90, 30], [110, 36], [130, 46], [150, 44], [170, 26]],
        'Swallowtail': [[8, 30], [30, 50], [52, 56], [72, 44], [92, 28], [112, 34], [132, 50], [152, 68], [172, 40]],
        'Moth': [[8, 36], [28, 50], [50, 54], [72, 52], [96, 46], [118, 44], [140, 40], [160, 32], [174, 22]],
        'Little blue': [[8, 26], [28, 38], [50, 42], [72, 38], [92, 30], [112, 32], [132, 36], [152, 32], [170, 20]],
        'Heart wings': [[8, 24], [28, 48], [50, 56], [72, 44], [92, 32], [112, 40], [132, 52], [152, 46], [170, 26]]
      };
      var nodes = SHAPES.Monarch.map(function (n) { return n.slice(); }), spots = [], redrawWings = null, api0 = null;

      function polar(phi, r) { var a = phi * DEG; return [r * Math.sin(a), -r * Math.cos(a)]; }
      function outlinePts(sc) {
        var pts = [[0.4, -3]].concat(nodes.map(function (n) { return polar(n[0], n[1] * sc); }), [[0.4, 3]]);
        return curve(pts, 7);
      }
      function radiusAt(O, phi) {
        var best = null, bd = 1e9, i;
        for (i = 0; i < O.length; i++) { var ph = Math.atan2(O[i][0], -O[i][1]) / DEG, d = Math.abs(ph - phi); if (d < bd) { bd = d; best = O[i]; } }
        return best;
      }
      function mirror(pts) { return pts.map(function (q) { return [-q[0], q[1]]; }); }

      function build(p) {
        var out = [], T = p.thick, sc = p.span / 100, O = outlinePts(sc), C = [1.4, 0], i, k;
        var wings = [fanPrism(O, 0, T, C), fanPrism(mirror(O), 0, T, [-C[0], 0])];
        var veins = [], border = [], sp = [];
        var yb = T - 0.3, yt = T + p.ridge;
        if (p.border >= 1) {
          var inner = O.map(function (q) { return [C[0] + (q[0] - C[0]) * 0.92, q[1] * 0.92]; });
          border.push(ringPrism(O.map(function (q) { return [q[0] * 0.995, q[1] * 0.995]; }), inner, yb, yt));
          border.push(ringPrism(mirror(O).map(function (q) { return [q[0] * 0.995, q[1] * 0.995]; }), mirror(inner), yb, yt));
        }
        for (k = 0; k < Math.round(p.veins); k++) {
          var phi = 16 + (148 * k) / Math.max(1, Math.round(p.veins) - 1), e = radiusAt(O, phi), a = polar(phi, 4);
          [1, -1].forEach(function (s) { veins.push(capsule(s * a[0] * 0.5, a[1] * 0.4, s * e[0] * 0.9, e[1] * 0.9, 1.5, yb, yt)); });
        }
        var auto = Math.round(p.spotAuto);
        for (k = 0; k < auto; k++) {
          var ph2 = 20 + (130 * k) / Math.max(1, auto - 1), e2 = radiusAt(O, ph2);
          [1, -1].forEach(function (s) { sp.push(slab(circlePts(s * e2[0] * 0.66, e2[1] * 0.66, p.spotR, 24), yb, yt + 0.2)); });
        }
        spots.forEach(function (q) { [1, -1].forEach(function (s) { sp.push(slab(circlePts(s * q.x, q.z, q.r, 24), yb, yt + 0.2)); }); });
        // body, head and antennae lie on the bed
        var bl = p.bodyL / 2, body = [xform(ball(3.1, 3.1, bl, 40), { t: [0, 3.1, 0] }), xform(ball(3.7, 3.4, 3.7, 32), { t: [0, 3.4, -bl - 1.5] })], ants = [];
        if (p.ant >= 1) [1, -1].forEach(function (s) {
          var hz = -bl - 3, pts = curve([[s * 1.2, hz], [s * p.antenna * 0.3, hz - p.antenna * 0.5], [s * p.antenna * 0.55, hz - p.antenna]], 6);
          // alternate segment heights by a hair so neighbouring segments never share a side edge
          for (i = 0; i < pts.length - 1; i++) ants.push(capsule(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], 1.7, 0, i % 2 ? 1.82 : 1.8));
          ants.push(slab(circlePts(pts[pts.length - 1][0], pts[pts.length - 1][1], 2.1, 20), 0, 1.84));
        });
        pushMesh(out, mesh('wings', wings)); pushMesh(out, mesh('veins', veins)); pushMesh(out, mesh('border', border));
        pushMesh(out, mesh('spots', sp)); pushMesh(out, mesh('body', body)); pushMesh(out, mesh('antennae', ants));
        return out;
      }

      // ---- Wing canvas: drag the handles; the left wing mirrors live ----
      function drawWings(cv) {
        var g = cv.getContext('2d'), w = cv.width, h = cv.height, sc = 2.2, cx = w / 2, cy = h * 0.5, i;
        g.clearRect(0, 0, w, h);
        var O = outlinePts(1);
        function path(pts, s) { g.beginPath(); pts.forEach(function (q, k) { var X = cx + s * q[0] * sc, Y = cy + q[1] * sc; if (k) g.lineTo(X, Y); else g.moveTo(X, Y); }); g.closePath(); }
        g.fillStyle = 'rgba(255,212,0,0.22)'; g.strokeStyle = '#ffd400'; g.lineWidth = 2;
        path(O, 1); g.fill(); g.stroke();
        g.fillStyle = 'rgba(0,229,255,0.14)'; g.strokeStyle = '#00e5ff88'; path(O, -1); g.fill(); g.stroke();
        spots.forEach(function (q) { g.fillStyle = '#ff6ec7'; g.beginPath(); g.arc(cx + q.x * sc, cy + q.z * sc, q.r * sc, 0, TAU); g.fill(); });
        g.strokeStyle = '#eef7ff'; g.lineWidth = 6; g.lineCap = 'round'; g.beginPath(); g.moveTo(cx, cy - 20 * sc); g.lineTo(cx, cy + 20 * sc); g.stroke();
        nodes.forEach(function (n) { var q = polar(n[0], n[1]); g.fillStyle = '#fff'; g.strokeStyle = '#0d2b59'; g.lineWidth = 2; g.beginPath(); g.arc(cx + q[0] * sc, cy + q[1] * sc, 7, 0, TAU); g.fill(); g.stroke(); });
      }
      function mountWings(container, api) {
        container.appendChild(mkEl('p', { class: 'mm-note' }, 'Drag the white handles to reshape the right wing; the left wing copies it. Click the wings in 3D to add spots (Spots tab).'));
        var cv = mkCanvas(container, 300, 290), drag = -1;
        redrawWings = function () { if (api0) drawWings(cv); };
        dragCanvas(cv, function (x, y, phase) {
          var sc = 2.2, px = (x * cv.width - cv.width / 2) / sc, pz = (y * cv.height - cv.height * 0.5) / sc, i;
          if (phase === 'down') { var bd = 1e9; drag = -1; nodes.forEach(function (n, k) { var q = polar(n[0], n[1]), d = Math.hypot(q[0] - px, q[1] - pz); if (d < bd) { bd = d; drag = k; } }); if (bd > 9) drag = -1; }
          if (drag < 0 || phase === 'up') return;
          var phi = Math.atan2(px, -pz) / DEG, r = Math.hypot(px, pz), lo = drag ? nodes[drag - 1][0] + 6 : 4, hi = drag < nodes.length - 1 ? nodes[drag + 1][0] - 6 : 176;
          nodes[drag] = [Math.max(lo, Math.min(hi, phi)), Math.max(14, Math.min(78, r))];
          redrawWings(); api.rebuild();
        });
        var row = mkEl('div', { class: 'mm-export-row' });
        Object.keys(SHAPES).forEach(function (nm) { row.appendChild(mkBtn(nm, function () { nodes = SHAPES[nm].map(function (n) { return n.slice(); }); redrawWings(); api.rebuild(); })); });
        container.appendChild(row);
        setTimeout(redrawWings, 50);
      }

      window.MM_GENERATOR = {
        code: 'MM-034',
        category: 'SPRING // BUTTERFLIES',
        title: 'Butterfly Wings',
        fileName: 'Butterfly',
        palette: [
          { name: 'Monarch Orange', color: '#fb923c' },
          { name: 'Spring Pink', color: '#fbb6ce' },
          { name: 'Sky Blue', color: '#93c5fd' },
          { name: 'Lilac', color: '#c4a3f5' },
          { name: 'Sunny Yellow', color: '#fde047' },
          { name: 'Mint Green', color: '#86efac' },
          { name: 'Bone White', color: '#f1f5f9' },
          { name: 'Shadow Black', color: '#334155' }
        ],
        defaultColor: '#fb923c',
        partNames: { wings: 'Wings', veins: 'Veins', border: 'Wing edge', spots: 'Spots', body: 'Body', antennae: 'Antennae' },
        openGroups: ['Butterfly'],
        extrasTitle: 'Shape the wings',
        parameters: [
          { group: 'Butterfly', key: 'span', label: 'Wing size', unit: '%', min: 50, max: 120, step: 1, value: DEFAULTS.span },
          { group: 'Butterfly', key: 'thick', label: 'Wing thickness', unit: ' mm', min: 1.6, max: 5, step: 0.2, value: DEFAULTS.thick },
          { group: 'Butterfly', key: 'bodyL', label: 'Body length', unit: ' mm', min: 28, max: 70, step: 1, value: DEFAULTS.bodyL },
          { group: 'Butterfly', key: 'antenna', label: 'Antenna length', unit: ' mm', min: 10, max: 40, step: 1, value: DEFAULTS.antenna },
          toggle('Butterfly', 'ant', 'Antennae', 'None', 'Shown', DEFAULTS.ant),
          { group: 'Pattern', key: 'veins', label: 'Wing veins', unit: '', min: 0, max: 10, step: 1, value: DEFAULTS.veins },
          toggle('Pattern', 'border', 'Edge trim', 'None', 'Raised edge', DEFAULTS.border),
          { group: 'Pattern', key: 'spotAuto', label: 'Automatic spots per wing', unit: '', min: 0, max: 8, step: 1, value: DEFAULTS.spotAuto },
          { group: 'Pattern', key: 'ridge', label: 'Raised pattern height', unit: ' mm', min: 0.6, max: 1.8, step: 0.1, value: DEFAULTS.ridge },
          { tab: 'spots', group: 'Click-on spots', key: 'spotR', label: 'Spot size', unit: ' mm', min: 1.6, max: 9, step: 0.2, value: DEFAULTS.spotR }
        ],
        presets: [
          presetOf(DEFAULTS, 'Monarch', {}),
          presetOf(DEFAULTS, 'Plain wings', { veins: 0, border: 0, spotAuto: 0 }),
          presetOf(DEFAULTS, 'Spotty', { veins: 0, border: 1, spotAuto: 8, spotR: 3.8 }),
          presetOf(DEFAULTS, 'Fridge magnet size', { span: 55, bodyL: 28, antenna: 14, veins: 4, spotAuto: 3, spotR: 2.2 }),
          presetOf(DEFAULTS, 'Big and bold', { span: 118, thick: 3, veins: 7, ridge: 1.2 })
        ],
        tabs: [{
          id: 'spots',
          label: 'Spots',
          hint: 'Click a wing to add a spot (the other wing copies it)',
          mount: function (container, api) {
            container.appendChild(mkEl('p', { class: 'mm-note' }, 'Click either wing in the 3D view to add a spot; Spot size sets how big the next one is.'));
            var r = mkEl('div', { class: 'mm-export-row' });
            r.appendChild(mkBtn('Undo spot', function () { spots.pop(); if (redrawWings) redrawWings(); api.rebuild(); }));
