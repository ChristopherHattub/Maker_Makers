            hu: sd * Math.sin(flare), hv: Math.cos(flare),
            L: 21 * E * Math.max(s, 0.85), tau: 34 * DEG,
            a: 6.4 * Math.pow(E, 0.6), b: 3.3 * Math.pow(E, 0.4), inner: true
          };
          var e = earShapes(sp);
          add('ears', e.outer);
          add('innerEars', e.inner);
        });

        // Face.
        var H = D.head, fu = H.a, fv = H.b, halloween = p.face >= 1;
        var eyeU = (halloween ? 0.45 : 0.41) * fu, eyeV = H.cv + (halloween ? 0.12 : 0.10) * fv;
        [1, -1].forEach(function (sd) {
          var ex = sd * eyeU;
          if (!halloween) {
            var ea = 4.2 * s, eb = 4.6 * s, yb = Math.min(surf(ex - ea, eyeV), surf(ex + ea, eyeV), surf(ex, eyeV - eb), surf(ex, eyeV + eb)) - 0.8;
            var et = surf(ex, eyeV) + 2.4;
            var eye = { cu: ex, cv: eyeV, a: ea, b: eb, y0: yb, top: et, rot: 0 };
            add('eyes', dome(eye, 10, 36));
            var pup = { cu: ex + sd * -0.2, cv: eyeV - 0.2, a: ea * 0.66, b: eb * 0.66, y0: et - 1.6, top: et + 0.9, rot: 0 };
            add('pupils', dome(pup, 8, 28));
            var gu = pup.cu - sd * 0.9, gv = pup.cv + 1.1;
            var glint = { cu: gu, cv: gv, a: 0.85, b: 0.85, y0: domeAt(pup, gu, gv) - 0.6, top: domeAt(pup, gu, gv) + 0.45, rot: 0 };
            add('glints', dome(glint, 5, 16));
          } else {
            var A28 = 28 * DEG, ea2 = 5.6 * s, eb2 = 3.3 * s;
            // long axis rises outward; domeAt/dome rot is the angle of the long axis from +u toward +v
            var rot = sd * A28;
            var ym = Math.min(surf(ex, eyeV), surf(ex + ea2, eyeV), surf(ex - ea2, eyeV), surf(ex, eyeV + eb2), surf(ex, eyeV - eb2)) - 0.8;
            var et2 = surf(ex, eyeV) + 2.2;
            var eye2 = { cu: ex, cv: eyeV, a: ea2, b: eb2, y0: ym, top: et2, rot: rot };
            add('eyes', dome(eye2, 10, 36));
            var slit = { cu: ex, cv: eyeV, a: 0.95, b: 2.5, y0: et2 - 1.8, top: et2 + 0.8, rot: 0 };
            add('pupils', dome(slit, 8, 24));
            // angry brow above the eye
            var cd = [sd * Math.cos(A28), Math.sin(A28)], perp = [-sd * Math.sin(A28), Math.cos(A28)];
            var bc = [ex + perp[0] * (eb2 + 2.2), eyeV + perp[1] * (eb2 + 2.2)], path = [], q;
            for (q = 0; q <= 8; q++) {
              var x = lerp(-ea2 * 0.12, ea2 + 0.9, q / 8);
              path.push([bc[0] + cd[0] * x, bc[1] + cd[1] * x]);
            }
            add('brows', ridge(path, function (t) { return 1.5 * (1 - 0.35 * t); }, function () { return 1.5; }, 1.0, surf));
          }
        });
        // nose
        var nv = H.cv - 0.17 * fv;
        var nose = halloween
          ? { cu: 0, cv: nv, a: 2.2, b: 1.5, y0: surf(0, nv) - 1.0, top: surf(0, nv) + 1.5, rot: 0 }
          : { cu: 0, cv: nv, a: 2.4, b: 1.7, y0: surf(0, nv) - 1.0, top: surf(0, nv) + 1.9, rot: 0 };
        add('nose', dome(nose, 8, 24));

        // mouth and fangs
        var mv = H.cv - 0.50 * fv, half = halloween ? 0.60 * fu : 0.40 * fu, curve = halloween ? 3.2 : 1.7, mp = [], q2;
        function lip(u) { return mv + curve * sq(u / half); }
        for (q2 = 0; q2 <= 14; q2++) { var uu = lerp(-half, half, q2 / 14); mp.push([uu, lip(uu)]); }
        add('mouth', ridge(mp, function () { return 0.8; }, function () { return 1.0; }, 0.9, surf));
        var FL = Math.min(p.fang, 0.75 * H.b);   // a fang never runs off the head
        function fang(u, len, w) {
          if (len < 0.8) return;
          var path = [], m = 7, k;
          for (k = 0; k <= m; k++) path.push([u * (1 + 0.04 * k / m), lip(u) - 0.6 - len * k / m]);
          add('fangs', ridge(path, function (t) { return Math.max(w * (1 - t), 0.2); }, function (t) { return lerp(2.2, 0.7, t); }, 1.0, surf));
        }
        if (halloween) {
          var fu1 = 0.215 * fu * 1;
          fang(-fu1 * 1.0, FL, 1.8); fang(fu1 * 1.0, FL, 1.8);
          fang(0, FL * 0.45, 1.3);
          fang(-half * 0.8, FL * 0.5, 1.3); fang(half * 0.8, FL * 0.5, 1.3);
        } else {
          fang(-half * 0.55, FL * 0.85, 1.5); fang(half * 0.55, FL * 0.85, 1.5);
        }

        // Hanging loop on the feet end.
        if (HANG && p.loop >= 1) {
          var Rc = 5.6, rw = 2.2, hh = 3.2, cvL = G.rear[1] - 3.2, rings = [], a, K = 9, ps, kk, SEGL = 40;
          for (ps = 0; ps < SEGL; ps++) {
            var psi = (ps / SEGL) * Math.PI * 2, ring = [];
            for (kk = 0; kk <= K; kk++) {
              a = Math.PI * (1 - kk / K);
              var rho = Rc + rw * Math.cos(a);
              ring.push([rho * Math.cos(psi), hh * Math.sin(a), cvL + rho * Math.sin(psi)]);
            }
            rings.push(ring);
          }
          add('loop', skin(rings, true));
        }

        return finish(shells);
      }

      // Map design space to the printed pose, orient each shell and pack the meshes.
      function finish(shells) {
        var out = [];
        Object.keys(shells).forEach(function (name) {
          var total = 0;
          var parts = shells[name].map(function (arr) {
            var f = new Float32Array(arr.length), i, vol = 0;
            for (i = 0; i < arr.length; i += 3) {
              var u = arr[i], y = arr[i + 1], v = arr[i + 2];
              f[i] = HANG ? -u : u; f[i + 1] = y; f[i + 2] = HANG ? v : -v;
            }
            for (i = 0; i < f.length; i += 9) {
              vol += f[i] * (f[i + 4] * f[i + 8] - f[i + 5] * f[i + 7])
                - f[i + 1] * (f[i + 3] * f[i + 8] - f[i + 5] * f[i + 6])
                + f[i + 2] * (f[i + 3] * f[i + 7] - f[i + 4] * f[i + 6]);
            }
            if (vol < 0) {
              for (i = 0; i < f.length; i += 9) {
                for (var t = 0; t < 3; t++) { var sv = f[i + 3 + t]; f[i + 3 + t] = f[i + 6 + t]; f[i + 6 + t] = sv; }
              }
            }
            total += f.length;
            return f;
          });
          var pos = new Float32Array(total), at = 0;
          parts.forEach(function (f) { pos.set(f, at); at += f.length; });
          out.push({ name: name, positions: pos });
        });
        return out;
      }

      var DEFAULTS = { span: 130, fingers: 4, scallop: 28, thick: 2.4, boneH: 1.4, ears: 100, flare: 22, face: 0, fang: 3.5, hang: 0, loop: 1, body: 100 };

          { name: 'Pumpkin Matte', color: '#fdba74' },
          { name: 'Blush Pink', color: '#fda4af' },
          { name: 'Slime Green', color: '#a3e635' },
          { name: 'Ember Red', color: '#f0584a' },
          { name: 'Moon Yellow', color: '#fde047' }
        ],
        partNames: {
          body: 'Body & head', wings: 'Wing membrane', bones: 'Wing bones', ears: 'Ears', innerEars: 'Inner ears', fur: 'Chest fur',
          eyes: 'Eyes', pupils: 'Pupils', glints: 'Eye glints', brows: 'Brows', nose: 'Nose', mouth: 'Mouth',
          fangs: 'Fangs', loop: 'Hanging loop'
        },
        parameters: [
          { group: 'Wings', key: 'span', label: 'Wingspan', unit: ' mm', min: 80, max: 170, step: 1, value: DEFAULTS.span },
          { group: 'Wings', key: 'fingers', label: 'Wing bones per wing', unit: '', min: 2, max: 6, step: 1, value: DEFAULTS.fingers },
          { group: 'Wings', key: 'scallop', label: 'Scallop depth (shallow ↔ deep)', unit: '%', min: 8, max: 45, step: 1, value: DEFAULTS.scallop },
          { group: 'Wings', key: 'thick', label: 'Membrane thickness', unit: ' mm', min: 1.6, max: 4, step: 0.1, value: DEFAULTS.thick },
          { group: 'Wings', key: 'boneH', label: 'Bone height', unit: ' mm', min: 0.6, max: 2.4, step: 0.1, value: DEFAULTS.boneH },
          { group: 'Head & face', key: 'face', label: 'Face', unit: '', min: 0, max: 1, step: 1, value: DEFAULTS.face, options: ['Cute', 'Halloween'] },
          { group: 'Head & face', key: 'ears', label: 'Ear size', unit: '%', min: 50, max: 160, step: 5, value: DEFAULTS.ears },
          { group: 'Head & face', key: 'flare', label: 'Ear flare (upright ↔ spread)', unit: '°', min: 0, max: 35, step: 1, value: DEFAULTS.flare },
          { group: 'Head & face', key: 'fang', label: 'Fang length (0 = none)', unit: ' mm', min: 0, max: 10, step: 0.5, value: DEFAULTS.fang },
          { group: 'Body & pose', key: 'hang', label: 'Pose', unit: '', min: 0, max: 1, step: 1, value: DEFAULTS.hang, options: ['Perched', 'Hanging'] },
          { group: 'Body & pose', key: 'loop', label: 'Hanging loop (hanging only)', unit: '', min: 0, max: 1, step: 1, value: DEFAULTS.loop, options: ['Off', 'On'], showIf: function (q) { return q.hang >= 1; } },
          { group: 'Body & pose', key: 'body', label: 'Body size', unit: '%', min: 70, max: 140, step: 5, value: DEFAULTS.body }
        ],
        presets: [

          { label: 'Halloween hanger', values: { span: 140, fingers: 4, scallop: 32, thick: 2.4, boneH: 1.4, flare: 22, face: 1, fang: 6, ears: 115, hang: 1, loop: 1, body: 100 } },
          { label: 'Spooky perched bat', values: { span: 135, fingers: 4, scallop: 34, thick: 2.4, boneH: 1.4, face: 1, fang: 5.5, ears: 110, flare: 24, hang: 0, loop: 1, body: 100 } },
          { label: 'Big-eared perched bat', values: { span: 110, fingers: 3, scallop: 24, thick: 2.4, boneH: 1.4, face: 0, fang: 2, ears: 130, flare: 18, hang: 0, body: 110 } },
          { label: 'Vampire bat', values: { span: 165, fingers: 5, scallop: 40, face: 1, fang: 9, ears: 120, flare: 28, hang: 1, loop: 1, body: 100 } },
          { label: 'Tiny charm', values: { span: 80, fingers: 3, scallop: 22, thick: 2.4, boneH: 1.0, face: 0, fang: 0, ears: 100, hang: 1, loop: 1, body: 80 } },
