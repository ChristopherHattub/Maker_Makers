<!doctype html>

  <title>MM-008 Holiday Tree // Maker Makers</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    body.mm-soft.holiday {

      --s-text: #3b2a2a; --s-muted: #8a6e6e; --s-amber: #e9892a; --s-green: #2f9e63; --s-edge: #ecd3b8;
      --s-card: #fdf0dc; --s-card-a: rgba(255,248,238,0.9); --s-stage: linear-gradient(#2b1d24, #4a2c2a);
      --s-font: ui-rounded, 'Arial Rounded MT Bold', 'Trebuchet MS', 'Segoe UI', sans-serif;
      --s-bg-img: linear-gradient(#4a2530, #2b1a20);
    }
    .holiday .mm-gen-title { font-weight: 700; }
    .ht-row { display: flex; flex-direction: column; gap: 0.15rem; margin: 0 0 0.5rem; }
    .ht-label { font-size: 0.78rem; color: var(--s-muted); line-height: 1.1; }
    .ht-tiles, .ht-tools { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .ht-tools { margin: 0.7rem 0 0.3rem; align-items: center; }
    .ht-tile { width: 2.7rem; height: 2.7rem; padding: 0.22rem; border-radius: 12px; border: 2px solid var(--s-edge); background: #fff; cursor: pointer;
      box-shadow: 0 2px 0 var(--s-edge); transition: transform .12s, box-shadow .12s; }
    .ht-tile svg { width: 100%; height: 100%; display: block; }
    .ht-tile:hover { transform: translateY(-2px); }
    .ht-tile:active { transform: translateY(1px); box-shadow: none; }
    .ht-tile[aria-pressed="true"] { border-color: var(--s-accent); background: #ffe9ec; transform: scale(1.08); }
    .ht-tile:focus-visible { outline: 3px solid var(--s-accent); outline-offset: 2px; }
    .ht-shape { margin-top: 0.8rem; }
  </style>
</head>
<body class="mm-gen mm-soft holiday">
  <script>
    // Holiday Tree: parameters, presets, palette and geometry. The page layout, the viewport,
    // the Color tool and the exports come from shared/generator-core.js.
    (function () {
      'use strict';

      // ---- Geometry kit: closed shells built from rings (shared vertices, so always watertight) ----
      var TAU = Math.PI * 2;
      function rad(d) { return (d * Math.PI) / 180; }
      function sqr(x) { return x * x; }
      function vsub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
      function vadd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }

      function vnorm(a) { var l = Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }

        }

        for (i = 0; i < idx.length; i += 3) {

        }
        return out;
      }

      function cat(list) {
        var n = 0, i;
        for (i = 0; i < list.length; i++) n += list[i].length;
        var out = new Float32Array(n), at = 0;
        for (i = 0; i < list.length; i++) { out.set(list[i], at); at += list[i].length; }
        return out;
      }

      // Circle / ellipse loop in the XZ plane at height y. o: { cx, cz, sx, sz, rot }.
      function loopXZ(r, y, seg, o) {
        o = o || {};
        var cx = o.cx || 0, cz = o.cz || 0, sx = o.sx || 1, sz = o.sz || 1, rot = o.rot || 0;
        var cr = Math.cos(rot), sr = Math.sin(rot), out = [], j, a, x, z;
        for (j = 0; j < seg; j++) {
          a = (j / seg) * TAU;
          x = r * sx * Math.cos(a); z = r * sz * Math.sin(a);
          out.push([cx + x * cr - z * sr, y, cz + x * sr + z * cr]);

      }

      // Solid of revolution from a profile [[r, y, dx, dz], ...] (bottom to top). r = 0 makes a pole.
      function lathe(profile, seg, o) {
        o = o || {};

          var oo = { cx: (o.cx || 0) + (p[2] || 0), cz: (o.cz || 0) + (p[3] || 0), sx: o.sx, sz: o.sz, rot: o.rot };

          return loopXZ(p[0], p[1], seg, oo);
        });
        return shell(rings, false);
      }

      // Closed ring-shaped solid (torus-like): cross-section polygon [[r, y], ...] revolved around Y.
      function bandRing(poly, seg, o) {
        return shell(poly.map(function (p) { return loopXZ(p[0], p[1], seg, o); }), true);
      }

      // Sphere or ellipsoid. tFrom > 0 starts the sphere at a flat cut (polar angle from the bottom pole).
      function ball(cx, cy, cz, rx, ry, rz, seg, steps) {

      }

      // Rounded rectangle loop (counter-clockwise from above) at height y.
      function rrect(hx, hz, cr, y, arcN, cx, cz) {
        cr = Math.max(0.05, Math.min(cr, Math.min(hx, hz) - 0.02));
        var out = [], k, a, corners = [[hx - cr, hz - cr, 0], [-(hx - cr), hz - cr, 90], [-(hx - cr), -(hz - cr), 180], [hx - cr, -(hz - cr), 270]];
        corners.forEach(function (c) {
          for (k = 0; k <= arcN; k++) {
            a = rad(c[2] + (k / arcN) * 90);
            out.push([(cx || 0) + c[0] + cr * Math.cos(a), y, (cz || 0) + c[1] + cr * Math.sin(a)]);

      }
      function centroid(loop) {

      }
      // Loft of loops with flat end caps.
      function loftCapped(loops) {

        return shell(rings, false);
      }

      // Rod with rounded ends from a to b, radius ra at a and rb at b.
      function capsule(a, b, ra, rb, seg, capN) {
        var d = vnorm(vsub(b, a));

        var u = vnorm(vcross(d, ax)), v = vcross(d, u);

          var out = [], j, ang;
          for (j = 0; j < seg; j++) {
            ang = (j / seg) * TAU;
            out.push(vadd(c, vadd(vmul(u, r * Math.cos(ang)), vmul(v, r * Math.sin(ang)))));

        }

        for (k = 1; k <= capN; k++) {

        }

          phi = (Math.PI / 2) * (1 - k / capN);
          rings.push(ring(vadd(b, vmul(d, rb * Math.cos(phi))), rb * Math.sin(phi)));
        }
        rings.push({ pole: vadd(b, vmul(d, rb)) });
        return shell(rings, false);
      }

      function smootherstep(x) {
        var t = Math.max(0, Math.min(1, x));
        return t * t * t * (t * (t * 6 - 15) + 10);
      }
      function el(tag, attrs, text) {
        var node = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (k) {
          if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
          else node.setAttribute(k, attrs[k]);
        });
        if (text) node.textContent = text;
        return node;
      }
      function withDefaults(defaults, over) {
        var values = {};
        Object.keys(defaults).forEach(function (k) { values[k] = defaults[k]; });
        Object.keys(over).forEach(function (k) { values[k] = over[k]; });
        return values;
      }

      // Ornament hook: a small ring standing up on a model (plane faces +Z) so it can be hung from a string.
      // Bottom of the ring sits `embed` mm inside the model at (cx, baseY, cz).
      function hookRing(cx, baseY, cz, hole, tube, embed) {
        var Rc = hole + tube, cy = baseY - embed + Rc + tube, N = 40, k, rings = [];
        var oct = [[-1, -0.5], [-0.5, -1], [0.5, -1], [1, -0.5], [1, 0.5], [0.5, 1], [-0.5, 1], [-1, 0.5]];
        for (k = 0; k < N; k++) {
          var th = (k / N) * TAU, c = Math.cos(th), s = Math.sin(th), ring = [];
          oct.forEach(function (q) {
            ring.push([cx + (Rc + q[0] * tube) * c, cy + (Rc + q[0] * tube) * s, cz + q[1] * tube * 1.15]);
          });
          rings.push(ring);
        }
        return shell(rings, true);
      }


      // ---- Ornament library: shapes you pick, each in several colors, placed by clicking the tree ----
      var COLORS = [
        { id: 'red', name: 'Red', hex: '#e5484d' }, { id: 'gold', name: 'Gold', hex: '#f6b93b' },
        { id: 'blue', name: 'Blue', hex: '#3b82f6' }, { id: 'purple', name: 'Purple', hex: '#a78bfa' },
        { id: 'pink', name: 'Pink', hex: '#f472b6' }, { id: 'white', name: 'White', hex: '#f1f5f9' }
      ];
      var ITEMS = [
        { id: 'ball', name: 'Ball' }, { id: 'star', name: 'Star' }, { id: 'heart', name: 'Heart' },
        { id: 'bell', name: 'Bell' }, { id: 'cane', name: 'Candy cane' }, { id: 'snow', name: 'Snowflake' },
        { id: 'gift', name: 'Present' }, { id: 'ginger', name: 'Gingerbread' }, { id: 'holly', name: 'Holly' }
      ];
      var ITEM_NAME = {};
      ITEMS.forEach(function (d) { ITEM_NAME[d.id] = d.name; });
      var PART_NAMES = { tree: 'Tree boughs', trunk: 'Trunk', base: 'Snow base', hook: 'Ornament hook', topper: 'Topper' };

      var ornaments = []; // { id, type, color, size, rotation, point: [x, y, z], normal: [x, y, z], ref: { h, r } }
      var nextId = 1;
      var pick = { type: 'ball', color: COLORS[0].hex };   // type 'erase' removes ornaments
      var refreshPanel = null;
      var T3 = null;   // THREE from the engine api (the mesh check passes it the same way)

      function colorName(hex) {
        var c = COLORS.filter(function (k) { return k.hex === hex; })[0];
        return c ? c.name : 'Custom';
      }
      function shadeHex(hex, f) {
        var n = parseInt(hex.slice(1), 16);
        return 'rgb(' + Math.round(((n >> 16) & 255) * f) + ',' + Math.round(((n >> 8) & 255) * f) + ',' + Math.round((n & 255) * f) + ')';
      }

      function strokeOutline(pts, hw) {
        var left = [], right = [], i, a, b, dx, dy, l;
        for (i = 0; i < pts.length; i++) {
          a = pts[Math.max(0, i - 1)]; b = pts[Math.min(pts.length - 1, i + 1)];
          dx = b[0] - a[0]; dy = b[1] - a[1]; l = Math.sqrt(dx * dx + dy * dy) || 1;
          left.push([pts[i][0] - (dy / l) * hw, pts[i][1] + (dx / l) * hw]);
          right.push([pts[i][0] + (dy / l) * hw, pts[i][1] - (dx / l) * hw]);
        }
        return left.concat(right.reverse());
      }
      function mirrorHalf(half) {
        var out = half.slice(), i;
        for (i = half.length - 1; i >= 1; i--) out.push([-half[i][0], half[i][1]]);
        return out;
      }
      function leaf(angleDeg, len, wid, ox, oy) {
        var up = [], dn = [], i, s, w, a = rad(angleDeg), c = Math.cos(a), sn = Math.sin(a);
        for (i = 0; i <= 12; i++) {
          s = i / 12; w = wid * Math.pow(Math.sin(Math.PI * s), 0.8);
          up.push([s * len, w]); dn.push([s * len, -w]);
        }
        return up.concat(dn.reverse()).map(function (q) { return [ox + q[0] * c - q[1] * sn, oy + q[0] * sn + q[1] * c]; });
      }
      function disc(cx, cy, r, n) {
        var out = [], i;
        for (i = 0; i < n; i++) out.push([cx + r * Math.cos((i / n) * TAU), cy + r * Math.sin((i / n) * TAU)]);
        return out;
      }

      // Outline polygons (unit radius). Each polygon is extruded as its own solid; overlaps are fine.
      function stampPolys(type) {
        var i, a, pts = [];
        if (type === 'star') {
          for (i = 0; i < 10; i++) { a = (i * Math.PI) / 5 + Math.PI / 2; pts.push([Math.cos(a) * (i % 2 ? 0.46 : 1), Math.sin(a) * (i % 2 ? 0.46 : 1)]); }
          return [pts];
        }
        if (type === 'snow') {
          var spec = [[-30, 0.3], [-17, 0.68], [-8, 0.5], [0, 1], [8, 0.5], [17, 0.68]];
          for (i = 0; i < 6; i++) spec.forEach(function (sp) { var an = rad(90 + i * 60 + sp[0]); pts.push([Math.cos(an) * sp[1], Math.sin(an) * sp[1]]); });
          return [pts];
        }
        if (type === 'heart') {
          for (i = 0; i < 36; i++) {
            a = (i / 36) * TAU;
            pts.push([(16 * Math.pow(Math.sin(a), 3)) / 17, (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a) + 2.5) / 17]);
          }
          return [pts];
        }
        if (type === 'bell') {
          return [mirrorHalf([[0, 1], [0.2, 0.94], [0.35, 0.74], [0.4, 0.35], [0.5, -0.1], [0.7, -0.45], [0.82, -0.58], [0.82, -0.7], [0.2, -0.7], [0.2, -0.82], [0.1, -1]])];
        }
        if (type === 'cane') {
          var cl = [[0.32, -1], [0.32, -0.5], [0.32, 0]];
          for (i = 0; i <= 14; i++) { a = (i / 14) * Math.PI; cl.push([-0.08 + 0.4 * Math.cos(a), 0 + 0.4 * Math.sin(a)]); }

      // Picker tile: the ornament drawn in its own color.
      function tileIcon(type, hex) {

        if (type === 'erase') return '<svg viewBox="-1.1 -1.1 2.2 2.2" aria-hidden="true"><path d="M-0.7 0.35 L0.1 -0.65 L0.8 -0.1 L0 0.9 Z" fill="#f9a8b8" stroke="#b9546a" stroke-width="0.07" stroke-linejoin="round"/><path d="M-0.7 0.35 L0.1 -0.65" stroke="#b9546a" stroke-width="0.07"/><path d="M-0.2 0.95 H0.9" stroke="#b9546a" stroke-width="0.09" stroke-linecap="round"/></svg>';
        if (type === 'ball') {
          return '<svg viewBox="-1.1 -1.1 2.2 2.2" aria-hidden="true"><rect x="-0.24" y="-1.02" width="0.48" height="0.32" rx="0.06" fill="#d9a441" stroke="#8a6420" stroke-width="0.06"/><circle cx="0" cy="0.14" r="0.82" fill="' + hex + '"' + stroke + '/><ellipse cx="-0.3" cy="-0.22" rx="0.17" ry="0.3" fill="#fff" opacity="0.5" transform="rotate(32 -0.3 -0.22)"/></svg>';

      // Ornament mesh in model space: sunk `embed` mm into the surface and standing `depth - embed` mm proud.

        var quat = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(tx, ty, normal));
        var matrix = new THREE.Matrix4().compose(new THREE.Vector3().fromArray(stamp.point), quat, new THREE.Vector3(1, 1, 1));
        var flat = geo.toNonIndexed();

      }

      // An ornament follows the tree when its height or width changes: scale its spot with the tree.
      function placed(st, p) {
        var ref = st.ref || { h: p.height, r: p.baseR };
        var sx = p.baseR / ref.r, sy = p.height / ref.h;

        // Fireplace on the back wall
        function brick(w, h) {
          var tex = canvasTex(T, 320, 112, function (g, cw, ch) {
            var R = rnd(5), r, x;
            g.fillStyle = '#d9cbb6'; g.fillRect(0, 0, cw, ch);

        var zf = Z0 + DP;

        });
        var knot = new T.Mesh(new T.SphereGeometry(2.4, 8, 8), red);
        knot.position.set(FX, 104.8, Z0 + 18); group.add(knot);
        function stocking(x, col) {
          var s = new T.Shape();
          s.moveTo(-5, 0); s.lineTo(5, 0); s.lineTo(5, -15); s.lineTo(13, -17); s.lineTo(19, -21); s.lineTo(17, -26); s.lineTo(10, -26); s.lineTo(-3, -20); s.lineTo(-5, -14); s.closePath();
          var m = new T.Mesh(new T.ExtrudeGeometry(s, { depth: 3, bevelEnabled: false }), std({ color: col }));
          m.position.set(x, 68, Z0 + DP + 9.5); group.add(m);
          var cuff = new T.Mesh(new T.BoxGeometry(11.6, 4.4, 3.8), std({ color: 0xf8f5ee }));
          cuff.position.set(x, 66.4, Z0 + DP + 11); group.add(cuff);
        }
        stocking(FX - 50, 0xd63a40); stocking(FX, 0x2e8b57); stocking(FX + 50, 0xd63a40);

        // Window with a snowy night outside
        var nightTex = canvasTex(T, 128, 160, function (g, w, h) {
          var R = rnd(3), i, grad = g.createLinearGradient(0, 0, 0, h);
          grad.addColorStop(0, '#0f1b3d'); grad.addColorStop(1, '#3a5aa0');
          g.fillStyle = grad; g.fillRect(0, 0, w, h);
          g.fillStyle = '#f7f3d6'; g.beginPath(); g.arc(94, 34, 11, 0, TAU); g.fill();
          g.fillStyle = '#0f1b3d'; g.beginPath(); g.arc(99, 31, 10, 0, TAU); g.fill();
          g.fillStyle = '#ffffff';
          for (i = 0; i < 40; i++) { g.globalAlpha = 0.4 + R() * 0.6; g.fillRect(R() * w, R() * h * 0.8, 2, 2); }
          g.globalAlpha = 1; g.fillStyle = '#e8f1ff'; g.beginPath(); g.moveTo(0, h); g.lineTo(0, h - 26); g.quadraticCurveTo(w / 2, h - 44, w, h - 22); g.lineTo(w, h); g.fill();
        });
        nightTex.wrapS = nightTex.wrapT = T.ClampToEdgeWrapping;
        var WX = 82, WY = 122, white = std({ color: 0xf8f4ec });
        box(70, 86, 3, white, WX, WY, Z0 + 1.5);
        plane(60, 76, new T.MeshBasicMaterial({ map: nightTex }), WX, WY, Z0 + 3.1, 0);
        box(60, 1.8, 2, white, WX, WY, Z0 + 3.6); box(1.8, 76, 2, white, WX, WY, Z0 + 3.6);
        box(78, 4, 8, white, WX, WY - 44, Z0 + 4);
        box(10, 92, 4, red, WX - 40, WY, Z0 + 5); box(10, 92, 4, red, WX + 40, WY, Z0 + 5);

        // Pictures on the side walls
        function frame(x, y, z, ry, col) {
          var pic = canvasTex(T, 64, 48, function (g, w, h) {
            var grad = g.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, col[0]); grad.addColorStop(1, col[1]);
            g.fillStyle = grad; g.fillRect(0, 0, w, h);
            g.fillStyle = '#fff6c9'; g.beginPath(); g.arc(46, 14, 6, 0, TAU); g.fill();
            g.fillStyle = col[2]; g.beginPath(); g.moveTo(0, h); g.lineTo(18, 20); g.lineTo(34, h); g.fill();
            g.beginPath(); g.moveTo(22, h); g.lineTo(44, 26); g.lineTo(64, h); g.fill();
          });
          pic.wrapS = pic.wrapT = T.ClampToEdgeWrapping;
          var fr = new T.Group();
          var outer = new T.Mesh(new T.BoxGeometry(40, 30, 2.4), std({ color: 0x6d4328 }));
          fr.add(outer);
          var inner = new T.Mesh(new T.PlaneGeometry(34, 24), new T.MeshBasicMaterial({ map: pic }));
          inner.position.z = 1.3; fr.add(inner);
          fr.position.set(x, y, z); fr.rotation.y = ry; group.add(fr);
        }
        frame(HW - 1.3, 112, -35, -Math.PI / 2, ['#7ec3f0', '#d6ecff', '#5a7fa8']);
        frame(HW - 1.3, 112, 45, -Math.PI / 2, ['#ffb67a', '#ffe3b8', '#8a5a6a']);
        frame(-HW + 1.3, 112, 20, Math.PI / 2, ['#9ad0a0', '#e1f5dc', '#4f8a5a']);

        // Presents on the rug
        function present(x, z, w, h, d, col, rib, ry) {
          var g = new T.Group();
          var body = new T.Mesh(new T.BoxGeometry(w, h, d), std({ color: col }));
          body.position.y = h / 2; body.castShadow = true; body.receiveShadow = true; g.add(body);
          var r1 = new T.Mesh(new T.BoxGeometry(w + 0.5, h + 0.4, 2.4), std({ color: rib })); r1.position.y = h / 2; g.add(r1);
          var r2 = new T.Mesh(new T.BoxGeometry(2.4, h + 0.4, d + 0.5), std({ color: rib })); r2.position.y = h / 2; g.add(r2);
          var bow = new T.Mesh(new T.SphereGeometry(2.6, 10, 8), std({ color: rib })); bow.scale.y = 0.7; bow.position.y = h + 1.2; g.add(bow);
          g.position.set(x, 0, z); g.rotation.y = ry; group.add(g);
        }
        present(-46, 22, 16, 13, 16, 0xd63a40, 0xf6e7a6, 0.4);
        present(50, 18, 14, 10, 20, 0x3b82f6, 0xf8f5ee, -0.3);
        present(-30, 50, 12, 9, 12, 0x2e8b57, 0xd63a40, 0.8);

        fireTick = function (t) {
          flames.forEach(function (f, i) {
            f.scale.set(1 + 0.12 * Math.sin(t / 130 + i * 1.7), 1 + 0.2 * Math.sin(t / 105 + i * 2.3) + 0.1 * Math.sin(t / 47 + i), 1);
            f.rotation.z = 0.08 * Math.sin(t / 170 + i * 1.3);
          });
          fireLight.intensity = 1.15 + 0.22 * Math.sin(t / 90) + 0.12 * Math.sin(t / 37);
        };
        return group;
      }

      // ---- The Decorate tab ----
      function mountDecorate(container, api) {
        apiRef = api;
        container.appendChild(el('h2', { class: 'mm-section-title' }, 'Decorate your tree'));
        container.appendChild(el('p', { class: 'mm-note' }, 'Tap a picture, then tap the tree to hang it. Keep tapping to add more!'));
        var tiles = [];
        function mark() {
          tiles.forEach(function (t) { t.el.setAttribute('aria-pressed', String(t.type === pick.type && (t.type === 'erase' || t.color === pick.color))); });
          var hint = document.getElementById('mm-hint');
          if (hint) hint.textContent = pick.type === 'erase' ? 'Tap an ornament to take it off' : 'Tap the tree to hang a ' + colorName(pick.color).toLowerCase() + ' ' + ITEM_NAME[pick.type].toLowerCase();
        }
        function tile(parent, type, color, label) {
          var b = el('button', { class: 'ht-tile', type: 'button', title: label, 'aria-label': label });
          b.innerHTML = tileIcon(type, color || '#f9a8b8');
          b.addEventListener('click', function () {
            pick = { type: type, color: color || pick.color };
            mark();
            api.toast(type === 'erase' ? 'Eraser: tap an ornament to remove it' : label + ' picked');
          });
          tiles.push({ el: b, type: type, color: color });
          parent.appendChild(b);
        }
        ITEMS.forEach(function (d) {
          var row = el('div', { class: 'ht-row' });
          row.appendChild(el('span', { class: 'ht-label' }, d.name));
          var box = el('div', { class: 'ht-tiles' });
          COLORS.forEach(function (c) { tile(box, d.id, c.hex, c.name + ' ' + d.name); });
          row.appendChild(box);
          container.appendChild(row);
        });
        var tools = el('div', { class: 'ht-tools' });
        tile(tools, 'erase', null, 'Eraser');
        var count = el('p', { class: 'mm-note' }, '');
        var undo = el('button', { class: 'mm-btn', type: 'button', onclick: function () { if (ornaments.length) { ornaments.pop(); api.rebuild(); api.toast('Took one off'); } } }, 'Undo');
        var clear = el('button', { class: 'mm-btn', type: 'button', onclick: function () { if (ornaments.length) { ornaments = []; anims = []; api.rebuild(); api.toast('Fresh tree!'); } } }, 'Clear all');
        var sur = el('button', { class: 'mm-btn mm-btn--solid', type: 'button', onclick: function () { surprise(api); } }, 'Surprise me!');
        tools.appendChild(undo); tools.appendChild(clear); tools.appendChild(sur);
        container.appendChild(tools);
        container.appendChild(count);
        refreshPanel = function () {
          count.textContent = ornaments.length + (ornaments.length === 1 ? ' ornament' : ' ornaments') + ' on your tree';
          undo.disabled = clear.disabled = ornaments.length === 0;
        };
        mark();
        refreshPanel();
        container.appendChild(el('p', { class: 'mm-note' }, 'Everything is fused to the tree so it prints as one piece. The room is just for fun and is not printed. Paint any part in the Color tab.'));

        // All the old Parametric controls (tree shape, topper, hook, styles) live here too, folded away.
        var frag = api.takeParams();
        if (frag.firstChild && frag.firstChild.tagName === 'H2') frag.removeChild(frag.firstChild);
        var inner = el('div', {});
        inner.appendChild(frag);
        var acc = el('details', { class: 'mm-acc ht-shape' }, [el('summary', { class: 'mm-acc-title' }, 'Tree shape, topper & styles'), el('div', { class: 'mm-acc-body' }, [inner])]);
        treeAcc = acc;
        container.appendChild(acc);
      }
      var treeAcc = null;

      window.MM_GENERATOR = {
        code: 'MM-008',
        category: 'CHRISTMAS // TREES',
        title: 'Holiday Tree',
        fileName: 'Holiday_Tree',
        printerLink: '../index.html#map-screen',
        customStage: true,
        hideModelTab: true,
        tabsFirst: true,
        coloredTabs: ['decorate'],
        defaultColor: '#2f9e5b',
        palette: [
          { name: 'Pine Green', color: '#2f9e5b' },
          { name: 'Snow White', color: '#f1f5f9' },
          { name: 'Candy Red', color: '#e5484d' },
          { name: 'Gold', color: '#f6b93b' },
          { name: 'Bark Brown', color: '#8b5a2b' },
          { name: 'Ice Blue', color: '#93c5fd' },
          { name: 'Berry Purple', color: '#a78bfa' },
          { name: 'Midnight', color: '#334155' }
        ],
        partNames: PART_NAMES,

        parameters: PARAMS,
        presets: STYLES.map(function (s) { return { label: s.name === 'Classic' ? 'Default tree' : s.name, values: withDefaults(DEFAULTS, s.values) }; }),

        tabs: [{
          id: 'decorate',
          label: 'Decorate',
          hint: 'Tap a picture, then tap the tree to hang it',
          mount: mountDecorate,
          onHover: function (hit, api) {
            if (!hit) { api.setPreview(null); return; }
            if (pick.type === 'erase') { api.setPreview(hit.meshName.indexOf('orn_') === 0 && ornGeo[hit.meshName] ? { positions: ornGeo[hit.meshName] } : null); return; }
            if (hit.meshName !== 'tree' || hit.normal.y < 0.12) { api.setPreview(null); return; }
            api.setPreview({ positions: stampPositions({ type: pick.type, size: api.params.stampSize, rotation: api.params.stampRotation, point: hit.point.toArray(), normal: hit.normal.toArray() }, 3.8, 1.6) });
          },
          onPick: function (hit, api) {
            if (pick.type === 'erase') {
              if (hit.meshName.indexOf('orn_') === 0) removeOrnament(parseInt(hit.meshName.slice(4), 10));
              else api.toast('Tap an ornament to take it off');
              return;
            }
            if (hit.meshName !== 'tree' || hit.normal.y < 0.12) { api.toast('Tap the green branches to hang it'); return; }
            var p = api.params, local = stage ? stage.modelGroup.worldToLocal(hit.point.clone()) : hit.point;
            addOrnament({ type: pick.type, color: pick.color, size: p.stampSize, rotation: p.stampRotation, point: local.toArray(), normal: hit.normal.toArray(), h: p.height, r: p.baseR }, 0);
            jiggleT0 = clock();

          }
        }],

        embedState: {
          get: function () { return ornaments; },
          set: function (v) {
            ornaments = (v || []).map(function (o) { o.color = o.color || '#f6b93b'; if (!o.id) o.id = nextId; nextId = Math.max(nextId, o.id) + 1; return o; });
            seeded = true;
          }
        },

        onStage: function (env) {
          if (/[?&]embed=workshop\b/.test(location.search)) return;
          var T = env.THREE;
          env.container.style.background = 'linear-gradient(#2b1d24, #4a2c2a)';
          env.plateMesh.parent.visible = false;
          env.controls.maxDistance = 300;
          env.hemi.color.set(0xfff0dd); env.hemi.groundColor.set(0x8a5a44); env.hemi.intensity = 0.8;
          env.key.color.set(0xffe9c9); env.key.intensity = 0.7;
          env.rim.color.set(0xffb27a); env.rim.intensity = 0.25;
          var spark = canvasTex(T, 64, 64, function (g) {
            var grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.35, 'rgba(255,255,255,0.7)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
            g.fillStyle = grad; g.fillRect(0, 0, 64, 64);

          var g = layout(p), n = Math.max(1, g.N - 1);
          ornaments = [];
          ITEMS.forEach(function (d, i) {
            var sp = surfacePoint(p, g, i % n, 0.3, i * 1.1);
            ornaments.push({ id: nextId++, type: d.id, color: COLORS[i % COLORS.length].hex, size: p.stampSize, rotation: 0, point: sp.point, normal: sp.normal, ref: { h: p.height, r: p.baseR } });
          });
          seeded = true;
        },
        build: function (p, api) { T3 = (api && api.THREE) || T3; return build(p, api); }
      };
    })();
