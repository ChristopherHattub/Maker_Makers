    // Holiday Tree: parameters, presets, palette and geometry. The page layout, the viewport,

    (function () {

      // ---- Geometry kit: closed shells built from rings (shared vertices, so always watertight) ----
      var TAU = Math.PI * 2;

      // Circle / ellipse loop in the XZ plane at height y. o: { cx, cz, sx, sz, rot }.

      // Solid of revolution from a profile [[r, y, dx, dz], ...] (bottom to top). r = 0 makes a pole.

      // Closed ring-shaped solid (torus-like): cross-section polygon [[r, y], ...] revolved around Y.
      function bandRing(poly, seg, o) {

      }

      // Sphere or ellipsoid. tFrom > 0 starts the sphere at a flat cut (polar angle from the bottom pole).
      function ball(cx, cy, cz, rx, ry, rz, seg, steps) {

      // Rounded rectangle loop (counter-clockwise from above) at height y.
      function rrect(hx, hz, cr, y, arcN, cx, cz) {

      }
      // Loft of loops with flat end caps.
      function loftCapped(loops) {

      }

      // Rod with rounded ends from a to b, radius ra at a and rb at b.
      function capsule(a, b, ra, rb, seg, capN) {

        var u = vnorm(vcross(d, ax)), v = vcross(d, u);

          var out = [], j, ang;
          for (j = 0; j < seg; j++) {
            ang = (j / seg) * TAU;

        for (k = 0; k < capN; k++) {
          phi = (Math.PI / 2) * (1 - k / capN);
          rings.push(ring(vadd(b, vmul(d, rb * Math.cos(phi))), rb * Math.sin(phi)));
        }
        rings.push({ pole: vadd(b, vmul(d, rb)) });

      }

      function smootherstep(x) {

        return t * t * t * (t * (t * 6 - 15) + 10);
      }
      function el(tag, attrs, text) {

      }

      // Ornament hook: a small ring standing up on a model (plane faces +Z) so it can be hung from a string.
      // Bottom of the ring sits `embed` mm inside the model at (cx, baseY, cz).

      // ---- Stamp library: flat shapes placed on the model surface by clicking ----

      var stampType = 'star';

      function strokeOutline(pts, hw) {

      // Outline polygons (unit radius). Each polygon is extruded as its own solid; overlaps are fine.
      function stampPolys(type) {

        { group: 'Ornament hook', key: 'hookHole', label: 'Hook hole size', unit: ' mm', min: 1.6, max: 3.6, step: 0.1, value: 2.4 },
        { group: 'Ornament hook', key: 'hookTube', label: 'Hook ring thickness', unit: ' mm', min: 1.2, max: 2.4, step: 0.1, value: 1.6 },
        { tab: 'ornaments', group: 'Ornament size & rotation', key: 'stampSize', label: 'Ornament size', unit: ' mm', min: 5, max: 20, step: 0.5, value: 8 },
        { tab: 'ornaments', group: 'Ornament size & rotation', key: 'stampRotation', label: 'Ornament rotation (flat shapes)', unit: '°', min: 0, max: 355, step: 5, value: 0 }
      ];
      var DEFAULTS = {};
      PARAMS.forEach(function (d) { DEFAULTS[d.key] = d.value; });

      function lerp(a, b, t) { return a + (b - a) * t; }

      function layout(p) {
        var N = Math.round(p.tiers), T = Math.tan(rad(p.slope)), g = { N: N, T: T, tiers: [] }, i;
        var R0 = p.baseR, lip = p.lipH;
        var rtr = Math.min(p.trunkR, R0 * 0.55);
        g.rtr = rtr;
        var yl0 = p.trunkH;
        var Rl = lerp(R0, R0 * p.topPct / 100, 1);
        var hLast = Math.max(Rl * T * 1.3, 0.22 * (p.height - yl0));
        var ylLast = Math.max(yl0 + (N - 1) * 4, p.height - lip - hLast);
        var pitch = (ylLast - yl0) / (N - 1);
        for (i = 0; i < N; i++) {
          g.tiers.push({ R: lerp(R0, R0 * p.topPct / 100, N === 1 ? 0 : i / (N - 1)), yl: yl0 + pitch * i, rt: 0 });
        }
        g.roof = yl0 + (R0 - rtr) * T;
        g.apex = g.tiers[N - 1].yl + lip + (p.height - g.tiers[N - 1].yl - lip);
        for (i = 0; i < N; i++) {
          var t = g.tiers[i];
          if (i === N - 1) { t.rt = 0; t.h = p.height - t.yl - lip; t.uX = 1; continue; }
          var nx = g.tiers[i + 1];
          t.rt = t.R * 0.12;
          var K = Math.max(3, nx.yl + (nx.R - t.R) * T - t.yl - lip);
          var uX = 0.72;
          t.h = K / uX + (t.R - t.rt) * T;
          t.uX = uX;
        }
        return g;
      }

      function wobble(p, w, ph, a) { return 1 + (p.scallop / 100) * w * Math.cos(p.lobes * a + ph); }

      function treeShell(p, g) {
        var prof = [], i, k, N = g.N, lip = p.lipH, SUB = 3, wx = 0.3, dPh = Math.PI / p.lobes;
        function add(r, y, w, ph) { prof.push({ r: r, y: y, w: w, ph: ph }); }
        var t0 = g.tiers[0];
        add(0, g.roof, 0, 0);
        for (k = 0; k <= SUB; k++) {
          var f = k / SUB;
          add(lerp(g.rtr, t0.R, f), lerp(g.roof, t0.yl, f), f, 0);
        }
        for (i = 0; i < N; i++) {
          var t = g.tiers[i], ph = i * dPh;
          add(t.R, t.yl + lip, 1, ph);
          if (i === N - 1) {
            for (k = 1; k < 12; k++) {
              var u = k / 12;
              add(lerp(t.R, 0, u), t.yl + lip + t.h * u, lerp(1, 0.2, u), ph);
            }
            add(0, t.yl + lip + t.h, 0, ph);
            break;
          }
          var nx = g.tiers[i + 1], uX = t.uX, xr = lerp(t.R, t.rt, uX), xy = t.yl + lip + t.h * uX;
          for (k = 1; k <= SUB * 2; k++) {
            var uu = (k / (SUB * 2)) * uX;
            add(lerp(t.R, t.rt, uu), t.yl + lip + t.h * uu, lerp(1, wx, k / (SUB * 2)), ph);
          }
          for (k = 1; k <= SUB; k++) {
            var ff = k / SUB;
            add(lerp(xr, nx.R, ff), lerp(xy, nx.yl, ff), lerp(wx, 1, ff), lerp(ph, (i + 1) * dPh, ff));
          }
        }
        var rings = prof.map(function (q) {
          if (q.r < 1e-6) return { pole: [0, q.y, 0] };
          var out = [], j, a;
          for (j = 0; j < SEG; j++) {
            a = (j / SEG) * TAU;
            var r = q.r * wobble(p, q.w, q.ph, a);
            out.push([r * Math.cos(a), q.y, r * Math.sin(a)]);
          }
          return out;
        });
        return shell(rings, false);
      }

      function build(p) {
        var g = layout(p), out = [], N = g.N, lip = p.lipH;
        out.push({ name: 'tree', positions: treeShell(p, g), singlePart: true });
        var rtr = g.rtr;
        out.push({ name: 'trunk', positions: lathe([[0, 0], [rtr - 0.8, 0], [rtr, 0.8], [rtr, g.roof + 2], [0, g.roof + 2]], 40), singlePart: true });
        if (p.basePct >= 40) {
          var Rb = Math.max(rtr + 6, g.tiers[0].R * p.basePct / 100), h0 = 1.4, top = h0 + (Rb - rtr) * 0.3;
          out.push({ name: 'base', positions: lathe([[0, 0], [Rb - 0.6, 0], [Rb, 0.6], [Rb, h0], [rtr + 1, top], [0, top]], SEG), singlePart: true });
        }
        var H = p.height, topTop = H;
        if (p.topper >= 1) {
          var s = p.topperR, kind = p.hook >= 1 ? 1 : Math.round(p.topper);
          if (kind === 1) { out.push({ name: 'topper', positions: ball(0, H + s * 0.35, 0, s, s, s, 40, 20), singlePart: true }); topTop = H + s * 1.35; }
          else {
            var yc = H + s * 0.45, pr = [[0, yc - 1.15 * s]], q;
            for (q = 1; q < 8; q++) pr.push([s * Math.pow(q / 8, 0.9), yc - 1.15 * s * (1 - q / 8)]);
            pr.push([s, yc]);
            for (q = 1; q < 10; q++) pr.push([s * Math.pow(1 - q / 10, 1.4), yc + 1.9 * s * (q / 10)]);
            pr.push([0, yc + 1.9 * s]);
            out.push({ name: 'topper', positions: lathe(pr, 48), singlePart: true });
          }
        }
        if (p.hook >= 1) out.push({ name: 'hook', positions: hookRing(0, topTop, 0, p.hookHole, p.hookTube, 1.8), singlePart: true });
        if (!seeded) { seeded = true; stamps = autoDecorate(p, g, 9); }
        stamps.forEach(function (st) { out.push({ name: 'ornament', positions: stampPositions(st, 3.4, 1.4), singlePart: true }); });
        if (refreshStampPanel) refreshStampPanel();
        return out;
      }

      var seeded = false;
      // Evenly spread balls over the tier surfaces for the current tree shape.
      function autoDecorate(p, g, count) {
        var list = [], N = g.N, i;
        for (i = 0; i < count; i++) {
          var ti = i % Math.max(1, N - 1), t = g.tiers[ti];
          var u = (0.12 + 0.46 * (((i * 7) % 10) / 10)) * t.uX, a = i * 2.39996;
          var w = lerp(1, 0.3, u / t.uX);
          var r = lerp(t.R, t.rt, u) * wobble(p, w, ti * Math.PI / p.lobes, a), y = t.yl + p.lipH + t.h * u;
          var nr = vnorm([t.h, t.R - t.rt, 0]);
          list.push({ type: 'ball', size: 6.4, rotation: 0, point: [r * Math.cos(a), y, r * Math.sin(a)], normal: [nr[0] * Math.cos(a), nr[1], nr[0] * Math.sin(a)] });
        }
        return list;
      }

      var STYLES = [
        { name: 'Classic', values: {} },
        { name: 'Slim spruce', values: { tiers: 7, baseR: 21, height: 112, topPct: 26, scallop: 3, trunkR: 7, topper: 1, topperR: 4 } },
        { name: 'Fat pine', values: { tiers: 4, baseR: 38, height: 84, topPct: 40, scallop: 5, lobes: 10, topperR: 6 } },
        { name: 'Frosty', values: { scallop: 9, lobes: 12, topper: 2, topperR: 5.5 } },
        { name: 'Party tree', values: { tiers: 6, scallop: 2, topperR: 6 } },
        { name: 'Mini 3-tier', values: { tiers: 3, height: 66, baseR: 22, topPct: 38, topperR: 4, trunkH: 5, trunkR: 7 } }
      ];

      window.MM_GENERATOR = {
        code: 'MM-008',
        category: 'CHRISTMAS // TREES',
        title: 'Holiday Tree',
        fileName: 'Holiday_Tree',
        printerLink: '../index.html#map-screen',
        defaultColor: '#86efac',
        palette: [
          { name: 'Pine Green', color: '#86efac' },
          { name: 'Snow White', color: '#f1f5f9' },
          { name: 'Candy Red', color: '#f87171' },
          { name: 'Gold', color: '#fde047' },
          { name: 'Bark Brown', color: '#d6a578' },
          { name: 'Ice Blue', color: '#93c5fd' },
          { name: 'Berry Purple', color: '#d8b4fe' },
          { name: 'Midnight', color: '#334155' }
        ],
        partNames: { tree: 'Tree boughs', trunk: 'Trunk', base: 'Snow base', ornament: 'Ornament', hook: 'Ornament hook', topper: 'Topper' },

        parameters: PARAMS,
        presets: STYLES.map(function (s) { return { label: s.name === 'Classic' ? 'Default tree' : s.name, values: withDefaults(DEFAULTS, s.values) }; }),

        tabs: [{
          id: 'ornaments',
          label: 'Ornaments',
          hint: 'Pick an ornament shape, then click the tree to hang it',
          mount: function (container, api) {
            mountStampPanel(container, api, ['ball', 'star', 'heart', 'diamond', 'bell', 'cane', 'snow'], 'Ornament shapes (click the tree to place)', 'ornament', [{
              label: 'Auto-decorate',
              run: function (a) { stamps = autoDecorate(a.params, layout(a.params), 12); a.rebuild(); a.toast('Added balls'); }
            }]);
            container.appendChild(el('p', { class: 'mm-note' }, 'Ornaments sit on the upper surface of the boughs. Each one is its own part you can paint. If you reshape the tree afterwards, clear and place them again.'));
          },
          onHover: function (hit, api) {
            if (!hit || hit.meshName !== 'tree' || hit.normal.y < 0.12) { api.setPreview(null); return; }
            api.setPreview({ positions: stampPositions({ type: stampType, size: api.params.stampSize, rotation: api.params.stampRotation, point: hit.point.toArray(), normal: hit.normal.toArray() }, 3.4, 1.4) });
          },
          onPick: function (hit, api) {
            if (hit.meshName !== 'tree') return;
            if (hit.normal.y < 0.12) { api.toast('Tip: place ornaments on the top of the boughs, not underneath.'); return; }
            stamps.push({ type: stampType, size: api.params.stampSize, rotation: api.params.stampRotation, point: hit.point.toArray(), normal: hit.normal.toArray() });
            api.rebuild();
            api.toast('Hung ' + STAMP_NAMES[stampType]);
          }
        }],

        embedState: { get: function () { return stamps; }, set: function (v) { stamps = v || []; } },
        build: build
      };
    })();
  </script>
  <script src="shared/generator-core.js"></script>
</body>
