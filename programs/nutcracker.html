<body class="mm-gen">
  <script>
    // Nutcracker: a toy soldier with a working jaw that prints in place. The lower jaw is a quarter disc that
    // swings on two diamond-section pins inside a bowl of the same radius (a clearance gap all round), so
    // nothing needs supports and nothing needs gluing. The page layout, the viewport, the Color tool and the
    // exports come from shared/generator-core.js.
    (function () {
      'use strict';

      var TAU = Math.PI * 2;
      function rad(d) { return (d * Math.PI) / 180; }
      function sqr(x) { return x * x; }
      function vsub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }

      // rings: array of closed point loops [[x,y,z],...] or { pole: [x,y,z] } (a single point cap).
      // Neighbouring rings must have the same winding. wrap = true joins the last ring to the first (torus).
      // The winding of the whole shell is fixed afterwards from its signed volume.
      function shell(rings, wrap) {
        var verts = [], idx = [], info = [], i, j;
        rings.forEach(function (r) {
          if (r.pole) { info.push({ pole: true, s: verts.length, n: 1 }); verts.push(r.pole); }
          else { info.push({ s: verts.length, n: r.length }); r.forEach(function (q) { verts.push(q); }); }
        });
        var n = rings.length, last = wrap ? n : n - 1;
        for (i = 0; i < last; i++) {

          else if (B.pole) { for (j = 0; j < A.n; j++) idx.push(A.s + j, A.s + (j + 1) % A.n, B.s); }

              idx.push(a, b, c, a, c, d);

        }

        for (i = 0; i < idx.length; i += 3) {

        }

      }

      function cat(list) {
        var n = 0, i;
        for (i = 0; i < list.length; i++) n += list[i].length;
        var out = new Float32Array(n), at = 0;
        for (i = 0; i < list.length; i++) { out.set(list[i], at); at += list[i].length; }
        return out;
      }

      // Circle / ellipse loop in the XZ plane at height y. o: { cx, cz, sx, sz, rot }.
      function loopXZ(r, y, seg, o) {
        o = o || {};

        var cr = Math.cos(rot), sr = Math.sin(rot), out = [], j, a, x, z;
        for (j = 0; j < seg; j++) {

          out.push([cx + x * cr - z * sr, y, cz + x * sr + z * cr]);

      }

      // Solid of revolution from a profile [[r, y, dx, dz], ...] (bottom to top). r = 0 makes a pole.
      function lathe(profile, seg, o) {
        o = o || {};

          var oo = { cx: (o.cx || 0) + (p[2] || 0), cz: (o.cz || 0) + (p[3] || 0), sx: o.sx, sz: o.sz, rot: o.rot };
          if (p[0] < 1e-6) return { pole: [oo.cx, p[1], oo.cz] };
          return loopXZ(p[0], p[1], seg, oo);

      }

      // Closed ring-shaped solid (torus-like): cross-section polygon [[r, y], ...] revolved around Y.
      function bandRing(poly, seg, o) {
        return shell(poly.map(function (p) { return loopXZ(p[0], p[1], seg, o); }), true);
      }

      // Sphere or ellipsoid. tFrom > 0 starts the sphere at a flat cut (polar angle from the bottom pole).
      function ball(cx, cy, cz, rx, ry, rz, seg, steps) {

      }

      // Rounded rectangle loop (counter-clockwise from above) at height y.
      function rrect(hx, hz, cr, y, arcN, cx, cz) {

          }

      }

        var c = [0, 0, 0];
        loop.forEach(function (p) { c[0] += p[0]; c[1] += p[1]; c[2] += p[2]; });
        return [c[0] / loop.length, c[1] / loop.length, c[2] / loop.length];
      }
      // Loft of loops with flat end caps.
      function loftCapped(loops) {
        var rings = [{ pole: centroid(loops[0]) }].concat(loops, [{ pole: centroid(loops[loops.length - 1]) }]);
        return shell(rings, false);
      }

      // Rod with rounded ends from a to b, radius ra at a and rb at b.
      function capsule(a, b, ra, rb, seg, capN) {
        var d = vnorm(vsub(b, a));
        var ax = Math.abs(d[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
        var u = vnorm(vcross(d, ax)), v = vcross(d, u);
        function ring(c, r) {
          var out = [], j, ang;
          for (j = 0; j < seg; j++) {
            ang = (j / seg) * TAU;
            out.push(vadd(c, vadd(vmul(u, r * Math.cos(ang)), vmul(v, r * Math.sin(ang)))));
          }
          return out;
        }
        var rings = [{ pole: vsub(a, vmul(d, ra)) }], k, phi;
        for (k = 1; k <= capN; k++) {
          phi = (k / capN) * (Math.PI / 2);
          rings.push(ring(vsub(a, vmul(d, ra * Math.cos(phi))), ra * Math.sin(phi)));
        }
        for (k = 0; k < capN; k++) {
          phi = (Math.PI / 2) * (1 - k / capN);
          rings.push(ring(vadd(b, vmul(d, rb * Math.cos(phi))), rb * Math.sin(phi)));
        }
        rings.push({ pole: vadd(b, vmul(d, rb)) });
        return shell(rings, false);
      }

      // ---- Small helpers --------------------------------------------------------------------------
      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
      function lerp(a, b, t) { return a + (b - a) * t; }
      // Catmull-Rom through table rows [key, v1, v2, ...] at key y.
      function sample(table, y) {
        var n = table.length, i = 0, k, out = [];
        while (i < n - 2 && y > table[i + 1][0]) i++;

        var p0 = table[Math.max(0, i - 1)], p1 = table[i], p2 = table[i + 1], p3 = table[Math.min(n - 1, i + 2)];
        for (k = 1; k < p1.length; k++) {
          var a = p0[k], b = p1[k], c = p2[k], d = p3[k];
          out.push(0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (-a + 3 * b - 3 * c + d) * t * t * t));

      }

      // Extrude a flat outline [[z, y], ...] (holes: same) along x from x0 to x1. Needs api.THREE (r128).

      // Rotate about the x axis through (y = py, z = 0): the jaw's pose. Positive angle drops the front.
      function swing(pos, py, deg) {
        if (!deg) return pos;

      }
      // Pyramid stud pointing +z (diamond section: no overhang).

        function ring(z, rr) { return [[cx + rr, cy, z], [cx, cy + rr, z], [cx - rr, cy, z], [cx, cy - rr, z]]; }
        return loftCapped([ring(z0 - 0.6, r), ring(z0, r), ring(z0 + len, r * 0.3)]);
      }
      // Ellipsoid whose underside is cut flat at yMin (so a foot sits on the plinth with a flat first layer).
      function footBall(cx, cy, cz, rx, ry, rz, yMin) {
        var pos = ball(cx, cy, cz, rx, ry, rz, 20, 12), i;
        for (i = 1; i < pos.length; i += 3) if (pos[i] < yMin) pos[i] = yMin;
        return pos;
      }

      // ---- Layout: everything the build needs, in design millimetres (1 unit = 1 mm at 112 mm tall) ----
      var BASE_H = 4, COAT_TOP = 54, PHI_MAX = 30, PIN_R = 2.2, CHEEK_T = 4.6, HOLE_DEPTH = 2.7;
      function layout(p) {
        var L = {};
        L.s = p.height / 112;
        L.clr = p.tolerance / L.s;
        L.R = p.mouth; L.Rb = L.R + L.clr;
        L.W = p.headWidth;
        L.Wu = L.W / 2 - CHEEK_T; L.Wj = L.Wu - L.clr;
        L.hdg = Math.SQRT2 * (PIN_R + L.clr);

        L.zw = -(PIN_R + L.clr) / c;                       // rear wall of the mouth pocket
        var t = L.zw * sn + Math.sqrt(L.Rb * L.Rb - L.zw * L.zw * c * c);
        L.E = [L.zw - t * sn, -t * c];                     // where the slanted rear wall meets the bowl (relative to the pivot)
        L.Py = COAT_TOP + L.Rb + 2.8;
        L.yc = L.Py + PIN_R + L.clr;                       // ceiling of the mouth slit
        L.yTop = L.yc + p.faceH;
        L.zU = Math.sqrt(L.R * L.R - PIN_R * PIN_R) + 0.2;   // the face is flush with the front of the chin, so the lip has no overhang
        L.zr = L.E[0] - 3.4;
        L.zf = L.Rb * Math.cos(rad(315));
        L.czH = (L.zr + L.zU) / 2;
        L.hzT = (L.zU - L.zr) / 2 + 1.6;
        L.hxT = L.W / 2 + 2.2;
        var kx = L.hxT, kz = L.hzT;

          [BASE_H - 0.5, kx * 1.12, kz * 1.15, 0],
          [12, kx * 1.02, kz * 1.08, 0.04],
          [24, kx * 0.86, kz * 0.97, 0.2],
          [34, kx * 0.85, kz * 0.95, 0.4],
          [44, kx * 0.95, kz * 1.0, 0.7],
          [COAT_TOP, kx, kz, 1]

      }

      // ---- Build ------------------------------------------------------------------------------------
      function build(p, api) {

        function add(name, color, parts, fixed) { list.push({ name: name, color: color, positions: Array.isArray(parts) ? cat(parts) : parts, fixed: fixed !== false }); }
        function rr(hx, hz, y, cz) { return rrect(hx, hz, 0.45 * Math.min(hx, hz), y, AN, 0, cz); }

        add('boots', '#334155', boots);

        [-1, 1].forEach(function (sg) {

          var S = [sg * (bS.hx + 0.2), yS, bS.cz], E = [sg * (bE.hx + 1.4), yE, bE.cz + 1.5], H = [sg * (bH.hx - 0.8), yH, bH.cz + 3];

        add('brows', '#f1f5f9', [barX(-ex - 2.8, -ex + 2.8, fy(0.86), fy(0.8), zFace - 0.3, 1.1), barX(ex - 2.8, ex + 2.8, fy(0.8), fy(0.86), zFace - 0.3, 1.1)]);

        function hl(sc, y, g) { g = g || 0; return rrect(hx0 * sc + g, hz0 * sc + g, 0.4 * Math.min(hx0, hz0) * sc + g, y, AN, 0, L.czH); }
        if (p.hat === 0) {            // shako
          hatLoops = [hl(1, yH0), hl(0.97, yH0 + hH * 0.5), hl(0.8, yH0 + hH)];
          trim.push(loftCapped([hl(0.8, yH0 + hH - 3.2), hl(0.8, yH0 + hH - 2, 1.2), hl(0.8, yH0 + hH - 0.8, 1.2), hl(0.8, yH0 + hH + 0.4)]));
          plume = ball(L.hxT * 0 , yH0 + hH + 2.4, L.czH, 4.2, 4.6, 4.2, 18, 12);
        } else if (p.hat === 1) {     // crown
          var ch = Math.min(hH * 0.42, 11);
          hatLoops = [hl(1, yH0), hl(1.0, yH0 + ch * 0.5), hl(1.0, yH0 + ch)];
          trim.push(loftCapped([hl(1.0, yH0 + ch * 0.9), hl(1.0, yH0 + ch + 0.2)].map(function (lp) { return lp; })));
          var spikes = [], sy = yH0 + ch - 0.4, sh = Math.min(hH * 0.4, 10), rim = [[hx0 - 4.5, hz0 - 4.5], [-hx0 + 4.5, hz0 - 4.5], [hx0 - 4.5, -hz0 + 4.5], [-hx0 + 4.5, -hz0 + 4.5], [0, hz0 - 3.2], [0, -hz0 + 3.2], [hx0 - 3.2, 0], [-hx0 + 3.2, 0]];
          rim.forEach(function (q) { spikes.push(lathe([[0, sy - 0.6], [2.7, sy - 0.6], [2.7, sy], [0, sy + sh]], 10, { cx: q[0], cz: L.czH + q[1] })); });
          plume = cat(spikes);
        } else {                      // spike helmet
          for (k = 0; k <= 7; k++) { var tt = k / 7; hatLoops.push(hl(0.45 + 0.55 * Math.sqrt(1 - tt * tt * 0.97), yH0 + hH * tt)); }
          trim.push(loftCapped([hl(1, yH0), hl(1, yH0 + 1.0, 1.0), hl(1, yH0 + 3.2, 1.0), hl(1, yH0 + 4.2)]));
          plume = lathe([[0, yH0 + hH - 0.8], [3.0, yH0 + hH - 0.8], [3.0, yH0 + hH], [1.6, yH0 + hH + 4], [0, yH0 + hH + 9]], 12, { cx: 0, cz: L.czH });
        }
        add('hat', p.hat === 1 ? '#fde047' : '#60a5fa', loftCapped(hatLoops));
        if (p.hat !== 1) add('hatTrim', '#fde047', trim); else add('hatTrim', '#f87171', trim);
        add('plume', p.hat === 2 ? '#fde047' : (p.hat === 1 ? '#fde047' : '#f1f5f9'), plume);

        // Jaw last so the Color tool lists it with the head
        var fixed = list.filter(function (m) { return m.fixed; });
        var lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
        fixed.forEach(function (m) { for (i = 0; i < m.positions.length; i += 3) for (k = 0; k < 3; k++) { var v = m.positions[i + k]; if (v < lo[k]) lo[k] = v; if (v > hi[k]) hi[k] = v; } });
        var cx = (lo[0] + hi[0]) / 2, cz = (lo[2] + hi[2]) / 2, y0 = lo[1];
        list.push({ name: 'jaw', color: '#f1f5f9', positions: jawPos, fixed: false });
        return list.map(function (m) {
          var a = m.positions, o = new Float32Array(a.length);
          for (i = 0; i < a.length; i += 3) { o[i] = (a[i] - cx) * s; o[i + 1] = (a[i + 1] - y0) * s; o[i + 2] = (a[i + 2] - cz) * s; }
          return { name: m.name, positions: o, color: m.color, singlePart: true };
        });
      }

      // ---- Parameters -----------------------------------------------------------------------------
      function slider(group, key, label, unit, min, max, step, value) { return { group: group, key: key, label: label, unit: unit, min: min, max: max, step: step, value: value }; }
