            hp.push([-ri, 24]); hp.push([ri, 24]);
            for (i = 0; i <= 40; i++) { var a2 = (i / 40) * Math.PI; hp.push([ri * Math.cos(a2), H - R + ri * Math.sin(a2) - 0]); }
            holes.push(hp);
          }
        }
        return { outers: outers, holes: holes };
      }

      function oneBookend(p, THREE) {
        var sil = silhouette(p), t = p.panel, F = p.foot, ft = p.footT, W = p.width, H = p.hgt, parts = [], k;
        // each piece of the silhouette gets the cut-outs whose centre lies inside its bounds
        sil.outers.forEach(function (o) {
          var mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9;
          o.forEach(function (q) { mnx = Math.min(mnx, q[0]); mxx = Math.max(mxx, q[0]); mny = Math.min(mny, q[1]); mxy = Math.max(mxy, q[1]); });
          var mine = sil.holes.filter(function (h) {
            var cx = 0, cy = 0; h.forEach(function (q) { cx += q[0]; cy += q[1]; }); cx /= h.length; cy /= h.length;
            return cx > mnx && cx < mxx && cy > mny && cy < mxy;
          });
          parts.push(extrudeXY(THREE, o, mine, 0, t));
        });
        // the foot lies on the bed behind the panel's back face and under the books
        var foot = [box(-W / 2 + 0.4, 0, 0.5, W / 2 - 0.4, ft, t + F)];
        var gN = Math.round(p.gussets), gH = Math.min(H * 0.45, F * 0.9);
        for (k = 0; k < gN; k++) {
          var gx = gN === 1 ? 0 : -W / 2 + 14 + (k * (W - 28)) / (gN - 1);
          foot.push(extrudeYZ(THREE, [[ft - 0.4, t - 0.5], [ft - 0.4, t + F * 0.92], [ft + gH, t - 0.5]], null, gx - 2.2, gx + 2.2));
        }
        return { panel: parts, foot: foot };
      }

      function build(p, api) {
        var THREE = api.THREE, out = [], a = oneBookend(p, THREE), panel = a.panel.slice(), foot = a.foot.slice();
        if (Math.round(p.pair) === 1) {
          var dx = p.width + 18;
          a.panel.forEach(function (m) { panel.push(mirrorX(m, dx)); });
          a.foot.forEach(function (m) { foot.push(mirrorX(m, dx)); });
        }
        pushMesh(out, mesh('panel', panel));
        pushMesh(out, mesh('foot', foot));
        return out;
      }

          slider('Foot', 'foot', 'Foot length (under the books)', ' mm', 40, 130, 1, DEFAULTS.foot),
          slider('Foot', 'footT', 'Foot thickness', ' mm', 4, 12, 0.5, DEFAULTS.footT),
          slider('Foot', 'gussets', 'Gussets', '', 0, 4, 1, DEFAULTS.gussets),
          choice('Foot', 'pair', 'Set', ['Single', 'Mirrored pair'], DEFAULTS.pair)
