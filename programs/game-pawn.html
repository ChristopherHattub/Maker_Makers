        // split into base / body / head so each can be painted; rings are shared so the surface stays closed
        var cuts = [0, iBase];
        if (iHead > 0) cuts.push(iHead);
        cuts.push(pts.length - 1);
        var names = ['base', 'body', 'head'], out = [];
        for (var c = 0; c + 1 < cuts.length; c++) {
          var arr = [];
          K.lathe(arr, pts.slice(cuts[c], cuts[c + 1] + 1), seg, 0, 0, c > 0, c + 2 < cuts.length);
          out.push({ name: names[c], smoothGroup: 'pawn', positions: K.f32(arr) });
        }
        return out;
      }
