<body class="mm-gen">
  <script>
    // Twisty Spiral Tower: a stack of polygon tiers, each free to spin on one central post. The tiers are
    // printed in place with a small gap between them, so flick one and the whole tower twists into a spiral.
    // The post grows from a wide base and ends in a cone-shaped head (45 degree underside, no supports).
    // The page layout, the viewport, the Color tool and the exports come from shared/generator-core.js.
    (function () {
      'use strict';

      // -----------------------------------------------------------------------
      // Mesh toolkit. A mesh is a flat array of triangle corners (x,y,z per corner, 9 per triangle),
      // Y-up, millimetres, counter-clockwise seen from outside. Every primitive returns one or more
      // closed shells; shells may overlap each other (slicers union them).
      // -----------------------------------------------------------------------
      var PI = Math.PI, TAU = Math.PI * 2;

      function tri(m, a, b, c) {
        // Skip zero-area triangles (poles of a lathe share one point).
        if ((a[0] === b[0] && a[1] === b[1] && a[2] === b[2]) || (b[0] === c[0] && b[1] === c[1] && b[2] === c[2]) ||
            (a[0] === c[0] && a[1] === c[1] && a[2] === c[2])) return;
        m.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
      }
      function quad(m, a, b, c, d) { tri(m, a, b, c); tri(m, a, c, d); }
      function append(dst, src) { for (var i = 0; i < src.length; i++) dst.push(src[i]); return dst; }

      // Apply f(x,y,z) -> [x,y,z] to every corner. Pass mirror = true when f flips handedness.
      function xf(m, f, mirror) {
        var out = new Array(m.length);
        for (var i = 0; i < m.length; i += 3) {
          var p = f(m[i], m[i + 1], m[i + 2]);
          out[i] = p[0]; out[i + 1] = p[1]; out[i + 2] = p[2];
        }
        if (mirror) {
          for (var k = 0; k < out.length; k += 9) {
            for (var q = 0; q < 3; q++) { var t = out[k + 3 + q]; out[k + 3 + q] = out[k + 6 + q]; out[k + 6 + q] = t; }
          }
        }
        return out;
      }
      function mv(m, x, y, z) { return xf(m, function (a, b, c) { return [a + x, b + y, c + z]; }); }
      function rotY(m, a) {
        var c = Math.cos(a), s = Math.sin(a);
        return xf(m, function (x, y, z) { return [c * x + s * z, y, -s * x + c * z]; });
      }
      function rotX(m, a) {
        var c = Math.cos(a), s = Math.sin(a);
        return xf(m, function (x, y, z) { return [x, c * y - s * z, s * y + c * z]; });
      }
      function rotZ(m, a) {
        var c = Math.cos(a), s = Math.sin(a);
        return xf(m, function (x, y, z) { return [c * x - s * y, s * x + c * y, z]; });
      }
      // Rotate by angle a about an arbitrary unit axis (ux,uy,uz) through the origin.
      function rotAxis(m, ux, uy, uz, a) {
        var c = Math.cos(a), s = Math.sin(a), t = 1 - c;
        return xf(m, function (x, y, z) {
          return [(t * ux * ux + c) * x + (t * ux * uy - s * uz) * y + (t * ux * uz + s * uy) * z,
                  (t * ux * uy + s * uz) * x + (t * uy * uy + c) * y + (t * uy * uz - s * ux) * z,
                  (t * ux * uz - s * uy) * x + (t * uy * uz + s * ux) * y + (t * uz * uz + c) * z];
        });
      }
      // Rotate so that +Y points along (dx,dy,dz); keeps shells watertight and outward.
      function aimY(m, dx, dy, dz) {
        var len = Math.sqrt(dx * dx + dy * dy + dz * dz);
        dx /= len; dy /= len; dz /= len;
        // axis = Y x d, angle = acos(dy)
        var ax = dz, az = -dx, al = Math.sqrt(ax * ax + az * az);
        if (al < 1e-9) return dy > 0 ? m : rotX(m, PI);
        return rotAxis(m, ax / al, 0, az / al, Math.acos(Math.max(-1, Math.min(1, dy))));
      }

      function box(x0, y0, z0, x1, y1, z1) {
        var m = [];
        quad(m, [x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]);
        quad(m, [x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]);
        quad(m, [x0, y1, z0], [x0, y1, z1], [x1, y1, z1], [x1, y1, z0]);
        quad(m, [x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]);
        quad(m, [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]);
        quad(m, [x0, y0, z0], [x0, y1, z0], [x1, y1, z0], [x1, y0, z0]);
        return m;
      }
      function boxC(cx, cy, cz, sx, sy, sz) { return box(cx - sx / 2, cy - sy / 2, cz - sz / 2, cx + sx / 2, cy + sy / 2, cz + sz / 2); }

      // Solid of revolution about the Y axis. prof = [[r, y], ...] closed outline, counter-clockwise in
      // the (r right, y up) plane (interior on the left). Points on the axis (r = 0) make poles.
      function lathe(prof, seg) {
        var m = [], n = prof.length, j, k;
        for (k = 0; k < n; k++) {
          var p1 = prof[k], p2 = prof[(k + 1) % n];
          if (p1[0] === 0 && p2[0] === 0) continue;
          for (j = 0; j < seg; j++) {
            var f0 = TAU * j / seg, f1 = TAU * (j + 1) / seg;
            var c0 = Math.cos(f0), s0 = Math.sin(f0), c1 = Math.cos(f1), s1 = Math.sin(f1);
            if (j === seg - 1) { c1 = 1; s1 = 0; }
            quad(m, [p1[0] * c0, p1[1], p1[0] * s0], [p2[0] * c0, p2[1], p2[0] * s0],
                    [p2[0] * c1, p2[1], p2[0] * s1], [p1[0] * c1, p1[1], p1[0] * s1]);
          }
        }
        return m;
      }
      function cylY(r, y0, y1, seg) { return lathe([[0, y0], [r, y0], [r, y1], [0, y1]], seg); }
      // Cylinder between two points (a to b) with radius r.
      function cylAB(a, b, r, seg) {
        var dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2], len = Math.sqrt(dx * dx + dy * dy + dz * dz);
        return mv(aimY(cylY(r, 0, len, seg), dx, dy, dz), a[0], a[1], a[2]);
      }
      function sphere(r, rings, seg) {
        var prof = [];
        for (var i = 0; i <= rings; i++) {
          var a = -PI / 2 + PI * i / rings;
          prof.push([i === 0 || i === rings ? 0 : r * Math.cos(a), r * Math.sin(a)]);
        }
        return lathe(prof, seg);
      }

      // Signed area of a polygon given as [x, z] pairs; negative = clockwise in the (x,z) plane,
      // which is the order the code below keeps (it faces +Y for the top cap).
      function area2(poly) {
        var s = 0;
        for (var i = 0; i < poly.length; i++) { var a = poly[i], b = poly[(i + 1) % poly.length]; s += a[0] * b[1] - b[0] * a[1]; }
        return s;
      }
      function cw(poly) { return area2(poly) < 0 ? poly : poly.slice().reverse(); }

      // Ear clipping triangulation of a simple clockwise polygon [x, z]. Returns index triples.
      function earClip(P) {
        var n = P.length, idx = [], i, out = [];
        for (i = 0; i < n; i++) idx.push(i);
        var guard = 0;
        function cross(a, b, c) { return (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]); }
        while (idx.length > 3 && guard++ < 20000) {
          var clipped = false;
          for (i = 0; i < idx.length; i++) {
            var ia = idx[(i + idx.length - 1) % idx.length], ib = idx[i], ic = idx[(i + 1) % idx.length];
            var a = P[ia], b = P[ib], c = P[ic];
            if (cross(a, b, c) > -1e-9) continue; // reflex or flat corner
            var inside = false;
            for (var k = 0; k < idx.length && !inside; k++) {
              var id = idx[k];
              if (id === ia || id === ib || id === ic) continue;
              var p = P[id];
              if (cross(a, b, p) <= 1e-9 && cross(b, c, p) <= 1e-9 && cross(c, a, p) <= 1e-9) inside = true;
            }
            if (inside) continue;
            out.push([ia, ib, ic]);
            idx.splice(i, 1);
            clipped = true;
            break;
          }
          if (!clipped) { // degenerate input: drop a flat corner so the loop always ends
            idx.splice(0, 1);
          }
        }
        if (idx.length === 3) out.push([idx[0], idx[1], idx[2]]);
        return out;
      }

      // Prism: a simple polygon [x, z] extruded from y0 to y1.
      function extrude(poly, y0, y1) {
        var P = cw(poly), m = [], n = P.length, i;
        var T = earClip(P);
        for (i = 0; i < T.length; i++) {
          var t = T[i];
          tri(m, [P[t[0]][0], y1, P[t[0]][1]], [P[t[1]][0], y1, P[t[1]][1]], [P[t[2]][0], y1, P[t[2]][1]]);
          tri(m, [P[t[0]][0], y0, P[t[0]][1]], [P[t[2]][0], y0, P[t[2]][1]], [P[t[1]][0], y0, P[t[1]][1]]);
        }
        for (i = 0; i < n; i++) {
          var a = P[i], b = P[(i + 1) % n];
          quad(m, [a[0], y0, a[1]], [b[0], y0, b[1]], [b[0], y1, b[1]], [a[0], y1, a[1]]);
        }
        return m;
      }
      // Prism along any axis: poly is [u, v] pairs in the profile plane; the profile is extruded from
      // t0 to t1 along the named axis. Axis 'x': profile (z,y); 'z': profile (x,y).
      function extrudeAxis(poly, axis, t0, t1) {
        var m = extrude(poly, t0, t1); // profile in (x,z) extruded along y
        if (axis === 'y') return m;
        if (axis === 'x') return xf(m, function (x, y, z) { return [y, z, x]; }); // (u,t,v)->(x=t,y=v,z=u)
        return xf(m, function (x, y, z) { return [x, z, y]; }, true); // 'z': (u,v,t)
      }

      // Star-shaped ring: outer and inner loops ([x, z], any start, any winding) around the origin,
      // extruded from y0 to y1. The hole is open. Used for gears, bands and bearings.
      function ring(outer, inner, y0, y1) {
        var O = cw(outer), I = cw(inner), m = [], i, j;
        var ang = function (p) { return Math.atan2(p[1], p[0]); };
        var a0 = ang(O[0]);
        var prog = function (p) { var d = a0 - ang(p); d = d % TAU; if (d < 0) d += TAU; return d; };
        // first inner point at or just ahead of the start angle
        var j0 = 0, best = 1e9;
        for (j = 0; j < I.length; j++) { var pr = prog(I[j]); if (pr < best) { best = pr; j0 = j; } }
        var nO = O.length, nI = I.length, oi = 0, ii = 0;
        // Unwrapped progress of inner point ii (0..nI) relative to O[0].
        var ip = function (k) { var p = prog(I[(j0 + k) % nI]); if (k >= nI) p += TAU; else if (k > 0 && p < prog(I[j0])) p += TAU; return p; };
        var op = function (k) { return k >= nO ? TAU : prog(O[k % nO]); };
        function strip(y, up) {
          oi = 0; ii = 0;
          while (oi < nO || ii < nI) {
            var po = oi < nO ? op(oi + 1) : 1e9, pi = ii < nI ? ip(ii + 1) : 1e9;
            var o0 = O[oi % nO], o1 = O[(oi + 1) % nO], i0 = I[(j0 + ii) % nI], i1 = I[(j0 + ii + 1) % nI];
            var A, B, C;
            if (oi < nO && (po <= pi || ii >= nI)) { A = o0; B = o1; C = i0; oi++; }
            else { A = o0; B = i1; C = i0; ii++; }
            var pa = [A[0], y, A[1]], pb = [B[0], y, B[1]], pc = [C[0], y, C[1]];
            if (up) tri(m, pa, pb, pc); else tri(m, pa, pc, pb);
          }
        }
        strip(y1, true);
        strip(y0, false);
        for (i = 0; i < nO; i++) {
          var a = O[i], b = O[(i + 1) % nO];
          quad(m, [a[0], y0, a[1]], [b[0], y0, b[1]], [b[0], y1, b[1]], [a[0], y1, a[1]]);
        }
        for (i = 0; i < nI; i++) {
          var c = I[i], d = I[(i + 1) % nI];
          quad(m, [c[0], y0, c[1]], [c[0], y1, c[1]], [d[0], y1, d[1]], [d[0], y0, d[1]]);
        }
        return m;
      }
      function circlePts(r, n, rot) {
        var pts = [];
        for (var i = 0; i < n; i++) { var a = (rot || 0) + TAU * i / n; pts.push([r * Math.cos(a), r * Math.sin(a)]); }
        return pts;
      }

      function toF32(m) { return new Float32Array(m); }
      function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

      var MAX_TIERS = 12;

      // Polygon (or round, sides >= 12) outline of circumradius R, N samples that always hit the corners.
      function polyLoop(sides, R, N, rot) {
        var pts = [], round = sides >= 12, a = R * Math.cos(PI / sides), seg = TAU / sides;
        for (var i = 0; i < N; i++) {
          var th = TAU * i / N, r = R;
          if (!round) {
            var t = (th % seg) - seg / 2;
            r = a / Math.cos(t);
          }
          pts.push([r * Math.cos(th + rot), r * Math.sin(th + rot)]);
        }
        return pts;
      }

      // One tier: a polygon ring with 45 degree chamfers top and bottom and a round hole for the post.
      // Outer loops share the angular samples of the hole so the surface is a plain quad strip.
      function tierSolid(sides, R, ht, bev, holeR, rot, N) {
        var ys = [0, bev, ht - bev, ht], rs = [R - bev, R, R, R - bev], rings = [], j, i;
        // Corner samples of a polygon are placed at exact multiples of 2pi/sides, which polyLoop does for any N
        // that is a multiple of `sides`.
        for (j = 0; j < 4; j++) rings.push(polyLoop(sides, rs[j], N, 0));
        var hole = []; for (i = 0; i < N; i++) { var a = TAU * i / N; hole.push([holeR * Math.cos(a), holeR * Math.sin(a)]); }
        var m = [];
        for (i = 0; i < N; i++) {
          var n = (i + 1) % N;
          for (j = 0; j < 3; j++) {
            var a0 = rings[j][i], a1 = rings[j][n], b0 = rings[j + 1][i], b1 = rings[j + 1][n];
            quad(m, [a0[0], ys[j], a0[1]], [b0[0], ys[j + 1], b0[1]], [b1[0], ys[j + 1], b1[1]], [a1[0], ys[j], a1[1]]);
          }
          var h0 = hole[i], h1 = hole[n];
          quad(m, [h0[0], 0, h0[1]], [h1[0], 0, h1[1]], [h1[0], ht, h1[1]], [h0[0], ht, h0[1]]);          // hole wall, faces the post
          var o0 = rings[0][i], o1 = rings[0][n], t0 = rings[3][i], t1 = rings[3][n];
          quad(m, [o0[0], 0, o0[1]], [o1[0], 0, o1[1]], [h1[0], 0, h1[1]], [h0[0], 0, h0[1]]);            // bottom
          quad(m, [t0[0], ht, t0[1]], [h0[0], ht, h0[1]], [h1[0], ht, h1[1]], [t1[0], ht, t1[1]]);        // top
        }
        return xf(m, function (x, y, z) { return [Math.cos(rot) * x + Math.sin(rot) * z, y, -Math.sin(rot) * x + Math.cos(rot) * z]; });
      }

      function buildTower(p) {
        var n = Math.round(p.tiers), sides = Math.round(p.sides), g = p.gap, ht = p.height, pinR = p.post, holeR = pinR + p.pinClear;
        var N = sides >= 12 ? 96 : sides * Math.max(2, Math.round(72 / sides));
        var Rb = p.radius, Rt = Rb * p.taper, bev = Math.min(1.2, ht / 4);
        var baseT = 2.4, out = [], y = baseT + g, i;
        var minR = Rt * Math.cos(PI / Math.min(sides, 12));
        if (minR < holeR + 2.4) { Rt = (holeR + 2.4) / Math.cos(PI / Math.min(sides, 12)); }

        for (i = 0; i < n; i++) {
          var R = n === 1 ? Rb : Rb + (Rt - Rb) * i / (n - 1);
          var rot = i * p.twist * PI / 180;
          out.push({ name: 'tier' + i, positions: toF32(mv(tierSolid(sides, R, ht, bev, holeR, rot, N), 0, y, 0)) });
          y += ht + g;
        }
        // Post: base disc, shaft, and a cone-shaped head that keeps the tiers on.
        var headR = pinR + 3, headCone = headR - pinR;
        var post = lathe([[0, 0], [Rb + 1.5, 0], [Rb + 1.5, baseT], [pinR, baseT], [pinR, y],
                          [headR, y + headCone], [headR, y + headCone + 1.2], [headR - 1, y + headCone + 2.2], [0, y + headCone + 2.2]], 64);
        out.push({ name: 'post', positions: toF32(post) });
        return out;
      }

      var names = {};
      for (var q = 0; q < MAX_TIERS; q++) names['tier' + q] = 'Tier ' + (q + 1);
      names.post = 'Post and base';

      window.MM_GENERATOR = {
        code: 'MM-047',
        category: 'DESK // FIDGETS',
        title: 'Twisty Spiral Tower',
        fileName: 'Spiral_Tower',
        palette: [
          { name: 'Bone White', color: '#f1f5f9' }, { name: 'Glow Mint', color: '#a7f3d0' },
          { name: 'Pumpkin Matte', color: '#fdba74' }, { name: 'Lavender Mist', color: '#d8b4fe' },
          { name: 'Phantom Ice', color: '#93c5fd' }, { name: 'Berry Sorbet', color: '#fda4af' },
          { name: 'Shadow Black', color: '#334155' }, { name: 'Sunny Yellow', color: '#fde047' }
        ],
        partNames: names,
        parameters: [
          { group: 'Tower', key: 'tiers', label: 'Tiers', unit: '', min: 3, max: MAX_TIERS, step: 1, value: 8 },
          { group: 'Tower', key: 'sides', label: 'Tier shape (sides)', unit: '', min: 3, max: 12, step: 1, value: 6, format: function (v) { return v >= 12 ? 'Round' : Math.round(v) + ' sides'; } },
          { group: 'Tower', key: 'radius', label: 'Bottom tier radius', unit: ' mm', min: 14, max: 36, step: 1, value: 24 },
          { group: 'Tower', key: 'taper', label: 'Top tier size', unit: '%', min: 0.3, max: 1, step: 0.05, value: 0.55, format: function (v) { return Math.round(v * 100) + '%'; } },
          { group: 'Tower', key: 'height', label: 'Tier thickness', unit: ' mm', min: 3, max: 10, step: 0.5, value: 5 },
          { group: 'Tower', key: 'twist', label: 'Twist per tier (starting spiral)', unit: '°', min: 0, max: 60, step: 1, value: 18 },
          { group: 'Fit', key: 'post', label: 'Post radius', unit: ' mm', min: 2.5, max: 5, step: 0.25, value: 3.5 },
          { group: 'Fit', key: 'gap', label: 'Gap between tiers (height)', unit: ' mm', min: 0.25, max: 0.6, step: 0.05, value: 0.35 },
          { group: 'Fit', key: 'pinClear', label: 'Gap around post', unit: ' mm', min: 0.25, max: 0.7, step: 0.05, value: 0.4 }
        ],
        presets: [
          { label: 'Default hex tower', values: { tiers: 8, sides: 6, radius: 24, taper: 0.55, height: 5, twist: 18, post: 3.5, gap: 0.35, pinClear: 0.4 } },
          { label: 'Pyramid of triangles', values: { tiers: 10, sides: 3, radius: 30, taper: 0.4, height: 4, twist: 12, post: 3.5, gap: 0.35, pinClear: 0.4 } },
          { label: 'Round stack', values: { tiers: 6, sides: 12, radius: 22, taper: 0.7, height: 6, twist: 0, post: 4, gap: 0.4, pinClear: 0.45 } },
          { label: 'Tall square twist', values: { tiers: 12, sides: 4, radius: 20, taper: 0.5, height: 4, twist: 8, post: 3, gap: 0.35, pinClear: 0.4 } }
        ],
        build: function (p) { return buildTower(p); }
      };
    })();
  </script>
