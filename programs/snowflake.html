<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MM-006 Snowflake Studio // Maker Makers</title>
  <link rel="stylesheet" href="shared/generator.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body class="mm-gen">
  <script>
    // Snowflake Studio: parameters, presets, palette and geometry. The page layout, the viewport,
    // the Color tool and the exports come from shared/generator-core.js.
    (function () {
      'use strict';

      // ---- Geometry kit: closed shells built from rings (shared vertices, so always watertight) ----
      var TAU = Math.PI * 2;
      function rad(d) { return (d * Math.PI) / 180; }
      function sqr(x) { return x * x; }
      function vsub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
      function vadd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
      function vmul(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }
      function vcross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
      function vnorm(a) { var l = Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }

      // rings: array of closed point loops [[x,y,z],...] or { pole: [x,y,z] } (a single point cap).
      // Neighbouring rings must have the same winding. wrap = true joins the last ring to the first (torus).
      // The winding of the whole shell is fixed afterwards from its signed volume.
      function shell(rings, wrap) {
        var verts = [], idx = [], info = [], i, j;
        rings.forEach(function (r) {
          if (r.pole) { info.push({ pole: true, s: verts.length, n: 1 }); verts.push(r.pole); }
          else { info.push({ s: verts.length, n: r.length }); r.forEach(function (q) { verts.push(q); }); }
        });
        var n = rings.length, last = wrap ? n : n - 1;
        for (i = 0; i < last; i++) {
          var A = info[i], B = info[(i + 1) % n];
          if (A.pole && B.pole) continue;
          if (A.pole) { for (j = 0; j < B.n; j++) idx.push(A.s, B.s + (j + 1) % B.n, B.s + j); }
          else if (B.pole) { for (j = 0; j < A.n; j++) idx.push(A.s + j, A.s + (j + 1) % A.n, B.s); }
          else {
            for (j = 0; j < A.n; j++) {
              var a = A.s + j, b = A.s + (j + 1) % A.n, c = B.s + (j + 1) % B.n, d = B.s + j;
              idx.push(a, b, c, a, c, d);
            }
          }
        }
        var vol = 0, p, q, r;
        for (i = 0; i < idx.length; i += 3) {
          p = verts[idx[i]]; q = verts[idx[i + 1]]; r = verts[idx[i + 2]];
          vol += (p[0] * (q[1] * r[2] - q[2] * r[1]) - p[1] * (q[0] * r[2] - q[2] * r[0]) + p[2] * (q[0] * r[1] - q[1] * r[0])) / 6;
        }
        var out = new Float32Array(idx.length * 3), o = 0, v;
        for (i = 0; i < idx.length; i += 3) {
          var tri = vol < 0 ? [idx[i], idx[i + 2], idx[i + 1]] : [idx[i], idx[i + 1], idx[i + 2]];
          for (j = 0; j < 3; j++) { v = verts[tri[j]]; out[o++] = v[0]; out[o++] = v[1]; out[o++] = v[2]; }
        }
        return out;
      }

      function cat(list) {
        var n = 0, i;
        for (i = 0; i < list.length; i++) n += list[i].length;
        var out = new Float32Array(n), at = 0;
        for (i = 0; i < list.length; i++) { out.set(list[i], at); at += list[i].length; }
        return out;
      }

      // Circle / ellipse loop in the XZ plane at height y. o: { cx, cz, sx, sz, rot }.
      function loopXZ(r, y, seg, o) {
        o = o || {};
        var cx = o.cx || 0, cz = o.cz || 0, sx = o.sx || 1, sz = o.sz || 1, rot = o.rot || 0;
        var cr = Math.cos(rot), sr = Math.sin(rot), out = [], j, a, x, z;
        for (j = 0; j < seg; j++) {
          a = (j / seg) * TAU;
          x = r * sx * Math.cos(a); z = r * sz * Math.sin(a);
          out.push([cx + x * cr - z * sr, y, cz + x * sr + z * cr]);
        }
        return out;
      }

      // Solid of revolution from a profile [[r, y, dx, dz], ...] (bottom to top). r = 0 makes a pole.
      function lathe(profile, seg, o) {
        o = o || {};
        var rings = profile.map(function (p) {
          var oo = { cx: (o.cx || 0) + (p[2] || 0), cz: (o.cz || 0) + (p[3] || 0), sx: o.sx, sz: o.sz, rot: o.rot };
          if (p[0] < 1e-6) return { pole: [oo.cx, p[1], oo.cz] };
          return loopXZ(p[0], p[1], seg, oo);
        });
        return shell(rings, false);
      }

      // Closed ring-shaped solid (torus-like): cross-section polygon [[r, y], ...] revolved around Y.
      function bandRing(poly, seg, o) {
        return shell(poly.map(function (p) { return loopXZ(p[0], p[1], seg, o); }), true);
      }

      // Sphere or ellipsoid. tFrom > 0 starts the sphere at a flat cut (polar angle from the bottom pole).
      function ball(cx, cy, cz, rx, ry, rz, seg, steps) {
        var prof = [], k, t;
        for (k = 0; k <= steps; k++) {
          t = (k / steps) * Math.PI;
          prof.push([Math.sin(t), cy - ry * Math.cos(t)]);
        }
        prof[0][0] = 0; prof[steps][0] = 0;
        return lathe(prof, seg, { cx: cx, cz: cz, sx: rx, sz: rz });
      }

      // Rounded rectangle loop (counter-clockwise from above) at height y.
      function rrect(hx, hz, cr, y, arcN, cx, cz) {
        cr = Math.max(0.05, Math.min(cr, Math.min(hx, hz) - 0.02));
        var out = [], k, a, corners = [[hx - cr, hz - cr, 0], [-(hx - cr), hz - cr, 90], [-(hx - cr), -(hz - cr), 180], [hx - cr, -(hz - cr), 270]];
        corners.forEach(function (c) {
          for (k = 0; k <= arcN; k++) {
            a = rad(c[2] + (k / arcN) * 90);
            out.push([(cx || 0) + c[0] + cr * Math.cos(a), y, (cz || 0) + c[1] + cr * Math.sin(a)]);
          }
        });
        return out;
      }
      function centroid(loop) {
        var c = [0, 0, 0];
        loop.forEach(function (p) { c[0] += p[0]; c[1] += p[1]; c[2] += p[2]; });
        return [c[0] / loop.length, c[1] / loop.length, c[2] / loop.length];
      }
      // Loft of loops with flat end caps.
      function loftCapped(loops) {
        var rings = [{ pole: centroid(loops[0]) }].concat(loops, [{ pole: centroid(loops[loops.length - 1]) }]);
        return shell(rings, false);
      }

      // Rod with rounded ends from a to b, radius ra at a and rb at b.
      function capsule(a, b, ra, rb, seg, capN) {
        var d = vnorm(vsub(b, a));
        var ax = Math.abs(d[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
        var u = vnorm(vcross(d, ax)), v = vcross(d, u);
        function ring(c, r) {
          var out = [], j, ang;
          for (j = 0; j < seg; j++) {
            ang = (j / seg) * TAU;
            out.push(vadd(c, vadd(vmul(u, r * Math.cos(ang)), vmul(v, r * Math.sin(ang)))));
          }
          return out;
        }
        var rings = [{ pole: vsub(a, vmul(d, ra)) }], k, phi;
        for (k = 1; k <= capN; k++) {
          phi = (k / capN) * (Math.PI / 2);
          rings.push(ring(vsub(a, vmul(d, ra * Math.cos(phi))), ra * Math.sin(phi)));
        }
        for (k = 0; k < capN; k++) {
          phi = (Math.PI / 2) * (1 - k / capN);
          rings.push(ring(vadd(b, vmul(d, rb * Math.cos(phi))), rb * Math.sin(phi)));
        }
        rings.push({ pole: vadd(b, vmul(d, rb)) });
        return shell(rings, false);
      }

      function smootherstep(x) {
        var t = Math.max(0, Math.min(1, x));
        return t * t * t * (t * (t * 6 - 15) + 10);
      }
      function el(tag, attrs, text) {
        var node = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (k) {
          if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
          else node.setAttribute(k, attrs[k]);
        });
        if (text) node.textContent = text;
        return node;
      }
      // Picture-card style picker for the "Styles" tab. cardSvg(values) draws a small icon.
      function mountStyleCards(container, api, styles, cardSvg, defaults, heading, note) {
        container.appendChild(el('h3', { class: 'mm-group-title' }, heading));
        var grid = el('div', { class: 'mm-preset-cards' });
        styles.forEach(function (s) {
          var vals = {};
          Object.keys(defaults).forEach(function (k) { vals[k] = defaults[k]; });
          Object.keys(s.values).forEach(function (k) { vals[k] = s.values[k]; });
          var card = el('button', { class: 'mm-preset-card', type: 'button', title: s.name, onclick: function () {
            api.setParams(vals);
            api.toast('Style: ' + s.name);
          } });
          card.innerHTML = cardSvg(vals) + '<span>' + s.name + '</span>';
          grid.appendChild(card);
        });
        container.appendChild(grid);
        container.appendChild(el('p', { class: 'mm-note' }, note));
      }
      function withDefaults(defaults, over) {
        var values = {};
        Object.keys(defaults).forEach(function (k) { values[k] = defaults[k]; });
        Object.keys(over).forEach(function (k) { values[k] = over[k]; });
        return values;
      }

      // Ornament hook: a small ring standing up on a model (plane faces +Z) so it can be hung from a string.
      // Bottom of the ring sits `embed` mm inside the model at (cx, baseY, cz).
      function hookRing(cx, baseY, cz, hole, tube, embed) {
        var Rc = hole + tube, cy = baseY - embed + Rc + tube, N = 40, k, rings = [];
        var oct = [[-1, -0.5], [-0.5, -1], [0.5, -1], [1, -0.5], [1, 0.5], [0.5, 1], [-0.5, 1], [-1, 0.5]];
        for (k = 0; k < N; k++) {
          var th = (k / N) * TAU, c = Math.cos(th), s = Math.sin(th), ring = [];
          oct.forEach(function (q) {
            ring.push([cx + (Rc + q[0] * tube) * c, cy + (Rc + q[0] * tube) * s, cz + q[1] * tube * 1.15]);
          });
          rings.push(ring);
        }
        return shell(rings, true);
      }

      var PARAMS = [
        { group: 'Arms', key: 'armCount', label: 'Number of arms', unit: '', min: 5, max: 12, step: 1, value: 6 },
        { group: 'Arms', key: 'armLen', label: 'Arm length (from centre)', unit: ' mm', min: 22, max: 62, step: 1, value: 40 },
        { group: 'Arms', key: 'armW', label: 'Arm width', unit: ' mm', min: 3, max: 10, step: 0.2, value: 5 },
        { group: 'Arms', key: 'thick', label: 'Flake thickness', unit: ' mm', min: 2, max: 6, step: 0.2, value: 3.2 },
        { group: 'Arms', key: 'tipTaper', label: 'Pointy tips (blunt ↔ sharp)', unit: '%', min: 0, max: 100, step: 5, value: 55 },
        { group: 'Branches', key: 'rows', label: 'Branch pairs per arm', unit: '', min: 0, max: 4, step: 1, value: 2 },
        { group: 'Branches', key: 'branchLen', label: 'Branch length', unit: ' mm', min: 5, max: 26, step: 1, value: 13 },
        { group: 'Branches', key: 'branchAngle', label: 'Branch angle (open ↔ swept)', unit: '°', min: 30, max: 80, step: 1, value: 55 },
        { group: 'Branches', key: 'branchStart', label: 'First branch position', unit: '%', min: 20, max: 65, step: 1, value: 38 },
        { group: 'Branches', key: 'branchW', label: 'Branch width (% of arm)', unit: '%', min: 50, max: 100, step: 5, value: 80 },
        { group: 'Centre & tips', key: 'hubR', label: 'Centre size', unit: ' mm', min: 3, max: 16, step: 0.5, value: 8 },
        { group: 'Centre & tips', key: 'hubRaise', label: 'Centre raise', unit: ' mm', min: 0, max: 3, step: 0.2, value: 1.2 },
        { group: 'Centre & tips', key: 'hubSides', label: 'Centre sides (hexagon ↔ round)', unit: '', min: 6, max: 48, step: 2, value: 48,
          format: function (v) { return v >= 40 ? 'Round' : v + ' sides'; } },
        { group: 'Centre & tips', key: 'tipR', label: 'Arm-tip discs (0 = none)', unit: ' mm', min: 0, max: 8, step: 0.5, value: 0,
          format: function (v) { return v < 2 ? 'None' : v + ' mm'; } },
        { group: 'Ornament hook', key: 'loop', label: 'Ornament hook (hanging loop)', unit: '', min: 0, max: 1, step: 1, value: 1,
          format: function (v) { return v >= 1 ? 'On' : 'Off'; } },
        { group: 'Ornament hook', key: 'loopHole', label: 'Loop hole size', unit: ' mm', min: 1.5, max: 4.5, step: 0.1, value: 2.4 },
        { group: 'Ornament hook', key: 'loopW', label: 'Loop ring width', unit: ' mm', min: 2, max: 5, step: 0.1, value: 3 }
      ];
      var DEFAULTS = {};
      PARAMS.forEach(function (d) { DEFAULTS[d.key] = d.value; });

      // Flat bar from (x0, z0) along angle `ang` (radians) between distances s0 and s1. Bottom is flat on the bed,
      // sides have 45 degree chamfers, and the tip tapers to a rounded point. All inside one watertight shell.
      function bar(x0, z0, ang, s0, s1, w, t, tipFrac, ch) {
        var dx = Math.cos(ang), dz = Math.sin(ang), px = -dz, pz = dx;
        function loop(s, wid) {
          var hw = Math.max(0.3, wid / 2), c = Math.min(ch, hw * 0.45, t * 0.35), hb = hw - c, out = [];
          [[-hb, 0], [hb, 0], [hw, c], [hw, t - c], [hb, t], [-hb, t], [-hw, t - c], [-hw, c]].forEach(function (q) {
            out.push([x0 + dx * s + px * q[0], q[1], z0 + dz * s + pz * q[0]]);
          });
          return out;
        }
        var tipL = Math.min((s1 - s0) * 0.6, w * (0.4 + 2.2 * tipFrac));
        var loops = [loop(s0, w), loop(s1 - tipL, w), loop(s1 - tipL * 0.45, w * (1 - 0.55 * tipFrac) * 0.85), loop(s1, Math.max(0.9, w * (1 - 0.8 * tipFrac)))];
        return loftCapped(loops);
      }

      function build(p) {
        var out = [], n = Math.round(p.armCount), t = p.thick, ch = Math.min(1.1, t * 0.35), tipFrac = p.tipTaper / 100;
        var arms = [], branches = [], tips = [], k, r, side;
        var rows = Math.round(p.rows);
        for (k = 0; k < n; k++) {
          var ang = rad(-90) + (k / n) * TAU;
          arms.push(bar(0, 0, ang, 0.05 + k * 0.02, p.armLen, p.armW, t, tipFrac, ch));
          for (r = 0; r < rows; r++) {
            var f = rows === 1 ? p.branchStart / 100 : (p.branchStart + (r / (rows - 1)) * (84 - p.branchStart)) / 100;
            var sp = f * p.armLen, len = p.branchLen * (1 - 0.4 * (rows === 1 ? 0 : r / (rows - 1)));
            for (side = -1; side <= 1; side += 2) {
              var ba = ang + side * rad(p.branchAngle);
              var bw = Math.max(2.4, p.armW * p.branchW / 100);
              branches.push(bar(Math.cos(ang) * sp, Math.sin(ang) * sp, ba, -bw * 0.5, len, bw, t, tipFrac, ch));
            }
          }
          if (p.tipR >= 2) {
            var cx = Math.cos(ang) * (p.armLen - p.tipR * 0.5), cz = Math.sin(ang) * (p.armLen - p.tipR * 0.5), c2 = Math.min(1.1, t * 0.35);
            tips.push(lathe([[0, 0], [p.tipR - c2, 0], [p.tipR, c2], [p.tipR, t - c2], [p.tipR - c2, t], [0, t]], 28, { cx: cx, cz: cz }));
          }
        }
        out.push({ name: 'arms', positions: cat(arms), singlePart: true });
        if (branches.length) out.push({ name: 'branches', positions: cat(branches), singlePart: true });
        var T = t + p.hubRaise, hc = Math.min(1.2, T * 0.35), hr = p.hubR;
        out.push({ name: 'hub', positions: lathe([[0, 0], [hr - ch * 0.5, 0], [hr, ch * 0.5], [hr, T - hc], [hr - hc, T], [0, T]], Math.round(p.hubSides), { rot: rad(-90) }), singlePart: true });
        if (tips.length) out.push({ name: 'tips', positions: cat(tips), singlePart: true });
        if (p.loop >= 1) {
          var ri = p.loopHole, ro = ri + p.loopW, c3 = Math.min(ch, p.loopW * 0.35);
          var cz2 = -(p.armLen + ri + p.loopW * 0.35 + (p.tipR >= 2 ? p.tipR * 0.5 : 0));
          out.push({ name: 'loop', positions: bandRing([[ri + c3, 0], [ro - c3, 0], [ro, c3], [ro, t - c3], [ro - c3, t], [ri + c3, t], [ri, t - c3], [ri, c3]], 40, { cz: cz2 }), singlePart: true });
        }
        return out;
      }

      function cardSvg(v) {
        var n = Math.round(v.armCount), sc = 25 / v.armLen, svg = '<svg viewBox="0 0 64 64" aria-hidden="true"><g transform="translate(32 34)" stroke="#e0f2fe" fill="none" stroke-linecap="round">';
        var k, r, side, rows = Math.round(v.rows);
        for (k = 0; k < n; k++) {
          var a = rad(-90) + (k / n) * TAU, ex = Math.cos(a) * v.armLen * sc, ey = Math.sin(a) * v.armLen * sc;
          svg += '<path stroke-width="' + (v.armW * sc * 0.9).toFixed(1) + '" d="M0 0L' + ex.toFixed(1) + ' ' + ey.toFixed(1) + '"/>';
          for (r = 0; r < rows; r++) {
            var f = rows === 1 ? v.branchStart / 100 : (v.branchStart + (r / (rows - 1)) * (84 - v.branchStart)) / 100;
            var len = v.branchLen * (1 - 0.4 * (rows === 1 ? 0 : r / (rows - 1))) * sc;
            for (side = -1; side <= 1; side += 2) {
              var ba = a + side * rad(v.branchAngle);
              svg += '<path stroke-width="' + (v.armW * v.branchW / 100 * sc * 0.9).toFixed(1) + '" d="M' + (ex * f).toFixed(1) + ' ' + (ey * f).toFixed(1) + 'l' + (Math.cos(ba) * len).toFixed(1) + ' ' + (Math.sin(ba) * len).toFixed(1) + '"/>';
            }
          }
          if (v.tipR >= 2) svg += '<circle cx="' + ex.toFixed(1) + '" cy="' + ey.toFixed(1) + '" r="' + (v.tipR * sc).toFixed(1) + '" fill="#e0f2fe" stroke="none"/>';
        }
        svg += '<circle r="' + (v.hubR * sc).toFixed(1) + '" fill="#7dd3fc" stroke="#e0f2fe" stroke-width="0.8"/></g></svg>';
        return svg;
      }

      var STYLES = [
        { name: 'Classic', values: {} },
        { name: 'Fern', values: { rows: 3, branchLen: 10, branchAngle: 42, branchStart: 30, armW: 4, armLen: 42 } },
        { name: 'Star', values: { rows: 0, armW: 8, armLen: 36, hubR: 10, tipTaper: 90, hubSides: 6, loopW: 3.4 } },
        { name: 'Crystal', values: { rows: 1, branchLen: 18, branchAngle: 62, branchStart: 50, armW: 6, hubR: 9, hubSides: 6, tipTaper: 80, tipR: 0 } },
        { name: 'Lace', values: { rows: 4, branchLen: 9, branchAngle: 48, branchStart: 26, armW: 3.2, armLen: 46, thick: 2.4, branchW: 75, hubR: 6 } },
        { name: 'Bubble tips', values: { rows: 2, tipR: 5, armW: 4.4, branchLen: 11, tipTaper: 0, hubR: 9 } },
        { name: 'Eight point', values: { armCount: 8, rows: 1, branchLen: 12, branchStart: 45, armW: 4.4, armLen: 38 } },
        { name: 'Chunky', values: { armW: 8.4, thick: 4.4, rows: 1, branchLen: 14, branchAngle: 58, hubR: 11, armLen: 36, tipTaper: 30, loopHole: 3, loopW: 4 } }
      ];

      window.MM_GENERATOR = {
        code: 'MM-006',
        category: 'CHRISTMAS // ORNAMENTS',
        title: 'Snowflake Studio',
        fileName: 'Snowflake',
        printerLink: '../index.html#map-screen',
        defaultColor: '#e0f2fe',
        palette: [
          { name: 'Frost White', color: '#f1f5f9' },
          { name: 'Ice Blue', color: '#93c5fd' },
          { name: 'Glacier Mint', color: '#a7f3d0' },
          { name: 'Candy Red', color: '#f87171' },
          { name: 'Gold', color: '#fde047' },
          { name: 'Berry Purple', color: '#d8b4fe' },
          { name: 'Pine Green', color: '#86efac' },
          { name: 'Midnight', color: '#334155' }
        ],
        partNames: { arms: 'Arms', branches: 'Branches', hub: 'Centre', tips: 'Arm tips', loop: 'Ornament hook' },

        parameters: PARAMS,
        presets: STYLES.map(function (s) { return { label: s.name === 'Classic' ? 'Default snowflake' : s.name, values: withDefaults(DEFAULTS, s.values) }; }),

        tabs: [{
          id: 'styles',
          label: 'Styles',
          hint: 'Pick a snowflake style, then fine-tune the sliders',
          mount: function (container, api) {
            mountStyleCards(container, api, STYLES, cardSvg, DEFAULTS, 'Snowflake styles', 'Cards set every slider; keep tuning by hand. Arms, branches, centre, tips and the hanging loop are separate parts you can paint in the Color tool.');
          }
        }],

        build: build
      };
    })();
  </script>
  <script src="shared/generator-core.js"></script>
</body>
