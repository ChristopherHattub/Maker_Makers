        return pts;
      }

      function ellipsePts(A, B, n, wobble, lobes) {
        var pts = [];
        for (var i = 0; i < n; i++) {
          var a = i / n * Math.PI * 2, k = 1 + (wobble ? wobble * Math.cos(lobes * a) : 0);
          pts.push([A * k * Math.cos(a), B * k * Math.sin(a)]);
        }
        return pts;
      }

      function plateOutline(shape, W, H, p) {
        var pad = p.pad + p.rimWidth, a = W / 2 + pad, b = H / 2 + pad, pts, i;
        if (shape === 'rounded') pts = roundedRect(a, b, Math.min(p.corner, a, b));
        else if (shape === 'pill') pts = roundedRect(a + b * 0.45, b, b);
        else if (shape === 'oval' || shape === 'scallop') {
          var k = 1.22, A = k * W / 2 + pad, B = (H / 2) / Math.sqrt(1 - 1 / (k * k)) + pad;
          pts = shape === 'oval' ? ellipsePts(A, B, 96, 0, 0) : ellipsePts(A * 1.04, B * 1.04, 192, 0.04, 14);
        } else if (shape === 'hex') {
          var c = b * 0.58, ax = W / 2 + pad + c;
          pts = [[ax, 0], [ax - c, b], [-(ax - c), b], [-ax, 0], [-(ax - c), -b], [ax - c, -b]];
        } else { // heart
          var s = Math.max((W / 2 + pad) / 10, (H / 2 + pad) / 5, 0.9);
          pts = [];
          for (i = 0; i < 360; i += 3) {
            var th = i * DEG;
            var hx = 16 * Math.pow(Math.sin(th), 3);
            var hy = 13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th);
            pts.push([hx * s, (hy - 3) * s]);
          }
          pts.reverse(); // the curve runs clockwise
        }
        return densify(pts, 3);
      }

      // Centre of the key ring hole: just outside the outline so the ring overlaps it by half the wall.
      function holeCenter(pts, pos, yRef, holeR, wall) {
        var band = (holeR + wall) * 0.7, i, v, best = null;
        for (i = 0; i < pts.length; i++) {
          v = pts[i];
          if (pos === 'top') {
            if (Math.abs(v[0]) <= band && (best === null || v[1] > best)) best = v[1];
          } else if (Math.abs(v[1] - yRef) <= band) {
            if (best === null || (pos === 'left' ? v[0] < best : v[0] > best)) best = v[0];
          }
        }
        if (best === null) best = 0;
        var off = holeR + wall * 0.5;
        if (pos === 'top') return [0, best + off];
        return [pos === 'left' ? best - off : best + off, yRef];
      }

      function circle(cx, cy, r, n) {
        var pts = [];
        for (var i = 0; i < n; i++) {
          var a = i / n * Math.PI * 2;
          pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
        }
        return pts;
      }

      function buildKeychain(p) {
        var lay = layout(p), t = lay.t;
        var base = [], rim = [], text = [];
        var plated = state.shape !== 'none';
        var plateT = p.plateThick;
        var textY0 = plated ? plateT - EMBED : 0;
        var textY1 = plateT + p.raise;
        var outline, ringPts;

        if (plated) {
          outline = plateOutline(state.shape, lay.W, lay.H, p);
          prism(base, outline, 0, plateT, [0, 0]);
          if (p.rimWidth >= 0.2) {
            ringPrism(rim, outline, offsetInward(outline, p.rimWidth), plateT - EMBED, plateT + p.rimHeight);
          }
          ringPts = outline;
        } else {
          // Joined letters: a bar along each baseline ties the letters together.
          lay.lines.forEach(function (ln) {
            var bar = strokePoly(ln.x0 + t / 2, ln.base, ln.x1 - t / 2, ln.base, t, lay.cap);
            prism(base, bar, 0, textY1);
          });
          var last = lay.lines[lay.lines.length - 1];
          ringPts = strokePoly(last.x0 + t / 2, last.base, last.x1 - t / 2, last.base, t, lay.cap);
        }

        lay.segs.forEach(function (s) {
          prism(text, strokePoly(s[0], s[1], s[2], s[3], t, lay.cap), textY0, textY1);
        });

        if (state.hole !== 'none') {
          var pos = (!plated && state.hole === 'top') ? 'left' : state.hole;
          var holeR = p.holeDia / 2, wall = p.holeWall;
          var yRef = plated ? 0 : lay.lines[lay.lines.length - 1].base;
          var c = holeCenter(ringPts, pos, yRef, holeR, wall);
          prism_ring(base, c, holeR, wall, plated ? plateT : textY1);
        }

        var meshes = [{ name: 'base', positions: new Float32Array(base) }];
        if (rim.length) meshes.push({ name: 'rim', positions: new Float32Array(rim) });
        meshes.push({ name: 'text', positions: new Float32Array(text) });
        return meshes;
      }

      function prism_ring(out, c, holeR, wall, h) {
        ringPrism(out, circle(c[0], c[1], holeR + wall, 48), circle(c[0], c[1], holeR, 48), 0, h);
      }

      // -----------------------------------------------------------------------
      // Looks: one tap sets the lettering, plate and hole choices plus the matching sliders.
      // -----------------------------------------------------------------------
      var LOOKS = [
        { label: 'Classic tag', state: { font: 'block', shape: 'rounded', hole: 'left', caps: 'upper' }, params: { textHeight: 14, stroke: 2.6, pad: 5, corner: 5, rimWidth: 1.6 } },
        { label: 'Bubble pill', state: { font: 'bubble', shape: 'pill', hole: 'left', caps: 'typed' }, params: { textHeight: 14, stroke: 2.4, pad: 4, rimWidth: 1.2 } },
        { label: 'Love heart', state: { font: 'rounded', shape: 'heart', hole: 'top', caps: 'typed' }, params: { textHeight: 12, stroke: 2.2, pad: 2, rimWidth: 1.4 } },
        { label: 'Scallop badge', state: { font: 'wide', shape: 'scallop', hole: 'top', caps: 'upper' }, params: { textHeight: 12, stroke: 2.4, pad: 3, rimWidth: 1.2 } },
        { label: 'Hex nameplate', state: { font: 'narrow', shape: 'hex', hole: 'left', caps: 'upper' }, params: { textHeight: 15, stroke: 2.6, pad: 4, rimWidth: 1.4 } },
        { label: 'Bubble letters', state: { font: 'bubble', shape: 'none', hole: 'right', caps: 'typed' }, params: { textHeight: 22, stroke: 4.2, join: 12, plateThick: 3, raise: 1.6 } },
        { label: 'Joined script', state: { font: 'slanted', shape: 'none', hole: 'left', caps: 'typed' }, params: { textHeight: 16, stroke: 3, spacing: 0.5 } }
      ];

      window.MM_GENERATOR = {
        code: 'MM-011',
        category: 'KEYCHAINS // PERSONAL',
        title: 'Name Keychain',
        fileName: 'Name_Keychain',
        palette: [
          { name: 'Bone White', color: '#f1f5f9' }, { name: 'Glow Mint', color: '#a7f3d0' },
          { name: 'Pumpkin Matte', color: '#fdba74' }, { name: 'Lavender Mist', color: '#d8b4fe' },
          { name: 'Phantom Ice', color: '#93c5fd' }, { name: 'Berry Sorbet', color: '#fda4af' },
          { name: 'Shadow Black', color: '#334155' }, { name: 'Sunny Yellow', color: '#fde047' }
        ],
        partNames: { base: 'Plate & ring', rim: 'Border', text: 'Lettering' },
        openGroups: ['Lettering'],

        parameters: [
          { group: 'Lettering', tab: 'name', key: 'textHeight', label: 'Letter height', unit: ' mm', min: 8, max: 30, step: 0.5, value: 14 },
          { group: 'Lettering', tab: 'name', key: 'stroke', label: 'Stroke thickness', unit: ' mm', min: 1.2, max: 6, step: 0.1, value: 2.6 },
          { group: 'Lettering', tab: 'name', key: 'spacing', label: 'Letter spacing', unit: ' mm', min: 0, max: 6, step: 0.1, value: 1 },
          { group: 'Lettering', tab: 'name', key: 'join', label: 'Letter overlap (no backing)', unit: '%', min: 0, max: 60, step: 5, value: 12 },
          { group: 'Lettering', tab: 'name', key: 'lineGap', label: 'Line gap (2 lines)', unit: ' mm', min: 0, max: 10, step: 0.5, value: 2 },
          { group: 'Lettering', tab: 'name', key: 'line2Size', label: 'Line 2 size', unit: '%', min: 40, max: 100, step: 5, value: 70 },
          { group: 'Plate', key: 'plateThick', label: 'Plate thickness', unit: ' mm', min: 1.6, max: 6, step: 0.2, value: 3 },
          { group: 'Plate', key: 'pad', label: 'Space around the name', unit: ' mm', min: 2, max: 16, step: 0.5, value: 5 },
          { group: 'Plate', key: 'corner', label: 'Corner rounding (rectangle)', unit: ' mm', min: 0, max: 20, step: 0.5, value: 6 },
          { group: 'Plate', key: 'raise', label: 'Letters stand up', unit: ' mm', min: 0.8, max: 5, step: 0.2, value: 1.6 },
          { group: 'Border', key: 'rimWidth', label: 'Border width (0 = none)', unit: ' mm', min: 0, max: 4, step: 0.2, value: 1.6 },
          { group: 'Border', key: 'rimHeight', label: 'Border height', unit: ' mm', min: 0.4, max: 3, step: 0.2, value: 1 },
          { group: 'Key ring hole', key: 'holeDia', label: 'Hole diameter', unit: ' mm', min: 3, max: 10, step: 0.5, value: 5 },
          { group: 'Key ring hole', key: 'holeWall', label: 'Ring wall', unit: ' mm', min: 2, max: 6, step: 0.5, value: 3 }
        ],

        presets: [
          { label: 'Default keychain', values: { textHeight: 14, stroke: 2.6, spacing: 1, lineGap: 2, line2Size: 70, plateThick: 3, pad: 5, corner: 6, raise: 1.6, rimWidth: 1.6, rimHeight: 1, holeDia: 5, holeWall: 3 } },
          { label: 'Chunky letters', values: { textHeight: 18, stroke: 4.2, spacing: 1.5, plateThick: 3.4, raise: 2.4 } },
          { label: 'Slim and light', values: { textHeight: 12, stroke: 1.8, spacing: 0.6, plateThick: 2, raise: 1.2, rimWidth: 1 } }
        ],

        tabs: [{
          id: 'name',
          label: 'Name',
          hint: 'Type your name, pick a style, then fine-tune the lettering sliders',
          mount: function (container, api) {
            var h = function (tag, attrs, text) {
              var node = document.createElement(tag);
              Object.keys(attrs || {}).forEach(function (k) {
                if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
                else node.setAttribute(k, attrs[k]);
              });
              if (text) node.textContent = text;
              return node;
            };
            var field = function (label, control) {
              var wrap = h('div', { class: 'mm-slider' });
              var head = h('div', { class: 'mm-slider-head' });
              head.appendChild(h('label', {}, label));
              wrap.appendChild(head);
              wrap.appendChild(control);
              return wrap;
            };
            var picker = function (key, options, icons) {
              var wrap = h('div', { class: 'mm-choices' }), btns = [];
              options.forEach(function (o) {
                var b = h('button', { type: 'button', class: 'mm-choice', title: o[1], 'aria-label': o[1] });
                b.innerHTML = '<svg viewBox="0 0 40 40" aria-hidden="true">' + icons[o[0]] + '</svg><span>' + o[1].replace(' (letters joined)', '') + '</span>';
                b.addEventListener('click', function () { state[key] = o[0]; sync(); api.rebuild(); });
                btns.push([o[0], b]); wrap.appendChild(b);
              });
              function sync() { btns.forEach(function (x) { x[1].setAttribute('aria-pressed', String(state[key] === x[0])); }); }
              wrap.sync = sync; sync();
              return wrap;
            };
            var textInput = function (key, placeholder) {
              var input = h('input', { type: 'text', maxlength: '20', placeholder: placeholder, autocomplete: 'off', spellcheck: 'false' });
              input.value = state[key];
              input.addEventListener('input', function () { state[key] = input.value; api.rebuild(); });
              return input;
            };
            var select = function (key, options) {
              var sel = h('select', {});
              options.forEach(function (o) { sel.appendChild(h('option', { value: o[0] }, o[1])); });
              sel.value = state[key];
              sel.addEventListener('change', function () { state[key] = sel.value; api.rebuild(); });
              return sel;
            };

            container.appendChild(h('h3', { class: 'mm-group-title' }, 'Your name'));
            var in1 = textInput('line1', 'Line 1 (e.g. Chris)');
            var in2 = textInput('line2', 'Line 2 (optional)');
            container.appendChild(field('Line 1', in1));
            container.appendChild(field('Line 2 (optional)', in2));
            container.appendChild(h('p', { class: 'mm-note' }, 'Letters, numbers, - + . ! \' and <3 for a heart. Up to 20 characters per line.'));

            container.appendChild(h('h3', { class: 'mm-group-title' }, 'Style'));
            var selFont = select('font', Object.keys(FONTS).map(function (k) { return [k, FONTS[k].label]; }));
            var selCase = select('caps', CASES);
            var selShape = picker('shape', SHAPES, SHAPE_ICONS);
            var selHole = picker('hole', HOLES, HOLE_ICONS);
            container.appendChild(field('Lettering style', selFont));
            container.appendChild(field('Capitals', selCase));
            container.appendChild(field('Plate shape', selShape));
            container.appendChild(field('Key ring hole', selHole));

            container.appendChild(h('h3', { class: 'mm-group-title' }, 'Quick looks'));
            var chips = h('div', { class: 'mm-chips' });
            LOOKS.forEach(function (look) {
              chips.appendChild(h('button', {
                class: 'mm-chip', type: 'button', 'aria-pressed': 'false',
                onclick: function () {
                  Object.keys(look.state).forEach(function (k) { state[k] = look.state[k]; });
                  api.setParams(look.params);
                  refreshNameUI();
                  api.toast(look.label + ' applied');
                }
              }, look.label));
            });
            container.appendChild(chips);

            refreshNameUI = function () {
              in1.value = state.line1; in2.value = state.line2;
              selFont.value = state.font; selCase.value = state.caps;
              selShape.sync(); selHole.sync();
            };
            setTimeout(function () { api.centerCamera('iso'); }, 60);
          }
        }],

        build: function (p) {
          return buildKeychain(p);
        }
      };
    })();
  </script>
  <script src="shared/generator-core.js"></script>
</body>
</html>
