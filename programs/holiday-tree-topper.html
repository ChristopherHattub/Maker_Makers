<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MM-107 Holiday Tree Topper // Maker Makers</title>
  <link rel="stylesheet" href="shared/generator.css">
  <script src="../vendor/three/three.min.js"></script>
  <script src="../vendor/three/OrbitControls.js"></script>
</head>
<body class="mm-gen">
  <script>
    // Holiday Tree Topper: a faceted crystal star, sparkle or heart on a cone that spins on a socket for the tree tip.
    // Three bodies: base (socket + captured post), cap (the cone, printed in place around the post) and star.
    (function () {
      'use strict';
      var TAU = Math.PI * 2, K = Math.SQRT2, SEG = 96;

      // ---- Lathe kit: closed shells from rings (shared vertices, so always watertight) ----
      function loopXZ(r, y) {
        var out = [], j, a;
        for (j = 0; j < SEG; j++) { a = (j / SEG) * TAU; out.push([r * Math.cos(a), y, r * Math.sin(a)]); }
        return out;
      }
      // profile: [[r, y], ...]; r <= 0 makes a pole. The last point joins the first (pole to pole = nothing).
      function lathe(profile) {
        var verts = [], idx = [], info = [], i, j;
        profile.forEach(function (p) {
          if (p[0] < 1e-6) { info.push({ pole: true, s: verts.length, n: 1 }); verts.push([0, p[1], 0]); }
          else { info.push({ s: verts.length, n: SEG }); loopXZ(p[0], p[1]).forEach(function (q) { verts.push(q); }); }
        });
        var n = profile.length;
        for (i = 0; i < n; i++) {
          var A = info[i], B = info[(i + 1) % n];
          if (A.pole && B.pole) continue;
          if (A.pole) { for (j = 0; j < B.n; j++) idx.push(A.s, B.s + (j + 1) % B.n, B.s + j); }
          else if (B.pole) { for (j = 0; j < A.n; j++) idx.push(A.s + j, A.s + (j + 1) % A.n, B.s); }
          else {
            for (j = 0; j < A.n; j++) {
              var a = A.s + j, b = A.s + (j + 1) % A.n, c = B.s + (j + 1) % B.n, d = B.s + j;
              idx.push(a, b, c, a, c, d);
            }
          }
        }
        return expand(verts, idx);
      }
      // Non-indexed Float32Array, wound outward (fixed from the signed volume).
      function expand(verts, idx) {
        var vol = 0, i, j, p, q, r;
        for (i = 0; i < idx.length; i += 3) {
          p = verts[idx[i]]; q = verts[idx[i + 1]]; r = verts[idx[i + 2]];
          vol += (p[0] * (q[1] * r[2] - q[2] * r[1]) - p[1] * (q[0] * r[2] - q[2] * r[0]) + p[2] * (q[0] * r[1] - q[1] * r[0])) / 6;
        }
        var out = new Float32Array(idx.length * 3), o = 0, v, t;
        for (i = 0; i < idx.length; i += 3) {
          t = vol < 0 ? [idx[i], idx[i + 2], idx[i + 1]] : [idx[i], idx[i + 1], idx[i + 2]];
          for (j = 0; j < 3; j++) { v = verts[t[j]]; out[o++] = v[0]; out[o++] = v[1]; out[o++] = v[2]; }
        }
        return out;
      }

      // ---- Outline of the topper head, counter-clockwise, centred, y up, star-shaped about the origin ----
      function outline(p) {
        var R = p.size, pts = [], i, a, r, n = p.points;
        if (p.style === 0) {
          for (i = 0; i < 2 * n; i++) {
            a = Math.PI / 2 + (i * Math.PI) / n; r = i % 2 === 0 ? R : R * p.pointy / 100;
            pts.push([r * Math.cos(a), r * Math.sin(a)]);
          }
        } else if (p.style === 1) {
          var per = TAU / n, rv = R * p.pointy / 100 * 0.75, rs = R * 0.56, rr = [R, rv, rs, rv];
          for (i = 0; i < 4 * n; i++) {
            a = Math.PI / 2 + (Math.floor(i / 4) * per) + (i % 4) * per / 4;
            pts.push([rr[i % 4] * Math.cos(a), rr[i % 4] * Math.sin(a)]);
          }
        } else {
          var s = R / 16.5, t, c = [];
          for (i = 0; i < 72; i++) {
            t = -(i / 72) * TAU;
            c.push([s * 16 * Math.pow(Math.sin(t), 3),
              s * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t) + 2.5)]);
          }
          pts = c;
        }
        return pts;
      }

      // Faceted head: every outline edge joins a front and a back apex, so no face is flatter than the pillow slope.
      function headMesh(pts, t, yc) {
        var verts = [], idx = [], n = pts.length, i;
        pts.forEach(function (q) { verts.push([q[0], yc + q[1], 0]); });
        verts.push([0, yc, t]); verts.push([0, yc, -t]);
        for (i = 0; i < n; i++) {
          idx.push(i, (i + 1) % n, n);
          idx.push((i + 1) % n, i, n + 1);
        }
        return expand(verts, idx);
      }

      // Lowest point of the outline inside |x| <= xs, and the cone reach needed by downward-pointing corners.
      function outlineStats(pts, xs) {
        var n = pts.length, low = 1e9, need = -1e9, i, k, a, b, c, q, cross;
        for (i = 0; i < n; i++) {
          a = pts[i]; b = pts[(i + 1) % n];
          for (k = 0; k <= 24; k++) {
            q = [a[0] + (b[0] - a[0]) * k / 24, a[1] + (b[1] - a[1]) * k / 24];
            if (Math.abs(q[0]) <= xs && q[1] < low) low = q[1];
          }
        }
        for (i = 0; i < n; i++) {
          a = pts[(i + n - 1) % n]; b = pts[i]; c = pts[(i + 1) % n];
          cross = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
          if (cross > 0 && b[1] <= a[1] + 1e-6 && b[1] <= c[1] + 1e-6) need = Math.max(need, b[1] + Math.abs(b[0]));
        }
        return { low: low, need: need };
      }

      // ---- The three bodies ----
      var RN = 4, NECK = 3, RH = 6.5, HW = 1.5, LEDGE = 3;
      // The print check voxelises at cells of (longest side / 170), at least 0.4 mm. dY lowers the ledge top a hair (the ledge
      // gets that much narrower) so it sits just above a cell centre and the cone's flat underside is seen right above it,
      // as in the Sedan Maker. Nothing else moves, so the cell size does not change.
      function layout(p) {
        var L = layoutAt(p, 0), dY = 0, k, cell, t;
        for (k = 0; k < 3; k++) {
          cell = Math.max(0.4, spanOf(p, L) / 170);
          t = L.Ys + dY - 0.05 - 0.5 * cell;
          dY = t - cell * Math.floor(t / cell);
          L = layoutAt(p, dY);
        }
        return L;
      }
      function spanOf(p, L) {
        var lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
        [baseMesh(L), capMesh(L), headMesh(L.pts, p.puff / 100 * p.size, L.yc)].forEach(function (a) {
          for (var i = 0, d; i < a.length; i++) { d = i % 3; if (a[i] < lo[d]) lo[d] = a[i]; if (a[i] > hi[d]) hi[d] = a[i]; }
        });
        return Math.max(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]);
      }
      function layoutAt(p, dY) {
        var g = p.spin ? p.clr : -0.5, gf = p.spin ? p.clr : -0.2;
        var rbB = p.tipD / 2 + 1.5, rbT = Math.max(3.5, rbB - p.depth * 0.16), rc = rbB + 3;
        var Yb = p.depth, Yn = Yb + rbT - RN + 3.6;
        var Rs = Math.max(rc + 2, Math.min(rc + 5, (Yn + RN + rc + LEDGE - 2) / 2));
        var Ys = Yn - (Rs - LEDGE - RN) - dY, Yf = Ys - (Rs - rc);
        var Yh0 = Yn + NECK, P2y = Yh0 + (RH - RN), P1y = P2y + HW, P0y = P1y + RH;
        var S0 = RN + Yn, S0p = S0 + g * K, yHT = P0y + g * K;
        var pts = outline(p), st = outlineStats(pts, RH + 1.6);
        var yc = yHT + 1.5 - st.low;
        var Rk = RH + Math.max(g, 0) + 2.4;
        var Sc = Math.max(yc + 1.5 + st.need, yHT + Rk + 2.4, S0p + 2.4 * K + 2 * LEDGE);
        return { g: g, gf: gf, rbB: rbB, rbT: rbT, rc: rc, Yb: Yb, Yn: Yn, Rs: Rs, Ys: Ys, Yf: Yf, Yh0: Yh0, P2y: P2y, P1y: P1y, P0y: P0y,
          S0p: S0p, yHT: yHT, pts: pts, yc: yc, Sc: Sc };
      }

      function baseMesh(L) {
        return lathe([
          [0, L.P0y], [RH, L.P1y], [RH, L.P2y], [RN, L.Yh0], [RN, L.Yn], [RN + L.Yn - L.Ys, L.Ys], [L.Rs, L.Ys], [L.rc, L.Yf],
          [L.rc, 0], [L.rbB, 0], [L.rbT, L.Yb], [0, L.Yb + L.rbT]
        ]);
      }
      function capMesh(L) {
        var g = L.g, Sc = L.Sc, S0p = L.S0p, Fa = L.Rs - (L.Ys + L.gf);
        return lathe([
          [0, Sc],
          [(Sc + Fa) / 2, (Sc - Fa) / 2],
          [L.Rs, L.Ys + L.gf],
          [RN + L.Yn - L.Ys + (K - 1) * g, L.Ys + L.gf],
          [RN + g, S0p - RN - g],
          [RN + g, L.Yh0 - (K - 1) * g],
          [RH + g, L.Yh0 + (RH - RN) - (K - 1) * g],
          [RH + g, L.P1y + (K - 1) * g],
          [0, L.yHT]
        ]);
      }

      window.MM_GENERATOR = {
        code: 'MM-107',
        category: 'CHRISTMAS // TREE DECOR',
        title: 'Holiday Tree Topper',
        fileName: 'Holiday_Tree_Topper',
        palette: [
          { name: 'Honey Gold', color: '#fcd34d' }, { name: 'Holly Red', color: '#e5586b' },
          { name: 'Pine Green', color: '#4fae7b' }, { name: 'Frost Blue', color: '#93c5fd' },
          { name: 'Bone White', color: '#f1f5f9' }, { name: 'Candy Pink', color: '#fda4af' },
          { name: 'Lavender Mist', color: '#d8b4fe' }, { name: 'Midnight', color: '#334155' }
        ],
        defaultColor: '#fcd34d',
        partNames: { star: 'Star', cap: 'Spinning cone', base: 'Socket base' },
        parameters: [
          { group: 'Topper', key: 'style', label: 'Shape', unit: '', min: 0, max: 2, step: 1, value: 0, options: ['Star', 'Sparkle', 'Heart'] },
          { group: 'Topper', key: 'points', label: 'Points (5, 6, 10 print clean)', unit: '', min: 4, max: 10, step: 1, value: 5, showIf: function (p) { return p.style !== 2; } },
          { group: 'Topper', key: 'size', label: 'Size (radius)', unit: ' mm', min: 28, max: 55, step: 1, value: 38 },
          { group: 'Topper', key: 'pointy', label: 'Pointiness (higher = blunter, fewer overhangs)', unit: '%', min: 36, max: 62, step: 1, value: 42, showIf: function (p) { return p.style !== 2; } },
          { group: 'Topper', key: 'puff', label: 'Puff (faceted thickness)', unit: '%', min: 20, max: 50, step: 1, value: 28 },
          { group: 'Socket', key: 'tipD', label: 'Tree tip width', unit: ' mm', min: 10, max: 30, step: 1, value: 20 },
          { group: 'Socket', key: 'depth', label: 'Socket depth', unit: ' mm', min: 30, max: 70, step: 1, value: 45 },
          { group: 'Spinner', key: 'spin', label: 'Spins on its socket', unit: '', min: 0, max: 1, step: 1, value: 1, options: ['Fixed', 'Spins'] },
          { group: 'Spinner', key: 'clr', label: 'Print clearance', unit: ' mm', min: 0.3, max: 0.6, step: 0.05, value: 0.4, showIf: function (p) { return p.spin === 1; } }
        ],
        presets: [
          { label: 'Default star', values: { style: 0, points: 5, size: 38, pointy: 42, puff: 28, tipD: 20, depth: 45, spin: 1, clr: 0.4 } },
          { label: 'Four-point twinkle', values: { style: 0, points: 4, size: 40, pointy: 56, puff: 28, tipD: 20, depth: 45, spin: 1, clr: 0.4 } },
          { label: 'Sparkle burst', values: { style: 1, points: 6, size: 40, pointy: 42, puff: 28, tipD: 20, depth: 45, spin: 1, clr: 0.4 } },
          { label: 'Heart topper', values: { style: 2, points: 5, size: 36, pointy: 42, puff: 32, tipD: 20, depth: 45, spin: 1, clr: 0.4 } },
          { label: 'Small fixed star', values: { style: 0, points: 5, size: 30, pointy: 42, puff: 28, tipD: 14, depth: 36, spin: 0, clr: 0.4 } }
        ],
        build: function (p) {
          var L = layout(p);
          var head = headMesh(L.pts, p.puff / 100 * p.size, L.yc);
          return [
            { name: 'base', positions: baseMesh(L), smoothGroup: 'base' },
            { name: 'cap', positions: capMesh(L), smoothGroup: 'cap' },
            { name: 'star', positions: head, smoothGroup: 'star' }
          ];
        }
      };
    })();
  </script>
  <script src="shared/export-utils.js"></script>
  <script src="shared/mesh-utils.js"></script>
  <script src="shared/generator-core.js"></script>
</body>
</html>
