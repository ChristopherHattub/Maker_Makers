        else if (tab === 'fingers') v = { t: A.fingers, dir: [-0.4, 0.42, 0.85], visH: A.fLen * 2.0, visW: A.W * 1.3 };
        else if (tab === 'gems') {
          var i = Math.round(p.gemSel), g = A.gem[i] || A.gem[0];
          if (!g) return null;
          var side = i === 0 ? 0.22 : (g[0] >= 0 ? 0.5 : -0.5);
          v = { t: g, dir: [side, i === 0 ? 0.1 : (g[1] > A.plate[1] ? 0.28 : -0.05), 1], visH: Math.max(A.ext[i], 6) * 4.2, visW: Math.max(A.ext[i], 6) * 4.2 };
        } else v = { t: [0, A.H * 0.5, 0], dir: [0.62, 0.22, 0.75], visH: A.H * 1.32, visW: A.W * 1.7 };

      }
      function startFly(view) {
        if (!stage || !view) return;
        var cam = stage.camera, ctl = stage.controls, T = stage.THREE;
        var rect = stage.container;
        var aspect = Math.max(0.4, (rect.clientWidth || 600) / (rect.clientHeight || 450));
        var half = Math.tan(cam.fov * DEG / 2);
        var dist = Math.max(view.visH / (2 * half), view.visW / (2 * half * aspect));
        var d = new T.Vector3(view.dir[0], view.dir[1], view.dir[2]).normalize();
