        { tab: 'fingers', group: 'Fingers', key: 'fPose', label: 'Bend the fingers (preview only, the print stays straight)', unit: '°', min: 0, max: 70, step: 5, value: 0, showIf: artOn },
        { tab: 'fingers', group: 'Fingers', key: 'fSeg', label: 'Armour ridges per finger (jointed fingers: the sections; hinged needs about 15 mm each)', min: 2, max: 4, step: 1, value: DEFAULTS.fSeg },
        { tab: 'fingers', group: 'Fingers', key: 'fTip', label: 'Fingertip', min: 0, max: 2, step: 1, value: 0, format: function (v) { return TIP_NAMES[v]; } },
        { tab: 'fingers', group: 'Fingers', key: 'fSplay', label: 'Spread', unit: '°', min: 0, max: 8, step: 1, value: DEFAULTS.fSplay },
        { tab: 'fingers', group: 'Fingers', key: 'fDrop', label: 'Lean toward the palm (over 20 needs supports)', unit: '°', min: 0, max: 22, step: 1, value: DEFAULTS.fDrop, showIf: wearOnly },
        { tab: 'fingers', group: 'Fingers', key: 'fCurl', label: 'Curl forward (over 25 needs supports)', unit: '°', min: 0, max: 25, step: 1, value: DEFAULTS.fCurl, showIf: displayOnly },
        { tab: 'fingers', group: 'Thumb', key: 'tLen', label: 'Thumb length', unit: ' mm', min: 28, max: 55, step: 1, value: DEFAULTS.tLen },
        { tab: 'fingers', group: 'Thumb', key: 'tAngle', label: 'Thumb angle out (over 50 needs supports)', unit: '°', min: 20, max: 55, step: 1, value: DEFAULTS.tAngle },
        { tab: 'fingers', group: 'Knuckles', key: 'studs', label: 'Knuckle studs', min: 0, max: 2, step: 1, value: 0, format: function (v) { return STUD_NAMES[v]; } },

        { tab: 'gems', group: 'Positions', key: 'gemLayout', label: 'Gem layout', min: 0, max: 5, step: 1, value: DEFAULTS.gemLayout,
          choices: LAYOUT_NAMES.map(function (n, k) { return { label: n, svg: icon(LAYOUT_ICONS[k]) }; }) },
        { tab: 'gems', group: 'Positions', key: 'orbit', label: 'Links between the gems', min: 0, max: 1, step: 1, value: 1, options: ['Off', 'On'] },
        { tab: 'gems', group: 'Positions', key: 'orbitR', label: 'Spread (grows if the gems need room)', unit: ' mm', min: 18, max: 28, step: 1, value: DEFAULTS.orbitR },
        { tab: 'gems', group: 'Positions', key: 'orbitTurn', label: 'Turn the layout', unit: '°', min: -90, max: 90, step: 5, value: DEFAULTS.orbitTurn },
        { tab: 'gems', group: 'Gem', key: 'gemSel', label: 'Edit gem', min: 0, max: 4, step: 1, value: 0,
          choices: GEM_NAMES.map(function (n, i) { return { label: n, svg: icon('<path d="M20 6 31 15 20 34 9 15Z"/><path d="M9 15H31M15 15 20 34 25 15"/>') }; }) }
      ].concat(gemParams());

      PARAMS.forEach(function (p) { if (p.key === 'metal' || p.key === 'accent') p.value = DEFAULTS[p.key]; });

      window.MM_GENERATOR = {
        code: 'MM-136',
        category: 'COSMIC // WEARABLE ART',
        title: 'Constellation Gauntlet',
        fileName: 'Constellation_Gauntlet',
        minFrame: 160,
        sculpt: false,
        hideModelTab: true,
        coloredTabs: ['style', 'fit', 'cuff', 'plate', 'fingers', 'gems'],
        openGroups: ['Look', 'Build', 'Your hand (millimetres, measured flat)', 'Comfort', 'Cuff', 'Plate', 'Fingers', 'Positions', 'Gem', 'Stone'],
        palette: [
          { name: 'Brass Gold', color: '#d4a437' }, { name: 'Silver Steel', color: '#c4ccd8' },
          { name: 'Night Iron', color: '#3f4756' }, { name: 'Solar Amber', color: '#f59e0b' },
          { name: 'Aurora Teal', color: '#14b8a6' }, { name: 'Dusk Violet', color: '#8b5cf6' },
          { name: 'Nova Rose', color: '#f43f5e' }, { name: 'Comet Blue', color: '#3b82f6' }
        ],
        defaultColor: '#d4a437',
        partNames: {
          arm: 'Cuff & shield', plate: 'Hand plate', orbit: 'Gem links', settings: 'Gem settings', fingers: 'Fingers', segments: 'Finger segments',
          knuckles: 'Knuckle studs', thumb: 'Thumb', gem0: 'Solis (core gem)', gem1: 'Lunara gem', gem2: 'Vesper gem', gem3: 'Aurelia gem', gem4: 'Nova gem'
        },
        tabs: [
          { id: 'style', label: 'Style', hint: 'Pick a style family, then edit each part in its own tab',
            mount: function (box, api) {
              var note = document.createElement('p');
              note.className = 'mm-note';
              note.textContent = 'A style sets every part at once. Then each tab edits one part and the camera flies to it. It is a wearable gauntlet: set your hand size in Fit. Five gems sit on the hand plate: Solis the core, and Lunara, Vesper, Aurelia and Nova. The Gems tab has six layouts for them.';
              box.appendChild(note);
              var cards = document.createElement('div');
              cards.className = 'mm-preset-cards';
              STYLES.forEach(function (st) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'mm-preset-card mm-preset-card--lines';
                b.innerHTML = '<svg viewBox="0 0 40 40" aria-hidden="true">' + icon(st.icon) + '</svg><span>' + st.label + '</span>';
                b.addEventListener('click', function () { api.setParams(st.values); api.toast(st.label + ' style'); });
                cards.appendChild(b);
              });
              box.appendChild(cards);
              box.appendChild(api.takeParams());
            } },
          { id: 'fit', label: 'Fit', hint: 'Your hand size, how snugly the glove grips, and the palm window your hand slides in through' },
          { id: 'cuff', label: 'Cuff', hint: 'The forearm cuff: height, flare, surface and raised bands' },
          { id: 'plate', label: 'Plate', hint: 'The hand plate: outline, size, thickness and core' },
          { id: 'fingers', label: 'Fingers', hint: 'Finger tubes, thumb and knuckle studs. Jointed fingers are either print-in-place pin hinges or loose segments strung on elastic cord' },
          { id: 'gems', label: 'Gems', hint: 'Where the gems sit, then each gem\'s shape, cut, size, colour and setting',
            mount: function (box, api) {
              var note = document.createElement('p');
              note.className = 'mm-note';
              note.textContent = 'Each gem is its own piece. It prints lying on its flat bottom and is glued into its setting.';
              box.appendChild(note);
              var row = document.createElement('div');
              row.className = 'mm-export-row';
              function copyBtn(text, keys) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'mm-btn';
                b.textContent = text;
                b.addEventListener('click', function () {
                  var sel = Math.round(api.params.gemSel), v = {};
                  [0, 1, 2, 3, 4].forEach(function (i) { if (i !== sel) keys.forEach(function (k) { v['g' + i + '_' + k] = api.params['g' + sel + '_' + k]; }); });
                  api.setParams(v);
                  api.toast('Copied to the other gems');
                });
                row.appendChild(b);
              }
              fitNote = document.createElement('p');
              fitNote.className = 'mm-note';
              box.appendChild(fitNote);
              copyBtn('Copy shape, cut and setting to all', ['shape', 'cut', 'set', 'turn', 'height']);
              copyBtn('Copy colour to all', ['color']);
              box.appendChild(row);
            } }
        ],
        parameters: PARAMS,
        presets: [{ label: 'Default Orrery', values: DEFAULTS }].concat(STYLES.map(function (st) {
          var v = Object.assign({}, DEFAULTS, st.values);
          return { label: st.label + ' style', values: v };
        })),

        fitInfo: function () { return last ? last.fit : 1; },
        build: function (p) {
          var Lt = fullBuild(p);
          curParams = p;
          if (fitNote) fitNote.textContent = Lt.fit < 0.999 ? 'The gems are drawn at ' + Math.round(Lt.fit * 100) + '% of their set size so they fit on the plate. Make the plate bigger or the gems smaller to stop this.' : '';
          if (Math.round(p.gemSel) !== lastSel) { if (lastSel >= 0 && curTab === 'gems') wantGemFly = true; lastSel = Math.round(p.gemSel); }
          return Lt.meshes.concat(Lt.gemMeshes.map(function (g) { return { name: g.name, positions: g.positions, shade: g.shade, color: g.color }; }));
        },

        // The print plate: the gauntlet as built, and the gems lying on their flat bottoms in a row in front of it.
        printMeshes: function () {
          var Lt = last, out = Lt.meshes.slice(), gems = Lt.gemMeshes, S = Lt.S, i, x, zMax = -1e9, xs = [], total = 0;
          Lt.meshes.forEach(function (m) { for (var k = 2; k < m.positions.length; k += 3) if (m.positions[k] > zMax) zMax = m.positions[k]; });
          gems.forEach(function (g) { var w = g.size * 2 + 4; xs.push(w); total += w; });
          x = -total / 2;
          if (Lt.wear) {   // the glove prints as one piece
            var gl = out.filter(function (m) { return m.smoothGroup === 'glove'; });
            out = out.filter(function (m) { return m.smoothGroup !== 'glove'; });
            out.unshift({ name: 'arm', positions: join(gl.map(function (m) { return m.positions; })), color: gl[0].color });
          }
          var maxR = 0, zEnd;
          gems.forEach(function (g) { maxR = Math.max(maxR, g.size); });
          zEnd = zMax + 8 + 2 * maxR;
          out = out.filter(function (m) { return m.name !== 'segments'; });
          if (Lt.hinge && Lt.segPrint) out.push({ name: 'segments', positions: Lt.segPrint, color: Lt.meshes.filter(function (m) { return m.name === 'segments'; })[0].color });
          else if (Lt.wear && Lt.segs) {   // the loose finger segments stand on their flat ends in rows behind the gems: one row per section, one column per finger
            var left = Lt.p.hand > 0, rows = {}, rowW = 0, parts = [], colorSeg = (Lt.meshes.filter(function (m) { return m.name === 'segments'; })[0] || {}).color || Lt.meshes[0].color;
            Lt.segs.forEach(function (r) { (rows[r.m] = rows[r.m] || []).push(r); });
            var c0 = Lt.F.full, z = zEnd + 6;
            Object.keys(rows).forEach(function (k) {
              var rowD = 0;
              rows[k].forEach(function (r) {
                var c = c0[r.fi], a = new Float32Array(r.a), wd = c.Ro + c.bead + 1.5, xp = (left ? -1 : 1) * (r.fi - 1.5) * 2 * (Math.max.apply(null, c0.map(function (q) { return q.Ro + q.bead; })) + 2);
                mapPts(a, function (px, py, pz) { return [(left ? -px : px) + xp, py, pz + z + wd]; });
                if (left) flipAll(a);
                parts.push(a);
                rowD = Math.max(rowD, 2 * wd);
              });
              z += rowD + 3;
            });
            if (parts.length) out.push({ name: 'segments', positions: join(parts), color: colorSeg });
          }
          gems.forEach(function (g, n) {
            var a = new Float32Array(g.print.a), cx = x + xs[n] / 2, cz = zMax + 8 + maxR;
            mapPts(a, function (px, py, pz) { return [px * S + cx, (py + g.print.D) * S, pz * S + cz]; });
            out.push({ name: g.name, positions: a, color: g.color });
            x += xs[n];
          });
          return out;
        },

        onStage: function (env) {
          stage = env; env.controls.minDistance = 18;
          if (last && curParams) startFly(viewFor(curTab === 'color' ? 'style' : curTab, curParams));   // the opening swoop (the engine selects the first tab before the stage exists)
        },
        onTab: function (tab, api) {
          curTab = tab;
          if (tab === 'print') { fly = null; if (stage) stage.controls.enabled = true; return; }
          var key = tab === 'color' ? 'style' : tab;
          startFly(viewFor(key, api.params));
        },
        onFrame: function () {
          if (wantGemFly && stage && curTab === 'gems') { wantGemFly = false; startFly(viewFor('gems', curParams || {})); }
          if (fly) stepFly(performance.now());
        }
      };
    })();
  </script>
  <script src="shared/export-utils.js"></script>
  <script src="shared/mesh-utils.js"></script>
  <script src="shared/sculpt.js"></script>
  <script src="shared/generator-core.js"></script>
</body>
