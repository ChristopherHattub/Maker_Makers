          for (k = 0; k <= 6; k++) { var a = (c[2] + k * 15) * Math.PI / 180; pts.push([cx + c[0] * (w / 2 - r) + r * Math.cos(a) * 1, cz + c[1] * (d / 2 - r) + r * Math.sin(a) * 1]); }
        });
        // corners above were generated in angle order about each centre; sort into one convex loop
        return hull(pts);
      }


      // -----------------------------------------------------------------------
      // Config: parameters, presets and the character-creator tabs
      // -----------------------------------------------------------------------
      var PAL = [
        { name: 'Peach Skin', color: C.skin }, { name: 'Moss Green', color: C.moss }, { name: 'Steel Grey', color: C.steel }, { name: 'Royal Blue', color: C.blue },
        { name: 'Crimson Red', color: C.red }, { name: 'Leather Brown', color: C.brown }, { name: 'Sunny Gold', color: C.gold }, { name: 'Shadow Black', color: C.dark }

      function hidden() { return false; }
      var DEFAULTS = { race: 0, cls: 4, pose: 0, comp: 0, compPose: 0, hair: 0, beard: 0, height: 32, build: 100, headSize: 100, hand: 0, turn: 0, compSide: 0, compSize: 100, compTurn: 0, baseShape: 0, baseTop: 0, baseD: 25, baseH: 3, plate: 1, nameSize: 3.6 };
      function pv(over) { var o = {}; Object.keys(DEFAULTS).forEach(function (k) { o[k] = DEFAULTS[k]; }); Object.keys(over || {}).forEach(function (k) { o[k] = over[k]; }); return o; }

      var parameters = [
        { key: 'race', label: 'Race', min: 0, max: RACES.length - 1, step: 1, value: DEFAULTS.race, options: RACES.map(function (r) { return r.name; }), showIf: hidden },
        { key: 'cls', label: 'Class', min: 0, max: CLASSES.length - 1, step: 1, value: DEFAULTS.cls, options: CLASSES.map(function (r) { return r.name; }), showIf: hidden },
        { key: 'pose', label: 'Pose', min: 0, max: POSES.length - 1, step: 1, value: DEFAULTS.pose, options: POSES.map(function (r) { return r.name; }), showIf: hidden },
        { key: 'comp', label: 'Companion', min: 0, max: COMPANIONS.length, step: 1, value: 0, options: ['None'].concat(COMPANIONS.map(function (r) { return r.name; })), showIf: hidden },
        { key: 'compPose', label: 'Companion pose', min: 0, max: 2, step: 1, value: 0, options: ['Pose 1', 'Pose 2', 'Pose 3'], showIf: hidden },
        { tab: 'hero', group: 'Look', key: 'height', label: 'Figure height (a human is this tall, mm)', unit: ' mm', min: 22, max: 60, step: 1, value: 32 },
        { tab: 'hero', group: 'Look', key: 'build', label: 'Build (slim to stocky)', unit: '%', min: 80, max: 125, step: 1, value: 100 },
        { tab: 'hero', group: 'Look', key: 'headSize', label: 'Head size (heroic to cute)', unit: '%', min: 85, max: 140, step: 1, value: 100 },
        { tab: 'hero', group: 'Look', key: 'hair', label: 'Hair style', min: 0, max: HAIRS.length - 1, step: 1, value: 0, options: HAIRS },
        { tab: 'hero', group: 'Look', key: 'beard', label: 'Beard', min: 0, max: BEARDS.length - 1, step: 1, value: 0, options: BEARDS },
        { tab: 'pose', group: 'Stance', key: 'hand', label: 'Weapon hand', min: 0, max: 1, step: 1, value: 0, options: ['Right-handed', 'Left-handed'] },
        { tab: 'pose', group: 'Stance', key: 'turn', label: 'Turn the figure on its base', unit: '°', min: -60, max: 60, step: 1, value: 0 },
        { tab: 'companion', group: 'Placement', key: 'compSide', label: 'Companion stands', min: 0, max: 2, step: 1, value: 0, options: ['To the left', 'To the right', 'In front'] },
        { tab: 'companion', group: 'Placement', key: 'compSize', label: 'Companion size', unit: '%', min: 70, max: 150, step: 1, value: 100 },
        { tab: 'companion', group: 'Placement', key: 'compTurn', label: 'Companion turn', unit: '°', min: -135, max: 135, step: 1, value: 0 },
        { tab: 'base', group: 'Base', key: 'baseShape', label: 'Base shape', min: 0, max: BASE_SHAPES.length - 1, step: 1, value: 0, options: BASE_SHAPES },
        { tab: 'base', group: 'Base', key: 'baseTop', label: 'Ground', min: 0, max: BASE_TOPS.length - 1, step: 1, value: 0, options: BASE_TOPS },
        { tab: 'base', group: 'Base', key: 'baseD', label: 'Base width (grows to fit the pose)', unit: ' mm', min: 20, max: 50, step: 1, value: 25 },
        { tab: 'base', group: 'Base', key: 'baseH', label: 'Base thickness', unit: ' mm', min: 2, max: 6, step: 0.5, value: 3 },
        { tab: 'base', group: 'Name plate', key: 'plate', label: 'Name plate', min: 0, max: 1, step: 1, value: 1, options: ['Off', 'On'] },
        { tab: 'base', group: 'Name plate', key: 'nameSize', label: 'Letter height (under 3 mm is hard to print)', unit: ' mm', min: 2.4, max: 6, step: 0.2, value: 3.6, showIf: function (p) { return p.plate === 1; } }
      ];

      var presets = [
        { label: 'Default hero (Human Fighter)', values: pv({}) },
        { label: 'Elf Wizard, casting', values: pv({ race: 1, cls: 11, pose: 3 }) },
        { label: 'Dwarf Fighter with a wolf', values: pv({ race: 2, cls: 4, pose: 1, comp: 1, compPose: 1, baseTop: 1 }) },
        { label: 'Orc Barbarian, battle ready', values: pv({ race: 4, cls: 0, pose: 1, baseTop: 2 }) },
        { label: 'Halfling Rogue with a cat', values: pv({ race: 3, cls: 8, pose: 5, comp: 2, compPose: 1, compSide: 1, baseTop: 3 }) },
        { label: 'Human Cleric with a raven', values: pv({ race: 0, cls: 2, pose: 0, comp: 3, compPose: 1, baseShape: 2 }) },
        { label: 'Drakeling Sorcerer with a baby dragon', values: pv({ race: 5, cls: 9, pose: 3, comp: 4, compPose: 2, baseShape: 3 }) },
        { label: 'Elf Ranger with a wolf', values: pv({ race: 1, cls: 7, pose: 1, comp: 1, compPose: 2, baseTop: 3 }) },
        { label: 'Human Paladin, triumph', values: pv({ race: 0, cls: 6, pose: 4, baseTop: 1 }) },
        { label: 'Human Bard with a cat', values: pv({ race: 0, cls: 1, pose: 4, comp: 2, compPose: 0, compSide: 1 }) },
        { label: 'Human Warlock with a raven', values: pv({ race: 0, cls: 10, pose: 3, comp: 3, compPose: 2 }) },
        { label: 'Halfling Druid with a slime', values: pv({ race: 3, cls: 3, pose: 0, comp: 5, compPose: 0, baseTop: 3 }) },
        { label: 'Dwarf Monk, ready', values: pv({ race: 2, cls: 5, pose: 1 }) }
      ];

      function h(tag, attrs, text) {
        var node = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (k) {
          if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]); else node.setAttribute(k, attrs[k]);
        });
        if (text) node.textContent = text;
        return node;
      }
      var refreshers = [];
      function chipGrid(container, api, key, labels) {
        var wrap = h('div', { class: 'mm-chips' }), btns = labels.map(function (lb, i) {
          var b = h('button', { class: 'mm-chip', type: 'button', 'aria-pressed': 'false' }, lb);
          b.addEventListener('click', function () { var o = {}; o[key] = i; api.setParams(o); refresh(); });
          wrap.appendChild(b);
          return b;
        });
        function refresh() { btns.forEach(function (b, i) { b.setAttribute('aria-pressed', String(api.params[key] === i)); }); }
        refreshers.push(refresh); container.appendChild(wrap); refresh();
        return refresh;
      }
      function colorRow(container, api, label, roles) {
        container.appendChild(h('p', { class: 'mm-note' }, label));
        var wrap = h('div', { class: 'mm-chips' }), btns = [];
        var auto = h('button', { class: 'mm-chip', type: 'button', 'aria-pressed': 'false', title: 'Use the race and class colour' }, 'Auto');
        auto.addEventListener('click', function () { roles.forEach(function (r) { delete look[r]; }); api.rebuild(); refresh(); });
        wrap.appendChild(auto);
        PAL.forEach(function (pc) {
          var b = h('button', { class: 'mm-swatch', type: 'button', title: pc.name, 'aria-label': pc.name, 'aria-pressed': 'false', style: 'min-width:2.2rem;padding:0.3rem 0.45rem' });
          b.appendChild(h('span', { class: 'mm-swatch-dot', style: 'background:' + pc.color }));
          b.addEventListener('click', function () { roles.forEach(function (r) { look[r] = pc.color; }); api.rebuild(); refresh(); });
          btns.push([b, pc.color]); wrap.appendChild(b);
        });
        function refresh() {
          var cur = look[roles[0]];
          auto.setAttribute('aria-pressed', String(!cur));
          btns.forEach(function (x) { x[0].setAttribute('aria-pressed', String(cur === x[1])); });
        }
        refreshers.push(refresh); container.appendChild(wrap); refresh();
      }
      var blurbs = {};
      function note(container, id, text) { var n = h('p', { class: 'mm-note' }, text); blurbs[id] = n; container.appendChild(n); return n; }
      var lastSig = '';
      function syncUi(api) {
        var p = api.params, sig = [p.race, p.cls, p.pose, p.comp, p.compPose].join(',');
        if (sig === lastSig) return;
        lastSig = sig;
        refreshers.forEach(function (fn) { fn(); });
        if (blurbs.race) blurbs.race.textContent = RACES[p.race].blurb;
        if (blurbs.cls) blurbs.cls.textContent = CLASSES[p.cls].blurb;
        if (blurbs.comp) blurbs.comp.textContent = p.comp ? 'Pick a pose below. The companion stands on the same base.' : 'No companion. Pick one to add a pet to the base.';
      }
      var apiRef = null;

      window.MM_GENERATOR = {
        code: 'MM-138',
        category: 'TABLETOP // MINIATURES',
        title: 'Character Creator',
        fileName: 'CharacterMini',
        tabsFirst: true,
        sculpt: false,
        minFrame: 50,
        openGroups: ['Look'],
        palette: PAL,
        defaultColor: C.steel,
        partNames: {
          eyes: 'Eyes', skin: 'Skin', hair: 'Hair and beard', outfit: 'Clothes', trim: 'Boots and belt', armor: 'Armor', cape: 'Cloak, hat and plume', metal: 'Blades and metal', wood: 'Handles and staffs',
          gold: 'Gold trim', magic: 'Magic', shield: 'Shield', horn: 'Horns and tusks', pet: 'Companion', petDetail: 'Companion eyes and beak', base: 'Base', ground: 'Ground cover', plaque: 'Name plate', name: 'Name letters'
        },
        parameters: parameters,
        presets: presets,
        testState: nameState,
        onFrame: function () { if (apiRef) syncUi(apiRef); },
        build: build,
        tabs: [
          {
            id: 'hero', label: 'Hero', hint: 'Name your hero, then pick a race and a class',
            mount: function (container, api) {
              apiRef = api;
              container.appendChild(h('h3', { class: 'mm-group-title' }, 'Name'));
              var row = h('div', { class: 'mm-export-row' });
              var inp = h('input', { type: 'text', maxlength: '24', placeholder: 'Hero name', spellcheck: 'false', autocomplete: 'off', style: 'flex:1;min-width:0' });
              inp.value = nameState.text;
              inp.addEventListener('input', function () { nameState.text = inp.value; api.rebuild(); });
              var roll = h('button', { class: 'mm-btn', type: 'button' }, 'Roll a name');
              roll.addEventListener('click', function () { nameState.text = rollName(api.params.race); inp.value = nameState.text; api.rebuild(); });
              row.appendChild(inp); row.appendChild(roll); container.appendChild(row);
              var fsel = h('select', { 'aria-label': 'Name font' });
              NAME_FONTS.forEach(function (k) { fsel.appendChild(h('option', { value: k }, FONTDATA[k].label)); });
              fsel.value = nameState.font;
              fsel.addEventListener('change', function () { nameState.font = fsel.value; api.rebuild(); });
              container.appendChild(h('div', { class: 'mm-slider' })).appendChild(fsel);
              container.appendChild(h('p', { class: 'mm-note' }, 'The name is raised on a plate at the front of the base (Base tab turns it off). Letters need a bold font to print well at this size.'));
              container.appendChild(h('h3', { class: 'mm-group-title' }, 'Race'));
              chipGrid(container, api, 'race', RACES.map(function (r) { return r.name; }));
              note(container, 'race', RACES[api.params.race].blurb);
              container.appendChild(h('h3', { class: 'mm-group-title' }, 'Class'));
              chipGrid(container, api, 'cls', CLASSES.map(function (r) { return r.name; }));
              note(container, 'cls', CLASSES[api.params.cls].blurb);
              container.appendChild(h('h3', { class: 'mm-group-title' }, 'Colours'));
              colorRow(container, api, 'Skin', ['skin', 'horn']);
              colorRow(container, api, 'Hair and beard', ['hair']);
              colorRow(container, api, 'Clothes', ['outfit']);
              colorRow(container, api, 'Cloak, hat and plume', ['cape']);
              colorRow(container, api, 'Armor and blades', ['armor', 'metal']);
              colorRow(container, api, 'Boots, belt and wood', ['trim']);
              colorRow(container, api, 'Shield', ['shield']);
              container.appendChild(h('p', { class: 'mm-note' }, 'Every part can still be repainted one by one in the Color tool tab.'));
              lastSig = ''; syncUi(api);
              setTimeout(function () { api.centerCamera('iso'); }, 60);
            }
          },
          {
            id: 'pose', label: 'Pose', hint: 'Choose a stance for the hero',
            mount: function (container, api) {
              container.appendChild(h('h3', { class: 'mm-group-title' }, 'Pose'));
              chipGrid(container, api, 'pose', POSES.map(function (r) { return r.name; }));
              container.appendChild(h('p', { class: 'mm-note' }, 'Every pose prints with no supports: raised arms climb steeply, hands rest on the hip or on a planted shield, bow or staff, and the feet are flat on the base.'));
              container.appendChild(h('p', { class: 'mm-note' }, 'Staffs and bows touch the base in Heroic stand and Battle ready (a bow always does); in the other poses they are held up in the hand.'));
            }
          },
          {
            id: 'companion', label: 'Companion', hint: 'Add a pet or familiar to the base',
            mount: function (container, api) {
              container.appendChild(h('h3', { class: 'mm-group-title' }, 'Companion'));
              chipGrid(container, api, 'comp', ['None'].concat(COMPANIONS.map(function (r) { return r.name; })));
              note(container, 'comp', 'No companion. Pick one to add a pet to the base.');
              container.appendChild(h('h3', { class: 'mm-group-title' }, 'Companion pose'));
              var wrap = h('div', { class: 'mm-chips' }), bs = [0, 1, 2].map(function (i) {
                var b = h('button', { class: 'mm-chip', type: 'button', 'aria-pressed': 'false' }, 'Pose ' + (i + 1));
                b.addEventListener('click', function () { api.setParams({ compPose: i }); syncNow(); });
                wrap.appendChild(b); return b;
              });
              function syncNow() {
                var c = api.params.comp;
                bs.forEach(function (b, i) { b.textContent = c ? COMPANIONS[c - 1].poses[i] : 'Pose ' + (i + 1); b.setAttribute('aria-pressed', String(api.params.compPose === i)); });
              }
              refreshers.push(syncNow); container.appendChild(wrap); syncNow();
              container.appendChild(h('p', { class: 'mm-note' }, 'The base stretches to fit the companion. A hidden block under the belly of the animals means no supports.'));
            }
          },
          { id: 'base', label: 'Base', hint: 'Shape the base, the ground and the name plate', mount: function (container) { container.appendChild(h('p', { class: 'mm-note' }, 'The base is at least as wide as you ask, and grows to hold the feet, shield, staff and companion. 25 mm is a common size for 28 to 32 mm minis.')); } }
        ]
      };
    })();
  </script>
