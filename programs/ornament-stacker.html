<!doctype html>

<head>

  <link rel="stylesheet" href="shared/generator.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
  <style>
    body.mm-soft.snow {
      --s-bg: #cfe6fb; --s-panel: #ffffff; --s-panel-a: rgba(255,255,255,0.94); --s-accent: #e0475b; --s-accent-dim: rgba(224,71,91,0.35);
      --s-text: #24324d; --s-muted: #5f7799; --s-amber: #e9892a; --s-green: #2f9e63; --s-edge: #b9d4ee;
      --s-card: #eef6ff; --s-card-a: rgba(255,255,255,0.88); --s-stage: linear-gradient(#7fb2e5,#f1f8ff);
      --s-font: 'Fredoka', 'Trebuchet MS', 'Segoe UI', sans-serif;
      --s-bg-img: linear-gradient(#a9cdf0, #e6f2ff);
    }
    .snow .mm-gen-title { font-weight: 600; }
    .sn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.6rem, 1fr)); gap: 0.55rem; margin-bottom: 0.9rem; }
    .sn-card { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; padding: 0.5rem 0.25rem 0.4rem; border: 2px solid var(--s-edge); border-radius: 16px;
      background: #fff; color: var(--s-text); font: inherit; font-size: 0.78rem; cursor: pointer; min-height: 5.6rem; transition: transform .12s, box-shadow .12s; box-shadow: 0 3px 0 var(--s-edge); }
    .sn-card svg { width: 3.4rem; height: 3.4rem; }
    .sn-card:hover { transform: translateY(-2px); border-color: var(--s-accent); }
    .sn-card:active { transform: translateY(2px); box-shadow: 0 0 0 var(--s-edge); }
    .sn-card:focus-visible, .sn-mini:focus-visible { outline: 3px solid var(--s-accent); outline-offset: 2px; }
    .sn-tools { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.7rem; }
    .sn-yours { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.7rem; min-height: 2.2rem; }
    .sn-mini { width: 2.5rem; height: 2.5rem; padding: 0.15rem; border-radius: 12px; border: 2px solid var(--s-edge); background: #fff; cursor: pointer; }
    .sn-mini svg { width: 100%; height: 100%; }
    .sn-mini[aria-pressed="true"] { border-color: var(--s-accent); background: #ffe9ec; }

<body class="mm-gen mm-soft snow">
  <script>
    // Ornament Stacker: a cozy snowman-building game. Tap pictures from the catalog to add hats, faces, scarves and
    // arms as many times as you like, tap the snowman to place them. The page layout, the viewport, the Color tool
    // and the exports come from shared/generator-core.js.
    (function () {
      'use strict';
      // ---- Geometry kit: closed shells built from rings (shared vertices, so always watertight) ----
      var TAU = Math.PI * 2;
      function rad(d) { return (d * Math.PI) / 180; }
      function sqr(x) { return x * x; }
      function vsub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
      function vadd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
      function vmul(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }
      function vcross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
      function vnorm(a) { var l = Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }

      // rings: array of closed point loops [[x,y,z],...] or { pole: [x,y,z] } (a single point cap).
      // Neighbouring rings must have the same winding. wrap = true joins the last ring to the first (torus).
      // The winding of the whole shell is fixed afterwards from its signed volume.
      function shell(rings, wrap) {
        var verts = [], idx = [], info = [], i, j;
        rings.forEach(function (r) {
          if (r.pole) { info.push({ pole: true, s: verts.length, n: 1 }); verts.push(r.pole); }
          else { info.push({ s: verts.length, n: r.length }); r.forEach(function (q) { verts.push(q); }); }
        });
        var n = rings.length, last = wrap ? n : n - 1;
        for (i = 0; i < last; i++) {
          var A = info[i], B = info[(i + 1) % n];
          if (A.pole && B.pole) continue;
          if (A.pole) { for (j = 0; j < B.n; j++) idx.push(A.s, B.s + (j + 1) % B.n, B.s + j); }
          else if (B.pole) { for (j = 0; j < A.n; j++) idx.push(A.s + j, A.s + (j + 1) % A.n, B.s); }
          else {
            for (j = 0; j < A.n; j++) {
              var a = A.s + j, b = A.s + (j + 1) % A.n, c = B.s + (j + 1) % B.n, d = B.s + j;
              idx.push(a, b, c, a, c, d);
            }
          }
        }
        var vol = 0, p, q, r;
        for (i = 0; i < idx.length; i += 3) {
          p = verts[idx[i]]; q = verts[idx[i + 1]]; r = verts[idx[i + 2]];
          vol += (p[0] * (q[1] * r[2] - q[2] * r[1]) - p[1] * (q[0] * r[2] - q[2] * r[0]) + p[2] * (q[0] * r[1] - q[1] * r[0])) / 6;
        }
        var out = new Float32Array(idx.length * 3), o = 0, v;
        for (i = 0; i < idx.length; i += 3) {
          var tri = vol < 0 ? [idx[i], idx[i + 2], idx[i + 1]] : [idx[i], idx[i + 1], idx[i + 2]];
          for (j = 0; j < 3; j++) { v = verts[tri[j]]; out[o++] = v[0]; out[o++] = v[1]; out[o++] = v[2]; }
        }
        return out;
      }

      function cat(list) {
        var n = 0, i;
        for (i = 0; i < list.length; i++) n += list[i].length;
        var out = new Float32Array(n), at = 0;
        for (i = 0; i < list.length; i++) { out.set(list[i], at); at += list[i].length; }
        return out;
      }

      // Circle / ellipse loop in the XZ plane at height y. o: { cx, cz, sx, sz, rot }.
      function loopXZ(r, y, seg, o) {
        o = o || {};
        var cx = o.cx || 0, cz = o.cz || 0, sx = o.sx || 1, sz = o.sz || 1, rot = o.rot || 0;
        var cr = Math.cos(rot), sr = Math.sin(rot), out = [], j, a, x, z;
        for (j = 0; j < seg; j++) {
          a = (j / seg) * TAU;
          x = r * sx * Math.cos(a); z = r * sz * Math.sin(a);
          out.push([cx + x * cr - z * sr, y, cz + x * sr + z * cr]);
        }
        return out;
      }

      // Solid of revolution from a profile [[r, y, dx, dz], ...] (bottom to top). r = 0 makes a pole.
      function lathe(profile, seg, o) {
        o = o || {};
        var rings = profile.map(function (p) {
          var oo = { cx: (o.cx || 0) + (p[2] || 0), cz: (o.cz || 0) + (p[3] || 0), sx: o.sx, sz: o.sz, rot: o.rot };
          if (p[0] < 1e-6) return { pole: [oo.cx, p[1], oo.cz] };
          return loopXZ(p[0], p[1], seg, oo);
        });
        return shell(rings, false);
      }

      // Closed ring-shaped solid (torus-like): cross-section polygon [[r, y], ...] revolved around Y.
      function bandRing(poly, seg, o) {
        return shell(poly.map(function (p) { return loopXZ(p[0], p[1], seg, o); }), true);
      }

      // Sphere or ellipsoid. tFrom > 0 starts the sphere at a flat cut (polar angle from the bottom pole).
      function ball(cx, cy, cz, rx, ry, rz, seg, steps) {
        var prof = [], k, t;
        for (k = 0; k <= steps; k++) {
          t = (k / steps) * Math.PI;
          prof.push([Math.sin(t), cy - ry * Math.cos(t)]);
        }
        prof[0][0] = 0; prof[steps][0] = 0;
        return lathe(prof, seg, { cx: cx, cz: cz, sx: rx, sz: rz });
      }

      // Rounded rectangle loop (counter-clockwise from above) at height y.
      function rrect(hx, hz, cr, y, arcN, cx, cz) {
        cr = Math.max(0.05, Math.min(cr, Math.min(hx, hz) - 0.02));
        var out = [], k, a, corners = [[hx - cr, hz - cr, 0], [-(hx - cr), hz - cr, 90], [-(hx - cr), -(hz - cr), 180], [hx - cr, -(hz - cr), 270]];
        corners.forEach(function (c) {
          for (k = 0; k <= arcN; k++) {
            a = rad(c[2] + (k / arcN) * 90);
            out.push([(cx || 0) + c[0] + cr * Math.cos(a), y, (cz || 0) + c[1] + cr * Math.sin(a)]);
          }
        });
        return out;
      }
      function centroid(loop) {
        var c = [0, 0, 0];
        loop.forEach(function (p) { c[0] += p[0]; c[1] += p[1]; c[2] += p[2]; });
        return [c[0] / loop.length, c[1] / loop.length, c[2] / loop.length];
      }
      // Loft of loops with flat end caps.
      function loftCapped(loops) {
        var rings = [{ pole: centroid(loops[0]) }].concat(loops, [{ pole: centroid(loops[loops.length - 1]) }]);
        return shell(rings, false);
      }

      // Rod with rounded ends from a to b, radius ra at a and rb at b.
      function capsule(a, b, ra, rb, seg, capN) {
        var d = vnorm(vsub(b, a));
        var ax = Math.abs(d[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
        var u = vnorm(vcross(d, ax)), v = vcross(d, u);
        function ring(c, r) {
          var out = [], j, ang;
          for (j = 0; j < seg; j++) {
            ang = (j / seg) * TAU;
            out.push(vadd(c, vadd(vmul(u, r * Math.cos(ang)), vmul(v, r * Math.sin(ang)))));
          }
          return out;
        }
        var rings = [{ pole: vsub(a, vmul(d, ra)) }], k, phi;
        for (k = 1; k <= capN; k++) {
          phi = (k / capN) * (Math.PI / 2);
          rings.push(ring(vsub(a, vmul(d, ra * Math.cos(phi))), ra * Math.sin(phi)));
        }
        for (k = 0; k < capN; k++) {
          phi = (Math.PI / 2) * (1 - k / capN);
          rings.push(ring(vadd(b, vmul(d, rb * Math.cos(phi))), rb * Math.sin(phi)));
        }
        rings.push({ pole: vadd(b, vmul(d, rb)) });
        return shell(rings, false);
      }

      function el(tag, attrs, text) {
        var node = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (k) {
          if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
          else node.setAttribute(k, attrs[k]);
        });
        if (text) node.textContent = text;
        return node;
      }

      // ---- Small mesh helpers (all work on flat xyz Float32Arrays) ----
      function mapPts(arr, fn) {
        var out = new Float32Array(arr.length), q, i;
        for (i = 0; i < arr.length; i += 3) {
          q = fn(arr[i], arr[i + 1], arr[i + 2]);
          out[i] = q[0]; out[i + 1] = q[1]; out[i + 2] = q[2];
        }
        return out;
      }
      function rotZ(arr, deg) { var c = Math.cos(rad(deg)), s = Math.sin(rad(deg)); return mapPts(arr, function (x, y, z) { return [x * c - y * s, x * s + y * c, z]; }); }
      function rotX(arr, deg) { var c = Math.cos(rad(deg)), s = Math.sin(rad(deg)); return mapPts(arr, function (x, y, z) { return [x, y * c - z * s, y * s + z * c]; }); }
      function rotY(arr, deg) { var c = Math.cos(rad(deg)), s = Math.sin(rad(deg)); return mapPts(arr, function (x, y, z) { return [x * c + z * s, y, -x * s + z * c]; }); }
      function moveBy(arr, dx, dy, dz) { return mapPts(arr, function (x, y, z) { return [x + dx, y + dy, z + dz]; }); }
      function scaleBy(arr, sx, sy, sz) { return mapPts(arr, function (x, y, z) { return [x * sx, y * sy, z * sz]; }); }

      // Sphere with a flat cut at the bottom (so it sits on the plate without a point contact).
      function ballCut(cx, cy, cz, r, cutFrac, seg, steps) {
        var t0 = Math.acos(cutFrac), rings = [{ pole: [cx, cy - r * cutFrac, cz] }], k, t;
        for (k = 0; k <= steps; k++) {
          t = t0 + (k / steps) * (Math.PI - t0);
          if (k === steps) rings.push({ pole: [cx, cy + r, cz] });
          else rings.push(loopXZ(r * Math.sin(t), cy - r * Math.cos(t), seg, { cx: cx, cz: cz }));
        }
        return shell(rings, false);
      }

      // Colours of the cartoon parts (shown in the viewport and used as the starting paint; the STL has no colour).
      var COL = { snow: '#f4f9ff', coal: '#2b3445', orange: '#ff9a3c', red: '#ef5b5b', green: '#4fae6a', blue: '#7ec3f0', pink: '#ff9fb5', gold: '#ffd24a', brown: '#9a6a3f', white: '#ffffff', purple: '#a98af0', tan: '#e2b886' };

      // ---- Item catalog. build() returns [{ c: colour, p: positions }] ----
      // Surface items are authored in a local frame: +Y points out of the snowman, -Z is "up the snowman", +X is to the viewer's right.
      // mode: 'surf' (sticks on the surface where you tap), 'top' (stacks on the head, as many as you like), 'neck' (a ring at the height you tap).
      function bead(x, y, z, r) { return ball(x, y, z, r, r, r, 10, 6); }
      var ITEMS = [
        // ---- Hats ----
        { id: 'tophat', cat: 'Hats', name: 'Top hat', mode: 'top', h: 13.5, sink: 3,
          icon: '<ellipse cx="24" cy="38" rx="17" ry="5" fill="#3a4256"/><rect x="14" y="10" width="20" height="28" rx="3" fill="#4a546d"/><rect x="14" y="29" width="20" height="6" fill="#ef5b5b"/><ellipse cx="24" cy="10" rx="10" ry="3" fill="#5b6785"/>',
          build: function () {
            return [{ c: 'coal', p: lathe([[0, 0], [9.2, 0], [9.2, 1.4], [6.6, 1.4], [6.6, 13.5], [0, 13.5]], 32) },
                    { c: 'red', p: bandRing([[6.3, 1.2], [6.95, 1.2], [6.95, 3.8], [6.3, 3.8]], 32) }];
          } },
        { id: 'beanie', cat: 'Hats', name: 'Beanie', mode: 'top', h: 11, sink: 2.4,
          icon: '<path d="M8 34a16 16 0 0132 0z" fill="#4aa3e0"/><rect x="6" y="32" width="36" height="9" rx="4" fill="#ffffff"/><circle cx="24" cy="10" r="5" fill="#ffffff"/><path d="M16 32l1-12M24 32V17M32 32l-1-12" stroke="#2e7fb8" stroke-width="2" stroke-linecap="round"/>',
          build: function () {
            var prof = [[0, 0], [8.6, 0], [8.6, 3]], k, a;
            for (k = 1; k <= 8; k++) { a = (k / 8) * (Math.PI / 2); prof.push([8.6 * Math.cos(a), 3 + 6.5 * Math.sin(a)]); }
            prof[prof.length - 1][0] = 0;
            return [{ c: 'blue', p: lathe(prof, 28) },
                    { c: 'white', p: bandRing([[8.3, -0.3], [9.7, -0.3], [9.7, 3.3], [8.3, 3.3]], 28) },
                    { c: 'white', p: ball(0, 10.6, 0, 2.9, 2.9, 2.9, 16, 10) }];
          } },
        { id: 'santa', cat: 'Hats', name: 'Santa hat', mode: 'top', h: 16, sink: 2.6,
          icon: '<path d="M10 36C10 22 20 8 38 12c-6 2-6 8-4 24z" fill="#ef5b5b"/><rect x="7" y="33" width="34" height="9" rx="4.5" fill="#fff"/><circle cx="38" cy="12" r="5" fill="#fff"/>',
          build: function () {
            return [{ c: 'red', p: lathe([[0, 0], [8.8, 0], [7.8, 4], [6, 8], [3.8, 12], [1.6, 15.5], [0, 17]], 28) },
                    { c: 'white', p: bandRing([[8.4, -0.4], [9.9, -0.4], [9.9, 2.8], [8.4, 2.8]], 28) },
                    { c: 'white', p: ball(0, 17.4, 0, 2.6, 2.6, 2.6, 16, 10) }];
          } },
        { id: 'crown', cat: 'Hats', name: 'Crown', mode: 'top', h: 6.5, sink: 2.2,
          icon: '<path d="M8 36V16l9 9 7-13 7 13 9-9v20z" fill="#ffd24a" stroke="#e0a800" stroke-width="2" stroke-linejoin="round"/><circle cx="24" cy="30" r="3" fill="#ef5b5b"/><circle cx="14" cy="31" r="2" fill="#7ec3f0"/><circle cx="34" cy="31" r="2" fill="#7ec3f0"/>',
          build: function () {
            var out = [{ c: 'gold', p: bandRing([[7.0, 0], [8.2, 0], [8.2, 3.2], [7.0, 3.2]], 32) }], i, a;
            for (i = 0; i < 6; i++) {
              a = (i / 6) * TAU;
              out.push({ c: 'gold', p: lathe([[0, 2.4], [2.0, 2.4], [0, 7.2]], 12, { cx: 7.6 * Math.cos(a), cz: 7.6 * Math.sin(a) }) });
              out.push({ c: 'red', p: ball(7.6 * Math.cos(a), 7.6, 7.6 * Math.sin(a), 0.9, 0.9, 0.9, 8, 6) });
            }
            return out;
          } },
        { id: 'party', cat: 'Hats', name: 'Party hat', mode: 'top', h: 19, sink: 2.2,
          icon: '<path d="M24 6l12 32H12z" fill="#a98af0"/><path d="M19 24h10M16 31h16" stroke="#ffd24a" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="6" r="4" fill="#ffd24a"/><rect x="11" y="37" width="26" height="5" rx="2.5" fill="#7d5ad6"/>',
          build: function () {
            return [{ c: 'purple', p: lathe([[0, 0], [6.4, 0], [5.2, 4], [3.4, 10], [1.6, 15.5], [0, 18]], 24) },
                    { c: 'gold', p: ball(0, 18.4, 0, 2.1, 2.1, 2.1, 14, 8) }];
          } },
        // ---- Faces ----
        { id: 'coaleyes', cat: 'Face', name: 'Coal eyes', mode: 'surf', mirror: true,
          icon: '<circle cx="15" cy="24" r="6.5" fill="#2b3445"/><circle cx="33" cy="24" r="6.5" fill="#2b3445"/><circle cx="13" cy="22" r="2" fill="#fff"/><circle cx="31" cy="22" r="2" fill="#fff"/>',
          build: function () { return [{ c: 'coal', p: ball(0, 0.4, 0, 1.9, 1.7, 2.1, 16, 10) }]; } },
        { id: 'bigeyes', cat: 'Face', name: 'Googly eyes', mode: 'surf', mirror: true,
          icon: '<circle cx="15" cy="24" r="9" fill="#fff" stroke="#2b3445" stroke-width="2.5"/><circle cx="33" cy="24" r="9" fill="#fff" stroke="#2b3445" stroke-width="2.5"/><circle cx="17" cy="26" r="4" fill="#2b3445"/><circle cx="35" cy="26" r="4" fill="#2b3445"/>',
          build: function () { return [{ c: 'white', p: ball(0, 0.3, 0, 3.1, 2.1, 3.3, 20, 12) }, { c: 'coal', p: ball(0.3, 2.0, 0.8, 1.7, 0.9, 1.7, 14, 8) }]; } },
        { id: 'carrot', cat: 'Face', name: 'Carrot nose', mode: 'surf',
          icon: '<path d="M6 20c0-4 8-6 34 2 2 1 2 3 0 4C14 34 6 32 6 28z" fill="#ff9a3c"/><path d="M14 22l4 5M22 24l3 4M30 25l2 3" stroke="#e17a1c" stroke-width="2" stroke-linecap="round"/><path d="M6 24c-3-3-3-6 0-8 0 3 2 4 4 5z" fill="#4fae6a"/>',
          build: function () { return [{ c: 'orange', p: lathe([[0, -1.5, 0, 0], [3.0, -1.5, 0, 0], [2.6, 2, 0, 0.5], [1.5, 7, 0, 2], [0, 13, 0, 4]], 20) }]; } },
        { id: 'buttonnose', cat: 'Face', name: 'Button nose', mode: 'surf',
          icon: '<circle cx="24" cy="24" r="10" fill="#ef5b5b"/><ellipse cx="21" cy="20" rx="3" ry="2" fill="#ff9a9a"/>',
          build: function () { return [{ c: 'red', p: ball(0, 0.8, 0, 2.7, 2.6, 2.7, 16, 10) }]; } },
        { id: 'smile', cat: 'Face', name: 'Coal smile', mode: 'surf',
          icon: '<g fill="#2b3445"><circle cx="9" cy="19" r="3"/><circle cx="16" cy="26" r="3"/><circle cx="24" cy="29" r="3"/><circle cx="32" cy="26" r="3"/><circle cx="39" cy="19" r="3"/></g>',
          build: function () {
            var out = [], i, x;
            for (i = 0; i < 5; i++) { x = -5.5 + i * 2.75; out.push({ c: 'coal', p: bead(x, 0.5, 1.6 - 0.09 * x * x, 1.15) }); }
            return out;
          } },
        { id: 'cheeks', cat: 'Face', name: 'Rosy cheeks', mode: 'surf', mirror: true,
          icon: '<circle cx="14" cy="24" r="8" fill="#ff9fb5"/><circle cx="34" cy="24" r="8" fill="#ff9fb5"/><path d="M10 22l2 3M14 21l2 3M18 22l2 3" stroke="#ff6f93" stroke-width="1.5" stroke-linecap="round"/>',
          build: function () { return [{ c: 'pink', p: ball(0, 0, 0, 3.1, 1.3, 3.1, 18, 8) }]; } },
        { id: 'glasses', cat: 'Face', name: 'Round glasses', mode: 'surf',
          icon: '<circle cx="14" cy="26" r="9" fill="#cfeaff" stroke="#2b3445" stroke-width="3"/><circle cx="34" cy="26" r="9" fill="#cfeaff" stroke="#2b3445" stroke-width="3"/><path d="M23 25h2" stroke="#2b3445" stroke-width="3" stroke-linecap="round"/>',
          build: function () {
            return [{ c: 'coal', p: cat([ball(-4.0, 0.2, 0, 3.4, 1.2, 3.4, 20, 8), ball(4.0, 0.2, 0, 3.4, 1.2, 3.4, 20, 8), capsule([-3, 0.6, 0], [3, 0.6, 0], 0.8, 0.8, 8, 3)]) }];

        return { positions: cat(parts.map(function (q) { return q.p; })) };
      }

      var BODY_ICON = function (n) {
        var r = [13, 10, 8, 6], y = 42, out = '', i;
        for (i = 0; i < n; i++) { y -= r[i] * 1.5; out += '<circle cx="24" cy="' + (y + r[i] * 0.5 + 3) + '" r="' + r[i] + '" fill="#f4f9ff" stroke="currentColor" stroke-width="2"/>'; }
        return out;
      };
      var PARAMS = [
        { group: 'Snowman', key: 'bodyIdx', label: 'Snowballs', unit: '', min: 0, max: 3, step: 1, value: 2,
          choices: [{ label: '1 ball', svg: BODY_ICON(1) }, { label: '2 balls', svg: BODY_ICON(2) }, { label: '3 balls', svg: BODY_ICON(3) }, { label: '4 balls', svg: BODY_ICON(4) }] },
        { group: 'Snowman', key: 'baseR', label: 'Bottom ball size', unit: ' mm', min: 14, max: 30, step: 1, value: 22 },
        { group: 'Snowman', key: 'taper', label: 'Each ball is this big next to the one below', unit: '%', min: 55, max: 90, step: 1, value: 72 },
        { group: 'Snowman', key: 'mound', label: 'Snow mound', unit: '', min: 0, max: 1, step: 1, value: 1,
          choices: [{ label: 'No mound', svg: '<circle cx="20" cy="18" r="10" fill="#f4f9ff" stroke="currentColor" stroke-width="2"/><path d="M8 34h24" stroke="currentColor" stroke-width="2"/>' },
                    { label: 'Mound', svg: '<circle cx="20" cy="16" r="9" fill="#f4f9ff" stroke="currentColor" stroke-width="2"/><path d="M4 34q16-14 32 0z" fill="#cfe6fb" stroke="currentColor" stroke-width="2"/>' }] },
        { tab: 'build', group: 'Picked item', key: 'itemSize', label: 'Size', unit: '%', min: 50, max: 220, step: 5, value: 100 },
        { tab: 'build', group: 'Picked item', key: 'itemTwist', label: 'Turn', unit: '°', min: -180, max: 180, step: 5, value: 0 }
      ];

      window.MM_GENERATOR = {
        code: 'MM-013',
        category: 'ORNAMENTS // SNOWMAN',
        title: 'Ornament Stacker',
        fileName: 'Snowman',
        printerLink: '../index.html#map-screen',
        customStage: true,
        tabsFirst: true,
        defaultColor: '#f4f9ff',
        palette: [
          { name: 'Snow White', color: '#f4f9ff' }, { name: 'Candy Red', color: '#ef5b5b' },
          { name: 'Pine Green', color: '#4fae6a' }, { name: 'Carrot Orange', color: '#ff9a3c' },
          { name: 'Coal Black', color: '#2b3445' }, { name: 'Ice Blue', color: '#7ec3f0' },
          { name: 'Gold', color: '#ffd24a' }, { name: 'Berry Purple', color: '#a98af0' }
        ],
        parameters: PARAMS,
        presets: [
          { label: 'Classic trio', values: { bodyIdx: 2, baseR: 22, taper: 72, mound: 1 } },
          { label: 'Tiny buddy', values: { bodyIdx: 1, baseR: 20, taper: 72, mound: 1 } },
          { label: 'Tall stack', values: { bodyIdx: 3, baseR: 22, taper: 78, mound: 1 } }
        ],

        tabs: [{
          id: 'build',
          label: 'Build',
          hint: 'Tap a picture to add it, then tap the snowman to place it',
          mount: mountBuild,
          onHover: function (hit, api) {
            if (!hit || sel < 0 || !(hit.meshName === 'Snowman' || hit.meshName === 'Snow mound')) { api.setPreview(outlineFor(sel)); return; }
            if (hit.meshName === 'Snow mound' || hit.normal.y < -0.5) { api.setPreview(outlineFor(sel)); return; }
            api.setPreview(ghostFor(hit));
          },
          onPick: function (hit, api) {
            var owner = meshOwner[hit.meshName];
            if (owner !== undefined) { selectItem(owner); return; }
            if (hit.meshName !== 'Snowman') return;
            if (sel < 0) { api.toast('Add something from the pictures first'); return; }
            var it = items[sel], def = ITEM_BY_ID[it.id];
            if (def.mode === 'top') { api.toast('Hats always sit on top of the head'); return; }
            var pl = hitPlacement(hit);
            if (def.mode === 'neck') it.p = [0, pl.p[1], 0];
            else { it.p = pl.p; it.n = pl.n; }
            api.rebuild();
          }
        }],

        onStage: function (env) {
          var T = env.THREE;
          env.container.style.background = 'linear-gradient(#7fb2e5,#f1f8ff)';
          env.plateMesh.visible = false; env.grid.visible = false;
          var ground = new T.Mesh(new T.CircleGeometry(78, 64), new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, metalness: 0 }));
          ground.rotation.x = -Math.PI / 2; ground.position.y = -0.05; ground.receiveShadow = true;
          env.scene.add(ground);
          env.hemi.color.set(0xe3f0ff); env.hemi.groundColor.set(0xffffff); env.hemi.intensity = 0.95;
          env.key.color.set(0xfff4e0); env.key.intensity = 0.8;
          env.rim.color.set(0x9fc7ff); env.rim.intensity = 0.4;
          startBackdrop(env);
        },
        onFrame: function () { if (backdrop) backdrop(); },

        build: function (p, api) {
          lastParams = p;
          if (sel >= 0 && items[sel]) { items[sel].size = p.itemSize / 100; items[sel].twist = p.itemTwist; }
          var out = build(p);
          if (api && api.setPreview) api.setPreview(sel >= 0 ? outlineFor(sel) : null);
          return out;
        },
        testSetup: function () {
          items = [];
          [['tophat'], ['coaleyes'], ['carrot'], ['smile'], ['scarf'], ['button'], ['button'], ['arms']].forEach(function (e) {
            var pl = defaultPlace(ITEM_BY_ID[e[0]], { bodyIdx: 2, baseR: 22, taper: 72, mound: 1 });
            items.push({ id: e[0], p: pl.p, n: pl.n, size: 1, twist: 0 });
          });
        }
      };
    })();
  </script>
  <script src="shared/generator-core.js"></script>
</body>
</html>
