          add('feathers', leaf(hub, d, c, n, r0, L, hwMax, T, off, featherProf, false));
          if (kind > 0) {
            Pe = vadd(hub, vmul(d, r0 + L * 0.76));
            dims = kind === 1 ? [1.45 * E, 0.95 * E] : kind === 2 ? [1.5 * E, 1.0 * E] : [1.1 * E, 1.1 * E];
            [1, -1].forEach(function (s2) {
              nn = vmul(n, s2); face = vadd(Pe, vmul(n, off + s2 * T / 2));
              add('eyeRim', dome(face, d, c, nn, dims[0], dims[1], 0.55, 0.8, SHAPES[kind]));
              add('eyeIris', dome(face, d, c, nn, dims[0] * 0.66, dims[1] * 0.66, 0.95, 0.8, SHAPES[kind]));
              add('eyePupil', dome(face, d, c, nn, dims[0] * 0.38, dims[1] * 0.38, 1.35, 0.8, SHAPES[kind]));
            });
          }
        }
      }

      // ---------------------------------------------------------------------------------------------------------------
      // Flamingo
      // ---------------------------------------------------------------------------------------------------------------
      function flamingo(p, add, contacts) {
        var two = Math.round(p.stance) === 1, legL = p.legLen, hipY = legL + 2.2, hx = 1.0, sw = p.stanceW / 2, i;
        var hips = two ? [[hx, -sw], [hx, sw]] : [[hx, 0]];
        var B = domeBody({ xc: 0, rr: 17, rf: 19, rz: Math.max(9.5, two ? sw + 4.5 : 0), H: 18, pw: 0.55, pitch: 3, hipY: hipY, hips: hips, k: 0.95, soft: 1.2 });
        add('body', B.shell);
        if (Math.round(p.wings) === 1) wings(B, add, 17, 5.6, true, -0.5);

        // standing leg(s): a long thin leg with a knee bulge and a webbed foot
        hips.forEach(function (h) {
          var z = h[1], pts = [], k, t, m = 8;
          for (k = 0; k <= m; k++) {
            t = k / m;
            pts.push([hx + 1.6 * Math.sin(Math.PI * t) - 0.4 * t, lerp(hipY + 4, 1.2, t), z]);
          }
          add('legs', tube(pts, function (t) { return lerp(2.4, 1.6, t); }, { K: 12 }));
          add('legs', ellipsoid([pts[4][0], pts[4][1], z], [0, 1, 0], [1, 0, 0], 3.4, 2.7, 2.7, 8, 12));
          add('feet', footPlate(pts[m][0], z, 3.4, [[0, 11, 19], [40, 10, 19], [-40, 10, 19], [180, 4, 16]], 1.5, contacts));
        });
        // the lifted leg, folded up along the belly
        if (!two) {
          var zt = 3.0, xs = [0.5, -2, -5, -8, -11.5, -15];
          add('legs', tube(xs.map(function (x) { return [hx + x, B.dn(hx + x, zt) + 1.0, zt]; }), [2.0, 1.9, 1.8, 1.8, 1.7, 1.6], { K: 12, roundEnd: true }));
        }

        // neck, head, beak
        var xn = B.xmax - 6, base = [xn, B.up(xn, 0) - 2.5], Ln = 50 * p.neck / 100, lean = 12 * DEG;
        var amp = p.curve / 100 * (42 * DEG - lean);
        var np = neckPath(base, Ln, lean, amp);
        add('neck', tube(np.pts, function (t) { return lerp(3.3, 2.2, smooth(t)); }, { K: 14 }));
        var end = np.pts[np.pts.length - 1], hd = -8 * DEG;
        var ex = [Math.cos(hd), Math.sin(hd), 0], ey = [-Math.sin(hd), Math.cos(hd), 0];
        var Hc = vadd(end, vmul([Math.sin(np.phi), Math.cos(np.phi), 0], 1.4));
        add('head', ellipsoid(Hc, ex, ey, 5.0, 3.4, 3.1, 10, 18));
        // beak: bends down along a smooth arc
        var bend = p.beakBend * DEG, b0 = vadd(Hc, vmul(ex, 3.2)), bp = [b0], ang = -40 * DEG, ds = 11 / 14, bx = b0[0], by = b0[1];
        for (i = 0; i < 14; i++) {
          ang = -40 * DEG - bend * smooth((i + 0.5) / 14);
          bx += Math.cos(ang) * ds; by += Math.sin(ang) * ds; bp.push([bx, by, 0]);
        }
        var br = function (t) { return lerp(2.6, 1.0, t); };
        add('beak', tube(bp.slice(0, 9), function (t) { return br(t * 8 / 14); }, { K: 12 }));
        add('beakTip', tube(bp.slice(8), function (t) { return br(8 / 14 + t * 6 / 14) + 0.04; }, { K: 12, roundEnd: true }));
        [1, -1].forEach(function (s2) {
          add('eye', ellipsoid(vadd(Hc, vadd(vmul(ex, 1.7), vadd(vmul(ey, 0.9), [0, 0, s2 * 2.9]))), [1, 0, 0], [0, 1, 0], 0.85, 0.85, 0.85, 6, 10));
        });
      }

      // ---------------------------------------------------------------------------------------------------------------
      // Pedestal
      // ---------------------------------------------------------------------------------------------------------------
      function pedestal(kind, cx, cz, A, B, H) {
        var K = kind === 1 ? 6 : 72, poly = [], j, a, ca, sa, ch = Math.min(1.6, H / 3), rings = [];
        for (j = 0; j < K; j++) {
          a = TAU * j / K; ca = Math.cos(a); sa = Math.sin(a);
          if (kind === 0) poly.push([ca, sa]);
          else if (kind === 1) poly.push([ca, sa]);
          else poly.push([(ca < 0 ? -1 : 1) * Math.pow(Math.abs(ca), 0.4), (sa < 0 ? -1 : 1) * Math.pow(Math.abs(sa), 0.4)]);
        }
        [[0, -ch], [ch, 0], [H - ch, 0], [H, -ch]].forEach(function (lv) {
          rings.push(poly.map(function (q) {
            var m = kind === 1 ? 1 : 1;
            return [cx + q[0] * (A + lv[1]), lv[0], cz + q[1] * (B + lv[1])];
          }));
        });
        return ringSolid(rings, true, true);
      }

      var ORDER = ['base', 'body', 'wing', 'wingTip', 'neck', 'head', 'beak', 'beakTip', 'eye', 'crest', 'legs', 'feet', 'stalk', 'fanbase', 'feathers', 'eyeRim', 'eyeIris', 'eyePupil'];

      function build(p) {
        var parts = {}, contacts = [], s = p.size / 100, i, k;
        function add(name, shell) { (parts[name] = parts[name] || []).push(shell); }
        if (p.bird < 0.5) peacock(p, add, contacts); else flamingo(p, add, contacts);
        var baseKind = Math.round(p.base), hasBase = baseKind !== 3, yP = hasBase ? p.baseH : 0, shift = hasBase ? yP : 0.4 * s;
        var minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
        contacts.forEach(function (q) {
          minX = Math.min(minX, q[0] * s); maxX = Math.max(maxX, q[0] * s); minZ = Math.min(minZ, q[1] * s); maxZ = Math.max(maxZ, q[1] * s);
        });
        var out = [];
        if (hasBase) {
          var f = baseKind === 0 ? 1.41 : baseKind === 1 ? 1.2 : 1.0;
          var A = Math.max(20, (maxX - minX) / 2 * f + p.margin), Bz = Math.max(20, (maxZ - minZ) / 2 * f + p.margin);
          out.push({ name: 'base', positions: pedestal(baseKind, (minX + maxX) / 2, (minZ + maxZ) / 2, A, Bz, yP), smoothGroup: 'base' });
        }
        ORDER.forEach(function (name) {
          if (!parts[name]) return;
          var pos = concat(parts[name]);
          for (i = 0; i < pos.length; i += 3) { pos[i] *= s; pos[i + 1] = pos[i + 1] * s + shift; pos[i + 2] *= s; }
          out.push({ name: name, positions: pos });
        });
        return out;
      }

      // ---------------------------------------------------------------------------------------------------------------
      function choice(group, key, label, names, value, showIf) {
        var c = { group: group, key: key, label: label, unit: '', min: 0, max: names.length - 1, step: 1, value: value,
          format: function (v) { return names[Math.round(v)]; } };
        if (showIf) c.showIf = showIf;
        return c;
      }
      function isPeacock(p) { return p.bird < 0.5; }
      function isFlamingo(p) { return p.bird >= 0.5; }
      function twoLegs(p) { return p.bird >= 0.5 && Math.round(p.stance) === 1; }
      var PARAMS = [
        choice('Bird', 'bird', 'Bird', ['Peacock', 'Flamingo'], 0),
        { group: 'Bird', key: 'size', label: 'Overall size', unit: '%', min: 60, max: 130, step: 1, value: 100 },
        { group: 'Bird', key: 'neck', label: 'Neck length', unit: '%', min: 60, max: 150, step: 1, value: 100 },
        { group: 'Bird', key: 'curve', label: 'Neck curve (S bend, 100% still prints clean)', unit: '%', min: 0, max: 100, step: 1, value: 70 },

        { group: 'Peacock tail', key: 'feathers', label: 'Feathers', unit: '', min: 5, max: 25, step: 1, value: 15, showIf: isPeacock },
        { group: 'Peacock tail', key: 'spread', label: 'Fan spread (over 95° needs supports)', unit: '°', min: 50, max: 150, step: 1, value: 90, showIf: isPeacock },
        { group: 'Peacock tail', key: 'featherLen', label: 'Feather length', unit: ' mm', min: 40, max: 90, step: 1, value: 64, showIf: isPeacock },
        { group: 'Peacock tail', key: 'featherW', label: 'Feather width (under 100% leaves gaps)', unit: '%', min: 80, max: 140, step: 1, value: 105, showIf: isPeacock },
        choice('Peacock tail', 'eye', 'Eye pattern', ['None', 'Oval', 'Teardrop', 'Round'], 1, isPeacock),
        { group: 'Peacock tail', key: 'eyeSize', label: 'Eye size', unit: '%', min: 60, max: 140, step: 1, value: 100, showIf: function (p) { return isPeacock(p) && Math.round(p.eye) > 0; } },
        { group: 'Peacock tail', key: 'crest', label: 'Crest plumes (0 = none)', unit: '', min: 0, max: 7, step: 1, value: 5, showIf: isPeacock },

        choice('Flamingo', 'stance', 'Stance', ['One leg', 'Two legs'], 0, isFlamingo),
        { group: 'Flamingo', key: 'legLen', label: 'Leg length', unit: ' mm', min: 22, max: 60, step: 1, value: 40, showIf: isFlamingo },
        { group: 'Flamingo', key: 'stanceW', label: 'Leg spacing', unit: ' mm', min: 8, max: 24, step: 1, value: 14, showIf: twoLegs },
        { group: 'Flamingo', key: 'beakBend', label: 'Beak bend', unit: '°', min: 20, max: 80, step: 1, value: 60, showIf: isFlamingo },
        choice('Flamingo', 'wings', 'Wing detail', ['Off', 'On'], 1, isFlamingo),

        choice('Pedestal', 'base', 'Pedestal', ['Round', 'Hexagon', 'Rounded square', 'None'], 0),
        { group: 'Pedestal', key: 'baseH', label: 'Pedestal height', unit: ' mm', min: 3, max: 16, step: 1, value: 7, showIf: function (p) { return Math.round(p.base) !== 3; } },
        { group: 'Pedestal', key: 'margin', label: 'Pedestal margin around the feet', unit: ' mm', min: 6, max: 30, step: 1, value: 14, showIf: function (p) { return Math.round(p.base) !== 3; } }
      ];
      var DEFAULTS = {};
      PARAMS.forEach(function (q) { DEFAULTS[q.key] = q.value; });
      function presetOf(label, over) {
        var values = {};
        Object.keys(DEFAULTS).forEach(function (k) { values[k] = DEFAULTS[k]; });
        Object.keys(over || {}).forEach(function (k) { values[k] = over[k]; });
        return { label: label, values: values };
      }

      window.MM_GENERATOR = {
        code: 'MM-133',
        category: 'ANIMALS // DISPLAY BIRDS',
        title: 'Peacock & Flamingo',
        fileName: 'Peacock_Flamingo',

          { name: 'Peacock Teal', color: '#5eead4' }, { name: 'Sapphire Blue', color: '#7aa7f7' },
          { name: 'Gold Leaf', color: '#fcd34d' }, { name: 'Leaf Green', color: '#9bd77e' },
          { name: 'Coral Red', color: '#fb8a7a' }, { name: 'Ink Black', color: '#334155' }
        ],
        partNames: {
          base: 'Pedestal', body: 'Body', wing: 'Wings', wingTip: 'Wing tips', neck: 'Neck', head: 'Head', beak: 'Beak',
          beakTip: 'Beak tip', eye: 'Eyes', crest: 'Crest', legs: 'Legs', feet: 'Feet', stalk: 'Tail stalk',
          fanbase: 'Fan base', feathers: 'Tail feathers', eyeRim: 'Feather eye ring', eyeIris: 'Feather eye middle', eyePupil: 'Feather eye centre'
        },

          presetOf('Default peacock'),

          presetOf('Slim fan, teardrop eyes', { feathers: 11, spread: 80, featherLen: 60, featherW: 100, eye: 2 }),
          presetOf('Round-eyed peacock', { feathers: 17, eye: 3, eyeSize: 115, crest: 7 }),
          presetOf('Plain feathers', { eye: 0, crest: 3, curve: 55 }),
          presetOf('Flamingo on one leg', { bird: 1 }),
          presetOf('Flamingo wading', { bird: 1, stance: 1, legLen: 36, stanceW: 16, beakBend: 55 }),

    })();
