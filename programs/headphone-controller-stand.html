        gen(R, p.cell, p.seed, function (poly) {

          if (!q) return;
          for (i = 0; i < q.length; i++) { x0 = Math.min(x0, q[i][0]); x1 = Math.max(x1, q[i][0]); z0 = Math.min(z0, q[i][1]); z1 = Math.max(z1, q[i][1]); }

      }

      // A 45 degree wedge: the underside of a lip, so it prints without supports. Profile in (x, y), extruded over z.
      function wedge(THREE, xBase, h, yTop, c, z0, z1) {
        var rise = (h + 3) * 1.15, yb = yTop - c - rise;
        return solid(THREE, [[xBase - 3, yb], [xBase + h, yb + rise], [xBase + h, yTop], [xBase - 3, yTop]], null, z0, z1, mapXY);
      }

      function build(p, api) {
        var THREE = api.THREE, m = Math.round(p.mount), out = [], i, n, tb = p.plateT, ft = p.thick, skip = [], P;
        function add(name, pos, group) { out.push({ name: name, positions: pos, smoothGroup: group || name }); }

        if (m === 0) { // Desk headphone stand: base, post and a domed cradle
          var H = p.height, pz = p.post, cz = Math.max(p.cap, pz + 16), band = p.bandW, dome = 10, capT = 10, flare = (cz - pz) / 2;
          var yg = H - dome - capT - flare, bl = Math.max(p.baseL, band + 30), bw = Math.max(p.baseW, cz + 20), pts = [];
          add('base', solid(THREE, rrectPts(0, 0, bl / 2, bw / 2, 10, 8), null, 0, tb, mapPlan));
          pts.push([-pz / 2, tb - 0.4], [pz / 2, tb - 0.4], [pz / 2, yg], [cz / 2, yg + flare]);
          for (i = 0; i <= 16; i++) { var uu = cz / 2 - cz * i / 16; pts.push([uu, H - dome + dome * (1 - Math.pow(2 * uu / cz, 2))]); }

          P = { u0: -pz / 2 + 3, u1: pz / 2 - 3, v0: -(yg - 4), v1: -(tb + 4) };

        } else if (m === 1) { // Wall headphone hook: back plate with upright pegs
          var pegH = p.pegH, pegW = p.pegW, D = p.bandW;
          n = Math.round(p.hooks);
          var Wp = (n - 1) * 110 + 104, Hp = pegH + 56, xtop = Hp / 2 - 16, xa = xtop - pegH, holes = [];
          if (p.screw > 0.5) { holes.push(circlePts(0, -(Wp / 2 - 9), p.screw / 2, 24), circlePts(0, Wp / 2 - 9, p.screw / 2, 24)); }
          add('plate', solid(THREE, rrectPts(0, 0, Hp / 2, Wp / 2, 8, 8), holes, 0, tb, mapPlan));
          var blades = [], lips = [], zc, lw = pegW * 0.62;
          for (i = 0; i < n; i++) {
            zc = (i - (n - 1) / 2) * 110;
            blades.push(fanPrism(rrectPts((xa + xtop) / 2, zc, pegH / 2, pegW / 2, pegW / 2 - 0.05, 10), tb - 0.4, tb + D));
            if (p.lipH > 0.5) lips.push(wedge(THREE, xtop, p.lipH, tb + D, 4, zc - lw / 2, zc + lw / 2));
            skip.push({ u0: zc - pegW / 2 - 4, u1: zc + pegW / 2 + 4, v0: -(xtop + 4), v1: -(xa - 4) });
          }
          add('hook', concat(blades), 'hook');
          if (lips.length) add('lip', concat(lips), 'hook');
          P = { u0: -Wp / 2 + 16, u1: Wp / 2 - 16, v0: -(Hp / 2 - 3), v1: Hp / 2 - 3 };
          panel(out, P, function (a, h, v) { return [-v, tb + h, a]; }, p, skip);

          var sw = p.slotW, Wc = n * sw + (n + 1) * ft, Hf = p.finH, Dd = p.rackD, zi, fins = [];
          if (m === 2) { // Desk controller rack: base, back wall and fins that hold controllers on edge
            var Hb = Hf + 30, xb = -Dd / 2;
            add('base', solid(THREE, rrectPts(0, 0, Dd / 2 + 6, Wc / 2 + 12, 8, 8), null, 0, tb, mapPlan));
            add('wall', box(THREE, xb, xb + ft, tb - 0.4, tb + Hb, -Wc / 2, Wc / 2));
            for (i = 0; i <= n; i++) {

              fins.push(solid(THREE, [[xb + ft - 0.4, tb - 0.4], [Dd / 2, tb - 0.4], [Dd / 2, tb + Hf * 0.4], [xb + ft - 0.4, tb + Hf]], null, zi - ft / 2, zi + ft / 2, mapXY));

            if (p.lipH > 0.5) add('stop', box(THREE, Dd / 2 - 3, Dd / 2, tb - 0.4, tb + p.lipH, -Wc / 2, Wc / 2));
            P = { u0: -Wc / 2 + 3, u1: Wc / 2 - 3, v0: -(tb + Hb - 3), v1: -(tb + 3) };
            panel(out, P, function (a, h, v) { return [xb - h, -v, a]; }, p, null, true);
          } else { // Wall controller shelf: back plate, shelf and fins, printed on its back
            var Wp2 = Wc + 36, Hp2 = ft + Hf + 54, x0 = -Hp2 / 2 + ft, hl = [];
            if (p.screw > 0.5) { hl.push(circlePts(0, -(Wp2 / 2 - 9), p.screw / 2, 24), circlePts(0, Wp2 / 2 - 9, p.screw / 2, 24)); }
            add('plate', solid(THREE, rrectPts(0, 0, Hp2 / 2, Wp2 / 2, 8, 8), hl, 0, tb, mapPlan));
            add('shelf', box(THREE, -Hp2 / 2, x0, tb - 0.4, tb + Dd, -Wc / 2, Wc / 2));
            for (i = 0; i <= n; i++) {
              zi = -Wc / 2 + ft / 2 + i * (sw + ft);
              fins.push(solid(THREE, [[x0 - 0.4, tb - 0.4], [x0 + Hf, tb - 0.4], [x0 + Hf * 0.35, tb + Dd], [x0 - 0.4, tb + Dd]], null, zi - ft / 2, zi + ft / 2, mapXY));
            }
            add('fins', concat(fins), 'fins');
            if (p.lipH > 0.5) add('stop', wedge(THREE, x0, p.lipH, tb + Dd, 3, -Wc / 2, Wc / 2));
            P = { u0: -Wp2 / 2 + 16, u1: Wp2 / 2 - 16, v0: -(Hp2 / 2 - 3), v1: -(x0 + Hf + 8) };
            panel(out, P, function (a, h, v) { return [-v, tb + h, a]; }, p);

        }

      }
