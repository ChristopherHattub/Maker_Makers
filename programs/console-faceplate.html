<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MM-106 Console Faceplate // Maker Makers</title>
  <link rel="stylesheet" href="shared/generator.css">
  <script src="../vendor/three/three.min.js"></script>
  <script src="../vendor/three/OrbitControls.js"></script>
</head>
<body class="mm-gen">
  <script>
    (function () {
      'use strict';
      // Y up, millimetres. The plate lies flat on the bed, face up, centred on x and z. Every solid is a closed shell.
      var TAU = Math.PI * 2, DEG = Math.PI / 180;

      // Devices. w and h are the plate size in mm (x and z). ESTIMATES from published sizes and photos of each
      // console, not measured on hardware: test-print the Trim slider first, then dial the size in.
      var DEVICES = [
        { name: 'Switch dock', w: 160, h: 92, r: 9 },
        { name: 'Switch 2 dock', w: 178, h: 100, r: 10 },
        { name: 'PS5 side panel', w: 380, h: 250, r: 28 },
        { name: 'Xbox Series X top', w: 148, h: 148, r: 6 }
      ];
      var DESIGNS = ['Plain bezel', 'Honeycomb', 'Diagonal stripes', 'Circuit traces', 'Broken rings', 'Pixel fade', 'Mountains and sun', 'Starburst'];
      var DEFAULTS = { device: 0, design: 1, vents: 0, thick: 3, rimH: 2, rimW: 2.4, reliefH: 1.2, cell: 10, scale: 100, trim: 0, seed: 4 };

      function tri(o, a, b, c) { o.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]); }
      function concat(list) {
        var n = 0, i, out, at = 0;
        for (i = 0; i < list.length; i++) n += list[i].length;
        out = new Float32Array(n);
        for (i = 0; i < list.length; i++) { out.set(list[i], at); at += list[i].length; }
        return out;
      }
      // Flip a closed shell inside out when its signed volume is negative.
      function orient(pos) {
        var v = 0, i, t;
        for (i = 0; i < pos.length; i += 9) {
          v += pos[i] * (pos[i + 4] * pos[i + 8] - pos[i + 5] * pos[i + 7])
             - pos[i + 1] * (pos[i + 3] * pos[i + 8] - pos[i + 5] * pos[i + 6])
             + pos[i + 2] * (pos[i + 3] * pos[i + 7] - pos[i + 4] * pos[i + 6]);
        }
        if (v < 0) {
          for (i = 0; i < pos.length; i += 9) {
            for (t = 0; t < 3; t++) { var s = pos[i + 3 + t]; pos[i + 3 + t] = pos[i + 6 + t]; pos[i + 6 + t] = s; }
          }
        }
        return pos;
      }
      // Convex outline pts [x, z] spanning y0..y1.
      function fanPrism(pts, y0, y1) {
        var o = [], n = pts.length, i, a, b, cx = 0, cz = 0;
        for (i = 0; i < n; i++) { cx += pts[i][0] / n; cz += pts[i][1] / n; }
        for (i = 0; i < n; i++) {
          a = pts[i]; b = pts[(i + 1) % n];
          var at = [a[0], y1, a[1]], bt = [b[0], y1, b[1]], ab = [a[0], y0, a[1]], bb = [b[0], y0, b[1]];
          tri(o, [cx, y1, cz], at, bt);
          tri(o, [cx, y0, cz], bb, ab);
          tri(o, bt, at, ab); tri(o, bt, ab, bb);
        }
        return orient(new Float32Array(o));
      }
      // Ring between two loops of equal vertex count.
      function ringPrism(A, B, y0, y1) {
        var o = [], n = A.length, i, a, a2, b, b2;
        for (i = 0; i < n; i++) {
          a = A[i]; a2 = A[(i + 1) % n]; b = B[i]; b2 = B[(i + 1) % n];
          var at = [a[0], y1, a[1]], a2t = [a2[0], y1, a2[1]], bt = [b[0], y1, b[1]], b2t = [b2[0], y1, b2[1]];
          var ab = [a[0], y0, a[1]], a2b = [a2[0], y0, a2[1]], bb = [b[0], y0, b[1]], b2b = [b2[0], y0, b2[1]];
          tri(o, at, a2t, b2t); tri(o, at, b2t, bt);
          tri(o, ab, b2b, a2b); tri(o, ab, bb, b2b);
          tri(o, a2t, at, ab); tri(o, a2t, ab, a2b);
          tri(o, bt, b2t, b2b); tri(o, bt, b2b, bb);
        }
        return orient(new Float32Array(o));
      }
      function circlePts(cx, cz, r, n, rot) {
        var pts = [], i;
        for (i = 0; i < n; i++) pts.push([cx + r * Math.cos((i / n) * TAU + (rot || 0)), cz + r * Math.sin((i / n) * TAU + (rot || 0))]);
        return pts;
      }
      // Rounded rectangle outline: n + 1 points per corner, so the point count never changes with r.
      function rrectPts(cx, cz, hw, hd, r, n) {
        r = Math.max(0.05, Math.min(r, hw - 0.01, hd - 0.01));
        var cs = [[hw - r, hd - r, 0], [-(hw - r), hd - r, 90], [-(hw - r), -(hd - r), 180], [hw - r, -(hd - r), 270]];
        var pts = [], i, k, a;
        for (i = 0; i < 4; i++) {
          for (k = 0; k <= n; k++) {
            a = (cs[i][2] + (90 * k) / n) * DEG;
            pts.push([cx + cs[i][0] + r * Math.cos(a), cz + cs[i][1] + r * Math.sin(a)]);
          }
        }
        return pts;
      }
      function ccw(pts) {
        var a = 0, i, n = pts.length;
        for (i = 0; i < n; i++) a += pts[i][0] * pts[(i + 1) % n][1] - pts[(i + 1) % n][0] * pts[i][1];
        return a < 0 ? pts.slice().reverse() : pts;
      }
      // Flat plate from a plan outline [x, z] with holes, spanning y0..y1 (three.js triangulation).
      function extrude(THREE, outer, holes, y0, y1) {
        var sh = new THREE.Shape(ccw(outer.map(function (p) { return [p[0], -p[1]]; })).map(function (p) { return new THREE.Vector2(p[0], p[1]); }));
        (holes || []).forEach(function (h) { sh.holes.push(new THREE.Path(h.map(function (p) { return new THREE.Vector2(p[0], -p[1]); }))); });
        var g = new THREE.ExtrudeGeometry(sh, { depth: y1 - y0, bevelEnabled: false, steps: 1, curveSegments: 12 });
        var a = g.attributes.position.array, out = new Float32Array(a.length), i;
        // rotate -90 degrees about X: (x, y, z) -> (x, z, -y), then lift to y0
        for (i = 0; i < a.length; i += 3) { out[i] = a[i]; out[i + 1] = a[i + 2] + y0; out[i + 2] = -a[i + 1]; }
        return orient(out);
      }
      function rnd(i, seed) { var s = Math.sin(i * 127.1 + (seed || 0) * 311.7) * 43758.5453; return s - Math.floor(s); }

      // Clip a convex polygon to the pattern rectangle (Sutherland-Hodgman). Returns null for slivers.
      function clipRect(poly, R) {
        var edges = [[0, 1, R.x0], [0, -1, -R.x1], [1, 1, R.z0], [1, -1, -R.z1]], e, out, i, a, b, da, db, t, k;
        for (k = 0; k < 4; k++) {
          e = edges[k]; out = [];
          for (i = 0; i < poly.length; i++) {
            a = poly[i]; b = poly[(i + 1) % poly.length];
            da = e[1] * a[e[0]] - e[2]; db = e[1] * b[e[0]] - e[2];
            if (da >= 0) out.push(a);
            if ((da >= 0) !== (db >= 0)) { t = da / (da - db); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
          }
          poly = out;
          if (poly.length < 3) return null;
        }
        var area = 0;
        for (i = 0; i < poly.length; i++) area += poly[i][0] * poly[(i + 1) % poly.length][1] - poly[(i + 1) % poly.length][0] * poly[i][1];
        return Math.abs(area) / 2 < 3 ? null : ccw(poly);
      }

      // Pattern generators: each calls add(convexPolygon). R = pattern rectangle, c = cell size in mm.
      var PATTERNS = {
        1: function (R, c, seed, add) { // honeycomb of raised hexagon tiles
          var s = c / 2, dx = Math.sqrt(3) * s, dz = 1.5 * s, rr = s - 0.8, row, col, x, z;
          for (row = 0, z = R.z0 - s; z < R.z1 + s; z += dz, row++) {
            for (col = 0, x = R.x0 - dx + (row % 2 ? dx / 2 : 0); x < R.x1 + dx; x += dx, col++) add(circlePts(x, z, rr, 6, Math.PI / 6));
          }
        },
        2: function (R, c, seed, add) { // 45 degree stripes
          var w = R.x1 - R.x0, d = R.z1 - R.z0, L = w + d, cx = (R.x0 + R.x1) / 2, cz = (R.z0 + R.z1) / 2, k, sw = c * 0.42, ux = 0.7071, uz = 0.7071, nx = -0.7071, nz = 0.7071, px, pz, N = Math.ceil(L / c / 1.4) + 1;
          for (k = -N; k <= N; k++) {
            px = cx + nx * k * c * 1.0; pz = cz + nz * k * c * 1.0;
            add([[px - ux * L - nx * sw / 2, pz - uz * L - nz * sw / 2], [px + ux * L - nx * sw / 2, pz + uz * L - nz * sw / 2],
                 [px + ux * L + nx * sw / 2, pz + uz * L + nz * sw / 2], [px - ux * L + nx * sw / 2, pz - uz * L + nz * sw / 2]]);
          }
        },
        3: function (R, c, seed, add) { // circuit board traces and pads
          var p = c * 0.8, tw = 1.7, row = 0, z, x, len, i, n = 0, prevPads = [];
          function strip(x0, z0, x1, z1) {
            var dx = x1 - x0, dz = z1 - z0, l = Math.sqrt(dx * dx + dz * dz) || 1, ex = dx / l * tw * 0.3, ez = dz / l * tw * 0.3, nx = -dz / l * tw / 2, nz = dx / l * tw / 2;
            add([[x0 - ex - nx, z0 - ez - nz], [x1 + ex - nx, z1 + ez - nz], [x1 + ex + nx, z1 + ez + nz], [x0 - ex + nx, z0 - ez + nz]]);
          }
          for (z = R.z0 + p / 2; z < R.z1; z += p, row++) {
            x = R.x0 - p * rnd(row, seed) * 2;
            while (x < R.x1) {
              len = p * (2 + Math.floor(rnd(n++, seed + 1) * 5));
              strip(x, z, x + len, z);
              if (rnd(n++, seed + 2) < 0.65) add(circlePts(x + len, z, 2.6, 8, 0.39));
              if (rnd(n++, seed + 3) < 0.45) { strip(x + len, z, x + len, z + p); add(circlePts(x + len, z + p, 2.6, 8, 0.39)); }
              x += len + p * (1 + Math.floor(rnd(n++, seed + 4) * 2));
            }
          }
        },
        4: function (R, c, seed, add) { // dashed concentric rings
          var cx = (R.x0 + R.x1) / 2, cz = (R.z0 + R.z1) / 2, far = Math.sqrt(Math.pow(R.x1 - R.x0, 2) + Math.pow(R.z1 - R.z0, 2)) / 2;
          var pitch = c * 0.9, rw = pitch * 0.42, k, r, m, M, a0, span, j, rot;
          add(circlePts(cx, cz, pitch * 0.55, 24));
          for (k = 1; r = pitch * (k + 0.6), r - rw < far; k++) {
            M = Math.max(6, Math.round(TAU * r / (c * 2.2)));
            rot = (k % 2 ? 0.5 : 0) * TAU / M + k * 0.3; span = TAU / M * 0.62;
            for (m = 0; m < M; m++) {
              a0 = rot + m * TAU / M; var pts = [];
              for (j = 0; j <= 3; j++) pts.push([cx + (r + rw / 2) * Math.cos(a0 + span * j / 3), cz + (r + rw / 2) * Math.sin(a0 + span * j / 3)]);
              for (j = 3; j >= 0; j--) pts.push([cx + (r - rw / 2) * Math.cos(a0 + span * j / 3), cz + (r - rw / 2) * Math.sin(a0 + span * j / 3)]);
              add(pts);
            }
          }
        },
        5: function (R, c, seed, add) { // pixel squares thinning out toward the bottom edge
          var q = c * 0.62, ix, iz, x, z, n = 0, f;
          for (iz = 0, z = R.z0 + c / 2; z < R.z1 + c; z += c * 0.8, iz++) {
            f = (z - R.z0) / Math.max(1, R.z1 - R.z0);
            for (ix = 0, x = R.x0 + c / 2; x < R.x1 + c; x += c * 0.8, ix++) {
              if (rnd(ix * 97 + iz, seed) < 0.85 - 0.8 * f) add([[x - q / 2, z - q / 2], [x + q / 2, z - q / 2], [x + q / 2, z + q / 2], [x - q / 2, z + q / 2]]);
            }
          }
        },
        6: function (R, c, seed, add) { // layered peaks along the bottom edge, a sun and a few stars
          var w = R.x1 - R.x0, d = R.z1 - R.z0, n = 0, layer, x, h, b, y, cx = (R.x0 + R.x1) / 2;
          for (layer = 0; layer < 3; layer++) {
            for (x = R.x0 - c + rnd(layer, seed) * c; x < R.x1 + c; x += c * (1.9 + rnd(n++, seed + layer) * 1.2)) {
              h = d * (0.22 + 0.1 * layer) * (0.6 + rnd(n++, seed + 7) * 0.7); b = h * 0.62 + 0.013 * layer;
              if (x - b < R.x0 + 2 || x + b > R.x1 - 2) continue;
              add([[x - b, R.z1 + 0.5 + layer * 0.011], [x + b, R.z1 + 0.5 + layer * 0.011], [x, R.z1 - h]]);
            }
          }
          add(circlePts(cx + w * (rnd(1, seed) - 0.5) * 0.4, R.z0 + d * 0.28, Math.min(w, d) * 0.13, 40));
          for (x = 0; x < 10; x++) add(circlePts(R.x0 + rnd(x + 40, seed) * w, R.z0 + rnd(x + 70, seed) * d * 0.4, 1.7, 8, 0.39));
        },
        7: function (R, c, seed, add) { // rays around a hub
          var cx = (R.x0 + R.x1) / 2, cz = (R.z0 + R.z1) / 2, far = Math.sqrt(Math.pow(R.x1 - R.x0, 2) + Math.pow(R.z1 - R.z0, 2)) / 2;
          var N = 28, k, a, half = TAU / N * 0.32, r0 = c * 1.1, r1;
          add(circlePts(cx, cz, c * 0.7, 32));
          for (k = 0; k < N; k++) {
            a = k * TAU / N + 0.05; r1 = (k % 2 ? 0.7 : 1.2) * far;
            add([[cx + r0 * Math.cos(a - half), cz + r0 * Math.sin(a - half)], [cx + r0 * Math.cos(a + half), cz + r0 * Math.sin(a + half)], [cx + r1 * Math.cos(a), cz + r1 * Math.sin(a)]]);
          }
        }
      };

      function build(p, api) {
        var THREE = api.THREE, dev = DEVICES[Math.round(p.device)], s = p.scale / 100;
        var W = Math.max(30, (dev.w + p.trim) * s), H = Math.max(30, (dev.h + p.trim) * s), hw = W / 2, hd = H / 2;
        var rad = Math.min(dev.r * Math.sqrt(s), hw - 2, hd - 2), t = p.thick, rimW = p.rimW, N = 8, out = [], list;
        var pad = rimW + 2, ro = Math.max(0.1, rad - pad);
        var R = { x0: -hw + pad, x1: hw - pad, z0: -hd + pad, z1: hd - pad };
        var holes = [];
        if (Math.round(p.vents) === 1) {
          var rows = 3, vl = Math.min(90, (R.x1 - R.x0) * 0.7), r, zc;
          for (r = 0; r < rows; r++) {
            zc = R.z1 - 1.5 - r * 6;
            holes.push(rrectPts(0, zc, vl / 2, 1.5, 1.5, 6));
          }
          R.z1 -= rows * 6 + 4;
        }
        out.push({ name: 'plate', positions: extrude(THREE, rrectPts(0, 0, hw, hd, rad, N), holes, 0, t), smoothGroup: 'plate' });
        if (p.rimH > 0.05) {
          out.push({ name: 'rim', positions: ringPrism(rrectPts(0, 0, hw, hd, rad, N), rrectPts(0, 0, hw - rimW, hd - rimW, Math.max(0.6, rad - rimW), N), t - 0.4, t + p.rimH), smoothGroup: 'rim' });
        }
        var gen = PATTERNS[Math.round(p.design)];
        if (gen && R.x1 - R.x0 > 10 && R.z1 - R.z0 > 10) {
          list = [];
          gen(R, p.cell, p.seed, function (poly) {
            var q = clipRect(poly, R), i;
            if (!q) return;
            for (i = 0; i < q.length; i++) { // keep every vertex inside the rounded plate corners
              var ex = Math.max(Math.abs(q[i][0]) - (hw - pad - ro), 0), ez = Math.max(Math.abs(q[i][1]) - (hd - pad - ro), 0);
              if (ex * ex + ez * ez > ro * ro) return;
            }
            list.push(fanPrism(q, t - 0.4, t + p.reliefH));
          });
          if (list.length) out.push({ name: 'pattern', positions: concat(list), smoothGroup: 'pattern' });
        }
        return out;
      }

      function slider(group, key, label, unit, min, max, step, value) {
        return { group: group, key: key, label: label, unit: unit, min: min, max: max, step: step, value: value };
      }
      function choice(group, key, label, names, value) {
        return { group: group, key: key, label: label, unit: '', min: 0, max: names.length - 1, step: 1, value: value, options: names };
      }
      function presetOf(label, over) {
        var values = {};
        Object.keys(DEFAULTS).forEach(function (k) { values[k] = DEFAULTS[k]; });
        Object.keys(over).forEach(function (k) { values[k] = over[k]; });
        return { label: label, values: values };
      }

      window.MM_GENERATOR = {
        code: 'MM-106',
        category: 'GAMING // CONSOLE COVERS',
        title: 'Console Faceplate',
        fileName: 'Console_Faceplate',
        palette: [
          { name: 'Bone White', color: '#f1f5f9' }, { name: 'Shadow Black', color: '#2b2f3a' },
          { name: 'Phantom Ice', color: '#93c5fd' }, { name: 'Glow Mint', color: '#a7f3d0' },
          { name: 'Berry Sorbet', color: '#fda4af' }, { name: 'Lavender Mist', color: '#d8b4fe' },
          { name: 'Sunny Yellow', color: '#fde047' }, { name: 'Pumpkin Matte', color: '#fdba74' }
        ],
        defaultColor: '#2b2f3a',
        partNames: { plate: 'Plate', rim: 'Raised rim', pattern: 'Pattern' },
        parameters: [
          choice('Console', 'device', 'Console (plate size is an estimate)', DEVICES.map(function (d) { return d.name; }), DEFAULTS.device),
          choice('Console', 'design', 'Design', DESIGNS, DEFAULTS.design),
          slider('Console', 'trim', 'Trim (grow or shrink to fit)', ' mm', -6, 6, 0.5, DEFAULTS.trim),
          slider('Console', 'scale', 'Size (100 = full panel; PS5 needs a big bed)', '%', 20, 100, 1, DEFAULTS.scale),
          choice('Console', 'vents', 'Vent slots cut through', ['Off', 'On'], DEFAULTS.vents),
          slider('Plate', 'thick', 'Plate thickness', ' mm', 2, 6, 0.5, DEFAULTS.thick),
          slider('Plate', 'rimW', 'Rim width', ' mm', 1.2, 6, 0.2, DEFAULTS.rimW),
          slider('Plate', 'rimH', 'Rim height (0 = no rim)', ' mm', 0, 4, 0.5, DEFAULTS.rimH),
          slider('Pattern', 'reliefH', 'Pattern height', ' mm', 0.6, 3, 0.2, DEFAULTS.reliefH),
          slider('Pattern', 'cell', 'Pattern size', ' mm', 6, 24, 1, DEFAULTS.cell),
          slider('Pattern', 'seed', 'Pattern shuffle', '', 1, 20, 1, DEFAULTS.seed)
        ],
        presets: [
          presetOf('Default Switch dock honeycomb', {}),
          presetOf('Switch dock pixel fade', { design: 5, cell: 9 }),
          presetOf('Switch 2 dock circuit', { device: 1, design: 3, cell: 10 }),
          presetOf('Switch 2 dock mountains', { device: 1, design: 6, cell: 12 }),
          presetOf('PS5 panel rings', { device: 2, design: 4, cell: 16, thick: 3.5 }),
          presetOf('PS5 panel half size', { device: 2, design: 2, scale: 50, cell: 10 }),
          presetOf('Xbox top starburst', { device: 3, design: 7, cell: 9 }),
          presetOf('Xbox top vented stripes', { device: 3, design: 2, vents: 1, cell: 10 }),
          presetOf('Plain bezel', { design: 0 })
        ],
        build: build
      };
    })();
  </script>
  <script src="shared/export-utils.js"></script>
  <script src="shared/mesh-utils.js"></script>
  <script src="shared/generator-core.js"></script>
</body>
