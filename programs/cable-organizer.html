          var a;
          for (a = 0; a <= 12; a++) { var ang = (a / 12) * Math.PI; ol.push([xc + ro * Math.cos(ang), ybot + ro - ro * Math.sin(ang)]); }
          ol.push([xc - ro, yw], [xc - m2, H - 0.01], [xc - m2, H]);
        }
        ol.push([-L / 2, H]);
        // the notch outline above is in x-y; walls are thin plates along z
        parts.push(extrudeXY(THREE, ol, null, -D / 2 - w, -D / 2));
        parts.push(extrudeXY(THREE, ol, null, D / 2, D / 2 + w));
        parts.push(box(-L / 2, fl - 0.3, -D / 2 - 0.2, -L / 2 + w, H, D / 2 + 0.2));
        parts.push(box(L / 2 - w, fl - 0.3, -D / 2 - 0.2, L / 2, H, D / 2 + 0.2));
        return { body: parts, slots: [] };
      }

      // Style 2: a flat strip of open C-shaped clips with a screw hole at each end. Rings run along the strip.
      function strip(THREE, p, S) {
        var n = Math.round(p.slots), t = p.plateT, wr = p.ringWall, ri = S.di / 2, ro = ri + wr, i, k;
        var pitch = 2 * ro + 1.2, tab = 12, L = n * pitch - 1.2 + 2 * tab, Wd = p.ringW + 8;
        var holes = [], cyc = Math.max(t + 0.6 + ri, ro + 0.2);
        holes.push(circlePts(-L / 2 + tab / 2, 0, p.screwD / 2, 32), circlePts(L / 2 - tab / 2, 0, p.screwD / 2, 32));
        var plate = extrude(THREE, rrectPts(0, 0, L / 2, Wd / 2, 4, 6), holes, 0, t);
        var th = Math.asin(Math.min(0.98, S.mouth / 2 / ri)), rings = [];
        for (i = 0; i < n; i++) {
          var cx = -((n - 1) * pitch) / 2 + i * pitch, pts = [], a, N = 40;
          // C outline: outer arc from the right tip round the bottom to the left tip, then back along the inner arc
          for (a = 0; a <= N; a++) { var ang = th + (a / N) * (2 * Math.PI - 2 * th); pts.push([cx + ro * Math.sin(ang), cyc + ro * Math.cos(ang)]); }
          for (a = N; a >= 0; a--) { var an2 = th + (a / N) * (2 * Math.PI - 2 * th); pts.push([cx + ri * Math.sin(an2), cyc + ri * Math.cos(an2)]); }
          rings.push(extrudeXY(THREE, pts, null, -p.ringW / 2, p.ringW / 2));
        }
        return { body: [plate], slots: rings };
      }

      function build(p, api) {
        var THREE = api.THREE, S = sizes(p), st = Math.round(p.style);
        var r = st === 1 ? tray(THREE, p, S) : (st === 2 ? strip(THREE, p, S) : deskClip(THREE, p, S));
        var out = [];
        pushMesh(out, mesh('body', r.body));
        pushMesh(out, mesh('slots', r.slots));
        return out;
      }

      var isClip = function (p) { return Math.round(p.style) === 0; };
      var isTray = function (p) { return Math.round(p.style) === 1; };
      var isStrip = function (p) { return Math.round(p.style) === 2; };
      function sl(group, key, label, unit, min, max, step, show) {
        var s = slider(group, key, label, unit, min, max, step, DEFAULTS[key]);
        if (show) s.showIf = show;
        return s;
      }

      function trayScrews() {
        var c = choice('Tray', 'screws', 'Screw holes in the floor', ['None', '2 holes', '4 holes'], DEFAULTS.screws);
        c.showIf = isTray;
        return c;
      }

      window.MM_GENERATOR = {
        code: 'MM-117',
        category: 'HOME // CABLE MANAGEMENT',
        title: 'Cable Organizer',
        fileName: 'Cable_Organizer',
        palette: [
          { name: 'Bone White', color: '#f1f5f9' }, { name: 'Charcoal', color: '#3b3f4a' },
          { name: 'Sage Green', color: '#a7c4a0' }, { name: 'Ocean Glass', color: '#93c5fd' },
          { name: 'Terracotta', color: '#e8a07a' }, { name: 'Lavender Mist', color: '#d8b4fe' },
          { name: 'Sunny Yellow', color: '#fde047' }, { name: 'Walnut', color: '#8a6a4f' }
        ],
        defaultColor: '#f1f5f9',
        partNames: { body: 'Clip body', slots: 'Cable slots' },
        parameters: [
          choice('Style', 'style', 'Organizer', ['Desk edge clip', 'Under-desk tray', 'Under-desk clip strip'], DEFAULTS.style),
          sl('Cable slots', 'slots', 'Cable slots', '', 1, 8, 1),
          sl('Cable slots', 'cableD', 'Cable thickness', ' mm', 2, 14, 0.5),
          sl('Cable slots', 'clear', 'Cable clearance', ' mm', 0.2, 1.2, 0.1),
          sl('Cable slots', 'snap', 'Snap-in grip (0 = open, about 15% of cable max)', ' mm', 0, 1.2, 0.1),
          sl('Desk clip', 'deskT', 'Desk thickness', ' mm', 10, 60, 1, isClip),
          sl('Desk clip', 'grip', 'Arm height (grip depth)', ' mm', 15, 60, 1, isClip),
          sl('Desk clip', 'arm', 'Arm thickness', ' mm', 2.4, 6, 0.2, isClip),
          sl('Desk clip', 'squeeze', 'Pinch on the desk (0 = loose)', ' mm', 0, 1.5, 0.1, isClip),
          sl('Desk clip', 'minW', 'Clip width at least', ' mm', 12, 50, 1, isClip),
          sl('Desk clip', 'combLen', 'Comb length', ' mm', 15, 60, 1, isClip),
          sl('Desk clip', 'rib', 'Slot wall thickness', ' mm', 1.6, 4, 0.2, isClip),
          sl('Tray', 'trayLen', 'Tray length (grows to fit the slots)', ' mm', 60, 300, 1, isTray),
          sl('Tray', 'trayD', 'Tray depth', ' mm', 30, 140, 1, isTray),
          sl('Tray', 'trayH', 'Wall height (grows to fit the slots)', ' mm', 20, 60, 1, isTray),
          sl('Tray', 'wall', 'Wall thickness', ' mm', 1.6, 4, 0.2, isTray),
          sl('Tray', 'floorT', 'Floor thickness', ' mm', 2.4, 6, 0.2, isTray),
          trayScrews(),
          sl('Clip strip', 'ringW', 'Clip depth', ' mm', 6, 20, 1, isStrip),
          sl('Clip strip', 'ringWall', 'Clip wall thickness', ' mm', 1.6, 4, 0.2, isStrip),
          sl('Clip strip', 'plateT', 'Strip thickness', ' mm', 2, 5, 0.5, isStrip),
          sl('Screws', 'screwD', 'Screw hole diameter', ' mm', 3, 6, 0.5, function (p) { return isStrip(p) || (isTray(p) && Math.round(p.screws) >= 1); })
        ],
        presets: [
          presetOf(DEFAULTS, 'Default desk clip (3 slots, 5 mm)', {}),
          presetOf(DEFAULTS, 'Thin USB clip, 5 slots', { slots: 5, cableD: 3.5, snap: 0.4, deskT: 20 }),
          presetOf(DEFAULTS, 'Power cable clip, 2 slots', { slots: 2, cableD: 9, snap: 1, grip: 36, arm: 4.4 }),
          presetOf(DEFAULTS, 'Standing desk clip', { deskT: 35, grip: 40, arm: 4.4, minW: 28 }),
          presetOf(DEFAULTS, 'Under-desk tray, 3 slots', { style: 1 }),
          presetOf(DEFAULTS, 'Power brick tray, 4 slots', { style: 1, slots: 4, cableD: 8, trayLen: 220, trayD: 90, trayH: 36, screws: 2, snap: 1 }),
          presetOf(DEFAULTS, 'Clip strip, 6 thin cables', { style: 2, slots: 6, cableD: 4, snap: 0.5 }),
          presetOf(DEFAULTS, 'Clip strip, 3 thick cables', { style: 2, slots: 3, cableD: 8, snap: 1, ringW: 12 })
        ],
        build: build
      };

    })();
  </script>
