      var SHAPE_KEYS = ['rounded', 'pill', 'oval', 'hex', 'scallop'];
      var SHAPE_NAMES = ['Rounded rectangle', 'Pill', 'Oval', 'Hexagon', 'Scalloped badge'];
      var MOTIF_KEYS = ['leaf', 'acorn', 'pumpkin', 'turkey', 'none'];
      var MOTIF_NAMES = ['Maple leaf', 'Acorn', 'Pumpkin', 'Turkey fan', 'No motif'];
      var CASE_KEYS = ['typed', 'upper', 'lower'];
      var CASE_NAMES = ['As typed', 'Uppercase', 'Lowercase'];
      // Only the typed text lives outside the parameters; font, case, shape and motif are choice parameters.
      var state = { line1: 'Chris', line2: '', font: 'rounded', shape: 'rounded', motif: 'leaf', caps: 'typed' };
      function choice(group, tab, key, label, names, value) {
        return { group: group, tab: tab, key: key, label: label, unit: '', min: 0, max: names.length - 1, step: 1, value: value,
          format: function (v) { return names[Math.round(v)]; } };
      }
      function syncState(p) {
        state.font = FONT_KEYS[Math.round(p.font)]; state.shape = SHAPE_KEYS[Math.round(p.shape)];
        state.motif = MOTIF_KEYS[Math.round(p.motif)]; state.caps = CASE_KEYS[Math.round(p.caps)];
      }

      function orient(pos) {
        var v = 0, i, t;
        for (i = 0; i < pos.length; i += 9) {
          v += pos[i] * (pos[i + 4] * pos[i + 8] - pos[i + 5] * pos[i + 7])
             - pos[i + 1] * (pos[i + 3] * pos[i + 8] - pos[i + 5] * pos[i + 6])
             + pos[i + 2] * (pos[i + 3] * pos[i + 7] - pos[i + 4] * pos[i + 6]);
        }
        if (v < 0) {
          for (i = 0; i < pos.length; i += 9) {
            for (t = 0; t < 3; t++) { var s = pos[i + 3 + t]; pos[i + 3 + t] = pos[i + 6 + t]; pos[i + 6 + t] = s; }
          }
        }
        return pos;
      }

      // Rotate about X, then move (the card stands up and leans back).
      function lean(arr, rx, t) {
        var pos = new Float32Array(arr), c = Math.cos(rx), s = Math.sin(rx), i, y, z;
        for (i = 0; i < pos.length; i += 3) {
          y = pos[i + 1]; z = pos[i + 2];
          pos[i + 1] = y * c - z * s + t[1]; pos[i + 2] = y * s + z * c + t[2];
        }
        return pos;
      }

      // Triangular prism along X: tri = three [z, y] points.
      function wedgeSolid(x0, x1, t) {
        var o = [], a0 = [x0, t[0][1], t[0][0]], b0 = [x0, t[1][1], t[1][0]], c0 = [x0, t[2][1], t[2][0]];
        var a1 = [x1, t[0][1], t[0][0]], b1 = [x1, t[1][1], t[1][0]], c1 = [x1, t[2][1], t[2][0]];
        tri(o, a0, b0, c0); tri(o, a1, c1, b1);
        quad(o, a0, a1, b1, b0); quad(o, b0, b1, c1, c0); quad(o, c0, c1, a1, a0);
        return orient(new Float32Array(o));
      }

      // Motif outlines: arrays of { poly, center, layer } in card coordinates, scaled to size m around (cx, cy).
      function maple(phi) {
        var a = Math.abs(Math.atan2(Math.sin(phi), Math.cos(phi))), r = 0.4;
        [[0, 1.0, 34], [55, 0.92, 33], [112, 0.6, 32], [160, 0.34, 30]].forEach(function (l) {
          r = Math.max(r, l[1] * Math.max(0, 1 - Math.pow(Math.abs(a / DEG - l[0]) / l[2], 1.5)));
        });
        return r;
      }
      function polar(n, f, m, cx, cy) {
        var pts = [], i, a, r;
        for (i = 0; i < n; i++) { a = (i / n) * Math.PI * 2; r = f(a) * m; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
        return pts;
      }
      function motifShapes(kind, m, cx, cy) {
        var out = [], r = m / 2;
        if (kind === 'leaf') {
          // phi from +y, so convert the polar angle
          out.push({ poly: polar(180, function (a) { return maple(Math.PI / 2 - a) * 0.5; }, m, cx, cy - m * 0.04), center: [cx, cy - m * 0.04], layer: 0 });
          out.push({ strokes: [[cx, cy - m * 0.4, cx, cy + m * 0.42], [cx, cy, cx + m * 0.28, cy + m * 0.16], [cx, cy, cx - m * 0.28, cy + m * 0.16]], layer: 1 });
        } else if (kind === 'acorn') {
          out.push({ poly: polar(96, function (a) { return 0.33 * (1 + 0.08 * Math.sin(a)) * (Math.sin(a) < 0 ? 1.05 : 0.85); }, m, cx, cy - m * 0.12), center: [cx, cy - m * 0.12], layer: 0 });
          out.push({ poly: polar(96, function (a) { return 0.28 + 0.13 * Math.abs(Math.cos(a)); }, m, cx, cy + m * 0.16).map(function (q) { return [q[0], Math.max(q[1], cy + m * 0.1)]; }), center: [cx, cy + m * 0.2], layer: 1 });
          out.push({ strokes: [[cx, cy + m * 0.3, cx, cy + m * 0.46]], layer: 1 });
        } else if (kind === 'pumpkin') {
          out.push({ poly: polar(140, function (a) { return 0.5 * (1 + 0.05 * Math.cos(7 * a)) * 1; }, m, cx, cy).map(function (q) { return [cx + (q[0] - cx), cy + (q[1] - cy) * 0.82]; }), center: [cx, cy], layer: 0 });
          out.push({ strokes: [[cx, cy + m * 0.32, cx, cy + m * 0.48]], layer: 1 });
        } else if (kind === 'turkey') {
          out.push({ poly: polar(160, function (a) {
            var d = Math.abs(a - Math.PI / 2);
            return a > 0 && a < Math.PI ? 0.3 + 0.2 * Math.pow(Math.max(0, Math.cos(d * 5)), 0.6) * (d < 1.6 ? 1 : 0) + 0.0 : 0.3;
          }, m, cx, cy - m * 0.1), center: [cx, cy - m * 0.1], layer: 0 });
          out.push({ poly: polar(40, function () { return 0.2; }, m, cx, cy - m * 0.18), center: [cx, cy - m * 0.18], layer: 1 });
        }
        return out;
      }

      function buildCard(p) {
        syncState(p);
        var lay = layout(p), t = lay.t, mSize = state.motif === 'none' ? 0 : p.motifSize, gap = mSize ? p.motifGap : 0;
        var W = Math.max(lay.W, mSize * 1.2), H = lay.H + mSize + gap;
        var outline = plateOutline(state.shape, W, H, p);
        var base = [], rim = [], text = [], mot1 = [], mot2 = [], plinth = [];
        var plateT = p.plateThick, tY0 = plateT - EMBED, tY1 = plateT + p.raise, mY1 = plateT + p.motifRaise;
        prism(base, outline, 0, plateT, [0, 0]);
        if (p.rimWidth >= 0.2) ringPrism(rim, outline, offsetInward(outline, p.rimWidth), plateT - EMBED, plateT + p.rimHeight);
        var dy = -(mSize + gap) / 2;
        lay.segs.forEach(function (s) { prism(text, strokePoly(s[0], s[1] + dy, s[2], s[3] + dy, t, lay.cap), tY0, tY1); });
        if (mSize) {
          motifShapes(state.motif, mSize, 0, H / 2 - mSize / 2).forEach(function (sh) {
            var dst = sh.layer ? mot2 : mot1;
            if (sh.poly) prism(dst, sh.poly, tY0, mY1, sh.center);
            else sh.strokes.forEach(function (s) { prism(dst, strokePoly(s[0], s[1], s[2], s[3], Math.max(1.2, mSize * 0.07), 'square'), tY0, mY1 + 0.0); });
          });
        }

        // Stand the card up, lean it back and give it a plinth and a back leg.
        var ymin = Infinity, ymax = -Infinity, xmax = 0;
        outline.forEach(function (q) { ymin = Math.min(ymin, q[1]); ymax = Math.max(ymax, q[1]); xmax = Math.max(xmax, Math.abs(q[0])); });
        var rx = Math.PI / 2 - p.lean * DEG, pt = p.plinthT, shiftY = pt * 0.6 - ymin * Math.sin(rx);
        var T = [0, shiftY, 0];
        function backZ(gy) { return -gy * Math.cos(rx); }
        function backY(gy) { return gy * Math.sin(rx) + shiftY; }
        var zFront = -ymin * Math.cos(rx) + 5;
        var legH = (ymax - ymin) * Math.sin(rx) * 0.6;
        var gyTop = ymin + legH / Math.sin(rx), gyLow = ymin + (pt * 0.4) / Math.sin(rx);
        var embed = 1.4, zBack = backZ(gyLow) - legH;
        var halfW = xmax * 0.92;
        prism(plinth, [[-halfW, -zFront], [halfW, -zFront], [halfW, -zBack + 2], [-halfW, -zBack + 2]], 0, pt, [0, (-zFront - zBack + 2) / 2]);
        var leg = wedgeSolid(-xmax * 0.4, xmax * 0.4, [[backZ(gyTop) + embed, backY(gyTop)], [backZ(gyLow) + embed, backY(gyLow)], [zBack, backY(gyLow)]]);

        var out = [];
        function add(name, arr) { if (arr.length) out.push({ name: name, positions: lean(arr, rx, T) }); }
        add('card', base); add('border', rim); add('lettering', text); add('motif', mot1); add('motifTrim', mot2);

      }
      function concat2(a, b) { var o = new Float32Array(a.length + b.length); o.set(a, 0); o.set(b, a.length); return o; }

      var refreshUI = null;
      var DEFAULTS = {
        font: 0, caps: 0, shape: 0, motif: 0,
        textHeight: 12, stroke: 2.2, spacing: 1, join: 12, lineGap: 2, line2Size: 60,
        plateThick: 3, pad: 6, corner: 6, rimWidth: 1.4, rimHeight: 1, raise: 1.4,
        motifSize: 18, motifGap: 3, motifRaise: 1.4, lean: 18, plinthT: 3
      };

      window.MM_GENERATOR = {
        code: 'MM-023',
        category: 'FALL // TABLE',
        title: 'Gratitude Place Cards',
        fileName: 'Place_Card',
        palette: [
          { name: 'Cream', color: '#fff4dc' },
          { name: 'Maple Red', color: '#e5503a' },
          { name: 'Harvest Orange', color: '#fdba74' },
          { name: 'Corn Gold', color: '#fde047' },
          { name: 'Acorn Brown', color: '#b4783c' },
          { name: 'Moss Green', color: '#86efac' },
          { name: 'Cocoa', color: '#5b3a24' },
          { name: 'Plum', color: '#9d6bd6' }
        ],
        defaultColor: '#fff4dc',
        partNames: { card: 'Card', border: 'Border', lettering: 'Name', motif: 'Motif', motifTrim: 'Motif trim', stand: 'Stand' },
        openGroups: ['Style'],
        parameters: [
          choice('Style', 'name', 'font', 'Lettering style', FONT_NAMES, DEFAULTS.font),
          choice('Style', 'name', 'caps', 'Capitals', CASE_NAMES, DEFAULTS.caps),
          choice('Style', 'name', 'shape', 'Card shape', SHAPE_NAMES, DEFAULTS.shape),
          choice('Style', 'name', 'motif', 'Fall motif', MOTIF_NAMES, DEFAULTS.motif),
          { group: 'Lettering', tab: 'name', key: 'textHeight', label: 'Letter height', unit: ' mm', min: 7, max: 26, step: 0.5, value: DEFAULTS.textHeight },
          { group: 'Lettering', tab: 'name', key: 'stroke', label: 'Stroke thickness', unit: ' mm', min: 1.2, max: 5, step: 0.1, value: DEFAULTS.stroke },
          { group: 'Lettering', tab: 'name', key: 'spacing', label: 'Letter spacing', unit: ' mm', min: 0, max: 6, step: 0.1, value: DEFAULTS.spacing },
          { group: 'Lettering', tab: 'name', key: 'lineGap', label: 'Line gap (2 lines)', unit: ' mm', min: 0, max: 10, step: 0.5, value: DEFAULTS.lineGap },
          { group: 'Lettering', tab: 'name', key: 'line2Size', label: 'Line 2 size', unit: '%', min: 40, max: 100, step: 5, value: DEFAULTS.line2Size },
          { group: 'Card', key: 'plateThick', label: 'Card thickness', unit: ' mm', min: 2, max: 6, step: 0.2, value: DEFAULTS.plateThick },
          { group: 'Card', key: 'pad', label: 'Space around the name', unit: ' mm', min: 3, max: 16, step: 0.5, value: DEFAULTS.pad },
          { group: 'Card', key: 'corner', label: 'Corner rounding (rectangle)', unit: ' mm', min: 0, max: 20, step: 0.5, value: DEFAULTS.corner },
          { group: 'Card', key: 'raise', label: 'Letters stand up', unit: ' mm', min: 0.8, max: 3.5, step: 0.2, value: DEFAULTS.raise },
          { group: 'Card', key: 'rimWidth', label: 'Border width (0 = none)', unit: ' mm', min: 0, max: 4, step: 0.2, value: DEFAULTS.rimWidth },
          { group: 'Card', key: 'rimHeight', label: 'Border height', unit: ' mm', min: 0.4, max: 3, step: 0.2, value: DEFAULTS.rimHeight },
          { group: 'Motif', key: 'motifSize', label: 'Motif size', unit: ' mm', min: 8, max: 30, step: 0.5, value: DEFAULTS.motifSize },
          { group: 'Motif', key: 'motifGap', label: 'Gap above the name', unit: ' mm', min: 1, max: 10, step: 0.5, value: DEFAULTS.motifGap },
          { group: 'Motif', key: 'motifRaise', label: 'Motif height', unit: ' mm', min: 0.8, max: 2.5, step: 0.1, value: DEFAULTS.motifRaise },
          { group: 'Stand', key: 'lean', label: 'Lean back (more = easier print)', unit: '°', min: 8, max: 30, step: 1, value: DEFAULTS.lean },
          { group: 'Stand', key: 'plinthT', label: 'Plinth thickness', unit: ' mm', min: 2, max: 6, step: 0.5, value: DEFAULTS.plinthT }
        ],
        presets: [
          { label: 'Turkey day', values: DEFAULTS },
          { label: 'Pumpkin patch', values: { font: 5, shape: 4, motif: 2, textHeight: 11, motifSize: 15, pad: 4 } },
          { label: 'Acorn tag', values: { font: 5, shape: 1, motif: 1, textHeight: 11, pad: 5 } },
          { label: 'Gobble gobble', values: { font: 3, shape: 3, motif: 3, textHeight: 10, stroke: 2.4, motifSize: 18, pad: 5 } },
          { label: 'Simple name', values: { font: 2, shape: 2, motif: 4, textHeight: 14, stroke: 2.4, pad: 5 } },
          { label: 'Chunky letters', values: { textHeight: 15, stroke: 3.4, raise: 2, plateThick: 3.6 } }
        ],
        tabs: [{
          id: 'name',
          label: 'Name',
          hint: 'Type a name, then pick the style and fall motif below',
          mount: function (container, api) {
            var h = function (tag, attrs, text) {
              var node = document.createElement(tag);
              Object.keys(attrs || {}).forEach(function (k) {
                if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]); else node.setAttribute(k, attrs[k]);

              if (text) node.textContent = text;
              return node;
            };
            var field = function (label, control) {
              var wrap = h('div', { class: 'mm-slider' }), head = h('div', { class: 'mm-slider-head' });
              head.appendChild(h('label', {}, label)); wrap.appendChild(head); wrap.appendChild(control);
              return wrap;
            };
            var textInput = function (key, ph) {
              var input = h('input', { type: 'text', maxlength: '20', placeholder: ph, autocomplete: 'off', spellcheck: 'false' });
              input.value = state[key];
              input.addEventListener('input', function () { state[key] = input.value; api.rebuild(); });
              return input;
            };
            container.appendChild(h('h3', { class: 'mm-group-title' }, 'Guest name'));
            var in1 = textInput('line1', 'Name (e.g. Chris)'), in2 = textInput('line2', 'Line 2 (optional)');
            container.appendChild(field('Line 1', in1));
            container.appendChild(field('Line 2 (optional)', in2));
            container.appendChild(h('p', { class: 'mm-note' }, 'Letters, numbers, - + . ! \' and <3 for a heart. Up to 20 characters per line.'));
            refreshUI = function () { in1.value = state.line1; in2.value = state.line2; };
            setTimeout(function () { api.centerCamera('iso'); }, 60);
          }
        }],
        build: buildCard
      };

    })();
  </script>
