    // Wind Chime Composer: a flat mobile you compose by placing hangers on a bar with the mouse or finger.

    (function () {

        });

      function loopXZ(r, y, seg, o) {

      // Closed ring-shaped solid (torus-like): cross-section polygon [[r, y], ...] revolved around Y.

      function smootherstep(x) {

      function el(tag, attrs, text) {

      function withDefaults(defaults, over) {

        } else if (type === 'heart') {
          for (i = 0; i < 40; i++) {
            a = (i / 40) * TAU;
            pts.push([(16 * Math.pow(Math.sin(a), 3)) / 17, (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a) + 2.2) / 17]);
          }

        } else if (type === 'flower') {
          for (i = 0; i < 60; i++) { a = (i / 60) * TAU + Math.PI / 2; var rr = 0.8 + 0.2 * Math.cos(5 * (a - Math.PI / 2)); pts.push([rr * Math.cos(a), rr * Math.sin(a)]); }
        } else if (type === 'leaf') {

        } else if (type === 'diamond') {

      function sqr(x) { return x * x; }

        { name: 'Star trio', items: [[-0.6, 14, 'star', 8], [0, 26, 'star', 10], [0.6, 14, 'star', 8]] },
        { name: 'Wind chime', items: [[-0.8, 6, 'tube', 14], [-0.4, 6, 'tube', 22], [0, 6, 'tube', 28], [0.4, 6, 'tube', 19], [0.8, 6, 'tube', 12]] },
        { name: 'Hearts & drops', items: [[-0.75, 12, 'heart', 7], [-0.25, 28, 'drop', 8], [0.25, 20, 'heart', 9], [0.75, 34, 'drop', 7]] },
        { name: 'Garden', items: [[-0.7, 16, 'flower', 8], [-0.25, 30, 'leaf', 9], [0.2, 14, 'drop', 7], [0.65, 26, 'flower', 9]] },
        { name: 'Gem drop', items: [[-0.5, 20, 'diamond', 9], [0, 40, 'hex', 8], [0.5, 20, 'diamond', 9]] }

      }
      loadLayout(0);

      var PARAMS = [
        { group: 'Bar', key: 'barLen', label: 'Bar length', unit: ' mm', min: 60, max: 170, step: 1, value: 100 },
        { group: 'Bar', key: 'barW', label: 'Bar width', unit: ' mm', min: 5, max: 14, step: 0.5, value: 8 },
        { group: 'Bar', key: 'thick', label: 'Plate thickness', unit: ' mm', min: 2, max: 5, step: 0.2, value: 3 },
        { group: 'Bar', key: 'autoBalance', label: 'Hanging loop', unit: '', min: 0, max: 1, step: 1, value: 1,

        { group: 'Bar', key: 'loopPos', label: 'Manual loop position (left ↔ right)', unit: '', min: -1, max: 1, step: 0.02, value: 0,

        { group: 'Strings', key: 'strW', label: 'String width', unit: ' mm', min: 1.4, max: 4, step: 0.2, value: 2 },
        { group: 'Strings', key: 'beads', label: 'Beads on each string', unit: '', min: 0, max: 5, step: 1, value: 0 },
        { group: 'Strings', key: 'charmScale', label: 'All charms size', unit: '%', min: 60, max: 150, step: 1, value: 100 },
        { tab: 'mobile', group: 'Selected hanger', key: 'selSize', label: 'Charm size', unit: ' mm', min: 4, max: 34, step: 0.5, value: 8 },
        { tab: 'mobile', group: 'Selected hanger', key: 'selLen', label: 'String length', unit: ' mm', min: 4, max: 90, step: 1, value: 14 }
      ];
      var DEFAULTS = {};

      function halfSpan(p) { return p.barLen / 2 - p.barW / 2 - 0.5; }
      function hangerX(h, p) { return h.u * halfSpan(p); }

      function build(p) {

        if (sel >= hangers.length) sel = hangers.length - 1;

      // ---- The editor: a top-down canvas of the mobile. Tap the bar to add, drag a charm to move it, drag down to lengthen ----

      function mountMobile(container, api) {

          ctx.strokeStyle = muted; ctx.globalAlpha = 0.25; ctx.lineWidth = 1;
          for (var m = -Math.floor(p.barLen / 20) * 10; m <= p.barLen / 2; m += 10) {
            var tp = toPx(m, -p.barW / 2 - 4); ctx.beginPath(); ctx.moveTo(tp[0], tp[1]); ctx.lineTo(tp[0], tp[1] - (m % 50 === 0 ? 7 : 3)); ctx.stroke();
          }
          ctx.globalAlpha = 1;
          anchor = [lx, -p.barW / 2 - (p.loopHole + 2.2) + 1.4];
          var ap = toPx(anchor[0], anchor[1]);
          // Plumb line from the loop.
          ctx.setLineDash([4, 4]); ctx.strokeStyle = green; ctx.globalAlpha = 0.5;
          ctx.beginPath(); ctx.moveTo(ap[0], ap[1]); ctx.lineTo(ap[0], H - 4); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
          ctx.save();
          ctx.translate(ap[0], ap[1]); ctx.rotate(ang); ctx.translate(-ap[0], -ap[1]);
          // Bar.
          var b0 = toPx(-p.barLen / 2, -p.barW / 2), bw = p.barLen * view.s, bh = p.barW * view.s;
          ctx.fillStyle = cyan; ctx.globalAlpha = 0.22; ctx.strokeStyle = cyan; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.roundRect ? ctx.roundRect(b0[0], b0[1], bw, bh, bh / 2) : ctx.rect(b0[0], b0[1], bw, bh);
          ctx.fill(); ctx.globalAlpha = 1; ctx.stroke();
          // Hanging loop.
          var lp = toPx(anchor[0], anchor[1]);
          ctx.beginPath(); ctx.arc(lp[0], lp[1], (p.loopHole + 2.2) * view.s, 0, TAU);
          ctx.moveTo(lp[0] + p.loopHole * view.s, lp[1]); ctx.arc(lp[0], lp[1], p.loopHole * view.s, 0, TAU, true);
          ctx.fillStyle = amber; ctx.globalAlpha = 0.35; ctx.fill('evenodd'); ctx.globalAlpha = 1; ctx.strokeStyle = amber; ctx.stroke();
          // Hangers.
          hangers.forEach(function (h, idx) {
            var x = hangerX(h, p), R = charmR(h, p), zc = h.len - 1 + R, isSel = idx === sel;
            var s0 = toPx(x, p.barW / 2), s1 = toPx(x, h.len);
            ctx.strokeStyle = white; ctx.globalAlpha = 0.7; ctx.lineWidth = Math.max(1, p.strW * view.s);
            ctx.beginPath(); ctx.moveTo(s0[0], s0[1]); ctx.lineTo(s1[0], s1[1]); ctx.stroke(); ctx.globalAlpha = 1;
            ctx.beginPath();
            charmPoly(h.type).pts.forEach(function (q, j) { var pp = toPx(x + q[0] * R, zc - q[1] * R); if (j) ctx.lineTo(pp[0], pp[1]); else ctx.moveTo(pp[0], pp[1]); });
            ctx.closePath();
            ctx.fillStyle = isSel ? amber : cyan; ctx.globalAlpha = isSel ? 0.45 : 0.25; ctx.fill(); ctx.globalAlpha = 1;
            ctx.strokeStyle = isSel ? amber : cyan; ctx.lineWidth = isSel ? 3 : 2; ctx.stroke();
          });
          ctx.restore();
          // Fulcrum marker and balance read-out.
          ctx.fillStyle = green; ctx.beginPath(); ctx.moveTo(ap[0], ap[1] - 14); ctx.lineTo(ap[0] - 5, ap[1] - 22); ctx.lineTo(ap[0] + 5, ap[1] - 22); ctx.closePath(); ctx.fill();
          var txt = Math.abs(off) < 1.2 ? 'Balanced: it will hang level' : 'Leans ' + (off > 0 ? 'left' : 'right') + ' by ' + Math.abs(off).toFixed(1) + ' mm' + (p.autoBalance >= 1 ? '' : ' (turn on Auto balance)');
          if (status.textContent !== txt) status.textContent = txt;
        }
        requestAnimationFrame(draw);

        function pointer(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
        function worldPt(e) { var a = pointer(e); var q = toWorld(a[0], a[1]); var anchorW = anchor; return rot(q, -tilt, anchorW); }

        function setSel(i) {
          sel = Math.max(0, Math.min(hangers.length - 1, i));
          api.setParams({ selSize: hangers[sel].size, selLen: hangers[sel].len });
        }
        cv.addEventListener('pointerdown', function (e) {
          var p = api.params, q = worldPt(e), hit = -1, i;
          for (i = hangers.length - 1; i >= 0; i--) {
            var h = hangers[i], R = charmR(h, p), cx = hangerX(h, p), cz = h.len - 1 + R;
            if (Math.abs(q[0] - cx) < Math.max(R, 3.5) && q[1] > p.barW / 2 && q[1] < cz + R + 2) { hit = i; break; }
          }
          if (hit < 0 && Math.abs(q[1]) <= p.barW / 2 + 3 && Math.abs(q[0]) <= p.barLen / 2) {
            if (hangers.length >= MAX_HANGERS) { api.toast('The bar holds up to ' + MAX_HANGERS + ' hangers'); return; }
            var u = Math.max(-1, Math.min(1, q[0] / halfSpan(p)));
            hangers.push({ u: u, len: 16, type: nextType, size: 8 });
            hit = hangers.length - 1;
          }
          if (hit < 0) return;
          sel = hit;
          drag = { id: e.pointerId };
          try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
          api.setParams({ selSize: hangers[sel].size, selLen: hangers[sel].len });
          api.rebuild();
        });
        cv.addEventListener('pointermove', function (e) {
          if (!drag) return;
          var p = api.params, q = worldPt(e), h = hangers[sel], R = charmR(h, p);
          h.u = Math.max(-1, Math.min(1, q[0] / halfSpan(p)));
          var len = Math.round(Math.max(4, Math.min(90, q[1] - R + 1)));
          api.setParams({ selLen: len });
          h.len = len;
          api.rebuild();
        });
        function end() { drag = null; }
        cv.addEventListener('pointerup', end);
        cv.addEventListener('pointercancel', end);

        // Charm picker: changes the selected hanger and the type used for the next one you add.
        container.appendChild(el('h3', { class: 'mm-group-title' }, 'Charm shape (for the selected hanger)'));
        var chips = el('div', { class: 'mm-icon-chips' }), chipBtns = {};
        CHARMS.forEach(function (type) {
          var btn = el('button', { class: 'mm-icon-chip', type: 'button', title: CHARM_NAMES[type], 'aria-pressed': 'false', onclick: function () {
            nextType = type;
            if (hangers[sel]) hangers[sel].type = type;
            api.rebuild();
          } });
          btn.innerHTML = charmIcon(type) + '<span>' + CHARM_NAMES[type] + '</span>';
          chipBtns[type] = btn; chips.appendChild(btn);
        });
        container.appendChild(chips);
        container.appendChild(el('p', { class: 'mm-note' }, 'Tap the bar to add a hanger. Drag a charm sideways to move it and down to lengthen its string. The green marker is where the loop sits; with Auto balance on it always hangs level.'));

        var row1 = el('div', { class: 'mm-export-row' }), row2 = el('div', { class: 'mm-export-row' });
        function btn(label, fn) { return el('button', { class: 'mm-btn', type: 'button', onclick: fn }, label); }
        row1.appendChild(btn('Delete selected', function () {
          if (hangers.length <= 1) { api.toast('Keep at least one hanger'); return; }
          hangers.splice(sel, 1); setSel(Math.min(sel, hangers.length - 1)); api.rebuild();
        }));
        row1.appendChild(btn('Duplicate', function () {
          if (hangers.length >= MAX_HANGERS) { api.toast('The bar holds up to ' + MAX_HANGERS + ' hangers'); return; }
          var h = hangers[sel];
          hangers.push({ u: Math.max(-1, Math.min(1, h.u + 0.3 > 1 ? h.u - 0.3 : h.u + 0.3)), len: h.len, type: h.type, size: h.size });
          setSel(hangers.length - 1); api.rebuild();
        }));
        row2.appendChild(btn('Mirror left ↔ right', function () { hangers.forEach(function (h) { h.u = -h.u; }); api.rebuild(); }));
        row2.appendChild(btn('Space evenly', function () {
          hangers.sort(function (a, b) { return a.u - b.u; });
          var n = hangers.length; hangers.forEach(function (h, i) { h.u = n === 1 ? 0 : -0.82 + (1.64 * i) / (n - 1); });
          api.rebuild(); api.toast('Spaced evenly');
        }));
        container.appendChild(row1); container.appendChild(row2);

        refreshMobile = function () {
          CHARMS.forEach(function (t) { chipBtns[t].setAttribute('aria-pressed', String(hangers[sel] && hangers[sel].type === t)); });
        };
        refreshMobile();

        container.appendChild(el('h3', { class: 'mm-group-title' }, 'Starter mobiles'));
        var grid = el('div', { class: 'mm-preset-cards' });
        LAYOUTS.forEach(function (lay, li) {
          var card = el('button', { class: 'mm-preset-card', type: 'button', title: lay.name, onclick: function () {
            loadLayout(li); setSel(0); api.rebuild(); api.toast('Mobile: ' + lay.name);
          } });
          var svg = '<svg viewBox="-60 -14 120 100" aria-hidden="true"><rect x="-50" y="-4" width="100" height="8" rx="4"/>';
          lay.items.forEach(function (q) {
            var x = q[0] * 46, R = q[3], zc = q[1] - 1 + R;
            svg += '<rect x="' + (x - 1) + '" y="4" width="2" height="' + q[1] + '"/><polygon points="' + charmPoly(q[2]).pts.map(function (pt) { return (x + pt[0] * R).toFixed(1) + ',' + (zc - pt[1] * R).toFixed(1); }).join(' ') + '"/>';
          });
          card.innerHTML = svg + '</svg><span>' + lay.name + '</span>';
          grid.appendChild(card);
        });
        container.appendChild(grid);
      }

      var STYLES = [
        { name: 'Default mobile', values: {} },
        { name: 'Beaded strings', values: { beads: 3, strW: 1.6 } },
        { name: 'Chunky plates', values: { thick: 4.2, strW: 3, barW: 11, charmScale: 115 } },
        { name: 'Long and light', values: { barLen: 140, thick: 2.4, strW: 1.6, charmScale: 90 } },
        { name: 'Manual loop (off centre)', values: { autoBalance: 0, loopPos: -0.4 } }
      ];

      window.MM_GENERATOR = {
        code: 'MM-014',
        category: 'ORNAMENTS // MOBILES',
        title: 'Wind Chime Composer',
        fileName: 'Wind_Chime_Mobile',
        printerLink: '../index.html#map-screen',
        defaultColor: '#f1f5f9',
        palette: [
          { name: 'Cloud White', color: '#f1f5f9' },
          { name: 'Sky Blue', color: '#93c5fd' },
          { name: 'Mint Breeze', color: '#a7f3d0' },
          { name: 'Sunny Yellow', color: '#fde047' },
          { name: 'Blossom Pink', color: '#fda4af' },
          { name: 'Lavender Mist', color: '#d8b4fe' },
          { name: 'Peach Matte', color: '#fdba74' },
          { name: 'Slate Night', color: '#334155' }
        ],
        partNames: (function () {
          var names = { bar: 'Bar', loop: 'Hanging loop', strings: 'Strings', beads: 'Beads' };
          for (var i = 0; i < MAX_HANGERS; i++) names['charm' + i] = 'Charm ' + (i + 1);
          return names;
        })(),

        parameters: PARAMS,

        presets: STYLES.map(function (s) { return { label: s.name, values: withDefaults(DEFAULTS, s.values) }; }),

        testSetup: function () { loadLayout(0); },

        tabs: [{
          id: 'mobile',
          label: 'Mobile',
          hint: 'Click a charm to select it. Compose the mobile in the editor.',
          mount: mountMobile,
          onHover: function (hit, api) { highlight(api, hit ? hangerIndex(hit.meshName) : -1); },
          onPick: function (hit, api) {
            var i = hangerIndex(hit.meshName);
            if (i < 0) return;
            sel = i;
            api.setParams({ selSize: hangers[sel].size, selLen: hangers[sel].len });
            api.rebuild();
          }
        }],

        build: build
      };
    })();
  </script>
  <script src="shared/generator-core.js"></script>
</body>
